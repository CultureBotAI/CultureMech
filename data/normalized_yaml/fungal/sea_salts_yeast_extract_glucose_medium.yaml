preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix components except NaHCO3 and adjust pH to 7.0. Bring to a boil,
    cool down to room temperature under a N2-CO2 (4:1, v/v) gas stream and add NaHCO3.
    Dispense the medium into culture vessels under the same gas mixture, seal with
    butyl rubber stoppers and autoclave.
applications:
- Microbial cultivation
