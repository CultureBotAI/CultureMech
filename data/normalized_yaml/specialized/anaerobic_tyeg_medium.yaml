preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: 'Mix components and adjust pH to 7.5. Bring to a boil, then cool down
    and distribute into culture vessels under a N2 gas stream. Seal with butyl rubber
    stoppers and autoclave. Prior to inoculation, add the following solution (autoclaved
    under a N2 atmosphere) into the medium (per liter):'
- step_number: 2
  action: ADJUST_PH
  description: Dissolve nitrilotriacetic acid at first and adjust pH to 6.5 with KOH.
    Then proceed to add the minerals.
