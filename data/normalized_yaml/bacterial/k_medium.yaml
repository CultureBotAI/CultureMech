preparation_steps:
- step_number: 1
  action: MIX
  description: "Note for Tris base: First add to 50ml of DIW and pH. Then slowly top\
    \ up to 100ml with DIW ensuring\r\nto check pH remains at 7.2."
- step_number: 2
  action: AUTOCLAVE
  description: "Make up to 1 litre with filtered natural seawater. Adjust pH to 8.0\
    \ with 1M NaOH or 1M HCl.\r\nAutoclave at 15 psi for 15 minutes."
- step_number: 3
  action: DISSOLVE
  description: "There are 7 chemicals. Prepare Primary stock solutions first. Add\
    \ first three\r\nchemicals separately in 100ml/dH2O, allowing each to completely\
    \ dissolve\r\nbefore adding the primary stocks in order:"
- step_number: 4
  action: MIX
  description: First make primary stocks of Cyanocobalamin and Biotin.
- step_number: 5
  action: POUR_PLATES
  description: Dispense any excess primary stocks into 1 ml aliquots and freeze.
- step_number: 6
  action: MIX
  description: 'For final vitamin mix stock solution:'
