preparation_notes: 'Flush the gas phase with nitrogen and add 5% oxygen. Sterilize
  at 120°C 20 min in a closed vessel (i.e. a serum tube or bottle) with a liquid to
  air ratio of about 1:10.

  Final pH is 8.0 - 8.5.

  Incubate statically until growth occurs, then shake at 100 rpm.

  After sterilization add from sterile stock solutions:

  (a white colloid will form which will rapidly dissolve after mixing)'
