    The SQL source joins name HB101, whereas the abstract identifies DH5 alpha. This
    is an unresolved assay/strain attribution conflict, not a synonym equivalence.
    The abstract compares medium complexity without a complete M9 recipe or glucose/lactose
    amounts. Plasmid stability results and their preferred conditions are not general
    cultivation optima. Formulation-unresolved; no resolved variant or growth assertion.
    Local pair MEDIADB:108/109 substitutes glucose with lactose while seven other
    entries agree; the common normalized name does not establish identical recipes.
    Inventory covers the inspected medium-relevant passages, not every organism in
