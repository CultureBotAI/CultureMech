  preferred_term: TOGO Medium M2453
  term:
    id: TOGO:M2453
    label: SP4-Z Medium
notes: TOGO M2453 / DSMZ Medium 1076b records the DSMZ Medium 1076b SP4-Z branch using
  arginine as its energy source. DSMZ Medium 1076b is a 200 ml formula that replaces
  yeast extract from normal SP4 with fish-sperm DNA, adjusts pH to 7.4, autoclaves
  at 121 degrees C for 15 minutes, aseptically adds CMRL-1066, autoclaved Yeastolate,
  heat-inactivated fetal bovine serum, and heat-inactivated swine serum, and then
  adds either glucose or arginine HCl; the two energy sources should not be combined.
  This agar-plate branch uses 126 ml distilled water per 200 ml, adds 2 g agar, and
  is held at 55 degrees C before supplements are added.
