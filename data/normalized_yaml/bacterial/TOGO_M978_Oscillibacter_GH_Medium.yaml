preparation_steps:
- step_number: 1
  action: MIX
  description: Mix yeast extract, Polypeptone peptone, Tween 80, distilled water,
    9.88142 ml/L Trace vitamins, 0.988142 ml/L FeCl2 solution, and 0.988142 ml/L Trace
    element solution.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 6.0.
- step_number: 3
  action: ALIQUOT
  description: Distribute the medium into culture vessels under a N2 gas stream and
    seal with butyl rubber stoppers.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave the sealed medium.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: JCM's default instruction is to autoclave media at 121 C for 15 min.
