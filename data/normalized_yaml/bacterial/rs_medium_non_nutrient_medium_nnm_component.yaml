preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare H2O stock solutions at the printed concentrations; autoclave
    stocks except BaCO3, which is 0.22 um filter-sterilized, and store heavy-metal
    stocks in the dark.
- step_number: 2
  action: MIX
  description: In a 2 L bottle, combine each solid ingredient or liquid stock and
    fill to 1 L with purified H2O.
- step_number: 3
  action: AUTOCLAVE
  description: Assemble a sterile sparging apparatus on the 2 L bottle and autoclave
    the 1 L medium with the apparatus attached.
- step_number: 4
  action: MIX
  description: After cooling, sparge the medium with CO2 for 4 h.
- step_number: 5
  action: MIX
  description: Disconnect CO2, sparge with air for 12-24 h to remove excess CO2, then
    replace the sparging apparatus with a sterile non-vented cap and store at room
    temperature.
