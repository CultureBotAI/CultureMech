  term:
    id: mediadive.medium:J387
    label: PYGV AGAR
notes: JCM Medium 387 PYGV Agar lists, per liter, 0.25 g Peptone, 0.25 g Yeast extract,
  20 ml Mineral salt solution from JCM Medium 304, 10 ml 2.5% Glucose solution, 10
  ml Vitamin solution from JCM Medium 304, 15 g Agar, and 960 ml Distilled water.
  The final pH is 7.5. The base medium is mixed, gently heated to a boil, autoclaved,
  cooled to 45-50 degrees C, supplemented aseptically with filter-sterilized glucose
  and vitamin solutions, and adjusted to pH 7.5 with sterile KOH if necessary.
