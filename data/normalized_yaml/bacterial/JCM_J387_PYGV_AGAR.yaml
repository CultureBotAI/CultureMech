preparation_steps:
- step_number: 1
  action: MIX
  description: Mix peptone, yeast extract, mineral salt solution, agar, and distilled
    water.
- step_number: 2
  action: HEAT
  description: Gently heat and bring to a boil.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 121 degrees C for 15 min.
- step_number: 4
  action: COOL
  description: Cool to 45-50 degrees C.
- step_number: 5
  action: MIX
  description: Aseptically add the filter-sterilized glucose solution and vitamin
    solution.
- step_number: 6
  action: ADJUST_PH
  description: Adjust to pH 7.5 with sterile KOH, if necessary.
