preparation_notes: "Add components to distilled water, bring volume to 1.0 L and adjust\
  \ pH to 7.0. Distribute the medium into culture vessels under a N2-CO2 (4:1, v/v)\
  \ gas mixture, sparge with the same gas mixture for 10 - 15 min, seal with butyl\
  \ rubber stoppers and autoclave. Before inoculation, add the following sterile solutions\
  \ (autoclaved and stored under a N2 gas atmosphere) to the medium (per 10 ml of\
  \ medium): \n\nOriginal volume: 21 mL"
