preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: DSMZ Medium 141 notes that, when the medium is used without overpressure,
    pH should be adjusted with a small amount of sterile anoxic 1 N HCl if needed.
- step_number: 2
  action: AUTOCLAVE
  description: Dissolve ingredients except bicarbonate, vitamins, cysteine, and sulfide;
    sparge with 80% H2/20% CO2 for 30-45 min, add bicarbonate and adjust pH to 6.5,
    dispense under 80% H2/20% CO2 into anoxic Hungate tubes or serum vials to 30%
    of volume, and autoclave.
- step_number: 3
  action: MIX
  description: After sterilization, add cysteine and sulfide from sterile anoxic stocks
    autoclaved under 100% N2. Prepare vitamins under 100% N2 and filter-sterilize
    them before addition.
- step_number: 4
  action: ADJUST_PH
  description: Adjust the complete medium to pH 6.8-7.0 if necessary, and incubate
    under sterile 80% H2/20% CO2 at two atmospheres of pressure.
- step_number: 5
  action: ADJUST_PH
  description: For the Modified Wolin's mineral solution, first dissolve nitrilotriacetic
    acid and adjust pH to 6.5 with KOH, add minerals, and adjust final pH to 7.0 with
    KOH.
