preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare Liver extract by putting 10.0 g liver powder in 170.0 ml water,
    holding at 50-60 C for 1 hr, boiling for 5 min, adjusting pH to 7.2, and filtering.
- step_number: 2
  action: MIX
  description: Combine the base ingredients, 150.0 ml/L Liver extract, 10.0 ml/L Solution
    A, 5.0 ml/L Solution B, 10.0 ml/L 5% L-Cysteine HCl x H2O solution, and 825.0
    ml/L distilled water; omit horse blood before autoclaving.
- step_number: 3
  action: ADJUST_PH
  description: Adjust pH to 7.2 before autoclaving.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min.
- step_number: 5
  action: MIX
  description: Cool to 50 C and aseptically add 50.0 ml/L horse blood.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: JCM's default instruction is to autoclave media at 121 C for 15 min.
