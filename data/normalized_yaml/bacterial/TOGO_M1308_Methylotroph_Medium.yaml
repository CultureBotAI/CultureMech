applications:
- Microbial cultivation
preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the main-solution components and adjust pH to 7.0 with 6 N KOH.
    Autoclave, then after cooling add filter-sterilized methanol, CuCl2 solution,
    and CeCl3 solution.
references:
- reference: DSMZ:J1219
  authors: DSMZ MediaDive / Japan Collection of Microorganisms
  year: 2026
  notes: 'J1219: METHYLOTROPH MEDIUM. Authoritative formulation source for JCM Medium
    1219, including main ingredients, stock solutions, pH, and the solid-medium agar
    variant.'
- reference: doi:10.1264/jsme2.ME19128
  title: Isolation and Genomic Characterization of a Proteobacterial Methanotroph
    Requiring Lanthanides
  authors: Kato, S.; Takashino, M.; Igarashi, K.; Kitagawa, W.
  year: 2020
  notes: Primary literature source for the Ca-free lanthanide-test formulation and
    positive growth of Methylosinus sp. Ce-a6/JCM 32771 on methanol cultures with
    lanthanides.
- reference: PMID:11315676
  year: 2000
  notes: Methylovorus mays--novel species of aerobic, obligatory methylotrophic bacteria
    associated with plants. Primary literature source for Methylovorus mays growth
    characteristics already represented in this record.
variants:
- name: solid_methylotroph_medium
  description: Solidified version of JCM Medium 1219.
  modifications:
  - Add agar at 15.0 g/L before autoclaving.
  purpose: Solid medium preparation.
  evidence:
  - reference: DSMZ:J1219
    supports: SUPPORT
    explanation: MediaDive/JCM medium J1219 states that agar is added for solid medium
      preparation.
- name: ca_free_lanthanide_test_basal_medium
  description: Experimental Ca-free basal formulation used to test lanthanide effects
    in methanotroph cultures related to Methylotroph Medium.
  modifications:
  - Omit CaCl2 from the trace element solution.
  - Supplement cultures with methane or methanol and defined CaCl2 or rare-earth element
    chlorides after autoclaving.
  - Use methanol cultures to quantify lanthanide-dependent growth of strain Ce-a6.
  purpose: Experimental lanthanide-dependency growth tests.
  evidence:
  - reference: doi:10.1264/jsme2.ME19128
    supports: SUPPORT
    explanation: Kato et al. describe a Ca-free inorganic basal medium closely related
      to J1219 and the carbon-source/lanthanide supplements used for growth tests.
