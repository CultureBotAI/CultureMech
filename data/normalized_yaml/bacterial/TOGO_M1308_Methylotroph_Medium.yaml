- reference: DSMZ:J1219
  authors: DSMZ MediaDive / Japan Collection of Microorganisms
  year: 2026
  notes: 'J1219: METHYLOTROPH MEDIUM. Authoritative formulation source for JCM Medium
    1219, including main ingredients, stock solutions, pH, and the solid-medium agar
    variant.'
- reference: doi:10.1264/jsme2.ME19128
  title: Isolation and Genomic Characterization of a Proteobacterial Methanotroph
    Requiring Lanthanides
  authors: Kato, S.; Takashino, M.; Igarashi, K.; Kitagawa, W.
  year: 2020
  notes: Primary literature source for the Ca-free lanthanide-test formulation and
    positive growth of Methylosinus sp. Ce-a6/JCM 32771 on methanol cultures with
    lanthanides.
- reference: PMID:11315676
  year: 2000
  notes: Methylovorus mays--novel species of aerobic, obligatory methylotrophic bacteria
    associated with plants. Primary literature source for Methylovorus mays growth
    characteristics already represented in this record.
