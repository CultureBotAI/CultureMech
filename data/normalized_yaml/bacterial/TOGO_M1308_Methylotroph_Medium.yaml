variants:
- name: solid_methylotroph_medium
  description: Solidified version of JCM Medium 1219.
  modifications:
  - Add agar at 15.0 g/L before autoclaving.
  purpose: Solid medium preparation.
  evidence:
  - reference: DSMZ:J1219
    supports: SUPPORT
    explanation: MediaDive/JCM medium J1219 states that agar is added for solid medium
      preparation.
- name: ca_free_lanthanide_test_basal_medium
  description: Experimental Ca-free basal formulation used to test lanthanide effects
    in methanotroph cultures related to Methylotroph Medium.
  modifications:
  - Omit CaCl2 from the trace element solution.
  - Supplement cultures with methane or methanol and defined CaCl2 or rare-earth element
    chlorides after autoclaving.
  - Use methanol cultures to quantify lanthanide-dependent growth of strain Ce-a6.
  purpose: Experimental lanthanide-dependency growth tests.
  evidence:
  - reference: doi:10.1264/jsme2.ME19128
    supports: SUPPORT
    explanation: Kato et al. describe a Ca-free inorganic basal medium closely related
      to J1219 and the carbon-source/lanthanide supplements used for growth tests.
