media_term:
  preferred_term: TOGO Medium M1308
  term:
    id: TOGO:M1308
    label: Methylotroph Medium
notes: 'Original source: JCM - JCM_M1219 (DSMZ J1219 Methylotroph Medium). Chemically
  defined methylotroph medium (970 mL distilled water + 20 mL Mineral Solution + 1
  mL FeSO4·7H2O stock + 3.8 mL Vitamin Solution + 0.01 mL Vitamin B12 stock + 5 mL
  filter-sterilized methanol per liter = 994.81 mL total batch volume before methanol
  addition, 999.81 mL including 5 mL methanol).'
applications:
- Microbial cultivation
preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the main-solution components and adjust pH to 7.0 with 6 N KOH.
    Autoclave, then after cooling add filter-sterilized methanol, CuCl2 solution,
    and CeCl3 solution.
