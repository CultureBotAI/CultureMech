preparation_steps:
- step_number: 1
  action: HEAT
  description: 'Mix components, except sulfur, bring to a boil and cool down under
    a CO2 (100%) gas stream. While gassing, add the following components to the medium:'
- step_number: 2
  action: AUTOCLAVE
  description: 'Bubble CO2 for 3 - 4 min and check pH to be 6.5 - 6.8. Readjust pH
    to the range if necessary. Autoclave under a CO2 gas atmosphere. Add the following
    solution to the medium (separately autoclaved under N2):'
- step_number: 3
  action: MIX
  description: Steam sulfur for 3 hr on each of 3 successive days. Aseptically and
    anaerobically distribute the medium into culture vessels containing appropriate
    amount of sulfur (e.g., 10 ml of the medium and 0.05 g sulfur in Hungate tubes)
    under a CO2 stream and seal with butyl rubber stoppers.
applications:
- Microbial cultivation
