preparation_steps:
- step_number: 1
  action: FILTER
  description: Mix all ingredients in a beaker with a stir bar. Adjust pH to 7.6.
    Add 200 ml of 7% gelatin. Filter-sterilize entire medium. Add sterile rabbit serum
    to final concentration of 6%.
