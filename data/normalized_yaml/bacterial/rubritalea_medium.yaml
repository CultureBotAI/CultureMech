preparation_steps:
- step_number: 1
  action: MIX
  description: Adjust to pH 7.5
- step_number: 2
  action: ADJUST_PH
  description: Dissolve the nitrilotriacetic acid, adjust the pH to 7.0 with KOH (about
    7.3 g). Dissolve other salts separately, combine and adjust the pH to 6.8 with
    NaOH or H2SO4.
- step_number: 3
  action: DISSOLVE
  description: Dissolve the EDTA and add a few drops of concentrated H2SO4 to retard
    precipitation of the heavy metal ions.
- step_number: 4
  action: FILTER_STERILIZE
  description: Add NaHCO3 from a filter-sterilized stock solution when the medium
    has cooled.
applications:
- Microbial cultivation
