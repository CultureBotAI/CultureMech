preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Dissolve 15 g agar in 900 ml distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the agar solution.
- step_number: 3
  action: AUTOCLAVE
  description: Sterilize the 10xM9 solution separately by autoclaving.
- step_number: 4
  action: AUTOCLAVE
  description: Dissolve MgSO4 and CaCl2 stocks in distilled water and sterilize by
    autoclaving.
- step_number: 5
  action: FILTER_STERILIZE
  description: Filter-sterilize the 250 mM phenanthrene solution in DMSO using DMSO-safe
    filters.
- step_number: 6
  action: MIX
  description: Aseptically mix autoclaved agar, 10xM9, MgSO4, and CaCl2 solutions.
- step_number: 7
  action: MIX
  description: After cooling to 65 C, aseptically add phenanthrene solution, sonicate
    for approximately 30 seconds, and pour into plates.
