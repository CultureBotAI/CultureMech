preparation_notes: "Mix components thoroughly, adjust pH to 8.0, bring to a boil for\
  \ a few seconds and cool down under a stream of N2. Distribute the medium into culture\
  \ vessels (e.g., 10 ml in Hungate tubes) under a N2 gas stream, seal with butyl\
  \ rubber stoppers and autoclave. After cooling, aseptically and anaerobically add\
  \ per liter the following solutions from sterile anaerobic stocks (autoclaved or\
  \ *filter-sterilized): \n\nOriginal volume: 1036 mL"
