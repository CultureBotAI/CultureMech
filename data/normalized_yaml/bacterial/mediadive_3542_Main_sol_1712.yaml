  \ was complemented by addition of the following stock solutions: \nAfter adding\
  \ bicarbonate the gas was changed from N2 to N2/CO2 (90/10 %, v/v) and the pH was\
  \ adjusted to 7.2 - 7.4 with sterile 2 M HCL. \n\nOriginal volume: 950 mL"
