preparation_notes: "Mix components thoroughly, bring to a boil and cool down under\
  \ a N2-CO2 (4:1, v/v) gas stream and autoclave under the same gas mixture. After\
  \ cooling, add per liter the following solutions (autoclaved or *filter-sterilized):\
  \ \nAseptically and anaerobically, dispense the medium into culture vessels (e.g.,\
  \ 10 ml in Hungate tubes) under a N2-CO2 (4:1, v/v) gas stream and seal with butyl\
  \ rubber stoppers. Prior to inoculation, add per liter the following solutions (autoclaved\
  \ and stored under a N2 atmosphere): \nReadjust pH to 7.3-7.5, if necessary.\n\n\
  Original volume: 1030 mL"
