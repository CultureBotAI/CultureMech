preparation_notes: 'Boil potatoes for 20 min. Strain off the pieces of potatoes through
  a fine sieve. Add glucose and agar, and boil until dissolved. Do not use new potatoes.

  Adjust pH to 5.4-5.6.

  Comment: Commercial Potato dextrose agar (BD-Difco or Oxoid) is also available.'
