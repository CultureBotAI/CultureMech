preparation_notes: 'pH 9.0

  Prepare the medium anaerobically without the vitamins, Na2S, yeast extract NaHCO3,
  and Na2CO3. Boil the medium, cool under N2, add the NaHCO3, and Na2CO3, dispense
  under N2 and autoclave the medium. Add the vitamin solution, yeast extract, Na2S
  and glucose from sterile stock solution prepared under N2 to the cooled, autoclaved
  medium.'
