notes: |
  DAS Macro Solution for Dasycladales Seawater Medium.
  DAS = Dasycladales-specific formulation for marine algae.
  Provides macronutrients (nitrogen and phosphorus) for marine algae culture.

  Preparation: Combine 10 mL of 0.70 M sodium nitrate stock with 30 mL of 0.02 M disodium hydrogen phosphate heptahydrate stock to make the stated 40 mL composite stock. Autoclave each component stock before addition; add aseptically in the listed order and swirl gently. The 25% and 75% volume fractions refer to these prepared stocks within this 40 mL mixture, not to the pure solutes. Component stock strengths remain on the nested compositions.

  Receiving-medium context: UTEX expresses the component additions per 3 L of DAS and separately labels the receiving concentrations as 2.3 mM and 0.2 mM. These are not the component stock strengths or a universal working dose for every medium.

  Storage: Refrigerator temperature; no exact temperature is established by this source.
