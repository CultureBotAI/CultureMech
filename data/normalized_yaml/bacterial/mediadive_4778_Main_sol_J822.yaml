  \ under a N2-CO2 (80:20, v/v) gas stream. Dispense the medium into culture vessels\
  \ under the same gas mixture, seal with butyl rubber stoppers and autoclave. After\
  \ cooling, add per liter the following solutions from sterile anaerobic stocks (autoclaved\
  \ or *filter-sterilized): \n\nOriginal volume: 1001 mL"
