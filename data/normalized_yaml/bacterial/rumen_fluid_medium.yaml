preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix all ingredients except NaHCO3, L-Cysteine HCl H2O, and Na2S x 9H2O,
    then adjust the pH to 6.5. Bring the medium to a boil for 5-10 seconds, cool under
    H2-CO2 (80:20, v/v), add NaHCO3, dispense under H2-CO2, seal, and autoclave. Separately
    autoclave cysteine HCl and Na2S x 9H2O as 5% solutions under N2. Before inoculation,
    aseptically and anaerobically add the sterile cysteine and sulfide solutions,
    then pressurize the inoculated bottles to 200 kPa H2-CO2 (80:20, v/v).
- step_number: 2
  action: MIX
  description: Prepare clarified rumen fluid by preheating rumen content at 120 C
    for 15 minutes and using the supernatant after centrifugation at 25,000 x g for
    15 minutes.
- step_number: 3
  action: MIX
  description: Use JCM Medium 266 without its fatty acid mixture.
