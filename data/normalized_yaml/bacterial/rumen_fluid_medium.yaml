notes: TOGO M802 preserves JCM Medium 773 as Rumen Fluid Medium after the JCM 773
  page became unavailable. The JCM formula contains 660.0 ml distilled water, 0.13
  g MgSO4 x 7H2O, 0.6 g NaCl, 8.0 mg CaCl2 x 2H2O, 0.3 g KH2PO4, 0.3 g K2HPO4, 1.0
  mg resazurin, 0.5 g Na2S x 9H2O, 2.0 mg FeSO4 x 7H2O, 2.0 g NaHCO3, 0.3 g (NH4)2SO4,
  1.0 g Yeast extract from BD-Difco, 1.0 g Trypticase peptone from BD-BBL, 0.5 g L-Cysteine
  HCl H2O, 300.0 ml clarified rumen fluid from JCM Medium 266, 10.0 ml Trace minerals
  from JCM Medium 151, 10.0 ml Trace vitamins from JCM Medium 197, and H2-CO2/N2 anaerobic
  gas handling. JCM Medium 773 omits the JCM Medium 266 fatty acid mixture and adjusts
  the medium to pH 6.5.
