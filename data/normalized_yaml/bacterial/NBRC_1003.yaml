preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Dissolve MgSO4·7H2O, (NH4)2SO4, K2HPO4, and KCl in 1 L distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the base medium to pH 2.0 with H2SO4.
- step_number: 3
  action: MIX
  description: For heterotrophic growth on yeast extract, add 10 mg/L FeSO4·7H2O to
    the medium.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave the medium before adding sterile yeast extract.
- step_number: 5
  action: MIX
  description: For heterotrophic growth on yeast extract, add sterile yeast extract
    stock solution after autoclaving to 0.25 g/L final concentration.
- step_number: 6
  action: ADJUST_PH
  description: For autotrophic growth on ferrous sulfate, add 13.9 g/L FeSO4·7H2O
    and adjust medium pH to 1.7 with H2SO4 prior to autoclaving.
