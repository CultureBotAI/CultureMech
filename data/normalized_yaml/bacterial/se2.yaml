notes: 'Source: CCAP | Link: https://www.ccap.ac.uk/wp-content/uploads/MR_SE2_Freshwater.pdf


  CCAP prepares SE2 by twice autoclaving dried calcareous garden loam with twice its
  volume of deionized water, settling it for 2-3 weeks, decanting the supernatant,
  and autoclaving the final extract.'
ingredients:
- preferred_term: Prepared dried calcareous garden loam
  concentration:
    value: variable
    unit: VARIABLE
  term:
    id: ENVO:00001998
    label: soil
  notes: CCAP specifies air-dried and sieved calcareous garden loam.
- preferred_term: Deionized water
  concentration:
    value: 2 volumes per 1 volume dried soil
    unit: VARIABLE
  term:
    id: CHEBI:15377
    label: water
  mediaingredientmech_chebi_term:
    id: CHEBI:15377
    label: water
  notes: CCAP mixes dried soil with twice its volume of deionized water.
preparation_steps:
- step_number: 1
  action: MIX
  description: Air-dry calcareous garden loam, remove debris, and sieve it.
- step_number: 2
  action: MIX
  description: Combine dried soil with twice its volume of deionized water.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 15 psi and 126 C for 20 minutes, cool, and repeat once.
- step_number: 4
  action: STORE
  description: Seal and leave undisturbed for 2-3 weeks to settle.
- step_number: 5
  action: ALIQUOT
  description: Aseptically decant the supernatant into sterile containers.
- step_number: 6
  action: AUTOCLAVE
  description: Autoclave the final soil extract at 15 psi and 121 C for 15 minutes.
- step_number: 7
  action: STORE
  description: Cool, seal, and store refrigerated.
applications:
- Microbial cultivation
