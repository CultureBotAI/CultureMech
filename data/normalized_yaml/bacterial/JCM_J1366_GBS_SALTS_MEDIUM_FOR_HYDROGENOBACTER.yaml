preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly and distribute the medium into culture vessels
    (e.g., 5.0 ml in 25 ml serum bottles/Balch tubes) under a stream of N2, seal with
    butyl rubber stoppers and autoclave.
- step_number: 2
  action: MIX
  description: 'After cooling, aseptically add per liter the following solutions (autoclaved
    or *filter-sterilized and stored anaerobically): After inoculation, add air to
    the gas phase (30-40% by volume) and pressurize to 100 KPa with H2-CO2 (4:1, v/v)
    gas mixture.'
