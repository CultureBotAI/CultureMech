preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly and adjust pH 6.8.
- step_number: 2
  action: MIX
  description: Bring to a boil, cool down under a stream of N2, distribute the medium
    into culture vessels (e.g., 10 ml medium in Hungate type tubes) under N2, seal
    with butyl rubber stoppers and autoclave.
- step_number: 3
  action: MIX
  description: After inoculation, cultivate in the light using a tungsten lamp.
