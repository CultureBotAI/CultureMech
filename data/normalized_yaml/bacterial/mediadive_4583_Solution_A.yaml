preparation_notes: "Mix components and adjust pH to 7.0. Dispense the solution into\
  \ culture vessels (e.g., 10 ml in the Hungate tubes) under a N2-CO2 (4:1, v/v) gas\
  \ stream, seal with butyl rubber stoppers and autoclave.\nTo complete the medium,\
  \ anaerobically and aseptically add the following solutions (autoclaved under a\
  \ N2 atmosphere) to the medium (per 10 ml): \nComment: Sodium nitrate can be substituted\
  \ by ferric citrate (20 mM).\n\nOriginal volume: 1002 mL"
