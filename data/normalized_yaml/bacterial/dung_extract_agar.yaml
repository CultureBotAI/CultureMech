preparation_steps:
- step_number: 1
  action: FILTER_STERILIZE
  description: 'Dung extract: Boil an average sized piece of horse dung (fresh or
    frozen) for two hours in 150 ml water using a water bath; filter and use immediately.
    Sterilize at 121°C for 15 min.'
