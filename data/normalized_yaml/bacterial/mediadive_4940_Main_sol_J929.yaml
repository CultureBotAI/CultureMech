preparation_notes: "Add components to distilled water and bring volume to 1.0 L. Adjust\
  \ pH to 8.3 with 10 M KOH. Bring to a boil and cool down under a N2 gas stream.\
  \ Then, distribute the medium into culture vessels (e.g., 5 ml of the medium in\
  \ the Hungate tubes) under a N2-CO2 (4:1, v/v) gas mixture, seal with butyl rubber\
  \ stoppers and autoclave at 110C for 20 min. Aseptically and anaerobically add the\
  \ following solutions (autoclaved or *filter-sterilized) into the medium (per liter):\
  \ \n\nOriginal volume: 1078 mL"
