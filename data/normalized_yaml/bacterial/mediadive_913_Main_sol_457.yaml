preparation_notes: 'Adjust pH to 6.9.

  Prepare a separate solution of the phosphates and autoclave separately. Combine
  the two solutions after cooling.

  Rehydrate and cultivate lyophilized cells in complex medium (e.g. medium 1, 220
  or 535). After this reactivation, cultivate in mineral medium 457 with the appropriate
  carbon source.'
