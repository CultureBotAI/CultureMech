  and trace elements and fill solution in screw capped Erlenmeyer flasks to 10% of
  volume. Autoclave at 110°C for 30 min. Add magnesium chloride, magnesium sulfate,
  thiosulfate and bicarbonat from sterile stock solutions and adjust pH of the medium
  to 8.0 - 8.5.


