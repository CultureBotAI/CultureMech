preparation_notes: 'Dissolve ingredients (except cysteine) and sparge medium with
  100% N2 gas for 30 - 45 min to make it anoxic. Dispense medium under same gas atmosphere
  into anoxic Hungate-type tubes or serum vials and autoclave. Add cysteine form a
  sterile anoxic stock solution prepared under 100% N2 gas and adjust pH of the complete
  medium to 6.5, if necessary.


  Original volume: 1001 mL'
