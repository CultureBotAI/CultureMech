preparation_notes: "Mix components thoroughly and adjust pH to 7.2 with NaOH. Bring\
  \ to a boil, then cool down and distribute into culture vessels under a N2 gas stream,\
  \ seal with butyl rubber stoppers, and autoclave. After cooling, aseptically and\
  \ anaerobically add the following solution (autoclaved): \n\nOriginal volume: 1018\
  \ mL"
