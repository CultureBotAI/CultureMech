preparation_steps:
- step_number: 1
  action: MIX
  description: Mix Artificial saltwater, MES, Wolfe's mineral solution, Trace vitamins,
    and Tryptone.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 6.2-6.5.
- step_number: 3
  action: ALIQUOT
  description: Distribute the medium into culture vessels, replace the gas phase with
    N2-CO2-O2 (90:10:2, v/v/v), and seal with butyl rubber stoppers.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 degrees C for 15 min.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Autoclave the sealed culture vessels.
