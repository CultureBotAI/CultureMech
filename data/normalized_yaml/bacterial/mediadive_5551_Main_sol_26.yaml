preparation_notes: 'Adjust pH to 5.7.

  Boil the medium for a few minute.

  Sparge medium with 100% N2 gas mixture to make it anoxic.

  Fill 10 ml in 15 ml tubes with a rubber septum under a stream of nitrogen gas.

  Autoclave at 121 °C for 20 min.

  Sterile syringes are used to inoculate and remove samples.

  Incubate in the light using a tungsten lamp.'
