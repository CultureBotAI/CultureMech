preparation_steps:
- step_number: 1
  action: MIX
  description: Mix ingredients except vitamin solution, cysteine-HCl, and Na2S·9H2O.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the basal medium under N2/CO2 (80/20).
- step_number: 3
  action: AUTOCLAVE
  description: Separately autoclave cysteine-HCl and Na2S·9H2O as 3% solutions under
    an N2 atmosphere.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter-sterilize the vitamin solution.
- step_number: 5
  action: MIX
  description: Aseptically and anaerobically add filter-sterile vitamin solution and
    sterile cysteine-HCl and Na2S·9H2O solutions.
- step_number: 6
  action: ADJUST_PH
  description: For the trace elements solution, first dissolve NTA, adjust pH to 6.5
    with NaOH, then add minerals; final pH is 7.0.
