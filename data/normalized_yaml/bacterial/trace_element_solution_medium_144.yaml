  NaCl, 0.20 g/L FeCl2 x 4 H2O, 0.17 g/L CoCl2 x 6 H2O, 0.10 g/L CaCl2 x 2 H2O, 0.10
  g/L ZnCl2, 0.10 g/L MnCl2 x 4 H2O, 0.03 g/L NiCl2 x 6 H2O, 0.02 g/L CuCl2, 0.02
  g/L Na2SeO3 x 5 H2O, 0.01 g/L H3BO3, 0.01 g/L Na2MoO4 x 2 H2O, variable KOH, and
  distilled water.
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the 1 L Trace element solution stock from distilled water,
    KOH, nitrilotriacetic acid, NaCl, the cobalt, calcium, zinc, manganese, copper,
    borate, molybdate, selenite, nickel, and iron salts listed by KOMODO 3070.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the Trace element solution stock to pH 6.5 with KOH as needed.
