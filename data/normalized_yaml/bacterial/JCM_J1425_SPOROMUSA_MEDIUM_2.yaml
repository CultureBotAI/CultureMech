preparation_steps:
- step_number: 1
  action: MIX
  description: 'Solution A: Autoclave under a N2 gas atmosphere.'
- step_number: 2
  action: MIX
  description: 'Solution B: Autoclave under a N2 gas atmosphere.'
- step_number: 3
  action: MIX
  description: 'After autoclaving, combine solutions A and B, then add the following
    solutions (filtersterilized): To complete the medium, aseptically and anaerobically
    distribute the medium into culture vessels (e.g., 10 ml in Hungate tubes) under
    a H2-CO2 (80:20, v/v) gas stream and seal with butyl rubber stoppers.'
- step_number: 4
  action: MIX
  description: 'Prior to inoculation, add per liter the following solution (freshly
    prepared and filter-sterilized): Adjust pH to 7.0, if necessary.'
