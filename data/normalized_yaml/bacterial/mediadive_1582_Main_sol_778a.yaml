preparation_notes: 'Dissolve ingredients (except bicarbonate, calcium chloride and
  vitamins), boil medium for some minutes to dissolve the anthraquinone, then cool
  under 80% H2 and 20% CO2 gas atmosphere to room temperature. Add solid bicarbonate
  and adjust pH to 7.2, dispense medium under same gas atmosphere into anoxic Hungate-type
  tubes or serum vials and autoclave. Add calcium chloride and vitamins from sterile
  anoxic stock solutions prepared under 100% N2 gas atmosphere. Vitamins are sterilized
  by filtration. Adjust pH of complete medium to 7.2, if necessary.


  Original volume: 1003 mL'
