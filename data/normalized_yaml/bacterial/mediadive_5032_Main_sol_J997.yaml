preparation_notes: Dissolve ingredients except glucose and reducing agents. Prepare
  medium anaerobically under a 100% N2 gas-atmosphere, adjust pH to 7.0, dispense
  in anaerobic vials (1/3 vol.) and autoclave. Add glucose, cysteine and sulfide from
  sterile, anoxic stock solutions prepared under N2.
