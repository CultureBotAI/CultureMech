ph_value: 7.0
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare HNW Medium from JCM Medium 344 and adjust pH to 7.0 with NaOH.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the HNW Medium base at 121 C for 15 min.
- step_number: 3
  action: MIX
  description: After cooling, add filter-sterilized 8% NaHCO3 solution and Trace vitamins.
- step_number: 4
  action: FILTER
  description: Freshly prepare and filter-sterilize 0.1% sodium dithionite solution.
- step_number: 5
  action: MIX
  description: Prior to inoculation, add 25.0 mL 0.1% sodium dithionite solution per
    liter and pressurize inoculated bottles to 200 kPa H2-CO2 (4:1, v/v).
sterilization:
  method: AUTOCLAVE
