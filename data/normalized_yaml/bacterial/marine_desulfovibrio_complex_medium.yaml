preparation_steps:
- step_number: 1
  action: MIX
  description: Mix Sea salts (Sigma), Wolfe's mineral elixir, Yeast extract (BD-Difco),
    Resazurin, and 945 ml distilled water thoroughly.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base medium under an N2 atmosphere.
- step_number: 3
  action: FILTER_STERILIZE
  description: Filter-sterilize 8% NaHCO3 solution and Trace vitamins as sterile anaerobic
    stock solutions.
- step_number: 4
  action: MIX
  description: Aseptically and anaerobically add 20 ml 1 M sodium lactate solution,
    10 ml Trace vitamins, and 25 ml 8% NaHCO3 solution per liter.
- step_number: 5
  action: MIX
  description: Distribute under an N2-CO2 (4:1, v/v) gas stream, seal culture vessels
    with butyl rubber stoppers, and finally add 6 ml/L 5% Na2S x 9 H2O solution autoclaved
    and stored under N2.
sterilization:
  method: AUTOCLAVE
  notes: JCM Medium 1367 autoclaves the base under N2 and uses sterile anaerobic stock
    solutions; NaHCO3 and Trace vitamins are filter-sterilized.
