ph_range:
  min: 6.8
  max: 7.0
  notes: JCM Medium 389 says adjust pH to 6.8-7.0, if necessary.
preparation_steps:
- step_number: 1
  action: MIX
  description: Mix ingredients except FeSO4 x 7 H2O, sodium thioglycolate, and ascorbic
    acid.
- step_number: 2
  action: HEAT
  description: Bring the medium to a boil and cool to room temperature under an N2
    gas stream.
- step_number: 3
  action: MIX
  description: Add FeSO4 x 7 H2O in 10 mL distilled water plus sodium thioglycolate
    and ascorbic acid in 10 mL distilled water.
- step_number: 4
  action: ADJUST_PH
  description: Adjust pH to 7.8 with NaOH; adjust to pH 6.8-7.0 if necessary.
- step_number: 5
  action: ALIQUOT
  description: While swirling under an N2 gas stream, dispense into culture vessels
    and seal with butyl rubber stoppers.
- step_number: 6
  action: AUTOCLAVE
  description: Autoclave the sealed medium.
sterilization:
  method: AUTOCLAVE
