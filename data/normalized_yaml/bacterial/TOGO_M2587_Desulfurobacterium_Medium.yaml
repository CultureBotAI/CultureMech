    Additional exact excerpt: "1. Dissolve ingredients (except sulfur, carbonate, vitamins, growth-stimulating factors and Na-dithionite), boil medium for 1 min, then cool to room temperature under 80% H2 and 20% CO2 gas atmosphere."
    preparation_steps[0].description: Retain the original main-recipe instruction and its stage; it is not new growth evidence. No unstated density, final volume, percent basis or chemical identifier is inferred. Locator=comments[0].comment; accessed=2026-10-09T04:05:06.095210+00:00; capture SHA256=ab7ea3ea0014701a9effaa5abec0effcd03276f79f9c36b1d2ceb0c5b9b0a034.

    Additional exact excerpt: "Adjust pH to 6.0 and dispense under 80% H2 and 20% CO2 gas atmosphere into anoxic Hungate-type tubes or serum vials which contain already the appropriate amount of sulfur, only to 30% of their volume to allow for a large head space."
    preparation_steps[1].description: Retain the original main-recipe instruction and its stage; it is not new growth evidence. No unstated density, final volume, percent basis or chemical identifier is inferred. Locator=comments[1].comment; accessed=2026-10-09T04:05:06.095210+00:00; capture SHA256=ab7ea3ea0014701a9effaa5abec0effcd03276f79f9c36b1d2ceb0c5b9b0a034.

    Additional exact excerpt: "Autoclave at a temperature of 110°C for 20 min! Add vitamins, growth-stimulating factors from sterile anoxic stock solutions prepared under 100% N2 gas and carbonate and Na-dithionite from sterile anoxic stock solutions prepared under 80% N2 and 20% CO2 gas atmosphere."
    preparation_steps[2].description: Retain the original main-recipe instruction and its stage; it is not new growth evidence. No unstated density, final volume, percent basis or chemical identifier is inferred. Locator=comments[2].comment; accessed=2026-10-09T04:05:06.095210+00:00; capture SHA256=ab7ea3ea0014701a9effaa5abec0effcd03276f79f9c36b1d2ceb0c5b9b0a034.

    Additional exact excerpt: "Vitamins and dithionite are sterilized by filtration. Adjust pH of the complete medium to 6.0, if necessary."
    preparation_steps[3].description: Retain the original main-recipe instruction and its stage; it is not new growth evidence. No unstated density, final volume, percent basis or chemical identifier is inferred. Locator=comments[3].comment; accessed=2026-10-09T04:05:06.095210+00:00; capture SHA256=ab7ea3ea0014701a9effaa5abec0effcd03276f79f9c36b1d2ceb0c5b9b0a034.

