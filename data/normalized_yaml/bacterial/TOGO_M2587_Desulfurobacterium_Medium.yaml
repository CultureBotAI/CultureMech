    the appropriate amount of sulfur, only to 30% of their volume to allow for a large
    head space.", "status": "add", "reference": "https://togomedium.org/sparqlist/api/gmdb_medium_by_gmid?gm_id=M2587",
    "snippet": "\"Adjust pH to 6.0 and dispense under 80% H2 and 20% CO2 gas atmosphere
    into anoxic Hungate-type tubes or serum vials which contain already the appropriate
    amount of sulfur, only to 30% of their volume to allow for a large head space.\""},
    {"old_field": null, "field": "preparation_steps[2].description", "old": null,
    "new": "Autoclave at a temperature of 110\u00b0C for 20 min! Add vitamins, growth-stimulating
    factors from sterile anoxic stock solutions prepared under 100% N2 gas and carbonate
    and Na-dithionite from sterile anoxic stock solutions prepared under 80% N2 and
    20% CO2 gas atmosphere.", "status": "add", "reference": "https://togomedium.org/sparqlist/api/gmdb_medium_by_gmid?gm_id=M2587",
    "snippet": "\"Autoclave at a temperature of 110\u00b0C for 20 min! Add vitamins,
    growth-stimulating factors from sterile anoxic stock solutions prepared under
    100% N2 gas and carbonate and Na-dithionite from sterile anoxic stock solutions
    prepared under 80% N2 and 20% CO2 gas atmosphere.\""}, {"old_field": null, "field":
    "preparation_steps[3].description", "old": null, "new": "Vitamins and dithionite
    are sterilized by filtration. Adjust pH of the complete medium to 6.0, if necessary.",
