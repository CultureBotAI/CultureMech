  preparation_notes: |-
    Dissolve NaHCO3 in water and make the solution anoxic by sparging with 80% N2 and 20% CO2 gas mixture.

    Then dissolve the Na-dithionite and filter sterilize the solution into anoxic Hungate tubes.

    Store the prepared solution in the dark and refrigerated. Prepare only small amounts of stock solution, as Na-dithionite decomposes rapidly.
