  Superseded historical provenance, not a current formulation claim:
  Commercial Product: LB Medium (Luria-Bertani, Miller formulation)
  Supplier: Multiple suppliers (Difco, Sigma, etc.)
  Catalog: Multiple (L3522 Sigma, 244520 BD)
  Source: https://www.laboratorynotes.com/preparation-of-luria-bertani-lb-miller-broth/
  Accessed: 2026-03-28

  Constituent composition researched from product specification.

  TOGO M2587 is a distinct captured source version. It specifies a bicarbonate-based dithionite stock and no final-medium denominator; current DSMZ829's NaOH carrier and reported 1005 ml final volume must not silently replace these assertions. External same-name stock references are withdrawn unless exact composition/version identity is established.

  The current DSMZ829 dithionite carrier is 0.50 ml of 1 N NaOH, unlike TOGO's bicarbonate stock. This comparison does not replace the source-specific TOGO formulation.

  The TOGO dithionite section includes a hydrogen-gas item, while its preparation text specifies 80% N2 and 20% CO2. Preserve that upstream discrepancy; do not infer an amount or silently select one gas formulation.

  Full exact-source recipe and stock/preparation tables were inspected. Reconstructed nodes retain explicit source scope; complete prior ingredient/stock assertions, including copied LB mappings and stage conflations, are archived in append-only history. A title alone is not the basis for removal. Unchanged annotations are preserved, not recertified; no new organism-growth association is added.

