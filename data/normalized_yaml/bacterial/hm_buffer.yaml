- step_number: 2
  action: MIX
  description: Dilute 50.0 ml/L 0.5 M HEPES to 1000.0 ml/L with UPW.
- step_number: 3
  action: ADJUST_PH
  description: Adjust pH to 7.4.
- step_number: 4
  action: AUTOCLAVE
  description: Sterilize the HEPES/UPW base by autoclaving.
- step_number: 5
  action: MIX
  description: After autoclaving, add 6.0 ml/L 0.5 M CaCl2 stock and 3.33 ml/L 0.6
    M MgCl2 stock.
sterilization:
