preparation_notes: "Mix components and adjust pH to 7.0. Bring to a boil and cool\
  \ down under a N2-CO2 (4:1, v/v) gas stream. Distribute the medium into culture\
  \ vessels under the same gas mixture, seal with butyl rubber stoppers and autoclave.\
  \ After cooling, aseptically and anaerobically add per liter the following solutions\
  \ (autoclaved or *filter-sterilized): \nPrior to use, add per liter the following\
  \ solution to reduce the medium (autoclaved and stored under N2): \n\nOriginal volume:\
  \ 989 mL"
