preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust the pH to 7.0 - 7.2.
- step_number: 2
  action: AUTOCLAVE
  description: Filter sterilize the vitamin solution and add to the autoclaved medium.
- step_number: 3
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
- step_number: 4
  action: ADJUST_PH
  description: Adjust pH to 6.0 .
