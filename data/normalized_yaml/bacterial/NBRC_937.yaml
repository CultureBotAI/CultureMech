notes: 'Source: NBRC Medium 936 | Link: https://www.nite.go.jp/nbrc/catalogue/NBRCMediumDetailServlet?NO=936


  NBRC lists Hydrogen-oxidizing bacteria medium with KP buffer, MgCl2·6H2O, CaCl2·2H2O,
  NH4Cl, Na2S2O3, trace element and vitamin stocks, Na2CO3, and distilled water. The
  basal medium is dispensed under H2/CO2/O2, KP buffer is autoclaved separately under
  N2, vitamin solution is filter-sterilized, and inoculated vessels are pressurized
  to 150 kPa with H2/CO2/O2. NBRC does not list a final medium pH.'
