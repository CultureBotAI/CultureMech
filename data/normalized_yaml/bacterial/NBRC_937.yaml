preparation_steps:
- step_number: 1
  action: MIX
  description: Mix ingredients except KP buffer and vitamin solution.
- step_number: 2
  action: ALIQUOT
  description: Dispense the medium into suitable culture vessels under a stream of
    H2/CO2/O2 (75/20/5) and seal with butyl rubber stoppers.
- step_number: 3
  action: AUTOCLAVE
  description: Separately autoclave KP buffer under an N2 atmosphere.
- step_number: 4
  action: FILTER_STERILIZE
  description: Sterilize vitamin solution by filtration.
- step_number: 5
  action: MIX
  description: Prior to inoculation, aseptically add KP buffer and vitamin solution.
- step_number: 6
  action: MIX
  description: Pressurize inoculated vessels to 150 kPa with H2/CO2/O2 (75/20/5).
- step_number: 7
  action: ADJUST_PH
  description: For the trace elements solution, first dissolve NTA, adjust pH to 6.5
    with NaOH, then add minerals; final pH is 7.0.
