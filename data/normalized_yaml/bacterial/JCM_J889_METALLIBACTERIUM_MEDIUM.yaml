preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix components, except Trace vitamins, adjust pH to 5.5 and autoclave.
    After cooling, aseptically add filter-sterilized Trace vitamins solution.
- step_number: 2
  action: ADJUST_PH
  description: First adjust pH to 1.0 with diluted H2SO4, then dissolve the salts.
