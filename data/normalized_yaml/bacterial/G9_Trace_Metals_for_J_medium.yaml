notes: "G9 Trace Metals solution for J Medium (UTEX).\nProvides essential micronutrients\
  \ for freshwater algae culture.\n\nPreparation: Add components in the listed order\
  \ to approximately 900 mL deionized water while stirring. Make up to a final volume\
  \ of 1 L. \n\nStorage: Refrigerator temperature; no exact temperature is established\
  \ by this source.\n\nThe source also prints a Final Concentration column and a stock-solution\
  \ footnote. Those annotations are retained as a source interpretation issue, not\
  \ asserted here as independently verified stock molarities. The structured values\
  \ use the explicit g/L Amount column. No receiving-medium dose or replacement molarity\
  \ is inferred.\n"
