  from JCM Medium 187, 1 ml/L Selenite-tungstate stock from JCM Medium 431, 30 ml/L
  5% NaHCO3, 10 ml/L Trace vitamins from JCM Medium 197, 1 ml/L Vitamin B12 stock
  from JCM Medium 403, 2 ml/L 5% Sodium thiosulfate, 10 ml/L 10% Yeast extract, 10
  ml/L Syringate, 10 ml/L 0.1 M Dithiothreitol, and 10 ml/L freshly prepared 2.5%
  Sodium dithionite after inoculation. The final pH is 7.2-7.4.
