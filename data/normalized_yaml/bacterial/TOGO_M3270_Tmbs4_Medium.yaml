preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the base salts, FeCl2 solution, Trace element solution, Selenite-tungstate
    solution, resazurin, and 930.0 ml distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave under an N2-CO2 (4:1, v/v) gas atmosphere.
- step_number: 3
  action: MIX
  description: After cooling, add the 5% NaHCO3, Trace vitamins, Vitamin B12, 5% Sodium
    thiosulfate, 10% Yeast extract, Syringate, and 0.1 M Dithiothreitol stocks from
    anaerobic stocks in sequence.
- step_number: 4
  action: ALIQUOT
  description: Aseptically and anaerobically distribute the medium under the same
    gas mixture and seal culture vessels with butyl rubber stoppers.
- step_number: 5
  action: MIX
  description: After inoculation, add 10.0 ml/L freshly prepared and filter-sterilized
    2.5% Sodium dithionite solution.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Autoclave the base under N2-CO2 (4:1, v/v); JCM Medium 1408 adds sterile
    anaerobic stocks after cooling and freshly prepared filter-sterilized Sodium dithionite
    solution after inoculation.
