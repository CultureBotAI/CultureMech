- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.0.
- step_number: 2
  action: FILTER_STERILIZE
  description: Where necessary, put a piece of sterilized filter paper (ca. 1 x 2
    cm) or carnation leaf on the agar medium and incubate cultures under near-UV light
    for sporulation.
