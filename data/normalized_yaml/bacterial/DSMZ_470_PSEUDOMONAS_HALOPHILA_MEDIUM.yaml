preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Vitamin solution is filter-sterilized and added after autoclaving.
    Solution A and B are autoclaved separately and combined after cooling.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 7.0 with 6 M NaOH or HCl.
- step_number: 3
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
