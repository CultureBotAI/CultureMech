preparation_notes: 'Mix potatoes and CaCO3 then autoclave 30 min at 121°C. Filter
  through cheese cloth, add glucose and cysteine, distribute under 100% N2 gas atmosphere
  into anoxic Hungate-type tubes or serum vials and autoclave at 121°C for 20 min.
  Adjust pH of complete medium to 6.8.

  Note: For the reactivation of freeze-dried strains it is recommended to use the
  following simple milk medium:'
