ingredients:
- preferred_term: yeast autolysate
  concentration:
    value: '4'
    unit: PERCENT_W_V
  source: TOGO Medium M2770 / Rosenthal et al. 2011
  notes: TOGO M2770 lists 4% yeast autolysate for 4-YACo medium.
- preferred_term: maltose
  concentration:
    value: '20'
    unit: MILLIMOLAR
  source: TOGO Medium M2770 / Rosenthal et al. 2011
  notes: TOGO M2770 supplements 4-YACo medium with 20 mM maltose.
  term:
    id: CHEBI:18167
    label: alpha-maltose
  mediaingredientmech_chebi_term:
    id: CHEBI:18167
    label: alpha-maltose
- preferred_term: H2
  concentration:
    value: '80'
    unit: PERCENT_V_V
  source: TOGO Medium M2770 / Rosenthal et al. 2011
  notes: TOGO M2770 uses 80% H2 and 20% CO2 in the Balch-tube headspace.
  term:
    id: CHEBI:18276
    label: dihydrogen
  mediaingredientmech_chebi_term:
    id: CHEBI:18276
    label: dihydrogen
- preferred_term: CO2
  concentration:
    value: '20'
    unit: PERCENT_V_V
  source: TOGO Medium M2770 / Rosenthal et al. 2011
  notes: TOGO M2770 uses 80% H2 and 20% CO2 in the Balch-tube headspace.
  term:
    id: CHEBI:16526
    label: carbon dioxide
  mediaingredientmech_chebi_term:
    id: CHEBI:16526
    label: carbon dioxide
- preferred_term: biotin
  concentration:
    value: 60-100
    unit: MICROG_PER_L
  source: TOGO Medium M2770 / Rosenthal et al. 2011
  notes: TOGO M2770 reports 0.3-0.5 ug biotin per 5 ml culture tube, equivalent to
    60-100 ug/L.
  term:
    id: CHEBI:15956
    label: biotin
  mediaingredientmech_chebi_term:
    id: CHEBI:15956
    label: biotin
- preferred_term: Vitamin B6 supplement
  concentration:
    value: 24-40
    unit: MG_PER_L
  source: TOGO Medium M2770 / Rosenthal et al. 2011
  notes: TOGO M2770 reports 120-200 ug per 5 ml culture tube under the Vitamin B6
    heading and names pyridoxal-HCl and pyridoxal-phosphate; modeled as an opaque
    B6 supplement family.
- preferred_term: Vitamin B12/corrinoid supplement
  concentration:
    value: 6-10
    unit: MG_PER_L
  source: TOGO Medium M2770 / Rosenthal et al. 2011
  notes: TOGO M2770 reports 30-50 ug of one B12/corrinoid form per 5 ml culture tube,
    equivalent to 6-10 mg/L; the alternatives are hydroxocobalamin acetate salt, hydroxocobalamin
    hydrochloride, methylcobalamin, or cyanocobalamin.
- preferred_term: L-tryptophan
  concentration:
    value: 12-20
    unit: MG_PER_L
  source: TOGO Medium M2770 / Rosenthal et al. 2011
  notes: TOGO M2770 reports 60-100 ug tryptophan per 5 ml culture tube, equivalent
    to 12-20 mg/L.
  term:
    id: CHEBI:27897
    label: tryptophan
  mediaingredientmech_chebi_term:
    id: CHEBI:27897
    label: tryptophan
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare 4-YACo medium with 4% yeast autolysate and 20 mM maltose.
- step_number: 2
  action: MIX
  description: Supplement each 5 ml culture with the Vitamin B7, Vitamin B6, Vitamin
    B12/corrinoid, and tryptophan quantities reported by TOGO M2770.
- step_number: 3
  action: ALIQUOT
  description: Grow cultures in 5 ml volumes in 25 ml Balch tubes with crimp-top stoppers
    under an 80% H2 and 20% CO2 headspace in the dark at room temperature.
