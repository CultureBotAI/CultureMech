preparation_notes: 'Dissolve ingredients except carbonate, hydrogenphosphate, ferrous
  chloride, yeast extract, vitamins, cysteine and ferric iron hydroxide sludge. Suspend
  pellet of ferric iron hydroxide in medium and sparge with 80% H2 and 20% CO2 gas
  mixture for 30 - 45 min to make it anoxic. Thereafter, dispense suspension under
  80% H2 and 20% CO2 gas atmosphere into anoxic Hungate-type tubes or serum vials
  and autoclave for 30 min. Add hydrogenphosphate, ferrous chloride (dissolved in
  0.1 N HCl), yeast extract, cysteine and vitamins from sterile anoxic stock solutions
  prepared under 100% N2 gas and carbonate from a sterile anoxic stock solution prepared
  under 80% N2 and 20% CO2 gas mixture. Vitamins and ferrous chloride should be sterilized
  by filtration. The pH of the complete medium should be at 5.5.


  Original volume: 1003 mL'
