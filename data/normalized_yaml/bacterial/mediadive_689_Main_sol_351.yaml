preparation_notes: 'Adjust pH to 7.0.

  Prepare the medium under an atmosphere of N2. Dispense into screw capped or crimp
  top bottles fitted with a rubber septum, or Hungate tubes.

  Autoclave at 121 °C for 15 min.

  After sterilization add filter-sterilized vitamin and neutralized sulfide solutions.'
