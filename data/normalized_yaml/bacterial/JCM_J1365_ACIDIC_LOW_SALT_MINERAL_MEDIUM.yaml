preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly.
- step_number: 2
  action: MIX
  description: For preparation of solid medium, add 15.0 g/L agarose.
- step_number: 3
  action: MIX
  description: 'Autoclave and, after cooling to 60C, add the following solutions (autoclaved
    or *filter-sterilized): Check pH to be 2.0 to 3.0.'
- step_number: 4
  action: MIX
  description: 'Cultivate with methane or methanol as a substrate as described below:
    Methane.'
- step_number: 5
  action: MIX
  description: Aseptically distribute the medium into sterile serum bottles (leave
    ≥ 80% gas phase by volume) and seal with rubber stoppers.
- step_number: 6
  action: MIX
  description: Add sterile CO2 and methane (respectively 2-10% and 5-20% by volume)
    in the gas phase.
- step_number: 7
  action: MIX
  description: Cultivate with shaking.
- step_number: 8
  action: MIX
  description: 'Methanol: Aseptically distribute the medium into culture vessels (e.g.,
    10 ml in 60 ml serum bottles), supplement with 0.4-1.0 ml per liter methanol (filter-sterilized)
    and seal with rubber stoppers.'
- step_number: 9
  action: MIX
  description: Add sterile CO2 (2-10% by volume) in the gas phase.
applications:
- Microbial cultivation
