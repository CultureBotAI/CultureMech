notes: |
  Trace metal stock solution for Bold Basal Medium (BBM) and related algae culture media.
  Provides essential micronutrients (Zn, Mn, Mo, Cu, Co) for freshwater algae.

  Preparation: Add components to approximately 900 mL deionized water in the order specified
  while stirring continuously. Add H2SO4 FIRST to acidify the solution before adding metals.
  This prevents precipitation. Bring to 1 L total volume.

  Storage: Room temperature in darkness. The acidic pH keeps metals in solution.

  Source discrepancy: the table's separately labeled concentration columns and its stock-solution footnote do not provide a consistent basis for the former micromolar stock summary. The structured amounts retain the explicit preparation amounts per final 1 L; no replacement molarity or working dilution is asserted. The manganese row prints MnCl.4H2O rather than the assigned MnCl2.4H2O; its supplied-form claim remains unresolved.
