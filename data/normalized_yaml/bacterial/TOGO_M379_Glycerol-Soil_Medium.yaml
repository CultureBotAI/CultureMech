notes: JCM Medium 384 Glycerol-Soil Medium lists, per liter, 5.0 g Bacto peptone (BD-Difco),
  3.0 g Beef extract (BD-Difco), 20.0 g Glycerol, 150 ml Soil extract, 850 ml Tap
  water, and 15.0 g Agar. The final pH is 7.0. Soil extract is prepared by autoclaving
  400 g air-dried garden soil in 960 ml tap water at 121 C for 1 hr, cooling and settling
  the slurry, decanting and paper-filtering the supernatant, then autoclaving and
  storing it at room temperature until cleared by sedimentation.
