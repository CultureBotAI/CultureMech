ph_value: 7.0
preparation_steps:
- step_number: 1
  action: MIX
  description: Mix KH2PO4, MgCl2 x 6 H2O, CaCl2 x 2 H2O, NH4Cl, NaCl, yeast extract,
    peptone, trace stocks, and distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 7.0.
- step_number: 3
  action: HEAT
  description: Bring to a boil and cool under an N2-CO2 (4:1, v/v) gas stream.
- step_number: 4
  action: AUTOCLAVE
  description: Distribute the medium into culture vessels under the same gas mixture,
    seal with butyl rubber stoppers, and autoclave.
- step_number: 5
  action: MIX
  description: After cooling, aseptically and anaerobically add sodium pyruvate, NaHCO3,
    L-cysteine, and Na2S stock solutions.
sterilization:
  method: AUTOCLAVE
