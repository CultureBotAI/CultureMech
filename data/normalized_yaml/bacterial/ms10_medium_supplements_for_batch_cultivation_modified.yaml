variants:
- name: Nordkvist 2003 microaerobic MS10 without lipoic acid and with acetate
  relationship: SUBSTITUTED_COMPONENT_VARIANT
  description: 'Source-described bioreactor assay, not a fully normalized expansion
    of MS10. The cited Cocaign-Bousquet 1995 base is available only as an abstract.
    The parent''s 42.92 mM K2HPO4 and 66.13 mM KH2PO4 are not certified: Nordkvist
    specifies threefold-higher phosphate for precultures, and the complete base formula
    needed to resolve the reactor concentrations is unavailable. Do not automatically
    divide these parent amounts or import preculture buffering into the reactor. Chemical
    hydrates, stereochemistry, and the generic parent filter-sterilization step remain
    unverified. '
  modifications:
  - Use source-specified MnSO4 at 1.25e-5 g/liter, not the parent's manganese chloride.
    Hydration is not specified; no molar conversion is applied.
  - Keep reactor medium separate from the threefold-phosphate preculture. Exact normalized
    reactor phosphate amounts remain unresolved pending the full MS10 base source.
  - Use the Figure 1C treatment without DL-6,8-thioctic acid and with 0.82 g/liter
    sodium acetate; retain this reported mass basis without certifying the parent's
    9.996 mM conversion.
  evidence:
  - reference: doi:10.1128/AEM.69.6.3462-3468.2003
    supports: SUPPORT
    snippet: MnSO 4 (1.25 × 10 −5 g · liter −1 )
    explanation: 'Supports variants[].modifications manganese identity and literal
      mass dose; Nordkvist Materials and Methods, medium paragraph. Separate exact
      formulation excerpt=''without dl -6,8-thioctic acid but with 0.82 g of sodium
      acetate liter −1''; Figure 1C caption and Table 2. Source-described bioreactor
      assay, not a fully normalized expansion of MS10. The cited Cocaign-Bousquet
      1995 base is available only as an abstract. The parent''s 42.92 mM K2HPO4 and
      66.13 mM KH2PO4 are not certified: Nordkvist specifies threefold-higher phosphate
      for precultures, and the complete base formula needed to resolve the reactor
      concentrations is unavailable. Do not automatically divide these parent amounts
      or import preculture buffering into the reactor. Chemical hydrates, stereochemistry,
      and the generic parent filter-sterilization step remain unverified. '
