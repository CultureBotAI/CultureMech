  authors: Nordkvist M; Jensen NB; Villadsen J
  year: 2003
  notes: 'source_type=journal_article; discovery_mode=MediaDB_source_cross_reference;
    accessed_on=2026-10-13; MediaDB sourceID=127, medID=415. Exact SQL joins establish
