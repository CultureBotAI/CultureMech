    PMID:12788751; PMC161490. Full article/Markdown=references_cache/papers/primary_html/nordkvist-2003-pmc.{html,md};
    PubMed=references_cache/papers/PMID_12788751.{xml,md}; Figure 1 raw/Markdown=references_cache/papers/primary_images/nordkvist-2003-figure1.{jpg,md}.
    Inspected Methods, growth-results passages, Figure 1 all panels and Table 2. Variant_destination=''Nordkvist
    2003 microaerobic MS10 without lipoic acid and with acetate''; assay=Figure 1C.
    Source-described bioreactor assay, not a fully normalized expansion of MS10. The
    cited Cocaign-Bousquet 1995 base is available only as an abstract. The parent''s
    42.92 mM K2HPO4 and 66.13 mM KH2PO4 are not certified: Nordkvist specifies threefold-higher
    phosphate for precultures, and the complete base formula needed to resolve the
    reactor concentrations is unavailable. Do not automatically divide these parent
    amounts or import preculture buffering into the reactor. Chemical hydrates, stereochemistry,
    and the generic parent filter-sterilization step remain unverified. Reported organism=Lactococcus
    lactis subsp. lactis MG1363; scientific name and canonical label=Lactococcus cremoris
    subsp. cremoris MG1363; NCBITaxon:416870; rank=strain; taxonomy_match=exact strain
    with documented historical reclassification. Wegmann 2007 Discussion (doi:10.1128/JB.01768-06)
    explicitly reconciles the former lactis classification with the later cremoris
    classification; NCBI lists the older cremoris name as a synonym of its current
    node. Lookup_on=2026-10-13; https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=416870&retmode=xml;
    archive=references_cache/papers/taxonomy/mg1363-20261013.{xml,md}. The article''s
    analytical 0.22-micrometer filtration concerns extracellular-metabolite samples,
    not a verified medium-sterilization method. Figure 4''s later rescue experiment
    is distinct from Figure 1B''s timed supplementation; no outcomes are pooled. Organism
    inventory is bounded to these cultivation passages; no organisms from cited references
    become target entries.'
