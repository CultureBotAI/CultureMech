preparation_notes: 'Dissolve ingredients except sulfur, carbonate, yeast extract,
  glucose, vitamins, and sulfide, then sparge medium with 80% N2 and 20% CO2 gas mixture
  for 30 - 45 min to make it anoxic. Dispense medium under same gas atmosphere into
  anoxic Hungate-type tubes or serum vials containing already the appropriate amount
  of sulfur. Heat the medium vials to 90-100°C for 1 hour on each of 3 successive
  days to sterilize the medium. Add yeast extract, glucose, vitamins (sterilized by
  filtration), and sulfide from sterile anoxic stock solutions prepared under 100%
  N2 gas and carbonate from a sterile anoxic stock solution prepared under 80% N2
  and 20% CO2 gas mixture. Prior to use check pH of complete medium and adjust to
  6.8 - 7.0, if necessary.


  Original volume: 1002 mL'
