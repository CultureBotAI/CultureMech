preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Use Medium No. 151 with 2.0 g/L (final) yeast extract, 2.0 g/L (final)
    peptone and 1.0 g/L Na2S2O3 x 5H2O, and omit sulfur. Adjust pH to 7.0.
- step_number: 2
  action: FILTER
  description: Apply the base-medium filtration under N2, with sulfur omitted and
    sodium sulfide prepared separately. The variant overrides receiving-medium pH
    to 7.0.
- step_number: 3
  action: MIX
  description: Before inoculation, add the separately prepared sterile sodium sulfide
    solution. Apply the variant's pH 7.0 override. No sulfur preparation or addition
    is performed.
applications:
- Microbial cultivation
