  \ 346ml with demineralized water and filter sterilize through 0.2µm filter\nAliquot\
  \ 17.3ml into 50ml tubes and store at -20°C.\nWhen ready to use add: \nFilter sterilize\
  \ each tube through 0.2µm filter.\n\nOriginal volume: 358 mL"
