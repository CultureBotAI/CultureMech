preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 6.5.
- step_number: 2
  action: ADJUST_PH
  description: Dissolve peptone, yeast extract and cysteine in 800 ml of distilled
    water. Adjust pH to 6.5 with NaOH. Add agar and dissolve by heating.
- step_number: 3
  action: HEAT
  description: Add 2 g/l activated charcoal to the agar base solution before autoclaving.
    After autoclaving, cool to 45°C and add sterilized serum.
