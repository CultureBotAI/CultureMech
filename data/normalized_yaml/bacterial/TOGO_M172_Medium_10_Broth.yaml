notes: TOGO M172 preserves JCM Medium 179 as Medium 10 Broth. TOGO M172 records 850
  ml distilled water, 0.5 g each of cellobiose, glucose, soluble starch, and Yeast
  extract from BD-Difco, 2 g Trypticase peptone from BD-BBL, 0.5 ml 0.1% Resazurin
  solution, 0.5 ml 0.2% Hemin solution, 100 ml 4% Na2SO3 solution, 2 ml 25% L-Ascorbic
  acid solution, 10 ml 5% L-Cysteine HCl H2O solution, and VFA and salt stocks from
  Medium 10 / TOGO M124, with pH adjusted to 6.7-6.8. It omits agar and Toray silicone
  from the JCM Medium 133 Medium 10 formulation. The current JCM Medium 179 URL no
  longer exposes the recipe.
