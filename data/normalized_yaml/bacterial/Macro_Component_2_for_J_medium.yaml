notes: "Macro Component 2 for J Medium (UTEX).\nSecond of two macronutrient stock\
  \ solutions for J Medium.\nProvides magnesium, iron, and EDTA chelator for metal\
  \ bioavailability.\n\nPreparation: Add components in the listed order to approximately\
  \ 850 mL deionized water while stirring. Adjust pH to 7.5; the source does not specify\
  \ a titrating reagent. Make up to a final volume of 1 L. \n\nStorage: Refrigerator\
  \ temperature; no exact temperature is established by this source.\n\nThe source\
  \ also prints a Final Concentration column and a stock-solution footnote. Those\
  \ annotations are retained as a source interpretation issue, not asserted here as\
  \ independently verified stock molarities. The structured values use the explicit\
  \ g/L Amount column. No receiving-medium dose or replacement molarity is inferred.\n\
  \nNote: EDTA chelates iron and trace metals, improving their bioavailability and\n\
  preventing precipitation in the alkaline pH range of the medium.\n"
