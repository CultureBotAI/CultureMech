preparation_steps:
- step_number: 1
  action: MIX
  description: Mix NaCl, KH2PO4, NH4Cl, KCl, Na2SO4, Trace element solution, Selenite-tungstate
    solution, resazurin, and distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base under an N2-CO2 (4:1, v/v) gas atmosphere.
- step_number: 3
  action: MIX
  description: After cooling, add bicarbonate, MgCl2 x 6H2O, CaCl2 x 2H2O, vitamin,
    thiamine, vitamin B12, sodium formate, and sodium acetate stocks at the JCM Medium
    1399 per-liter ratios.
- step_number: 4
  action: ALIQUOT
  description: Aseptically and anaerobically distribute 20 ml medium into 60 ml serum
    bottles under the same N2-CO2 gas mixture and seal with butyl rubber stoppers.
- step_number: 5
  action: MIX
  description: Prior to use, add 6.0 ml/L autoclaved 5% Na2S x 9H2O solution stored
    under N2 to reduce the medium.
