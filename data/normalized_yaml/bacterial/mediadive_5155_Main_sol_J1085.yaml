preparation_notes: "Mix components thoroughly, adjust pH to 7.0 and autoclave under\
  \ a N2 atmosphere. After cooling, aseptically and anaerobically add per liter the\
  \ following sterile solutions from anaerobic stocks (autoclaved and stored under\
  \ a N2 atmosphere or *filter-sterilized and stored under 80% N2 and 20% CO2 gas\
  \ mixture): \nDispense the medium into culture vessels under a N2 atmosphere and\
  \ seal with butyl rubber stoppers. Finally, add per litter the following solutions\
  \ (autoclaved and stored under a N2 atmosphere): \n\nOriginal volume: 1042 mL"
