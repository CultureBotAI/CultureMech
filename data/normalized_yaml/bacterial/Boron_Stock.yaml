notes: |
  Boron stock solution for Bold Basal Medium (BBM) and related algae culture media.
  Provides boron as an essential micronutrient for algae growth.

  Preparation: Dissolve 11 g boric acid in approximately 900 mL distilled water,
  then bring to 1 L total volume.

  Storage: Room temperature in darkness.

  Source discrepancy: the preparation specifies 11 g H3BO3 per final 1 L, but the same page also prints approximately 9 micromolar as a final solution concentration. That parenthetical is not treated as verified stock molarity. The mass concentration is retained; no replacement molarity or receiving-medium interpretation is inferred.
