preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly and adjust pH 7.5.
- step_number: 2
  action: MIX
  description: Bring to a boil and cool down under a N2-CO2 (4:1, v/v) gas stream.
- step_number: 3
  action: MIX
  description: Autoclave under the same gas mixture.
- step_number: 4
  action: MIX
  description: 'After cooling, add the following solutions (filter-sterilized): Aseptically
    and anaerobically distribute the medium into culture vessels (e.g., 10 ml medium
    in Balch tubes) under the same gas mixture and seal with butyl rubber stoppers.'
- step_number: 5
  action: MIX
  description: Add per liter the following solution (autoclave or *filter-sterilize
    and store under a N2 atmosphere).
- step_number: 6
  action: MIX
  description: Readjust pH to 7.5-8.0, if necessary.
