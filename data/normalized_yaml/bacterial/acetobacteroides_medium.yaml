preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: The vitamin solution, trace element solution, Se/W solution, cysteine,
    glucose, Na2S and NaHCO3 are added after the medium has been autoclaved.
- step_number: 2
  action: MIX
  description: 'Note: for preparation see Medium 141'
- step_number: 3
  action: ADJUST_PH
  description: First dissolve NTA in 200 ml of distilled water and adjust pH to 6.5
    with KOH, then dissolve mineral salts. Finally adjust pH to 6.5 with KOH and make
    up to 1000.00 ml.
applications:
- Microbial cultivation
