preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Prepare the DSM 3246 variant of anaerobic DSMZ Medium 298 by omitting
    2,3-butanediol and adding 1 g/L Acetoin.
- step_number: 2
  action: AUTOCLAVE
  description: Sparge the medium with 80% N2 and 20% CO2 for 30 to 45 minutes, dispense
    under the same gas atmosphere into anoxic tubes or vials, and autoclave.
- step_number: 3
  action: FILTER_STERILIZE
  description: Add Acetoin and sulfide from sterile anoxic stock solutions after autoclaving.
- step_number: 4
  action: ADJUST_PH
  description: Adjust the complete medium to pH 7.2 to 7.5 before use.
