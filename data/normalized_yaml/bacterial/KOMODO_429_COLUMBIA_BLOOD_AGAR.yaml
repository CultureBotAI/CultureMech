variants:
- name: columbia_blood_agar_staphylococcus_saccharolyticus_anaerobic
  description: Columbia blood agar cultivation evidence for the type strain
    Staphylococcus saccharolyticus ATCC 14953 / DSM 20359 / NCTC 11807, formerly
    Peptococcus saccharolyticus.
  modifications:
  - BacDive DSMZ Medium 693 specifies Columbia agar base with 50 g/L
    defibrinated sheep blood; the local parent record contains a Columbia blood
    agar base with horse blood at 40 g/L.
  - Incubate anaerobically or under reduced oxygen at 37 C for this anaerobic
    organism.
  purpose: Capture strain-specific qualitative growth evidence while preserving
    the blood-source and concentration difference as a variant-level formulation
    note.
  evidence:
  - reference: PMID:7077295
    supports: SUPPORT
    snippet: The highest bacterial counts were obtained on Columbia blood agar
      incubated anaerobically.
    explanation: The primary literature reports quantitative culture of
      Peptococcus saccharolyticus strains, now Staphylococcus saccharolyticus,
      on Columbia blood agar under anaerobic incubation.
  - reference: https://bacdive.dsmz.de/strain/14567
    supports: SUPPORT
    explanation: BacDive identifies Staphylococcus saccharolyticus S1 as the
      type strain with DSM 20359, ATCC 14953, JCM 1768, and NCTC 11807 aliases;
      its cultivation data list Columbia Blood Medium with positive growth at 37
      C.
