preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Dissolve NH4Cl, MgSO4 x 7 H2O, and CaCl2 x 2 H2O in distilled water
    with 0.1 ml/L Trace element solution and 0.1 ml/L Iron stock solution.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the basal medium.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the Phosphate buffer stock solution separately.
- step_number: 4
  action: MIX
  description: After cooling, add 1.0 ml/L sterile Phosphate buffer stock solution
    to the basal medium.
- step_number: 5
  action: ADJUST_PH
  description: Adjust the medium to pH 8.0.
- step_number: 6
  action: ALIQUOT
  description: Distribute 20 ml aliquots into sterile 120 ml serum bottles and seal
    with butyl rubber stoppers.
- step_number: 7
  action: FILTER_STERILIZE
  description: Replace the gas phase with filter-sterilized methane-air (80:20, v/v).
sterilization:
  method: AUTOCLAVE
  notes: Autoclave the basal medium and Phosphate buffer stock solution separately;
    filter-sterilize the methane-air gas phase.
data_quality_flags:
- has_ontology_mappings
