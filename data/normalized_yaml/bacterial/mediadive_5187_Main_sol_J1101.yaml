  \ into culture vessels (e.g., 10 ml medium in Hungate tubes) under a N2 gas atmosphere\
  \ and seal with butyl rubber stoppers. Prior to inoculation, add per liter the following\
  \ solution (autoclaved and stored under a N2 gas atmosphere): \nAdjust pH to 9.0,\
  \ if necessary.\n\nOriginal volume: 1011 mL"
