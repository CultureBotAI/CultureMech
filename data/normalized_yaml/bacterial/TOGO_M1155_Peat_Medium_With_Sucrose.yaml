preparation_steps:
- step_number: 1
  action: MIX
  description: Mix peptone, yeast extract, sucrose, Major metals, Trace metal 1 solution,
    and distilled water thoroughly.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base medium at 121 degrees C for 15 min.
- step_number: 3
  action: COOL
  description: Cool the autoclaved base medium, then add filter-sterilized 0.5 M MES
    solution.
- step_number: 4
  action: ALIQUOT
  description: Aseptically distribute the medium into culture vessels and replace
    the gas phase with N2-CO2 (4:1, v/v).
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Autoclave the base medium before adding filter-sterilized MES.
