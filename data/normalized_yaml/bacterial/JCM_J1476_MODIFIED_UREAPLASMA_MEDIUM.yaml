preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Dissolve 21.0 g PPLO broth without crystal violet (BD-Difco) in 700
    ml distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min and cool to 50 C.
- step_number: 3
  action: FILTER_STERILIZE
  description: Aseptically add 200 ml fetal bovine serum (inactivated at 56 C for
    30 min), 100 ml filter-sterilized 25% (w/v) fresh yeast extract solution, 5 ml
    filter-sterilized 10% (w/v) urea solution, and 10 ml filter-sterilized 0.2% (w/v)
    phenol red solution.
- step_number: 4
  action: ADJUST_PH
  description: Mix thoroughly and adjust pH to 6.0 with sterile 1 N HCl.
