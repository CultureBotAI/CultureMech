preparation_steps:
- step_number: 1
  action: MIX
  description: Suspend Nutrient Broth (OXOID) and optional agar in distilled water;
    the source records pH as unadjusted.
- step_number: 2
  action: AUTOCLAVE
  description: Sterilize the OXOID Nutrient Agar/Broth base by autoclaving.
- step_number: 3
  action: FILTER_STERILIZE
  description: Sterilize sodium benzoate and kanamycin separately by filtration.
- step_number: 4
  action: MIX
  description: Aseptically add filter-sterilized sodium benzoate and kanamycin to
    the autoclaved base.
sterilization:
  method: AUTOCLAVE
  notes: Autoclave the OXOID Nutrient Agar/Broth base and filter-sterilize sodium
    benzoate and kanamycin separately before aseptic addition.
