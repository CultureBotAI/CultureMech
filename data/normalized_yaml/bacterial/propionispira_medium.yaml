preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: 'Adjust pH to 7.2. Gas atmosphere: 80% N2 + 20% CO2. Prepare a 5% (w/v)
    solution of sodium sulfide anoxically under nitrogen and autoclave separately.
    Before use, neutralize by dropwise addition of 1 N HCl.'
- step_number: 2
  action: ADJUST_PH
  description: First dissolve NTA in 200 ml of distilled water and adjust pH to 6.5
    with KOH, then dissolve mineral salts. Finally adjust pH to 6.5 with KOH and make
    up to 1000.00 ml.
