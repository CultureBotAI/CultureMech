preparation_steps:
- step_number: 1
  action: FILTER_STERILIZE
  description: Prepare the medium without ethanol in closed vessels with a medium
    to headspace ratio of 1:5 to 1:10. Adjust pH to 7.0 and sterilize. Allow to cool
    to about 45°C before adding 0.5 mL filter-sterilized ethanol per liter medium.
