notes: TOGO M2267 imports ATCC Medium 2746, Autoinducer Bioassay (AB) Medium. ATCC
  prepares a 970 ml base from NaCl, MgSO4, Casamino Acids, and DI Water, adjusts the
  pH to 7.5 with 3 N NaOH, autoclaves the base at 121 C, cools it completely, and
  adds 10 ml each 1 M Potassium Phosphate (pH 7.0), 0.1 M L-arginine, and Glycerol
  from separate sterile stocks.
