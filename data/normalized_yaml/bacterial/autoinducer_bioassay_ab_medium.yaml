preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve NaCl, MgSO4, and Casamino Acids in DI Water.
- step_number: 2
  action: ADJUST_PH
  description: Bring the pH of the base solution to 7.5 with 3 N NaOH.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the base at 121 C.
- step_number: 4
  action: COOL
  description: Cool the autoclaved base completely.
- step_number: 5
  action: MIX
  description: Add 10.0 ml/L each 1 M Potassium Phosphate (pH 7.0), 0.1 M L-arginine,
    and Glycerol from separate sterile stocks.
