preparation_notes: 'To make medium anoxic boil it, cool under N2CO2 gas atmosphere,
  add 1 g/l L-cysteine hydrochloride and adjust pH to 6.8. Finally gas over with N2
  . Dispense under N2CO2 into suitable vessels for anaerobic growth (serum bottles
  or Hungate tubes sealed with rubber stoppers) and sterilize by autoclaving.


  Original volume: 500 mL'
