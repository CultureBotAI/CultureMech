parent_media:
  path: data/normalized_yaml/bacterial/r2a_medium.yaml
  relationship: CONCENTRATION_VARIANT
  id: CultureMech:001984
  name: r2a_medium
  notes: R3 A Medium (DSMZ 1153) is a double-strength formulation of
    full-strength R2A Medium (mediadive.medium:830 / DSMZ 830) - same component
    identity, salts and nutrients roughly 2x, agar held at 15 g/L. R2A is the
    canonical root of this family.
variant_relationship: CONCENTRATION_VARIANT
variant_modifications:
- 'R3 A Medium roughly doubles the nutrient and salt components of full-strength R2A:
  yeast extract, proteose peptone, casamino acids, glucose, and starch from 0.5 to
  1 g/L; K2HPO4 from 0.3 to 0.6 g/L; MgSO4 x 7 H2O from 0.05 to 0.1 g/L; agar remains
  15 g/L. Sodium pyruvate is 0.5 g/L per DSMZ Medium 1153 (1.67x R2A''s 0.3 g/L, not
  exactly doubled).'
