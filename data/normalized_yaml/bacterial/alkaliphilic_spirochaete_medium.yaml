preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the medium under N2, omitting Na2CO3, Na HCO3, Na2S, sucrose
    and vitamin solution.
- step_number: 2
  action: ADJUST_PH
  description: Boil the medium and cool under nitrogen, add the Na2CO3 and NaHCO3
    and adjust the pH to 9.7 with 6N NaOH (about 15 ml). Sterilize by autoclaving
    and add the Na2S (neutralized), vitamins and sucrose from sterile stock solutions.
- step_number: 3
  action: ADJUST_PH
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals. Adjust final to pH 7.0 with KOH.
applications:
- Microbial cultivation
