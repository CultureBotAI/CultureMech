ingredients:
- preferred_term: Corn meal
  concentration:
    value: '50.0'
    unit: G_PER_L
  source: DSMZ Medium 191
  notes: DSMZ Medium 191 blends 50.0 g corn meal in 800 ml distilled water, leaves
    it overnight in the refrigerator, heats it at 60 C for one hour, filters it, and
    brings the filtrate to 1 L.
  term:
    id: mediadive.compound:2087
    label: Corn meal
- preferred_term: Agar
