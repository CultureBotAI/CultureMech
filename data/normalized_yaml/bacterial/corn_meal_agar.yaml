    id: CHEBI:2509
    label: agar
  concentration:
    value: '10.0'
    unit: G_PER_L
  source: DSMZ Medium 191
  notes: DSMZ Medium 191 adds 10.0 g agar after bringing the corn-meal filtrate to
    1 L and heats to dissolve it before autoclaving.
  mediaingredientmech_chebi_term:
    id: CHEBI:2509
    label: agar
preparation_steps:
- step_number: 1
  action: MIX
  description: Blend 50.0 g corn meal in 800 ml distilled water and leave overnight
    in the refrigerator.
- step_number: 2
  action: HEAT
  description: Heat at 60 C for one hour.
- step_number: 3
  action: FILTER
  description: Filter and bring the volume to 1 L.
- step_number: 4
  action: HEAT
  description: Add 10.0 g agar and heat to dissolve.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave the completed corn meal agar.
