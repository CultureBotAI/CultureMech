preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: 'Mix ingredients, adjust pH to 7.5 and autoclave under a N2 atmosphere.
    After cooling, add the following stock solutions (filter-sterilized or *autoclaved)
    to the solution:'
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave in culture vessels.
- step_number: 3
  action: AUTOCLAVE
  description: To complete the medium, combine Solution A and substrate in the culture
    vessels under a N2-CO2 (4:1, v/v) gas mixture and seal with butyl rubber stoppers.
    Finally, reduce the medium with 0.01 volume of 5% Na2S x 9H2O solution (autoclaved
    and stored under a N2 atmosphere).
