preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components, adjust pH to 6.5 with H2SO4 solution and autoclave
    under a N2 gas atmosphere.
- step_number: 2
  action: MIX
  description: 'After cooling, add the following solutions from sterile anaerobic
    stocks (autoclaved or *filter-sterilized): Readjust pH to 6.5, if necessary.'
- step_number: 3
  action: MIX
  description: Separately autoclave and dry iron metal (grain).
- step_number: 4
  action: MIX
  description: Aseptically distribute the medium and iron metal into culture vessels
    (e.g., 10 ml medium and 100 mg iron in Hungate tubes) under a N2 gas stream and
    seal with butyl rubber stoppers.
applications:
- Microbial cultivation
