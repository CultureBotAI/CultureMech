    notes: |-
      Stated liquid input for this preparation stage, not a per-liter receiving-medium rate; no density or percentage inference. Exact batch input: 50.00 ml; stage=Solution A.

      Procedure-only preparation; no ingredient masses are supplied. The 30% vial fill is a storage instruction, not medium concentration. Rumen fluid from cow or sheep (obtained from fistulated animals or abattoir refuse) is
      filtered through muslin, autoclaved at 121°C for 15 min and then centrifuged at 27,000 g
      for 20 min. The supernatant is made anoxic by sparging with 100% N2 gas for 15 min,
      dispensed under same gas atmosphere into anoxic serum vials to 30% of volume and then
      stored frozen at -20°C.
