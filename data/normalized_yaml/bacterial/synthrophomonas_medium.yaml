    C, E and F are autoclaved\nunder 100% N2 gas atmosphere. Solution D is prepared
    under 100% N2 gas and sterilized\nby filtration. To complete the medium appropriate
    amounts of solutions B to F are added to\nthe sterile solution A in the sequence
    as indicated. Adjust pH of complete medium to 7.2, if\nnecessary.\n\n2. Note:
    Some cultures are shipped in semi-solid medium which stimulates growth at the\nbeginning.
