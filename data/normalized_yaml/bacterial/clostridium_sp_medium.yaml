preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (note that most of the carbonate remains suspended)
    and sparge medium with 100% N2 gas for 30 -45 min to make it anoxic. Dispense
    medium under same gas atmosphere into anoxic Hungate-type tubes or serum vials
    vials while stirring to keep carbonate suspended and autoclave.
