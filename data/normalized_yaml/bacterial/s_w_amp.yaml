- preferred_term: Air-dried sieved calcareous soil
  concentration:
    value: variable
    unit: VARIABLE
  notes: Add a layer approximately 1 cm deep to each vessel.
- preferred_term: Deionized water
  concentration:
    value: variable
    unit: VARIABLE
  notes: Add carefully to a depth of 7-10 cm above the soil layer.
preparation_steps:
- step_number: 1
  action: ALIQUOT
  description: Place approximately 0.01 g ammonium magnesium phosphate in the base
    of each vessel.
- step_number: 2
  action: ALIQUOT
  description: Place a 1 cm layer of air-dried, sieved calcareous soil in each vessel.
- step_number: 3
  action: MIX
  description: Optionally add one grain for organisms that benefit from it.
- step_number: 4
  action: ALIQUOT
  description: Add deionized water carefully to a depth of 7-10 cm, then plug or cover.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave at 15 psi for 15 minutes on each of two consecutive days.
- step_number: 6
  action: STORE
  description: Let stand for at least one further day before inoculation.
