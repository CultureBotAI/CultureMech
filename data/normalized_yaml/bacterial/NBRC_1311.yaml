notes: Mix ingredients except for vitamin solution, cysteine-HCl and Na2S·9H2O, and
  autoclave under a N2/CO2 atmosphere (80/20). Separately autoclave cysteine-HCl and
  Na2S·9H2O solutions as 5% solutions under a N2 atmosphere. Sterilize vitamin solution
  by filtration. Prior to inoculation, add vitamin solution, cysteine-HCl and Na2S·9H2O.
  First dissolve nitrilotriacetic acid and adjust pH to 6.5 with NaOH, and then add
  minerals. Final pH 7.0.
