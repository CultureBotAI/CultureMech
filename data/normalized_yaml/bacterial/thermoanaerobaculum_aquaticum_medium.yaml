preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: 'Mix components thoroughly and adjust pH to 7.0 with NaOH. Distribute
    the medium into culture vessels under a N2 gas stream, seal with butyl rubber
    stoppers and autoclave. Reduce the medium by the addition of the following solutions
    (autoclaved under a N2 gas atmosphere) per liter:'
- step_number: 2
  action: ADJUST_PH
  description: Dissolve nitrilotriacetic acid and adjust pH to 6.0 with KOH. Then
    proceed to add minerals.
