- reference: doi:10.1111/j.1472-765X.1996.tb01099.x
  title: A new chemically-defined medium for Bacillus subtilis (168) NCIMB 12900
  authors: J. Leitch; P.J. Collier
  year: 1996
  notes: 'source_type=journal_article; discovery_mode=MediaDB_source_cross_reference;
