preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: 'Mix components thoroughly, adjust pH to 7.0 with KOH, distribute the
    medium into culture vessels (e.g., 5 ml of the medium in the Hungate tubes) under
    a N2--CO2 (4:1, v/v) gas mixture, seal with butyl rubber stoppers and autoclave.
    After cooling, add per liter the following solutions from anaerobic stocks (autoclaved
    or *filter--sterilized):'
- step_number: 2
  action: ADJUST_PH
  description: Use Medium No. [786] supplemented with 1.0 g/L NaCl (final), 1.0 g/L
    yeast extract (final) and 4.96 g/L Na2S2O3・5H2O. Adjust pH to 7.4, if necessary.
