preparation_notes: 'Dissolve the nitrilotriacetic acid (C6H9NO6), adjust the pH to
  8.0 with 1 M NaOH.

  Dissolve the remaining ingredients in the nitrilotriacetic acid solution and adjust
  to pH 8.2 with 1 M NaOH.

  Autoclave at 121° C for 15 minutes.'
