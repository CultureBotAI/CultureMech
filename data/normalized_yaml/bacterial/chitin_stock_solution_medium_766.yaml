notes: DSMZ Medium 766 prepares its chitin stock solution by acid-treating 20 g practical-grade
  crab-shell chitin with 200 ml 37% HCl at 4 C, pouring the suspension into 1 L cold
  distilled water, filtering and washing the residue, resuspending it in 1 L water,
  neutralising it with 10 ml 5 M KOH to pH 6.5, and washing with 3 L water to remove
  KCl.
