preparation_steps:
- step_number: 1
  action: COOL
  description: Pre-cool the 37% HCl and distilled water to 4 C.
- step_number: 2
  action: MIX
  description: Mix 20 g practical-grade chitin from crab shells with 200 ml 37% HCl
    and stir for 1 h at 4 C.
- step_number: 3
  action: FILTER
  description: Pour the suspension into 1 L distilled water pre-cooled to 4 C and
    filter through filter paper.
- step_number: 4
  action: MIX
  description: Wash the residue five times with 500 ml distilled water and resuspend
    it in 1 L distilled water.
- step_number: 5
  action: ADJUST_PH
  description: Neutralise the suspension to pH 6.5 with 10 ml of 5 M KOH.
- step_number: 6
  action: FILTER
  description: Filter and wash with 3 L distilled water to remove KCl.
