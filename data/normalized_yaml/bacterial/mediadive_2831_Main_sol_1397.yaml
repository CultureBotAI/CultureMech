preparation_notes: 'pH 7.0

  Prepare medium except vitamin solution, NaHCO3 und Na2S-cysteine solution under
  N2/CO2 gas. Add vitamin solution (filter sterilized), NaHCO3 (filter sterilized)
  and Na2S-cysteine solution(autoclaved) as sterile stock solutions to sterile medium
  after autoclaving. Adjust pH to 7.0.'
