notes: "Source: DSMZ | Link: https://www.dsmz.de/microorganisms/medium/pdf/DSMZ_Medium1245.pdf\n\
  \nSuperseded historical provenance, not a current formulation claim:\nCommercial\
  \ Product: LB Medium (Luria-Bertani, Miller formulation)\nSupplier: Multiple suppliers\
  \ (Difco, Sigma, etc.)\nCatalog: Multiple (L3522 Sigma, 244520 BD)\nSource: https://www.laboratorynotes.com/preparation-of-luria-bertani-lb-miller-broth/\n\
  Accessed: 2026-03-28\n\nConstituent composition researched from product specification.\n\
  \nPreserve source descriptive/preparation text without falsely encoding every paragraph\
  \ as an instruction: OTEB-medium is available from Anaerobe Systems (http://www.anaerobesystems.com)\n\
  The following text was taken from the above page: \r\n\r\n- ORAL TREPONEME ENRICHMENT\
  \ BROTH (OTEB)\r\n\r\n- Products: AS-603 Oral Treponeme Enrichment Broth (OTEB)\
  \ 10 tubes / pkg\nIntended Use: OTEB is an enriched medium for the isolation, cultivation\
  \ and maintenance of Treponemes found as part of the oral flora.\nOTEB is a complex\
  \ peptone-yeast extract medium containing volatile fatty acids and serum for a source\
  \ of long chain fatty acids. Volatile fatty acids and serum are necessary nutrients\
  \ for recovery of Treponemes from the oral flora. Inoculation of the medium can\
  \ be done using a gassing cannula or inside an anaerobic chamber. This medium is\
  \ prepared, stored and dispensed under oxygen-free conditions to prevent the formation\
  \ of oxidized products prior to use.\nFinal pH 7.0 +/- 0.2 at 25 degrees C.\nFinal\
  \ volume 7.0 ml +/- 0.7.\n\nThe original states final pH 7.0 +/- 0.2 at 25 C: the\
  \ range 6.8-7.2 remains, while 25 C is a measurement condition. The printed final\
  \ volume 7.0 +/- 0.7 ml is retained, but cannot establish this formula's batch denominator.\
  \ The API declares 1000 ml although listed liquid inputs sum to 1003.1 ml. No final-medium\
  \ g/L or density conversion is inferred.\n\nComplete source tables were inspected.\
  \ Reconstructed ingredient/stock nodes retain source-specific amounts and uncertainties;\
  \ historical flattened amounts, false supplier-tagged LB ingredients and unsupported\
  \ interpretations are archived in append-only history. Existing unrelated metadata\
  \ and prior evidence remain preserved, not recertified."
