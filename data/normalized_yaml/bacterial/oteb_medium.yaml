    \ accessed=2026-10-09T05:34:33.373325+00:00; capture SHA256=2bcf71383b6fe0d25fa345832072429a262e21c3bf65da59edad55a11163c0d7.\n\
    \nAdditional exact excerpt: [\n                    {\n                       \
    \ \"step\": \"OTEB-medium is available from Anaerobe Systems (http://www.anaerobesystems.com)\"\
    \n                    },\n                    {\n                        \"step\"\
    : \"The following text was taken from the above page: \\r\\n\\r\\n- ORAL TREPONEME\
    \ ENRICHMENT BROTH (OTEB)\\r\\n\\r\\n- Products: AS-603 Oral Treponeme Enrichment\
    \ Broth (OTEB) 10 tubes / pkg\"\n                    },\n                    {\n\
    \                        \"step\": \"Intended Use: OTEB is an enriched medium\
    \ for the isolation, cultivation and maintenance of Treponemes found as part of\
    \ the oral flora.\"\n                    },\n                    {\n         \
    \               \"step\": \"OTEB is a complex peptone-yeast extract medium containing\
    \ volatile fatty acids and serum for a source of long chain fatty acids. Volatile\
    \ fatty acids and serum are necessary nutrients for recovery of Treponemes from\
    \ the oral flora. Inoculation of the medium can be done using a gassing cannula\
    \ or inside an anaerobic chamber. This medium is prepared, stored and dispensed\
    \ under oxygen-free conditions to prevent the formation of oxidized products prior\
    \ to use.\"\n                    },\n                    {\n                 \
