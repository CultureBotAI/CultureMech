preparation_notes: 'Adjust pH to 7.2. Gas atmosphere: 80% N2 + 20% CO2. Prepare a
  5% (w/v) solution of sodium sulfide anoxically under nitrogen and autoclave separately.
  Before use, neutralize by dropwise addition of 1 N HCl.'
