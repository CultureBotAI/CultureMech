notes: This medium is for co-culture of strain JT with Methanospirillum hungatei strain
  NBRC 100397. For vial cultures, dissolve all ingredients except for Na-terephthalate,
  Na2S·9H2O and cysteine-HCl (up to 900ml), flush N2/CO2 (80/20), and autoclave. Add
  0.5 ml of each of filter-sterilized Na2S·9H2O solution (0.6g Na2S·9H2O/50 ml) and
  cysteine-HCl solution (0.6g cysteine-HCl/ 50ml) per each vial separately. Add 0.2
  ml of neutralized and filter-sterilized 0.2 M Na-terephthalate solution. Yeast extract
  is also added at final concentration about 0.02%. Inoculum size 10-20%. Growth was
  observed after 3-4 weeks of incubation. First dissolve NTA in 200 ml of water and
  adjust the pH to 6.5 with KOH.
