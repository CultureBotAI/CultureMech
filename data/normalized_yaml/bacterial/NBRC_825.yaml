preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve all ingredients except Na-terephthalate, Na2S·9H2O, and cysteine-HCl
    up to 900 ml.
- step_number: 2
  action: AUTOCLAVE
  description: Flush with N2/CO2 (80/20), then autoclave.
- step_number: 3
  action: FILTER_STERILIZE
  description: Filter-sterilize Na2S·9H2O, cysteine-HCl, and neutralized 0.2 M Na-terephthalate
    solutions separately.
- step_number: 4
  action: MIX
  description: Add filter-sterile Na2S·9H2O, cysteine-HCl, and neutralized Na-terephthalate
    solutions to each vial separately.
