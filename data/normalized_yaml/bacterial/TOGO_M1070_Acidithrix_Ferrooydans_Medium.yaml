preparation_steps:
- step_number: 1
  action: MIX
  description: Mix UBS solution, Trace minerals, Ni-Se-W solution, glucose, yeast
    extract, and distilled water thoroughly.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the medium to pH 2.5 with H2SO4.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the acidified base medium.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter-sterilize 1 M FeSO4 solution at pH 2.0.
- step_number: 5
  action: MIX
  description: After cooling, add 5.0 ml/L filter-sterilized 1 M FeSO4 solution at
    pH 2.0.
sterilization:
  method: AUTOCLAVE
