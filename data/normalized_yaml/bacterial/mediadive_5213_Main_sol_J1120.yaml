preparation_notes: 'Mix components, adjust pH to 8.0 with NaOH, then distribute the
  medium into culture vessels (e.g., 20-50 ml per 120 ml serum bottles), seal with
  butyl rubber stoppers and autoclave at 110C for 5 min. Allow to stand the autoclaved
  medium overnight. Add ethane to the gas phase (10 to 50% of the gas phase by volume).


  Original volume: 1004 mL'
