preparation_notes: "Mix components thoroughly and adjust pH to 7.0. Autoclave under\
  \ a N2-CO2 (80:20, v/v) gas mixture. After cooling, add the following solutions\
  \ (autoclaved or *filter sterilized): \nAseptically and anaerobically distribute\
  \ the medium into culture vessels (e.g., 20 ml in 60 ml serum bottles) under the\
  \ same gas mixture and seal with butyl rubber stoppers. Prior to use, reduce the\
  \ medium by the addition of the following solutions (per liter, autoclaved and stored\
  \ under a N2 atmosphere): \n\nOriginal volume: 1022 mL"
