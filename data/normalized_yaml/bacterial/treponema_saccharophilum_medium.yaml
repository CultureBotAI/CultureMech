preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except cysteine, carbonate and glucose), adjust
    pH to 7.0 and sparge medium with 100% CO2 gas for 30 - 45 min to make it anoxic.
    Add the cysteine and carbonate, then equilibrate the medium with the CO2 gas to
    pH 7.0. Distribute medium under same gas atmosphere into anoxic Hungate-type tubes
    or serum vials and autoclave. Thereafter, add glucose from an anoxic stock solution
    prepared under 100% N2 gas atmosphere and sterilized by filtration. Adjust pH
    of complete medium to 7.0, if necessary.
- step_number: 2
  action: MIX
  description: For solid medium add 12.00 g/l agar (BD Bacto).
- step_number: 3
  action: HEAT
  description: Store fatty acid mixture at -20°C.
