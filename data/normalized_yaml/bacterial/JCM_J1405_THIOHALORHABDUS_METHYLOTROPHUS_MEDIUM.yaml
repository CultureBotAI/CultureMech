preparation_steps:
- step_number: 1
  action: MIX
  description: Add components to distilled water and bring volume to 1.0 L.
- step_number: 2
  action: MIX
  description: Adjust pH to 6.8 by 10% K2HPO4 or KH2PO4 solution, and autoclave.
- step_number: 3
  action: MIX
  description: 'After cooling, add the following solutions (autoclaved or *filter-sterilized):
    Place the medium in culture vessels leaving >80% head space (e.g., 20 ml in 120
    ml serum bottles) and seal with butyl rubber stoppers.'
- step_number: 4
  action: MIX
  description: Cultivated at the designated temperature with shaking.
