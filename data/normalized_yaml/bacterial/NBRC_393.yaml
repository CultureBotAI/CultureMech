notes: Dissolve ingredients except bicarbonate and sulfide, bring to boil for few
  minutes, then cool quickly to room temperature while gassing with N2/CO2 (80/20),
  add sodium bicarbonate and adjust pH to 6.9. Distribute in serum bottles (20 ml
  per 100 ml bottle) under N2/CO2, seal, pressurize bottles up to 2 bar overpressure,
  then autoclave. Before use, reduce the medium with sodium sulfide from anaerobic
  sterile neutral stock solution. First dissolve nitrilotriacetic acid and adjust
  pH to 6.5 with KOH, then add minerals. Final pH 7.0 (with KOH).
