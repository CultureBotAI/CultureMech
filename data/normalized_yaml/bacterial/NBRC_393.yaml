preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve ingredients except bicarbonate and sulfide.
- step_number: 2
  action: HEAT
  description: Bring to a boil for a few minutes.
- step_number: 3
  action: COOL
  description: Cool quickly to room temperature while gassing with N2/CO2 (80/20).
- step_number: 4
  action: ADJUST_PH
  description: Add sodium bicarbonate and adjust pH to 6.9.
- step_number: 5
  action: ALIQUOT
  description: Distribute 20 ml portions into 100 ml serum bottles under N2/CO2.
- step_number: 6
  action: AUTOCLAVE
  description: Seal and pressurize the bottles to 2 bar overpressure, then autoclave.
- step_number: 7
  action: MIX
  description: Before use, reduce the medium with sodium sulfide from an anaerobic
    sterile neutral stock solution.
