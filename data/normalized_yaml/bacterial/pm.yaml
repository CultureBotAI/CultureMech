notes: CCAP Medium C78 PM (Polytoma Medium) lists 2.0 g sodium acetate trihydrate,
  1.0 g yeast extract, 1.0 g tryptone, and deionised water to 1 litre, with autoclaving
  at 15 psi for 15 minutes. MediaDive C78 preserves the same CCAP formulation and
  identifies the yeast extract as Oxoid L21 and the tryptone as Oxoid L42. The accessible
  CCAP and MediaDive records do not state a pH or incubation temperature.
