preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Add to the medium 0.5% casitone and 2.5% NaCl (marine source). Adjust
    pH to 5.7 with hydrochloric acid before sterilization. Sterilize the medium by
    heating for 1 h at 90 - 100°C on three successive days. Before use add 30.0 ml/l
    of 5% (w/v) sterile, anaerobic NaHCO3-solution, vitamins and sulfide. Final pH
    should be 6.5.
- step_number: 2
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
applications:
- Microbial cultivation
