preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Sterilize solution A and B separately at 121°C for 20 min. Cool to
    50°C, then combine. To 4 parts of the above, add 1 part sterile foetal or new
    borne calf serum. Liquid medium should be filter sterilized instead of autoclaved.
