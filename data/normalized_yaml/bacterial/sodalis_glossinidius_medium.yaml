  Superseded historical provenance (not a current formulation claim):
  Commercial Product: LB Medium (Luria-Bertani, Miller formulation)
  Supplier: Multiple suppliers (Difco, Sigma, etc.)
  Catalog: Multiple (L3522 Sigma, 244520 BD)
  Source: https://www.laboratorynotes.com/preparation-of-luria-bertani-lb-miller-broth/
  Accessed: 2026-03-28

  Constituent composition researched from product specification.

  The false LB constituent expansion is withdrawn. Each source's actual hydrolysate and preparation scope is retained. Existing unrelated chemical annotations and history are preserved, not recertified; no taxa-media growth association is added.
ingredients: []
preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Prepare Solution A according to the linked DSMZ 1021 protocol and adjust
    Solution A to pH 8.0. This is not a measured final-medium pH.
- step_number: 2
  action: AUTOCLAVE
  description: For the solid preparation, sterilize Solution A and Solution B separately
    at 121 C for 20 min. Do not autoclave the serum-supplemented mixture.
- step_number: 3
  action: COOL
  description: Cool the separately sterilized solutions to 50 C, then combine A and
    B.
- step_number: 4
  action: MIX
  description: To 4 parts of the combined basal preparation, add 1 part sterile foetal
    or newborn calf serum. Preserve the reported ratio; no fixed serum batch dose
    or mass concentration is asserted.
applications:
- Microbial cultivation
