references:
- reference: PMID:39353547
  year: 2024
  notes: Primary literature source reporting MRS growth kinetics for Heyndrickxia
    coagulans ATCC 7050 and Lactiplantibacillus plantarum ATCC 10012.
- reference: PMID:38194015
  year: 2024
  notes: Primary literature source reporting growth optimization of Lactiplantibacillus
    plantarum BG24 in original MRS broth and modified MRS broth.
variants:
- name: mrs_bsh_oxygen_condition_atcc7050_atcc10012
  description: MRS medium condition used to compare oxygen-level effects on bile salt
    hydrolase production and growth kinetics in Heyndrickxia coagulans ATCC 7050 and
    Lactiplantibacillus plantarum ATCC 10012.
  modifications:
  - Compare MRS medium with M17 medium for bile salt hydrolase production.
  - Evaluate oxygen concentration effects in MRS medium, including anaerobic and microaerophilic
    conditions.
  purpose: Capture strain-specific MRS growth and doubling-time evidence under the
    parent MRS medium record.
  evidence:
  - reference: PMID:39353547
    supports: SUPPORT
    snippet: Cultivation of cultures in MRS and M17 media revealed that MRS medium
      enhanced BSH production by 235.98 % in H. coagulans ATCC 7050 and 147.37 % in
      L. plantarum ATCC 10012, compared to M 17 medium.
    explanation: The source directly compares growth-associated fermentation performance
      of the two named ATCC strains in MRS versus M17 and then reports oxygen-condition
      doubling times for the same strains.
- name: mrs_broth_bg24_ph_yeast_extract_optimization
  description: MRS broth growth optimization condition for Lactiplantibacillus plantarum
    BG24, comparing static and shaken cultures and an MRS broth condition adjusted
    to pH 6.5 with additional yeast extract.
  modifications:
  - Compare static culture with 100 rpm and 200 rpm shaking in MRS broth.
  - Compare original MRS broth at pH 5.7 with MRS broth at pH 6.5 enriched with 5
    g/L yeast extract.
  purpose: Capture strain-specific BG24 MRS broth growth optimization evidence under
    the shared MRS parent medium.
  evidence:
  - reference: PMID:38194015
    supports: SUPPORT
    snippet: The specific growth rate of L. plantarum BG24 was 0.416 h-1, the doubling
      time was 1.67 h, and the biomass productivity value was 0.14 gL-1 h-1 in the
      original MRS broth (pH 5.7) while higher values were found as 0.483 h-1, 1.43
      h and 0.17 gL-1 h-1, respectively, in MRS broth (pH 6.5) medium enriched with
      5 g/L yeast extract.
    explanation: The source directly reports quantitative growth kinetics for Lactiplantibacillus
      plantarum BG24 in original and modified MRS broth.
