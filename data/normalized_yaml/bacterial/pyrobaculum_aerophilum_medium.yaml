preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.0 with 1 N H2SO4, and sterilize by filtration. Dispense
    the medium into bottles under a N2-CO2-O2 (80:20:1) atmosphere. Pressurize inoculated
    bottles to 200 kPa N2-CO2-O2 (80:20:1).
- step_number: 2
  action: ADJUST_PH
  description: Dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH solution.
    Then proceed to add minerals. Adjust final pH to 7.0.
applications:
- Microbial cultivation
