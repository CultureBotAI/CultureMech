preparation_notes: "Mix components thoroughly, and autoclave under a N2-CO2 (80:20,\
  \ v/v) gas atmosphere. After cooling, aseptically and anaerobically add the following\
  \ solutions (autoclaved or *filter-sterilized): \nAseptically distribute the medium\
  \ into culture vessels under a H2-CO2 (80:20, v/v) gas mixture and seal with butyl\
  \ rubber stoppers (leave >80% gas phase by volume). Finally, add per liter the following\
  \ solutions from anaerobic stocks (autoclaved and stored under a N2 atmosphere):\
  \ \nPressurize the inoculated vessels to 200 kPa H2-CO2 (80:20, v/v).\n\nOriginal\
  \ volume: 1012 mL"
