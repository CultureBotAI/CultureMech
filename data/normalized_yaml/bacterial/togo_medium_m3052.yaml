preparation_steps:
- step_number: 1
  action: MIX
  description: Combine the NBRC 1604 basal ingredients with 1 L Distilled water and
    add 15 g/L Agar.
- step_number: 2
  action: MIX
  description: Add the NBRC-listed Resazurin, Biotin, Cobalamin, p-aminobenzoic acid,
    Folic acid, and Pyridoxamine stocks.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the medium.
- step_number: 4
  action: MIX
  description: After autoclaving, aseptically add the Thiamine, Riboflavin, and Glucose
    stocks.
media_term:
  preferred_term: TOGO Medium M3052
  term:
    id: TOGO:M3052
    label: TOGO Medium M3052
notes: TOGO M3052 imports NBRC Medium 1604. NBRC 1604 lists Casitone, yeast extract,
  NaCO3, K2HPO4, KH2PO4, NaCl, MgSO4 7H2O, CaCl2, Cysteine, Haemin, Resazurin, Biotin,
  Cobalamin, p-aminobenzoic acid, Folic acid, Pyridoxamine, and Agar. TOGO adds the
  1 L Distilled water solvent row. NBRC instructs Thiamine, Riboflavin, and Glucose
  stock additions after the medium is autoclaved, with all components added aseptically.
applications:
- Microbial cultivation
