preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare Sol. 1 with salts, yeast extract, tryptone, cysteine, Trace
    element solution SL-10, Trace vitamins, CaCl2, MgCl2, and Resazurin stocks, and
    distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the base medium to pH 7.3.
- step_number: 3
  action: AUTOCLAVE
  description: Prepare the medium anaerobically under N2-CO2 (4:1, v/v), distribute
    5.0 ml aliquots under the same gas mixture, seal, and autoclave.
- step_number: 4
  action: MIX
  description: After autoclaving, add 0.05 ml 3% Na2S x 9H2O, 0.05 ml filter-sterilized
    10% NaHCO3, and 0.1 ml 20% Glucose anaerobic stocks per 5.0 ml medium.
sterilization:
  method: AUTOCLAVE
