preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Before autoclaving, adjust pH to 7.6 - 7.8 for agar plate and to 7.4
    - 7.6 for liquid medium. Autoclave at 115C for 20 min. Separately sterilize Solution
    B by filtration and add to the medium aseptically.
- step_number: 2
  action: FILTER_STERILIZE
  description: Mix and filter-sterilize just before addition to the medium.
- step_number: 3
  action: MIX
  description: Prepare just before use.
applications:
- Microbial cultivation
