preparation_notes: "Basal mineral NaCl medium:\nAdd components to distilled water\
  \ and bring volume to 1.0 L. Autoclave and, after cooling, add per liter the following\
  \ solutions (autoclaved or *filter-sterilized separately): \nTo complete the medium,\
  \ aseptically and anaerobically distribute the medium into culture vessels containing\
  \ steam-sterilized sulfur (see below, approximately 1.0 g/L) under an argon gas\
  \ stream, and seal with butyl rubber stoppers. Then, add per liter the following\
  \ solutions (autoclaved or *filter-sterilized): \n\nOriginal volume: 28 mL"
