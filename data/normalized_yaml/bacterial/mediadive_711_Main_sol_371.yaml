preparation_notes: 'Add distilled water to give a final volume of 1000 ml.

  Adjust pH to 6.5 before autoclaving!

  Sterilize Na2CO3 separate from medium, add after cooling. Check final pH to be 9.0
  - 9.5.

  If agar medium is prepared, heat and dissolve agar before adding sodium chloride.'
