- step_number: 3
  action: AUTOCLAVE
  description: Autoclave Na2S·9H2O as a 5% solution under a N2 atmosphere.
- step_number: 4
  action: MIX
  description: Prior to inoculation, anaerobically add the sterile Na2S·9H2O solution,
    and readjust pH to 6.5 with sterile H2SO4.
