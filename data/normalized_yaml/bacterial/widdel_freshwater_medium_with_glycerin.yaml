preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix the base components, adjust pH to 7.5, and autoclave under an N2
    gas atmosphere.
- step_number: 2
  action: MIX
  description: After cooling, add sterile anaerobic stocks of Trace element solution,
    filter-sterilized Vitamin solution, filter-sterilized Thiamine solution, filter-sterilized
    Vitamin B12 solution, Selenite-tungstate solution, and 1.0 M glycerin solution.
- step_number: 3
  action: ALIQUOT
  description: Readjust pH to 7.5 if necessary; separately autoclave and dry iron
    metal grains; aseptically distribute the medium and iron metal into culture vessels
    under an N2 gas stream and seal with butyl rubber stoppers.
- step_number: 4
  action: MIX
  description: Prior to use, add 2.0 ml/L 5% Na2S x 9H2O solution.
