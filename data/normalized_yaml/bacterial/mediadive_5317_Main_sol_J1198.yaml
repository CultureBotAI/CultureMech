preparation_notes: "Mix components thoroughly and autoclave. After cooling, aseptically\
  \ add the following solutions (autoclaved or *filter-sterilized) in the given order:\
  \ \nCheck pH of the medium to be 7.2. Prior to use, add per liter 1.0 ml catalase\
  \ solution (5-10 units/ml, filter-sterilized, freshly prepared) to the medium.\n\
  Use glass or polystyrene containers for cultivation. Cultivate in the dark without\
  \ shaking."
