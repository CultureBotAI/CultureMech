preparation_notes: 'Dissolve ingredients except yeast extract and adjust pH to 2.0
  with H2SO4. After autoclaving add yeast extract from a sterile stock solution.

  Note: For autotrophic growth omit yeast extract and add to the medium 13.90 g/l
  FeSO4 x 7 H2O. Adjust medium pH to 1.7 with H2SO4 prior to autoclaving.'
