    MediaDB's B20 designation is a secondary lead, not verified by the inspected abstract.
    The abstract distinguishes complex versus synthetic lactose medium but gives neither
    complete formula nor the supplements of the two local owners. Historical MediaDB
    title spelling/encoding differs from publisher metadata (s-amylase and amylofiquefaciens);
    the verified DOI, authors and year identify the paper. Publisher title typography
    is retained rather than silently repairing the deposited byBacillus spacing. Formulation-unresolved;
    enzyme-production observations are not native growth metrics or certification
    of local amounts. Local pair MEDIADB:301/302 shares seven entries; despite the
    + vitamins name, the latter adds six amino-acid entries (hydroxyproline, proline,
    glutamine, glutamate, arginine and isoleucine). The abstract does not resolve
    this naming/composition discrepancy. Inventory covers the inspected medium-relevant
    passages, not every organism in the full paper or its bibliography. Correction/retraction
    coverage is limited to inspected publication metadata. Bounded taxonomy misses
    do not establish absence. All original ingredients, amounts, preparation, history
    and links are preserved, not newly certified. No new native growth assertion,
    resolved variant or concentration evidence.
