    taxonomy_match=exact_species; role=organism in the publisher abstract; no strain
    designation given there. Lookup_on=2026-10-13; https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=1390&retmode=xml;
