    under a N2-CO2 (4:1, v/v) gas mixture. After cooling, add the following solutions
    (filter-sterilized):'
- step_number: 2
  action: AUTOCLAVE
  description: 'Aseptically and anaerobically distribute the medium into culture vessels
    (e.g., 20 ml medium in 60 ml serum bottles) under a N2-CO2 (4:1, v/v) gas mixture
    and seal with butyl rubber stoppers. Then, add per liter the following solution
    (autoclaved and stored under N2):'
- step_number: 3
  action: ADJUST_PH
  description: Readjust pH to 7.5, if necessary.
