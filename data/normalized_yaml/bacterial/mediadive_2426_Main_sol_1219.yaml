preparation_notes: Adjust to pH 5.0 - 5.8. Prepare the medium in flasks or tubes with
  screw caps. The methanol may either be filter sterilised or autoclaved in half full
  serum bottles sealed with a rubber stopper and a crimp closure. Add to the cooled
  autoclaved medium. Agar may be added at 15 g/l for solid media.
