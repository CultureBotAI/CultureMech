preparation_steps:
- step_number: 1
  action: MIX
  description: Mix Sea Salts, Wolfe's mineral elixir, Trypticase peptone, yeast extract,
    glucose, resazurin, Na2CO3, and distilled water thoroughly.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the mixed base under an N2-CO2 gas mixture.
- step_number: 3
  action: ADJUST_PH
  description: After cooling, adjust to pH 7.2-7.5 with 5% Na2CO3 solution that has
    been autoclaved and stored under N2.
- step_number: 4
  action: MIX
  description: Add 6.0 ml/L each of 5% Na2S x 9H2O solution and 5% L-Cysteine HCl
    H2O solution, both autoclaved and stored under N2.
sterilization:
  method: AUTOCLAVE
