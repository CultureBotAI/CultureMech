media_term:
  preferred_term: TOGO Medium M1547
  term:
    id: TOGO:M1547
    label: Marine Agar 2216
notes: TOGO M1547 mirrors NBRC Medium 340, which lists 55.1 g Bacto Marine Agar 2216
  (Difco) in 1 L distilled water and states pH unadjusted; ATCC Medium 2 confirms
  the same 55.1 g Marine Agar 2216 commercial product and prints the scratch Difco
  Marine Agar/Broth 2216 formulation with agar.
applications:
- Microbial cultivation
references:
- reference: PMID:18319453
  year: 2008
  notes: Primary literature source reporting colony formation by Sneathiella glossodoripedis
    type strain MKT133T on Marine Agar 2216 at 30 C after 4-5 days.
- reference: NCBI:GCF_000616095.1
  notes: NCBI Datasets genome assembly page for Sneathiella glossodoripedis JCM 23214,
    the same type strain lineage as MKT133T / IAM 15419 / KCTC 12842.
- reference: BacDive:134304
  notes: BacDive type-strain record linking MKT133 / IAM 15419 / KCTC 12842 / JCM
    23214 to NCBI Taxonomy ID 1236958 and genome assembly GCA_000616095.
- reference: https://togomedium.org/medium/M1547
- reference: https://www.nite.go.jp/nbrc/catalogue/NBRCMediumDetailServlet?NO=340
- reference: https://www.atcc.org/~/media/B5025AB990724A91B4491C391E054448.ashx
