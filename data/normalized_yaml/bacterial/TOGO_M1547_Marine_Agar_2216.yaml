  genome_assembly_id:
  - GCA_000616095
  - GCF_000616095.1
  strain: MKT133T; IAM 15419T; KCTC 12842T; JCM 23214T
  growth_metrics:
  - temperature_celsius: 30.0
    measurement_conditions: Marine Agar 2216; aerobic incubation at 30 C; source reports
      colonies less than 1 mm diameter after 4-5 days.
    evidence:
    - reference: PMID:18319453
      supports: SUPPORT
      snippet: Colonies of the strain after 4-5 days incubation on marine agar 2216
        at 30 degrees C were less than 1 mm in diameter.
      explanation: Kurahashi et al. report colony formation for strain MKT133T on
        Marine Agar 2216, matching the CultureMech parent medium name.
    is_max_attainment: false
  evidence:
  - reference: PMID:18319453
    supports: SUPPORT
    explanation: The species-description paper identifies MKT133T as the type strain
      and reports growth as colony formation on Marine Agar 2216.
  - reference: NCBI:GCF_000616095.1
    supports: SUPPORT
    explanation: NCBI Datasets lists the genome assembly for Sneathiella glossodoripedis
      JCM 23214, an equivalent type-strain deposit.
