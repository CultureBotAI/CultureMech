  NBRC lists Medium for haloalkaliphilic methanogen as a 1:1 mix of two N2-autoclaved
  mineral bases with MgCl2, Bacto Yeast Extract, coenzyme M, vitamin and trace-element
  stocks, methanol, formate, acetate, FeS slurry, Na2S, and a 10% sodium dithionite
  solution in 1 M NaHCO3. The complete medium is adjusted anaerobically and has final
  pH 9.'
