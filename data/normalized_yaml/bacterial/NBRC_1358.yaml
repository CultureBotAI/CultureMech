notes: Mix mineral base 1 with mineral base 2 in 1:1 proportion in tightly closed
  vessels under a N2 atmosphere. Separately autoclave concentrated Bacto Yeast Extract,
  coenzyme M, sodium acetate, Na2S·9H2O and FeS solution under a N2 atmosphere in
  tightly closed vessels. Add the autoclaved concentrated solutions, and filter-sterile
  concentrated MgCl2·6H2O, vitamin solution, trace element solution, methanol and
  sodium formate solution. After re-exchanging with N2, add 1 drop of filter-sterile
  10% sodium dithionaite solution in 1 M NaHCO3 by syringe. Final pH of the complete
  medium should be 9. Mix ingredients and autoclave under a N2 atmosphere. Because
  some precipitate appears on the bottom for 1 day after autoclaving, use only supernatant
  for making the medium. Final pH should be 10. Mix ingredients and autoclave under
  a N2 atmosphere. Final pH should be 7.3. First dissolve nitrilotriacetic acid and
  adjust pH to 6.5 with NaOH, and then add minerals. Final pH 7.0. FeS slurry solution
  Mix 0.5 M FeSO4·7H2O and 0.5 M Na2S·9H2O solutions, wash with pure water several
  times, finally resuspend the FeS precipitate as 20% solution and autoclave (110°C,
  30 min) under a N2 atmosphere.
