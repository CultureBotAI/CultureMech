preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix Mineral base 1 ingredients and autoclave under an N2 atmosphere;
    after 1 day, use only the supernatant. Final pH should be 10.
- step_number: 2
  action: AUTOCLAVE
  description: Mix Mineral base 2 ingredients and autoclave under an N2 atmosphere.
    Final pH should be 7.3.
- step_number: 3
  action: ADJUST_PH
  description: For the trace elements solution, first dissolve NTA, adjust pH to 6.5
    with NaOH, then add minerals; final pH is 7.0.
- step_number: 4
  action: AUTOCLAVE
  description: Prepare the FeS slurry from 0.5 M FeSO4·7H2O and 0.5 M Na2S·9H2O, wash
    with pure water, resuspend the FeS precipitate as a 20% solution, and autoclave
    at 110 C for 30 min under N2.
- step_number: 5
  action: MIX
  description: Mix Mineral base 1 and Mineral base 2 in a 1:1 proportion in tightly
    closed vessels under an N2 atmosphere.
- step_number: 6
  action: AUTOCLAVE
  description: Separately autoclave concentrated Bacto Yeast Extract, coenzyme M,
    sodium acetate, Na2S·9H2O, and FeS slurry under an N2 atmosphere in tightly closed
    vessels.
- step_number: 7
  action: FILTER_STERILIZE
  description: Filter-sterilize concentrated MgCl2·6H2O, vitamin solution, trace element
    solution, methanol, and sodium formate solution.
- step_number: 8
  action: MIX
  description: After re-exchanging with N2, add one drop of filter-sterile 10% sodium
    dithionite in 1 M NaHCO3 by syringe. Final pH of the complete medium should be
    9.
