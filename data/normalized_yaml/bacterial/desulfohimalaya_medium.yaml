preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.3.
- step_number: 2
  action: ADJUST_PH
  description: Add components except ascorbic acid and thioglycollic acid to distilled
    water and adjust pH to 7.0 - 7.5. Thioglycollate and ascorbate should be added
    immediately prior to sterilization. Distribute into tubes or flasks. This medium
    may be cloudy after sterilization and turns black as a result of H2S production
    due to bacterial growth.
applications:
- Microbial cultivation
