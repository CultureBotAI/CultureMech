preparation_notes: 'Adjust pH to 7.3.

  Add components except ascorbic acid and thioglycollic acid to distilled water and
  adjust pH to 7.0 - 7.5. Thioglycollate and ascorbate should be added immediately
  prior to sterilization. Distribute into tubes or flasks. This medium may be cloudy
  after sterilization and turns black as a result of H2S production due to bacterial
  growth.'
