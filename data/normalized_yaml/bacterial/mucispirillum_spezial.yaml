preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.0.
- step_number: 2
  action: HEAT
  description: Bring to boil, cool down under N2CO2.
- step_number: 3
  action: MIX
  description: Fill under N2CO2 in hungate tubes (10 ml)
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
- step_number: 5
  action: MIX
  description: pressurize with 1 bar H2
- step_number: 6
  action: FILTER_STERILIZE
  description: Dissolve 50 mg haemin in 1 ml 1 N NaOH; make up to 100 ml with distilled
    water and filter sterilize. Store refrigerated.
- step_number: 7
  action: FILTER_STERILIZE
  description: Dissolve 5 mg vitamin K3 in 1 ml 95% ethanol, dilute to 0.05 mg/ml
    in water and filter sterilize. Store refrigerated in a brown bottle.
applications:
