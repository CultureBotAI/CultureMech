preparation_notes: "Mix components and autoclave. After cooling, add the following\
  \ solutions (autoclaved) to the medium: \nAdjust pH to 6.8, if necessary. Aseptically\
  \ distribute the medium into sterile serum bottles (leave &; 80% gas phase by volume)\
  \ and seal with rubber stoppers. Replace the gas phase with an air-methane gas mixture\
  \ (75:25, v/v). Cultivate with shaking.\n\nOriginal volume: 1015 mL"
