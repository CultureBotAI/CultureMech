- preferred_term: Defibrinated rabbit blood
  concentration:
    value: '5'
    unit: PERCENT_V_V
  source: JCM Medium 586
  notes: JCM Medium 586 adds sterile defibrinated rabbit blood to 5% final concentration
    after sterilization and cooling.
  term:
    id: UBERON:0000178
