id: CultureMech:002118
name: agar_with_e_coli_as_feed
original_name: AGAR WITH E. COLI AS FEED
category: bacterial
medium_type: DEFINED
composition_type: DEFINED
physical_state: SOLID_AGAR
ph_value: 7.2
media_term:
  preferred_term: DSMZ Medium 942
  term:
    id: mediadive.medium:942
    label: AGAR WITH E. COLI AS FEED
notes: DSMZ Medium 942 is a CaCl2-agar plate recipe overlaid with autoclaved Escherichia
  coli feed suspension lines/drops for myxobacteria; DSMZ specifies three separate
  drops of a thick ready-to-pipet suspension and does not fix an Escherichia coli
  concentration.
ingredients:
- preferred_term: CaCl2 x 2 H2O
  term:
    id: CHEBI:86158
    label: calcium chloride dihydrate
  concentration:
    value: '1.0'
    unit: G_PER_L
  source: DSMZ Medium 942
  notes: DSMZ Medium 942 lists 1.0 g/L CaCl2 x 2 H2O.
  mediaingredientmech_chebi_term:
    id: CHEBI:86158
    label: calcium chloride dihydrate
- preferred_term: Agar
  term:
    id: CHEBI:2509
    label: agar
  concentration:
    value: '15.0'
    unit: G_PER_L
  source: DSMZ Medium 942
  notes: DSMZ Medium 942 lists 15.0 g/L Agar.
  mediaingredientmech_chebi_term:
    id: CHEBI:2509
    label: agar
  physicochemical_roles:
  - SOLIDIFYING_AGENT
preparation_steps:
- step_number: 1
  action: MIX
  description: Mix 1.0 g/L CaCl2 x 2 H2O with 15.0 g/L agar to prepare the CaCl2-agar
    base.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the CaCl2-agar base to pH 7.2.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the CaCl2-agar base.
- step_number: 4
  action: POUR_PLATES
  description: Pour the autoclaved CaCl2-agar base into plates.
- step_number: 5
  action: MIX
  description: Grow Escherichia coli in liquid culture, collect the cells by centrifugation,
    and resuspend the pellet in enough water to produce a thick but ready-to-pipet
    feed suspension.
- step_number: 6
  action: AUTOCLAVE
  description: Autoclave the Escherichia coli feed suspension separately.
- step_number: 7
  action: MIX
  description: Place three separate feed-suspension drops on each CaCl2-agar plate,
    streak each drop once into an approximately 3 cm line, and inoculate the Escherichia
    coli lines/drops with myxobacteria.
sterilization:
  method: AUTOCLAVE
  notes: CaCl2-agar plates and Escherichia coli feed suspension are autoclaved separately.
applications:
- Microbial cultivation
