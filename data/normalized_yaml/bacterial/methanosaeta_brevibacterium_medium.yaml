preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix ingredients, except Trace vitamins, KHCO3, L--cysteine・HCl・H2O
    and Na2S・9H2O, and adjustpH to 7.0. Bring to a boil for 5--10 sec, then, cool
    down under a stream of N2--CO2 (80:20) and add KHCO3. Dispensethe medium into
    suitable culture vessels (e.g., 50 ml of the medium in 120 ml serum bottles) under
    a stream of N2--CO2 (80:20) and seal with butyl rubber stoppers. After autoclaving,
    stand the medium overnight. Separately autoclave cysteine・HCl and Na2S・9H2O as
    5% solutions, respectively, under a N2 atmosphere. Filter--sterilize Trace vitamins
    under a N2 atmosphere. Prior to inoculation, aseptically and anaerobically add
    Trace vitamins, L--cysteine・HCl・H2O and Na2S・9H2O solutions.Pressurize the inoculated
    bottles to 100 kPa N2--CO2 (80:20).
- step_number: 2
  action: MIX
  description: 'Comment: For strain JCM 10134, incubate with a 10--20% inoculum.'
- step_number: 3
  action: ADJUST_PH
  description: Use Medium No. [243] supplemented with 0.5 g/L yeast extract, 0.5 g/L
    peptone,0.5 g/L tryptone (BD-Difco) and 0.6 g/L (final) sodium acetate. Readjust
    pH to 7.2 -- 7.6, if necessary.
