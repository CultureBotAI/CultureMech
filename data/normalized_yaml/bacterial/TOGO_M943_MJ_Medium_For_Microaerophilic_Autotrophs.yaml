preparation_steps:
- step_number: 1
  action: MIX
  description: Mix NH4Cl with 1.0 L MJ(-N) synthetic seawater.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 5.5 and autoclave.
- step_number: 3
  action: MIX
  description: After cooling, aseptically add filter-sterilized 5.0 ml/L 8% NaHCO3
    solution, 15.0 ml/L 10% Na2S2O3 x 5 H2O solution, and 10.0 ml/L Trace vitamins.
- step_number: 4
  action: ALIQUOT
  description: Distribute under an N2-CO2-O2 (76:19:5, v/v) gas mixture, seal with
    butyl rubber stoppers, and pressurize to 50 kPa with the same gas mixture.
incubation_atmosphere: MICROAEROPHILIC
aeration: N2-CO2-O2 (76:19:5, v/v) gas atmosphere, 50 kPa
