preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components, except NaHCO3, and adjust pH 7.0.
- step_number: 2
  action: MIX
  description: Bring to a boil for 5-10 seconds, then, cool down under a stream of
    N2-CO2 (80:20, v/v), add NaHCO3, and autoclave under the same gas mixture.
- step_number: 3
  action: MIX
  description: 'After cooling. aseptically and anaerobically, add the following solutions
    (autoclaved or *filter-sterilized, and stored under a N2 atmosphere): Distribute
    the medium into culture vessels (e.g., 10 ml in Hungate tubes) under the same
    gas mixture and seal with butyl rubber stoppers.'
applications:
- Microbial cultivation
