preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except carbonate, thiosulfate and vitamins) and
    sparge medium with 80% N2 and 20% CO2 gas mixture for 30 - 45 min to make it anoxic.
    Dispense medium under same gas atmosphere into anoxic Hungate-type tubes or serum
    vials to 30% volume and autoclave. Add thiosulfate and vitamins from sterile anoxic
    stock solutions prepared under 100% N2 gas and carbonate from a sterile anoxic
    stock solution prepared under 80% N2 and 20% CO2 gas mixture. Stock solutions
    of thiosulfate and vitamins should be sterilized by filtration. Adjust pH of complete
    medium to 7.5, if necessary.
- step_number: 2
  action: MIX
  description: After inoculation add sterile air in an amount equivalent to 1% (v/v)
    of the total volume of the culture vessel.
- step_number: 3
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
applications:
- Microbial cultivation
