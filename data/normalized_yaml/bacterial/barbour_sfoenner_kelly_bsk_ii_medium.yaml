notes: |-
  Source: JCM | Link: https://www.jcm.riken.jp/cgi-bin/jcm/jcm_grmd?GRMD=173

  Superseded historical provenance (not a current formulation claim):
  Commercial Product: LB Medium (Luria-Bertani, Miller formulation)
  Supplier: Multiple suppliers (Difco, Sigma, etc.)
  Catalog: Multiple (L3522 Sigma, 244520 BD)
  Source: https://www.laboratorynotes.com/preparation-of-luria-bertani-lb-miller-broth/
  Accessed: 2026-03-28

  Constituent composition researched from product specification.

  The false LB constituent expansion is withdrawn in favor of this source's bovine serum albumin input. Existing unrelated chemical annotations are preserved, not recertified. This repair does not assert equivalence with other BSK formulations or add organism-growth evidence.
ingredients: []
preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.6 with 1 N NaOH at the source's pre-combination stage;
    a final combined-medium pH measurement is not stated.
- step_number: 2
  action: FILTER_STERILIZE
  description: Sterilize by filtration through a 0.22 micrometer filter (Millipore),
    before the source's subsequent combination instruction.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave Solution B separately. The JCM page's general default is
    121 C for 15 min unless otherwise stated.
- step_number: 4
  action: MIX
  description: Mix Solutions A and B, then add 40 ml heat-inactivated (56 C, 45 min)
    sterile rabbit serum (Pel-Freez Biologicals).
applications:
- Microbial cultivation
