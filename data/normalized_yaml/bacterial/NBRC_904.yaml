notes: Mix ingredients except vitamin solution, sulfur and Na2S·9H2O, and adjust pH
  to 7. Autoclave under a N2 atmosphere. Filter-sterilize vitamin solution. Sulfur
  is sterilized separately by autoclaving for 60 min at 105℃ on each of 3 successive
  days. Neutralize Na2S·9H2O as 5% solution and autoclave under a N2 atmosphere. Prior
  to inoculation, aseptically and anaerobically add vitamin, sulfur and Na2S·9H2O.
  Dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH solution. Then proceed
  to add minerals. Adjust final pH to 7.0.
