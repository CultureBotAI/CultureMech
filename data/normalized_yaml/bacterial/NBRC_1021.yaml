notes: For vial cultures, dissolve all ingredients except for ethanol, vitamin solution,
  Na2S·9H2O and cysteine-HCl, flush N2/CO2 (80/20) and autoclave. Concentrated Na2S·9H2O
  and cysteine-HCl solutions are sterilized separately by autoclaving under a N2 atmosphere
  in tightly closed vessels. Add filter-sterilized 0.8 M ethanol and vitamin solutions,
  and autoclaved Na2S·9H2O and cysteine-HCl solutions . Inoculum size 10-20%. First
  dissolve NTA in 200 ml of water and adjust the pH to 6.5 with KOH.
