preparation_steps:
- step_number: 1
  action: MIX
  description: mix compounds.
- step_number: 2
  action: MIX
  description: check pH (should be 10)
- step_number: 3
  action: MIX
  description: Fill 100 mL each into 200 mL serum-flasks.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 20 min.
- step_number: 5
  action: MIX
  description: 'After autoclaving, add the following sterile solutions:'
- step_number: 6
  action: ALIQUOT
  description: Mix well and aliquot into the desired volumes and flasks or tubes (e.g.,
    20 ml in 100 ml flasks).
- step_number: 7
  action: ADJUST_PH
  description: Adjust pH to 3.0-4.0 with HCl.
- step_number: 8
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
- step_number: 9
  action: AUTOCLAVE
  description: 'Note: autoclave in closed bottles'
- step_number: 10
  action: MIX
  description: Sterilize by filtration.
- step_number: 11
  action: MIX
  description: Mix the four solutions in the ratio 1:1:1:1.
