media_term:
  preferred_term: TOGO Medium M1529
  term:
    id: TOGO:M1529
    label: TOGO Medium M1529
preparation_steps:
- step_number: 1
  action: MIX
  description: Combine 10 g/L Hipolypepton, 2 g/L Yeast extract, 0.5 g/L MgSO4·7H2O,
    and 1 L Distilled water.
- step_number: 2
  action: MIX
  description: Add 15 g/L agar when solid NBRC Medium 316 is needed.
- step_number: 3
  action: AUTOCLAVE
  description: Sterilize Na2CO3 separately by autoclaving.
- step_number: 4
  action: MIX
  description: Add 10 g/L separately autoclaved Na2CO3 to the other ingredients; the
    final pH is between 9.0 and 10.0.
notes: TOGO M1529 imports NBRC Medium 316, which lists 10 g/L Hipolypepton from Wako
  Pure Chemical Industries, 2 g/L Yeast extract, 0.5 g/L MgSO4·7H2O, 10 g/L Na2CO3,
  1 L Distilled water, and 15 g/L Agar if needed. The Na2CO3 is sterilized separately
  by autoclaving and added to the other ingredients, giving a final pH between 9.0
  and 10.0.
