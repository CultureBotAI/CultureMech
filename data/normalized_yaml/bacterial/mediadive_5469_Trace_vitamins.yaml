preparation_notes: Solution (see below) is autoclaved under CO2 atmosphere in a 500
  ml bottle. Sterile solution is saturated with CO2 (~0.8 bar) until pH is approx.7.3.
  1 ml is added to 100 ml of culture every 3 days or when the sulfide is consumed.
