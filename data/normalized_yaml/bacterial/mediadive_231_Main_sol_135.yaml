preparation_notes: 'Dissolve ingredients except bicarbonate, fructose, vitamins, cysteine,
  and sulfide, bring to the boil, and cool to room temperature under 80% N2 and 20%
  CO2 gas mixture. Add bicarbonate (solid) and equilibrate the medium with the gas
  until a pH of around 7.4 is reached. Then distribute under the same gas atmosphere
  in anoxic Hungate-type tubes or serum vials and autoclave. Before use adjust the
  pH to 7.5 - 8.0 by adding a sterile anoxic stock solution of sodium carbonate (5%
  w/v) prepared under 80% N2 and 20% CO2 gas mixture and add fructose, vitamins (sterilized
  by filtration), cysteine, and sulfide from anoxic sterile stock solutions prepared
  under 100% N2.

  Note: For autotrophic growth D-fructose is omitted and a gas atmosphere of 80% H2
  and 20% CO2 is used.


  Original volume: 1021 mL'
