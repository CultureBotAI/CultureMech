preparation_notes: Dissolve ingredients (except sulfide), adjust pH to 7.0, bring
  medium to the boil, then cool to room temperature under 100% N2 gas. Dispense under
  same gas atmosphere in culture vessels and autoclave. After sterilization add sulfide
  from a sterile anoxic stock solution prepared under 100% N2 gas.
