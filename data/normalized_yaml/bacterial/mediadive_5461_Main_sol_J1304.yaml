preparation_notes: "Mix components thoroughly, adjust pH to 7.2-7.4 and autoclave\
  \ under a N2-CO2 (80:20, v/v) gas mixture. After cooling, while gassing with the\
  \ same gas mixture, add the following solutions from sterile anaerobic stocks (autoclaved\
  \ or *filter-sterilized): \nReadjust pH to 7.2-7.4, if necessary. Aseptically and\
  \ anaerobically distribute the medium into culture vessels (e.g., 10 ml in Hungate\
  \ tubes) under the same gas mixture and seal with butyl rubber stoppers. Prior to\
  \ use, add per liter the following solution (autoclaved and stored under N2): \n\
  \nOriginal volume: 1008 mL"
