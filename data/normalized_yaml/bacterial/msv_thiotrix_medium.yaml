preparation_steps:
- step_number: 1
  action: MIX
  description: Final pH of appr. 7.4 should be controlled sterile.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave for 20 min. at 121°C.
- step_number: 3
  action: MIX
  description: NaHCO3 2.625 g per 50 ml distilled water
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave for 20 min. at 121°C and add 8 ml/l sterile solution II shortly,
    before inoculation of bacterial culture.
- step_number: 5
  action: MIX
  description: H3P-vitamine solution (see medium 428)
- step_number: 6
  action: FILTER_STERILIZE
  description: Filter sterilize vitamine solution and add 1 ml/l medium.
- step_number: 7
  action: MIX
  description: 10% inositol (1g/10 ml distilled water)
- step_number: 8
  action: FILTER_STERILIZE
  description: Filter sterilize solution IV and add 0.1 ml/l medium.
- step_number: 9
  action: MIX
  description: Final pH of appr. 7.4 should be controlled sterile.
- step_number: 10
  action: FILTER_STERILIZE
  description: Filter sterilize (0.2 µm pore-size) and store at 4°C.
