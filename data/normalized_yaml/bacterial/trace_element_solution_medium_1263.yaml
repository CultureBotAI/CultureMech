  Na2WO4 x 2 H2O, 0.20 g/L NaSeO3, 0.20 g/L Fe(NH4)2(SO4)2 x 6 H2O, 0.10 g/L MnSO4
  x H2O, 0.10 g/L ZnSO4 x 7 H2O, 0.10 g/L Na2MoO4 x H2O, 0.02 g/L NiCl2 x 6 H2O, 0.01
  g/L CuSO4 x 5 H2O, variable KOH, and distilled water.
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the 1 L Trace element solution stock from distilled water,
    nitrilotriacetic acid, NaSeO3, the nickel, manganese, zinc, copper, iron, molybdate,
    and tungstate salts listed by KOMODO 3067, and KOH.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the Trace element solution stock to pH 7.0 with KOH as needed.
