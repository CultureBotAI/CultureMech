- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 6.6-6.8.
- step_number: 2
  action: HEAT
  description: To prepare soil extract, equal volumes of leafy soil and tap water
    are boiled for 2 hr and then cleared by centrifugation.
