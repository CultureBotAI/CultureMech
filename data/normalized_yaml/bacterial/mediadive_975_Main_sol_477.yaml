preparation_notes: 'Dissolve ingredients except ferrous sulfate and adjust pH to 2.5
  with 4 N H2SO4. Sterilize medium by autoclaving for 15 min at 121°C. Prior to inoculation
  add FeSO4 x 7 H2O from a 40% (w/v) stock solution prepared with 0.2 N H2SO4 and
  filter-sterilized under 100% N2 gas atmosphere.


  Original volume: 1002 mL'
