preparation_notes: "Mix components thoroughly and adjust pH to 7.0 with NaOH. Distribute\
  \ the medium into culture vessels (e.g., 10.0 ml in 25 ml serum bottles) under a\
  \ stream of N2, seal with butyl rubber stoppers and autoclave. After cooling, add\
  \ 80% headspace volume of filter-sterilized H2 gas into the culture vessels. Aseptically\
  \ and anaerobically add per liter the following solutions (autoclaved or *filter-sterilized\
  \ and stored anaerobically): \nSolution <I>A:</I> \n\nOriginal volume: 1030 mL"
