preparation_notes: 'Dissolve EDTA in 800 ml distilled water, adjust pH to 7 using
  2 N NaOH and add ferrous chloride. After ferrous chloride has dissolved add other
  compounds. Finally adjust pH to 6.0 and bring volume to 1000 ml. '
