preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.2 - 7.4.
- step_number: 2
  action: AUTOCLAVE
  description: Separately autoclave Trace x 10 solution, Se/W solution and Mg/Ca solution,
    and filter-sterilize Na benzoate solution, 7 vitamins solution and FeSO4 solution.
    Aseptically add all solutions to the medium.
