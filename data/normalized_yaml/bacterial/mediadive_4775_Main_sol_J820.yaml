preparation_notes: 'Adjust pH to 6.5.

  Distribute the medium into culture vessels (leave >80% volume gas phase), seal with
  butyl rubber stoppers and autoclave. After cooling, add filter-sterilized methane
  gas to make a final concentration about 20% (v/v) methane in the gas phase.


  Original volume: 1001 mL'
