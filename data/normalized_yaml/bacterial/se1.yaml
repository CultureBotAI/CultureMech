  preferred_term: CCAP Medium C90
  term:
    id: mediadive.medium:C90
    label: SE1
notes: 'Source: CCAP | Link: https://www.ccap.ac.uk/wp-content/uploads/MR_SE1_Marine.pdf

  Composition verified against https://www.ccap.ac.uk/wp-content/uploads/MR_SE1_Marine.pdf
  on 2026-08-25.'
ingredients:
- preferred_term: Prepared dried soil
  concentration:
    value: variable
    unit: VARIABLE
  notes: Use air-dried, sieved rich loam from undisturbed deciduous woodland.
- preferred_term: Deionized water
  concentration:
    value: variable
    unit: VARIABLE
  notes: Use twice the volume of water relative to dried soil.
preparation_steps:
- step_number: 1
  action: MIX
  description: Remove stones, roots, and large invertebrates; air-dry and sieve the
    soil.
- step_number: 2
  action: MIX
  description: Combine dried soil with twice its volume of supernatant deionized water.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 15 psi and 126 C for 20 minutes; cool and repeat once.
- step_number: 4
  action: STORE
  description: Seal and leave undisturbed for 2-3 weeks so sediment settles.
- step_number: 5
  action: ALIQUOT
  description: Aseptically decant the supernatant into sterile containers without
    disturbing sediment.
- step_number: 6
  action: AUTOCLAVE
  description: Autoclave the final soil extract at 15 psi and 121 C for 15 minutes.
- step_number: 7
  action: STORE
  description: Cool, seal, and store refrigerated.
applications:
- Microbial cultivation
