preparation_notes: 'Prepare the medium anaerobically under a N2-CO2 (4:1, v/v) gas
  mixture. Mix ingredients except Trace vitamins. After autoclaving, anaerobically
  and aseptically add the filter-sterilized Trace vitamins to the medium. Check final
  pH to be 7.0 - 7.2. Pressurize the inoculated bottles to 70 kPa N2-CO2 (4:1, v/v).


  Original volume: 1011 mL'
