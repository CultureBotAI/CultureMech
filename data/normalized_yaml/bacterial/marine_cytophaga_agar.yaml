notes: TOGO M1541 imports NBRC Medium 333 as Marine Cytophaga Agar. NBRC 333 lists
  2 g Bacto Tryptone (Difco), 0.5 g beef extract, 0.5 g yeast extract, 0.2 g sodium
  acetate, optional 15 g agar, and 1 L filtered aged seawater or artificial seawater
  at pH 7.2-7.4. The source footnotes Daigo's Artificial Seawater SP as an artificial
  seawater option but does not state sterilization, incubation temperature, or other
  preparation steps.
