preparation_steps:
- step_number: 1
  action: MIX
  description: Mix De-ionized water, Glucose, Bacto Tryptone, Bacto Peptone, and Mycoplasma
    Broth Base as the basal medium.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the basal medium to pH 7.5-7.6.
- step_number: 3
  action: AUTOCLAVE
  description: Sterilize the basal medium at 121 C for 15 minutes.
- step_number: 4
  action: MIX
  description: Add fetal bovine serum, Phenol red, Yeastolate, Penicillin G, optional
    Polymyxin B, Fresh yeast extract, Thallium acetate, and CMRL 1066 tissue culture
    supplement.
media_term:
  preferred_term: TOGO Medium M2964
  term:
    id: TOGO:M2964
    label: SP-4 medium
notes: TOGO M2964 defines SP-4 medium with 560 ml De-ionized water, 5 g Glucose, 10
  g Bacto Tryptone, 5.3 g Bacto Peptone, 3.5 g Mycoplasma Broth Base, 170 ml heat-treated
  Fetal bovine serum, 20 ml 0.1% Phenol red, 100 ml 2% Difco Yeastolate, 10 ml Penicillin
  G at 100000 units/ml, optional 5 ml Polymyxin B at 100000 units/ml, 35 ml Fresh
  yeast extract at 25%, 50 ml 1:50 Thallium acetate, and 50 ml CMRL 1066 tissue culture
  supplement. The TOGO comments direct adjusting to pH 7.5-7.6, sterilizing at 121
  C for 15 minutes, and record a final pH of 7.4-7.5.
applications:
- Microbial cultivation
