preparation_notes: "Mix components and autoclave. After cooling, add the following\
  \ solutions (autoclaved or *filter-sterilized) to the medium: \nTo complete medium,\
  \ adjust pH to 6.8. Then, distribute 20 ml-aliquots of the medium into sterile 120\
  \ ml-serum bottles and seal with butyl rubber stoppers. Add 100 ml methane gas (filter-sterilized)\
  \ into the head space of the culture bottle through a syringe.\n\nOriginal volume:\
  \ 1001 mL"
