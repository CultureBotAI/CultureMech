preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Prepare the medium without thiosulfate, adjust pH to 4.4 - 4.7 and
    autoclave at 121°C for 15 min. Sterilize thiosulfate separately by filtration
    and add after autoclaving.
- step_number: 2
  action: MIX
  description: 'Note: Incubate statically without shaking.'
