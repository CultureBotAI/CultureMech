preparation_steps:
- step_number: 1
  action: MIX
  description: Mix Solution A components except NaHCO3.
- step_number: 2
  action: HEAT
  description: Bring to a boil for several seconds and cool under N2-CO2 (80:20).
- step_number: 3
  action: MIX
  description: Add NaHCO3, mix thoroughly, and distribute the medium into culture
    vessels under N2-CO2 (80:20).
- step_number: 4
  action: AUTOCLAVE
  description: Seal with butyl rubber stoppers and autoclave.
- step_number: 5
  action: FILTER_STERILIZE
  description: Filter-sterilize the sodium formate solution.
- step_number: 6
  action: MIX
  description: Finally, add the sterile 5% Na2S x 9H2O, 5% L-cysteine x HCl x H2O,
    sodium formate, and trace vitamin solutions per liter.
applications:
- Microbial cultivation
