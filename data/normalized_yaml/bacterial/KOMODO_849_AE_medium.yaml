preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Autoclave the medium without the addition of glacial acetic acid and
    absolute ethanol.
- step_number: 2
  action: FILTER_STERILIZE
  description: Sterilize glacial acetic acid and absolute ethanol by filtration through
    Teflon filters or by autoclaving in completely closed screw-cap glass bottles
    sealed with Teflon-coated septa.
- step_number: 3
  action: MIX
  description: Add sterile glacial acetic acid and absolute ethanol.
- step_number: 4
  action: MIX
  description: Incubate plates in sealed containers to keep humidity high above 90%.
