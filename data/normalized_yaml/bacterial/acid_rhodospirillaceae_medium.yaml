preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 5.7.
- step_number: 2
  action: HEAT
  description: Boil the medium for a few minute.
- step_number: 3
  action: MIX
  description: Sparge medium with 100% N2 gas mixture to make it anoxic.
- step_number: 4
  action: MIX
  description: Fill 10 ml in 15 ml tubes with a rubber septum under a stream of nitrogen
    gas.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 20 min.
- step_number: 6
  action: MIX
  description: Sterile syringes are used to inoculate and remove samples.
- step_number: 7
  action: MIX
  description: Incubate in the light using a tungsten lamp.
