preparation_notes: 'Bubble with nitrogen gas and fill in tubes with a rubber septum
  under a stream of nitrogen gas.

  Autoclave at 121 °C for 15 min.

  aftre autoclaving add the following sterile solutions

  Adjust pH to 7.2.

  Add 1 ml/100ml of culture Sulfide feeding solution (Siefert and Pfennig 1984) every
  3 days or when the sulfide is consumed.'
