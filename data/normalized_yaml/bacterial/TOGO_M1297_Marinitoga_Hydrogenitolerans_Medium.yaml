preparation_steps:
- step_number: 1
  action: MIX
  description: Mix sea salts, MES, yeast extract, tryptone, resazurin, and distilled
    water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 6.0.
- step_number: 3
  action: ALIQUOT
  description: Bubble the medium with N2 for 5 min, distribute under N2, and seal
    with butyl rubber stoppers.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 degrees C for 15 min.
- step_number: 5
  action: COOL
  description: Cool after autoclaving.
- step_number: 6
  action: MIX
  description: Add autoclaved and N2-stored glucose, Na2S x 9H2O, and L-cysteine HCl
    H2O stock solutions aseptically and anaerobically.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Autoclave stocks separately and store under an N2 gas atmosphere.
