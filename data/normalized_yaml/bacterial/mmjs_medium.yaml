preparation_steps:
- step_number: 1
  action: MIX
  description: Use Medium No. 369 supplemented with 20.0 g/L (final) NaCl, 2.0 g/L
    (final) NaHCO3 and 2.0 g/L Na2S2O3 x 5H2O. Replace the gas phase with N2-CO2-O2
    (79:20:1, v/v), and pressurized inoculated bottles to 200 kPa with the same gas
    mixture.
