preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly, except agarose, and adjust pH to 6.7.
- step_number: 2
  action: MIX
  description: Add agarose to the medium and autoclave under a N2 gas atmosphere.
- step_number: 3
  action: MIX
  description: After cooling to 50C, add the following solutions to the medium aseptically
    and anaerobically (autoclaved or *filter-sterilized).
- step_number: 4
  action: MIX
  description: 'Keep the medium temperature at 50 C until the medium is distributed
    into sterile screw-capped test tubes as described below: Adjust pH to 7.0 with
    sterile HCl or NaOH solution.'
- step_number: 5
  action: MIX
  description: Dispense the medium to sterile screw-capped test tubes (typically 11
    ml medium into sterile Hungate tubes) under air and cap.
- step_number: 6
  action: MIX
  description: Allow to stand until the medium is solidified and a O2-gradient formed
    (as evidenced by a pink upper oxic zone and a colorless lower anoxic zone).
- step_number: 7
  action: MIX
  description: Inoculate cells just below the pink-colorless interface in the medium
    tube using a syringe.
- step_number: 8
  action: MIX
  description: 'Comment: The medium tubes can be stocked under a N2 gas atmosphere.'
- step_number: 9
  action: MIX
  description: In this case, prior to use, fill the head space with air and allow
    to stand until the O2 gradient is formed.
applications:
- Microbial cultivation
