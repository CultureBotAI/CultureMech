preparation_notes: 'Dissolve ingredients (except trace elements, HEPES buffer, ammonium
  chloride, pyruvate, bicarbonate and vitamins), dispense medium into Erlenmeyr flasks
  with screw caps (e.g., 20 ml medium per 100 ml flask) and autoclave. Add HEPES buffer
  and ammonium chloride from stock solutions sterilized by autoclaving. Trace elements,
  pyruvate, bicarbonate and vitamins are added from stock solutions sterilized by
  filtration. Adjust pH of the complete medium to 7.2 using sterile solutions of bicarbonate
  (5% w/v) or 1 N HCl.

  Note: Use at least 5% (v/v) inoculum and incubate in the dark without shaking.'
