preparation_notes: 'Dissolve ingredients (except carbonate, vitamins, and dithiothreitol),
  adjust pH to 6.8 - 7.0, and sparge medium with 80% N2 and 20% CO2 gas mixture for
  30 - 45 min to make it anoxic. Dispense medium under the same gas atmosphere into
  anoxic Hungate-type tubes or serum vials and autoclave. Add carbonate from a sterile
  anoxic stock solution prepared under an 80% N2 and 20% CO2 gas mixture. Add vitamins,
  and dithiothreitol from sterile anoxic stock solutions prepared under 100% N2 gas
  and sterilized by filtration. Adjust the pH of the complete medium to 7.0, if necessary.


  Original volume: 1011 mL'
