notes: |
  Stock solution for TAP Medium (Tris-Acetate-Phosphate) and related algae culture media.
  Provides macrominerals (N, Ca, Mg, S) for freshwater algae.
  Standard formulation used in Chlamydomonas reinhardtii culture.

  Preparation: Add components to approximately 800 mL distilled water, dissolve completely,
  then bring to 1 L total volume. Store at room temperature.

  Stock amounts are NH4Cl 8 g/L, CaCl2.2H2O 1 g/L and MgSO4.7H2O 2 g/L. The source table's millimolar column is explicitly for TAP medium, not the stock. No universal stock addition dose or replacement molarity is inferred.
