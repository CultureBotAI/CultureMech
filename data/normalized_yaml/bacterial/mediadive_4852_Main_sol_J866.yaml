  \ the medium into culture vessels (e.g., 9.4 ml in Balch tubes) under a N2-CO2 (4:1,\
  \ v/v) gas mixture, seal with butyl rubber stoppers and autoclave. After cooling,\
  \ aseptically and anaerobically add the following solutions (per 9.4 ml medium,\
  \ autoclaved or *filter-sterilized): \n\nOriginal volume: 942 mL"
