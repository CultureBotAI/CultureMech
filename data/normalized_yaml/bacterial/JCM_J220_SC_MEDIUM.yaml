preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 6.6.
- step_number: 2
  action: MIX
  description: Separately sterilize bovine serum albumin, glucose and cysteine solutions
    by filtration, and aseptically add to the medium.
applications:
- Microbial cultivation
