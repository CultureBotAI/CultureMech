  scoped_to_variant: Tang 2009 manuscript 20 mM PIPES tracer medium with amino acids
  evidence:
  - reference: doi:10.1002/btpr.227
    supports: SUPPORT
    snippet: Growth kinetics of Shewanella oneidensis MR-1
    explanation: 'Figure 1: no NaCl stress supplement; 17-amino-acid supplement. Figure
      1 caption on PDF page 13 identifies four treatments; the plot on page 15 shows
      increasing dry biomass for each. The matched curve is filled diamonds. Methods
      on page 4 specify duplicate cultures (n=2), 12 mL glass-tube cultures at 30
      degrees C and 200 rpm. The amino-acid-plus-salt treatment is supported by Figure
      1 and page 8 even though the abstract lists only three conditions. No approximate
      doubling time is converted into an exact database rate. Scientific name and
      canonical label=Shewanella oneidensis MR-1; NCBITaxon:211586; rank=strain; taxonomy_match=exact;
      ATCC 700550 is an NCBI equivalent name. Lookup_on=2026-10-13; https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=211586&retmode=xml;
      archive=references_cache/papers/taxonomy/shewanella-mr1-20261013.{xml,md}. This
      verifies the wild-type background, not an independent exact taxonomy identity
      for every engineered derivative. Growth is supported only on the named source-described
      inline variant, not on the unmodified imported parent. Unresolved chemical normalization
      is retained in that variant; the source''s qualitative cultivation result is
      not a certification of the flattened parent recipe. Current KGX export does
      not honor scoped_to_variant; this curation is not authorization to publish an
      unscoped parent edge.'
