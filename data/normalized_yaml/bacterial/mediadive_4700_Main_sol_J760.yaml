preparation_notes: "Mix components and autoclave under a N2 atmosphere. Then add the\
  \ following solutions from sterile anaerobic stocks: \nMix well until clarified.\
  \ Finally, add the following solution to the medium: \nComment: Incubate with a\
  \ 5-10% inoculum. The strain also grows in the medium with sulfur as an electron\
  \ acceptor. In this case, use the above described medium, replacing KNO3 with 0.25\
  \ g/L NH4Cl and 2.0 g/L sulfur (separately autoclaved at 110C for 40 min).\n\nOriginal\
  \ volume: 1046 mL"
