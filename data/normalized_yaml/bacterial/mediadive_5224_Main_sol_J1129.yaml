preparation_notes: "Mix components thoroughly, distribute the medium into culture\
  \ vessels (e.g., 5 ml of the medium in the Hungate tubes) under a N2-CO2 (4:1, v/v)\
  \ gas mixture, seal with butyl rubber stoppers and autoclave. After cooling, add\
  \ per liter the following solutions from anaerobic stocks (autoclaved or *filter-sterilized).\
  \ Prior to use adjust pH to 7.0 - 7.2. \n\nOriginal volume: 1086 mL"
