  0.04 g/L AlCl3 x 6 H2O, 0.03 g/L Na2WO4 x 2 H2O, 0.02 g/L CuCl2 x 2 H2O, 0.02 g/L
  NiSO4 x 6 H2O, 0.01 g/L H2SeO3, 0.01 g/L H3BO3, 0.01 g/L NaMoO4 x 2 H2O, and variable
  HCl.
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the 1 L Ferguson and Mah trace mineral stock from HCl, Na2-EDTA,
    the cobalt, aluminum, zinc, selenium, manganese, iron, copper, nickel, borate,
    molybdate, and tungstate salts listed by KOMODO.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the Ferguson and Mah trace mineral stock to pH 3.0 with HCl.
