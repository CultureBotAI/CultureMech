preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the base salts, FeCl2 solution, Trace element solution, Selenite-tungstate
    solution, resazurin, and distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base medium under an N2-CO2 (4:1, v/v) gas atmosphere.
- step_number: 3
  action: MIX
  description: After cooling, add the listed NaHCO3, MgCl2, CaCl2, vitamin, thiamine,
    vitamin B12, and glucose stock solutions.
- step_number: 4
  action: ALIQUOT
  description: Aseptically and anaerobically distribute under the same gas mixture
    and seal with butyl rubber stoppers.
- step_number: 5
  action: MIX
  description: Prior to use, add 5.0 ml/L 5% Na2S x 9H2O solution.
