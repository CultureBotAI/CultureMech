preparation_notes: 'Adjust pH to 7.2.

  Prepare the medium under a nitrogen atmosphere. Dispense 5 ml into 25 ml tubes fitted
  with rubber stoppers.

  Autoclave at 121 °C for 15 min.

  after autoklaving, add the following from anaerobic, sterile (autoclaved) stock
  solutions (e.g., 100x)

  Before inoculation 2% sterile O2 or 10% sterile air is added to the headspace.'
