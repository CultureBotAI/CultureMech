notes: pH 6.8-7.0 Mix ingredients except for bicarbonate and sulfide solutions. Dispense
  the medium into suitable culture vessels under a stream of nitrogen gas, seal with
  butyl rubber stoppers, and autoclave at 121°C for 15 min. Aseptically and anaerobically
  add other ingredients using sterile syringes, and the N2/CO2 (80/20) mixed gas is
  enclosed with the vessels. Adjust pH to 6.8-7.0 using compact pH meter. Sterilized
  by autoclaving. Sterilized by autoclaving. Saturated with CO2 gas. Tightly sealed
  in bottles filled with CO2 gas and then sterilized by autoclaving. Sterilized by
  filtration and stored under N2 gas.
