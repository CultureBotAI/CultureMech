preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.0.
- step_number: 2
  action: POUR_PLATES
  description: Prepare the medium under an atmosphere of N2. Dispense into screw capped
    or crimp top bottles fitted with a rubber septum, or Hungate tubes.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
- step_number: 4
  action: FILTER_STERILIZE
  description: After sterilization add filter-sterilized vitamin and neutralized sulfide
    solutions.
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH to 2.0 - 3.0.
- step_number: 6
  action: AUTOCLAVE
  description: The sulfide solution is prepared in a 250 ml screw-capped bottle with
    a butyl rubber septum and a magnetic stirrer. The solution is bubbled with nitrogen
    gas, closed and autoclaved for 15 min. at 121°C. After cooling to room temperature
    the pH is adjusted to about 7.0 by adding of sterile 2 M H2SO4 drop-wise with
    a syringe without opening the bottle.
