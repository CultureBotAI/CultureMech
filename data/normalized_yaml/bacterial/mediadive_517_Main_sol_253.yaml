preparation_notes: 'Adjust pH to 8.5.

  Bubble with nitrogen gas and fill in tubes with a rubber septum under a stream of
  nitrogen gas. Autoclave at 121°C for 15 min. After sterilization add 1 ml/l filter-sterilized
  vitamin solution (B), 200 ml of filter-sterilized solution Bicarbonate solution
  (C) and 10 ml/l sterilised Na2S x 9H2O solution (D). pH 8.5


  Original volume: 1011 mL'
