preparation_steps:
- step_number: 1
  action: STORE
  description: Columbia agar base supplemented with 5% defibrinated sheep blood. Rehydrate
    pellets of freeze-dried ampoules in liquid medium 545, 215 or 1 (see below).
- step_number: 2
  action: STORE
  description: 'ATTENTION: organisms, for which only M 693 is mentioned in the catalogue
    entry, do not grow in one of the media listed below! Those are meant to rehydrate
    the freeze-dried pellets, not for cultivation.'
- step_number: 3
  action: ADJUST_PH
  description: Adjust pH to 7.3.
- step_number: 4
  action: MIX
  description: The same as Caso Bouillon (Merck or Oxoid, Germany).
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH to 7.0.
