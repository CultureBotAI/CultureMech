preparation_steps:
- step_number: 1
  action: MIX
  description: Adjust to pH 8.0 and sterilize by autoclaving. The medium may be solidified
    by adding 20.0 g/l agar.
- step_number: 2
  action: AUTOCLAVE
  description: After autoclaving cool down and add the following to 1 litre medium.
    Methanol  and Vitamine B12 are filter sterilized. Solution T and Wolfe's Mineral
    Solution are separately autoclaved. Final pH 8.0.
- step_number: 3
  action: MIX
  description: Adjust to pH 8.0 and sterilize by autoclaving.
- step_number: 4
  action: ADJUST_PH
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals.
- step_number: 5
  action: MIX
  description: Adjust to pH 8.0 with KOH and sterilize by autoclaving.
- step_number: 6
  action: FILTER_STERILIZE
  description: Filter sterilized
applications:
- Microbial cultivation
