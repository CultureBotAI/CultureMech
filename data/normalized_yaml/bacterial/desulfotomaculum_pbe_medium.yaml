    label: DESULFOTOMACULUM PBE MEDIUM
notes: JCM Medium 547 Desulfotomaculum PBE Medium prepares Solution A from 2 g peptone,
  1 g beef extract, 2 g MgSO4 x 7H2O, 1.5 g Na2SO4, 0.1 g CaCl2, and 900 ml distilled
  water, then autoclaves it under an N2 gas atmosphere. To complete the medium, 10
  ml of autoclaved 5% K2HPO4, 70 ml of autoclaved 5% sodium lactate, 10 ml of filter-sterilized
  4% Fe(NH4)2(SO4)2 x 6H2O, and 10 ml of filter-sterilized 1% sodium ascorbate are
  added aseptically and anaerobically per liter. JCM, TOGO, and MediaDive do not report
  a final pH.
