    70 ml/L autoclaved 5% sodium lactate solution, 10 ml/L filter-sterilized 4% Fe(NH4)2(SO4)2
    x 6H2O solution, and 10 ml/L filter-sterilized 1% sodium ascorbate solution.
sterilization:
