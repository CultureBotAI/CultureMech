notes: NBRC Medium 1509 HGAM lists 41.7 g Nissui Modified GAM Broth and 1.0 L distilled
  water at pH 7.3; for anaerobic liquid medium it directs dispensing under an N2 atmosphere
  into butyl-stoppered culture vessels before autoclaving at 115 C for 15 min. TOGO
  M3040 imports this liquid anaerobic form from NBRC M1509-2.
preparation_steps:
- step_number: 1
  action: MIX
  description: Suspend 41.7 g Nissui Modified GAM Broth in 1.0 L distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 7.3.
- step_number: 3
  action: ALIQUOT
  description: Dispense anaerobic liquid medium into suitable culture vessels under
    an N2 atmosphere and seal with butyl rubber stoppers.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 115 C for 15 min.
  temperature:
    value: 115.0
    unit: CELSIUS
  duration: 15 min
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 115.0
    unit: CELSIUS
  duration: 15 min
  notes: NBRC Medium 1509 directs anaerobic liquid HGAM to be dispensed under N2 and
    autoclaved at 115 C for 15 min.
