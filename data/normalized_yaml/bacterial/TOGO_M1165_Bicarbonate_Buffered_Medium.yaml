preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the salts, yeast extract, Resazurin, FeCl2 solution, Trace element
    solution, Selenite-tungstate solution, and distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base medium under an N2-CO2 (4:1, v/v) gas mixture.
- step_number: 3
  action: MIX
  description: After cooling, add MgCl2, CaCl2, Trace vitamins, NaHCO3, and Substrate
    solutions.
- step_number: 4
  action: ALIQUOT
  description: Aseptically and anaerobically distribute medium into culture vessels
    under N2-CO2 (4:1, v/v) and seal with butyl rubber stoppers.
- step_number: 5
  action: MIX
  description: Prior to use, add 10.0 ml/L 5% Na2S x 9H2O solution autoclaved and
    stored under N2.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Autoclave the base under N2-CO2; filter-sterilize Trace vitamins and NaHCO3
    before adding after cooling.
