preparation_notes: "Mix components thoroughly. Bring to a boil for a few seconds,\
  \ cool down under a N2-CO2 (4:1, v/v) gas mixture, seal with butyl rubber stoppers\
  \ and autoclave. After cooling, add the following solutions (autoclaved or *filter-sterilized):\
  \ \nAseptically distribute the medium into culture vessels (e.g., 5 ml of the medium\
  \ in the Hungate tubes) under a N2-CO2 (4:1, v/v) gas mixture and seal with butyl\
  \ rubber stoppers. Add per liter the following solutions from anaerobic stocks (autoclaved\
  \ and stored under a N2 gas atmosphere): \nReadjust pH to 7.5, if necessary.\n\n\
  Original volume: 1022 mL"
