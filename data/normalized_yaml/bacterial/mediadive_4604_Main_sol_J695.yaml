preparation_notes: "Mix components except sulfur, adjust pH to 6.0 and autoclave under\
  \ a N2 atmosphere. Distribute the medium into culture vessels (e.g., 20 ml in 100\
  \ ml serum bottles) containing appropriate amount of sulfur under a H2-CO2 (4:1,\
  \ v/v) gas mixture and seal with butyl rubber stoppers. Aseptically and anaerobically\
  \ add the following solutions (autoclaved or *filter-sterilized) into the medium\
  \ (per liter): \nPressurize the inoculated culture vessel to 200 kPa H2-CO2 (4:1,\
  \ v/v).\n\nOriginal volume: 1050 mL"
