preparation_steps:
- step_number: 1
  action: MIX
  description: Mix distilled water, resazurin, Sigma sea salts, BD-Difco yeast extract,
    and 1.0 ml/L Wolfe's mineral elixir.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the medium under an N2 atmosphere.
- step_number: 3
  action: MIX
  description: Aseptically and anaerobically add 25.0 ml/L sterile anaerobic 8% NaHCO3
    solution, 20.0 ml/L 1 M sodium acetate solution, 20.0 ml/L 1 M sodium fumarate
    solution, and 10.0 ml/L Trace vitamins.
- step_number: 4
  action: MIX
  description: Distribute the medium under an N2-CO2 (4:1, v/v) gas stream, seal culture
    vessels with butyl rubber stoppers, then add 6.0 ml/L 5% Na2S x 9 H2O solution
    autoclaved and stored under N2.
applications:
- Microbial cultivation
