preparation_steps:
- step_number: 1
  action: HEAT
  description: Boil and cool under CO2. Under a gentle stream of CO2, add 4.0 g Na2CO3,
    1.0 ml fatty acid mixture (see below) and 500 mg L-cysteine x HCl x H2O.
- step_number: 2
  action: AUTOCLAVE
  description: Adjust pH to 7.0, distribute into appropriate vessels under N2 and
    autoclave.
applications:
- Microbial cultivation
