preparation_notes: "Addition: \npH 7.0\nSterilize medium for 30 min at 121°C, cool\
  \ to 30°C and add fresh egg mixture carefully to the medium.\n* You need for 1 l\
  \ of egg mixture 20 - 25 fresh eggs (not older then 1 week). Clean the eggs, wipe\
  \ away with 70% alcohol, open the eggs and homogenize the egg mixture carefully.\n\
  \nOriginal volume: 1612 mL"
