  mediaingredientmech_chebi_term:
    id: CHEBI:15377
    label: water
  notes: JCM Medium 386 uses 895 ml/L distilled water before OADC addition.
- preferred_term: Middlebrook OADC Enrichment (BD-BBL)
  concentration:
    value: '100'
    unit: ML_PER_L
  notes: JCM Medium 386 aseptically adds this commercial BD-BBL enrichment.
- preferred_term: Hemin
  concentration:
    value: '60'
    unit: MICROMOLAR
