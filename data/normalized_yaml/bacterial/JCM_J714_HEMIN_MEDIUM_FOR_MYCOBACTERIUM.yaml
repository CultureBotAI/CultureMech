preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Sterilize the Middlebrook 7H10 agar, glycerol, and distilled water
    at 121 C for 10 min.
- step_number: 2
  action: COOL
  description: Cool to 50-55 C.
- step_number: 3
  action: MIX
  description: Aseptically add 100 ml/L Middlebrook OADC Enrichment (BD-BBL), add
    hemin to 60 micromol/L after solubilizing it with 1 N NaOH, and mix thoroughly.
