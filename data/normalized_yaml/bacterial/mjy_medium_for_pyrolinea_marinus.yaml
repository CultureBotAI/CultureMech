preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix 1.0 L MJ(-N) synthetic seawater, NH4Cl, NaNO3, and Yeast extract
    thoroughly; distribute the medium into culture vessels under a N2-CO2 (4:1, v/v)
    gas mixture, seal with butyl rubber stoppers, and autoclave.
- step_number: 2
  action: MIX
  description: After cooling, add 5.0 ml/L 8% NaHCO3 solution and 10.0 ml/L 5% Na2S
    x 9 H2O solution that were filter-sterilized or autoclaved and stored anaerobically.
- step_number: 3
  action: ADJUST_PH
  description: Pressurize the culture vessels to 200 kPa N2-CO2 (4:1, v/v) and check
    the final pH at 6.0-6.5.
- step_number: 4
  action: MIX
  description: MJ(-N) synthetic seawater can be replaced with a commercial synthetic
    seawater such as Jamarin S. For strain JCM 15506, inoculate with a 5-10% inoculum.
applications:
- Microbial cultivation
