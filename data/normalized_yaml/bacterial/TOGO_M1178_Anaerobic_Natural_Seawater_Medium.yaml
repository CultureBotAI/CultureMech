preparation_steps:
- step_number: 1
  action: MIX
  description: Mix tryptone, yeast extract, resazurin, natural seawater, and distilled
    water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 7.0.
- step_number: 3
  action: COOL
  description: Bring the medium to a boil and cool under an N2 gas atmosphere.
- step_number: 4
  action: ALIQUOT
  description: Distribute the medium in culture vessels under N2 and seal with butyl
    rubber stoppers.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave at 121 degrees C for 15 min.
- step_number: 6
  action: MIX
  description: After cooling, aseptically and anaerobically add 6.0 ml/L each 5% L-Cysteine
    HCl H2O and 5% Na2S x 9H2O solutions autoclaved and stored under N2.
- step_number: 7
  action: MIX
  description: Supplement the JCM 33131 variant with 10.0 ml/L Trace vitamins from
    JCM Medium 197.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: JCM's default sterilization is autoclaving at 121 degrees C for 15 min; JCM
    Medium 1102 autoclaves the anaerobic base after distribution under N2.
ph_value: 7.0
