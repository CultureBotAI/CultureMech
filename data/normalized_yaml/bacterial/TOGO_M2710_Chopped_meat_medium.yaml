preparation_steps:
- step_number: 1
  action: HEAT
  description: Use lean beef or horse meat; remove fat and connective tissue before
    grinding. Mix meat, distilled water, and N NaOH and bring to a boil while stirring.
- step_number: 2
  action: FILTER
  description: Cool to room temperature, skim fat off the surface, and filter, retaining
    both meat particles and filtrate. Add enough distilled water to restore 1.0 L
    of filtrate.
- step_number: 3
  action: HEAT
  description: Add peptone, yeast extract, K2HPO4, any glucose supplement, and 0.025%
    resazurin solution to the filtrate, then boil and cool.
- step_number: 4
  action: ADJUST_PH
  description: Add L-cysteine HCl and adjust to pH 7.0.
- step_number: 5
  action: AUTOCLAVE
  description: Under 97% nitrogen / 3% hydrogen, dispense 7 ml medium over one part
    meat particles to four to five parts fluid per tube. Cap with butyl rubber stoppers
    under N2/H2 and autoclave for 15 minutes under fast exhaust.
