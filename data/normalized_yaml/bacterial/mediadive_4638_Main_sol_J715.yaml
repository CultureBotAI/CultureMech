preparation_notes: 'Mix components and adjust pH to 6.8 - 7.0 with NaOH. Bring to
  a boil, cool down under a N2 gas stream and add 2 ml of 5% Na2S x 9H2O solution.
  Anaerobically distribute the medium into culture vessels, seal with butyl rubber
  stoppers and autoclave.


  Original volume: 1014 mL'
