    Table 1 PA-5052 contains 18 amino acids with no cysteine or tyrosine. The methods
    specify monosodium glutamate, asparagine monohydrate, arginine/lysine hydrochlorides
    and histidine hydrochloride monohydrate, unlike the corresponding native free-compound
    entries. The native lysine amount also does not align with the uniformly specified
    amino-acid mass concentration; lactose is explicitly alpha-lactose monohydrate
    in the source but generic lactose in the owner. Table 5 is an experimental modification,
    not the Table 1 formula: glycerol, amino-acid levels, vitamins and the trace mixture
    differ. The assay lists B832(DE3)RIL/P21, whereas methods say B834. These study
    modifications and unresolved import identities are preserved here pending a defensible
    parent/variant mapping; no Table 5 outcome is assigned to native PA-5052. Inventory
    covers inspected medium-relevant passages, not the whole paper or bibliography.
    Correction/retraction coverage is limited to inspected metadata; bounded taxonomy
    misses do not prove absence. Original ingredients, amounts, preparation, history
    and links are preserved, not newly certified. No new native growth assertion,
    resolved variant or concentration evidence.'
