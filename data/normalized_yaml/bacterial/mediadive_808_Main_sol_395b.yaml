preparation_notes: 'Dissolve ingredients (except bicarbonate, Trypticase, vitamins
  and sulfide), then sparge medium with 80% N2 and 20% CO2 gas mixture for 30 - 45
  min to make it anoxic. Dispense medium under same gas atmosphere into anoxic Hungate-type
  tubes or serum vials and autoclave. After autoclaving add Trypticase, vitamins and
  sulfide from sterile anoxic stock solutions prepared under 100% N2 gas atmosphere
  and bicarbonate from a sterile anoxic stock solution prepared under 80% N2 and 20%
  CO2 gas mixture. Vitamins are sterilized by filtration. Adjust pH of complete medium
  to 6.0 - 6.1, if necessary.


  Original volume: 1002 mL'
