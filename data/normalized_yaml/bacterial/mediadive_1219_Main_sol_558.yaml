preparation_notes: 'Dissolve ingredients (except glucose, yeast extract, vitamin solution
  and reducing agents), adjust pH to 3.5 using HCl and sparge medium with 80% N2 and
  20% CO2 gas mixture for 30 - 45 min to make it anoxic. Dispense medium under same
  gas atmosphere into anoxic Hungate-type tubes or serum vials. After autoclaving
  add glucose, yeast extract, vitamin solution, cysteine and sulfide from sterile
  anoxic stock solutions prepared under 100% N2 gas. The vitamin solution should be
  sterilized by filtration. Adjust pH of complete medium to 3.5, if necessary.


  Original volume: 1011 mL'
