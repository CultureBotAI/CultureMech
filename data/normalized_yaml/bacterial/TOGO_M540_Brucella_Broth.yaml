  notes: Primary literature source reporting Helicobacter pylori OMU89-362 growth
    in Brucella broth supplemented with fetal bovine serum and hydrogen peroxide.
variants:
- name: brucella_broth_fbs_h2o2_helicobacter_pylori
  description: Brucella broth condition used for Helicobacter pylori liquid growth,
    with fetal bovine serum supplementation and hydrogen-peroxide detoxification of
    the bisulfite-containing parent broth.
  modifications:
  - Supplement Brucella broth with 10% fetal bovine serum.
  - Add hydrogen peroxide at sublethal concentrations, with maximum growth stimulation
    reported at 3.5 mM H2O2.
  - Incubate microaerobically at 37 C with shaking; source measured OD620 and viable
    CFU after 24 h.
  purpose: Capture strain-specific Helicobacter pylori growth evidence under the shared
    Brucella broth parent while modeling serum and H2O2 as study-specific variant
    conditions.
  evidence:
  - reference: PMID:10609610
    supports: SUPPORT
    snippet: enhanced the growth of Helicobacter pylori in Brucella broth supplemented
      with 10% fetal bovine serum (BB/FBS)
    explanation: The source uses the same Brucella broth basal formulation, supplemented
      with fetal bovine serum and hydrogen peroxide, to measure Helicobacter pylori
      OMU89-362 growth.
