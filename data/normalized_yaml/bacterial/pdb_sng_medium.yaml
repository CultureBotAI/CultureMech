preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve ingredients in distilled water and bring the medium to 1 L.
- step_number: 2
  action: MIX
  description: Add 1-2 ml of the selected SL-10 or SL-6 trace element solution; the
    official component table lists each stock at 1 ml/L.
- step_number: 3
  action: MIX
  description: Mix well and adjust pH with base or acid if necessary.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min.
- step_number: 5
  action: MIX
  description: Use 10% CH4 gas as the methane source.
