media_term:
  preferred_term: TOGO Medium M174
  term:
    id: TOGO:M174
    label: Horikoshi-I Medium
notes: 'Source: TOGO Medium M174 | Link: https://togomedium.org/medium/M174


  TOGO Medium M174 mirrors JCM Medium 181 Horikoshi-I medium: a 900 mL agar base with
  glucose, Polypepton, yeast extract, dipotassium hydrogen phosphate, magnesium sulfate
  heptahydrate, and agar plus 100 mL sterile 10% Na2CO3 solution after autoclaving,
  for a final pH of 10.0.'
sterilization:
  method: AUTOCLAVE
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the Horikoshi-I agar base in 900 mL water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min.
- step_number: 3
  action: MIX
  description: Aseptically add 100 mL of sterile 10% Na2CO3 solution.
- step_number: 4
  action: ADJUST_PH
  description: Check the final pH to be about 10.0.
ph_value: 10.0
applications:
- Microbial cultivation
