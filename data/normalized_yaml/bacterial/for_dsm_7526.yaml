preparation_steps:
- step_number: 1
  action: FILTER_STERILIZE
  description: DSMZ Medium 457b prepares a 2 g/L fluoranthene stock in acetone and
    filter-sterilizes it with a cellulose filter membrane.
- step_number: 2
  action: MIX
  description: DSMZ Medium 457b adds 1 mL of the fluoranthene stock to a sterile culture
    flask, lets the acetone evaporate, and adds 20 mL of medium; direct addition of
    about 1-2 mg fluoranthene is also possible.
- step_number: 3
  action: ADJUST_PH
  description: DSMZ Medium 457 adjusts the mineral base to pH 6.9.
- step_number: 4
  action: AUTOCLAVE
  description: DSMZ Medium 457 autoclaves the phosphate solution separately and combines
    it with the rest of the medium after cooling.
- step_number: 5
  action: MIX
  description: DSMZ Medium 457b reactivates lyophilized cells in a complex medium
    before transferring them to mineral medium 457 with the appropriate carbon source.
