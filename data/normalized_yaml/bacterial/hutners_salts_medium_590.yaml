original_name: Hutner's salts (medium 590)
category: bacterial
medium_type: DEFINED
composition_type: DEFINED
physical_state: LIQUID
ph_value: 6.8
notes: KOMODO 2110 records the Hutner's salts stock from DSMZ/MediaDive Medium 590.
  DSMZ Medium 590 defines Hutner's salts as 10.0 g/L nitrilotriacetic acid, 29.7 g/L
  MgSO4 x 7 H2O, 3.335 g/L CaCl2 x 2 H2O, 9.25 mg/L (NH4)6Mo7O24 x 4 H2O, 99.0 mg/L
  FeSO4 x 7 H2O, 50.0 ml/L Metals 44, and 950.0 ml/L distilled water adjusted to pH
  6.8.
preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve nitrilotriacetic acid.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 7.0 with about 7.3 g KOH.
- step_number: 3
  action: MIX
  description: Dissolve MgSO4, CaCl2, ammonium molybdate, and FeSO4 separately.
- step_number: 4
  action: MIX
  description: Combine the dissolved salts with 50.0 ml/L Metals 44.
- step_number: 5
  action: ADJUST_PH
  description: Adjust the final Hutner's salts stock to pH 6.8 with NaOH or H2SO4.
