preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix components except L--cysteine・HCl・H2O and Na2S・9H2O and adjust
    pH to 7.2. Bring to a boil for 5--10 sec and cool down under a stream of N2--CO2
    (80:20, v/v). Distribute into culture vessels under the same gasmixture, seal
    with butyl rubber stoppers and autoclave. Separately autoclave L--cysteine・HCl・H2O
    and Na2S・9H2O as 5% solutions under a N2 atmosphere. Prior to inoculation, add
    L--cysteine・HCl・H2O and Na2S・9H2O solutions anaerobically.
- step_number: 2
  action: MIX
  description: Use Medium No. [634] supplemented with 0.5 g/L (final conc.) yeast
    extract and 0.2 g/L peptone instead of sodium succinate.
applications:
- Microbial cultivation
