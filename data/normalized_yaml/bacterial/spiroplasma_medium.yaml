preparation_steps:
- step_number: 1
  action: MIX
  description: Mix DI Water, Agar if required, Tryptone, and PPLO Broth without crystal
    violet as the basal medium.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the basal medium to pH 7.3-7.4.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the basal medium at 121 C for 15 minutes, then cool to 50-55
    C in a water bath if agar is used.
- step_number: 4
  action: FILTER_STERILIZE
  description: Prepare the additive solution from heat-inactivated fetal bovine serum,
    Phenol red solution, TC Yeastolate, DI Water, Glucose, Mycoplasma Growth Supplement,
    and Yeast Extract Solution, then filter-sterilize it.
- step_number: 5
  action: MIX
  description: Combine the filter-sterilized additive solution with the basal medium
    and, if needed, readjust the pH to 7.35 +/- 0.1.
media_term:
  preferred_term: TOGO Medium M2578
  term:
    id: TOGO:M2578
    label: Spiroplasma Medium
notes: TOGO M2578 defines Spiroplasma Medium with a basal medium containing 500 ml
  DI Water, 15 g optional Agar, 10 g Tryptone, and 11 g PPLO Broth without crystal
  violet. Its additive solution supplies 170 ml heat-inactivated fetal bovine serum,
  20 ml 0.1% Phenol red solution, 100 ml 2% TC Yeastolate, 200 ml DI Water, 5 g Glucose,
  50 ml Mycoplasma Growth Supplement made from 98 g CMRL-1066 in 1.0 L water, and
  35 ml Yeast Extract Solution made from 250 g baker's yeast in 1.0 L water. The basal
  medium is adjusted to pH 7.3-7.4, autoclaved at 121 C for 15 minutes, combined with
  the filter-sterilized additive solution, and readjusted if needed to pH 7.35 +/-
  0.1.
applications:
- Microbial cultivation
