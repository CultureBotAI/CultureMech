preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the base ingredients, Trace metal solution, and Selenite-tungstate
    solution under an N2-CO2 (80:20, v/v) gas mixture.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base medium under the same gas mixture in bottles sealed
    with butyl rubber stoppers.
- step_number: 3
  action: MIX
  description: After cooling, aseptically and anaerobically add the NaHCO3, glucose,
    Na2S x 9H2O, Phosphate, and Trace vitamins stocks.
applications:
- Microbial cultivation
