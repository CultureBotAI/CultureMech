notes: TOGO M396 preserves a JCM Medium J400 snapshot for Desulfovibrio Piger Medium.
  The JCM formula lists 1 L distilled water, 1 g MgSO4・7H2O, 1 g yeast extract, 0.1
  g CaCl2・2H2O, 0.5 g KH2PO4, 1 g NH4Cl, 0.5 mg resazurin, 75 mg Na2S・9H2O, 2 g NaHCO3,
  2 g Na2SO4, 2.5 g sodium lactate, 1 g Na2S2O3・5H2O, and referenced trace-minerals,
  trace-element, and trace-vitamins stocks from JCM media M151, M187, and M197. The
  preparation text specifies an N2 gas stream and N2 atmosphere, and states to check
  the final pH to be 7.0-7.2.
