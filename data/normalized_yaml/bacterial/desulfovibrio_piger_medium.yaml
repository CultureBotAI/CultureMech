preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix ingredients, except sodium lactate, NaHCO3 and Na2S・9H2O, bring
    to aboil, and cool down to room temperature under a N2 gas stream. Dispense themedium
    into culture vessels under a N2 atmosphere, seal with butyl rubber stoppers and
    autoclave. Separately autoclave sodium lactate, NaHCO3 and Na2S・9H2O solutions
    (10, 8 and 0.75%, respectively) under a N2 atmosphere,and add to the medium. Check
    final pH to be 7.0 -- 7.2.
- step_number: 2
  action: MIX
  description: Use Medium No. [388] with 2.5 g/L (final) sodium lactate. Add Trace
    minerals of Medium No. [151], instead of FeCl2 solution, and Trace element solution
    of Medium No. [230].
