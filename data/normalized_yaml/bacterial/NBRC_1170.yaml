notes: Mix ingredients except for vitamin solution, trimethylamine-HCl, NaHCO3 and
  Na2S·9H2O, and autoclave under a N2/CO2 atmosphere (80/20). Separately autoclave
  Na2S·9H2O solution as 5% solution under a N2 atmosphere. Prior to inoculation, add
  the filter-sterile vitamin, 50% trimethylamine-HCl and 5% NaHCO3 solutions, and
  Na2S·9H2O. Adjust pH of the medium to 7.4 with filter-sterile 5% Na2CO3 solution
  (approximately final concentration of Na2CO3 is 0.5 g/L). First dissolve nitrilotriacetic
  acid and adjust pH to 6.5 with NaOH, and then add minerals. Final pH 7.0.
