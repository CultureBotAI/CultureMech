preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Mix all ingredients except vitamin solution, trimethylamine-HCl, NaHCO3,
    and Na2S·9H2O.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the medium under an N2/CO2 (80/20) atmosphere.
- step_number: 3
  action: AUTOCLAVE
  description: Separately autoclave Na2S·9H2O as a 5% solution under N2.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter-sterilize the vitamin solution, 50% trimethylamine-HCl solution,
    5% NaHCO3 solution, and 5% Na2CO3 solution.
- step_number: 5
  action: MIX
  description: Prior to inoculation, add the filter-sterile vitamin, trimethylamine-HCl,
    and NaHCO3 solutions and the Na2S·9H2O solution.
- step_number: 6
  action: ADJUST_PH
  description: Adjust pH of the medium to 7.4 with filter-sterile 5% Na2CO3 solution,
    approximately 0.5 g/L Na2CO3 final concentration.
- step_number: 7
  action: ADJUST_PH
  description: For the trace elements solution, first dissolve NTA, adjust pH to 6.5
    with NaOH, then add minerals; final pH is 7.0.
