preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the LB base from 10 g/L Bacto Tryptone (Difco), 5 g/L yeast
    extract, 5 g/L NaCl, 985 ml/L distilled water, and 15 g/L agar if needed.
- step_number: 2
  action: FILTER_STERILIZE
  description: Sterilize the 50 mg/ml streptomycin, and 50 mg/ml rifampicin stocks
    separately by filtration.
- step_number: 3
  action: MIX
  description: Add 10.0 ml/L filter-sterilized Streptomycin solution (50 mg/ml), and
    5.0 ml/L filter-sterilized Rifampicin solution (50 mg/ml) to the LB base.
