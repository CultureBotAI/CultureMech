- step_number: 2
  action: MIX
  description: The basic medium is the same as Caso Bouillon (Merck or Oxoid). The
    medium may be solidified by adding 15.0 g/l agar.
- step_number: 3
  action: MIX
  description: When using commercially available Caso Bouillon (Merck or Oxoid) for
    strains DSM 24264, DSM 24313, DSM 24197 increase the NaCl concentration to 100.0
    g/L.
