preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 6.2 - 6.5.
- step_number: 2
  action: AUTOCLAVE
  description: Add 4 ml Resazurin solution (25 mg/100 ml). 0.05% Cysteine-hydrochloride
    is added after the medium has been boiled and cooled and CO2. Distribute under
    N2 and autoclave.
applications:
- Microbial cultivation
