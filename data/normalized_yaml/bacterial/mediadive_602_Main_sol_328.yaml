preparation_notes: 'Adjust pH to 6.9.

  Dissolve ingredients except cysteine-HCl in water, boil for 5 min, cool to room
  temperature while gassing with 100% CO2, add cysteine-HCl and adjust pH to 6.9 with
  8 N NaOH while gassing is continued. Switch to 100% N2 gas after pH has reached
  the desired value, distribute in anaerobic tubes under nitrogen, and autoclave.'
