preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the basal salts, yeast extract, BD-Difco tryptone, peptone, resazurin,
    10.0 ml/L Trace element solution SL-4, 10.0 ml/L Trace vitamins, and 930.0 ml/L
    distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the medium to pH 7.0.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the medium under an N2 atmosphere.
- step_number: 4
  action: MIX
  description: After autoclaving, add 1.25 ml/L sterile anaerobic 8% NaHCO3 solution,
    50.0 ml/L 10% glucose solution, 10.0 ml/L 3% Na2S x 9 H2O solution, and 10.0 ml/L
    3% L-cysteine HCl x H2O solution.
applications:
- Microbial cultivation
