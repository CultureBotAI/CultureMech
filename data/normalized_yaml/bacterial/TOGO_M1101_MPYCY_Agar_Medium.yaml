notes: TOGO M1101/M1102 record JCM Medium 1037 with maltose monohydrate, sodium pyruvate,
  Casamino acids, yeast extract, Solution A from M1100/JCM 1036, Solution B from M1100/JCM
  1036, and distilled water; the M1101 agar variant also lists 12 g/L agar if necessary.
  JCM 1037 adjusts pH to 7.6-7.8 for agar plates or to 7.4-7.6 for liquid medium,
  autoclaves at 115 degrees C for 20 min, and adds Solution B aseptically after separate
  filter sterilization. This record uses the agar-plate pH range.
