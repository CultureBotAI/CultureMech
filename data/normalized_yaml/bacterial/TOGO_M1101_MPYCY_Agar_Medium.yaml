preparation_steps:
- step_number: 1
  action: MIX
  description: Mix maltose monohydrate, sodium pyruvate, Casamino acids, yeast extract,
    Solution A, optional agar, and distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Before autoclaving, adjust to pH 7.6-7.8 for agar plates or pH 7.4-7.6
    for liquid medium.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 115 degrees C for 20 min.
- step_number: 4
  action: FILTER_STERILIZE
  description: Mix Solution B and filter-sterilize it just before addition.
- step_number: 5
  action: MIX
  description: Add filter-sterilized Solution B aseptically after autoclaving.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 115.0
    unit: CELSIUS
  duration: 20 min
  notes: Separately filter-sterilize Solution B and add aseptically.
