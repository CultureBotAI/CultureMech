preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except carbonate, vitamins, gentisic acid and
    sulfide), then sparge medium with 80% N2 and 20% CO2 gas mixture for 30 - 45 min
    to make it anoxic. Dispense under same gas atmosphere in culture vessels and autoclave.
    Add vitamins (sterilized by filtration) and sulfide from sterile anoxic stock
    solutions prepared under 100% N2 gas and carbonate from a sterile anoxic stock
    solution prepared under 80% N2 and 20% CO2 gas mixture. Add gentisic acid (2,5-dihydroxybenzoic
    acid) from a sterile and neutralized 200 mM stock solution prepared under 100%
    N2 gas atmosphere. If necessary, adjust the final pH of the medium to 7.2.
- step_number: 2
  action: FILTER_STERILIZE
  description: 'Note: Addition of 10 - 20 mg sodium dithionite per liter (e.g. from
    5% (w/v) solution, freshly prepared under N2 and filter-sterilized) may stimulate
    growth at the beginning. For transfers use 5 - 10% inoculum. Some cultures are
    shipped in semi-solid medium which stimulates growth at the beginning. For agar
    stabs 3.00 g/l agar are added to the complete medium from a sterile anoxic stock
    solution (2% w/v). Upon receipt add anoxically 1 - 2 ml of the recommended freshly
    prepared liquid medium to the agar tube and incubate for 3 - 5 days. After incubation
    transfer 0.5 ml of the resulting cell suspension in the liquid phase to tubes
    with liquid medium.'
- step_number: 3
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
