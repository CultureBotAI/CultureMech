preparation_steps:
- step_number: 1
  action: HEAT
  description: Add 1 l water to 200.0 g pulp of sour stone cherries, heat to boiling,
    simmer gently for 2 h, and strain through cloth.
- step_number: 2
  action: AUTOCLAVE
  description: Sterilize the cherry extract at 110 C for 30 min.
- step_number: 3
  action: DISSOLVE
  description: Dissolve 20.0 g agar in 800 ml water and sterilize.
- step_number: 4
  action: MIX
  description: Add 200 ml cherry extract, distribute in presterilized tubes, and sterilize
    for 5 min at 120 C.
