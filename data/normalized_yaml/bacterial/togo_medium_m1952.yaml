preparation_steps:
- step_number: 1
  action: MIX
  description: Combine 4 g/L Hipolypepton, 3 g/L Yeast extract, 7.5 g/L Glucose, and
    1 L Distilled water.
- step_number: 2
  action: MIX
  description: Add 8 g/L agar when solid NBRC Medium 1227 is needed.
- step_number: 3
  action: FILTER_STERILIZE
  description: Sterilize Acetic acid and Ethanol separately by filtration.
- step_number: 4
  action: MIX
  description: Add 30 ml/L Acetic acid and 30 ml/L Ethanol.
- step_number: 5
  action: MIX
  description: Leave pH unadjusted.
media_term:
  preferred_term: TOGO Medium M1952
  term:
    id: TOGO:M1952
    label: TOGO Medium M1952
notes: TOGO M1952 imports NBRC Medium 1227, which lists 4 g/L Hipolypepton from Wako
  Pure Chemical Industries, 3 g/L Yeast extract, 7.5 g/L Glucose, 30 ml/L Acetic acid,
  30 ml/L Ethanol, 8 g/L Agar if needed, and 1 L Distilled water with pH unadjusted.
  Acetic acid and ethanol are sterilized separately by filtration.
