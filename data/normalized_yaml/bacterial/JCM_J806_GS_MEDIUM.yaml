preparation_steps:
- step_number: 1
  action: MIX
  description: Mix JCM Medium 265 base components except NaHCO3, with 6.0 g/L final
    NaCl from JCM Medium 262 and 1.8 g/L glucose replacing sodium acetate for JCM
    Medium 806.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 6.5 before adding NaHCO3.
- step_number: 3
  action: HEAT
  description: Bring the medium to a boil for 5-10 sec, cool under H2-CO2 (80:20,
    v/v), and add NaHCO3.
- step_number: 4
  action: AUTOCLAVE
  description: Dispense the medium into Hungate tubes under H2-CO2 (80:20, v/v), seal
    with butyl rubber stoppers, autoclave, and stand overnight.
- step_number: 5
  action: MIX
  description: Aseptically and anaerobically add 5% L-Cysteine HCl H2O and 5% Na2S
    x 9H2O solutions stored under N2 at the JCM Medium 265 per-liter ratios.
- step_number: 6
  action: MIX
  description: Cultivate JCM Medium 806 under an N2-CO2 (80:20, v/v) gas mixture.
applications:
- Microbial cultivation
incubation_atmosphere: ANAEROBIC
