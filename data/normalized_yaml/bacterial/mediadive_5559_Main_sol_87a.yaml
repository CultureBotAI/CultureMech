preparation_notes: 'Adjust pH to 8.2.

  Boil the medium under a stream of nitrogen gas for a few minutes and distribute
  90 ml medium into 100 ml screw-capped bottles. Bubble each bottle with nitrogen
  gas and close immediately with a rubber septum and screw tight. Autoclave at 121°C
  for 15 min. After autoclaving inject 1.0 ml of neutralized sulfide solution (0.03%
  end concentration) to each bottle. This medium can be stored for several months.
  Incubate the culture at 50°C at a light intensity of 300 - 500 lux. For heavy cell
  suspension supplement periodically with sterile yeast extract solution (0.1% end
  concentration, for more details see Ref. 3365, 3366).


  Original volume: 1050 mL'
