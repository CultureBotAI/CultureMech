  \ and anaerobically distribute the medium into culture vessels under a N2 gas stream\
  \ and seal with butyl rubber stoppers. Prior inoculation, add per liter the following\
  \ solution from an anaerobic stock (autoclaved and stored under a N2 atmosphere):\
  \ \n\nOriginal volume: 1011 mL"
