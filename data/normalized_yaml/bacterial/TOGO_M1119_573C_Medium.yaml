preparation_steps:
- step_number: 1
  action: MIX
  description: Mix carboxymethyl cellulose sodium salt, ammonium sulfate, KH2PO4,
    glucose, yeast extract, tryptone, and distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 4.8-5.0.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the base medium and the MgSO4 x 7H2O, CaCl2 x 2H2O, and FeCl3
    x 6H2O stock solutions separately at 121 degrees C for 15 min.
- step_number: 4
  action: MIX
  description: Aseptically add all stock solutions to the medium.
