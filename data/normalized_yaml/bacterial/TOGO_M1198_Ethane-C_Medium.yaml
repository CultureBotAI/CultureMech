preparation_steps:
- step_number: 1
  action: MIX
  description: Mix NH4NO3, KH2PO4, Fe(III)-EDTA, Vitamin mixture, Metal mixture, and
    Artificial seawater.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 8.0 with NaOH.
- step_number: 3
  action: ALIQUOT
  description: Distribute 20-50 ml aliquots into 120 ml serum bottles and seal with
    butyl rubber stoppers.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 110 degrees C for 5 min.
- step_number: 5
  action: MIX
  description: Allow the autoclaved medium to stand overnight, then add ethane to
    10-50% of the gas phase by volume.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 110.0
    unit: CELSIUS
  duration: 5 min
  notes: JCM Medium 1120 autoclaves the sealed medium at 110 C for 5 min.
