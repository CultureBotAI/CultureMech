    taxon. This is a medium-use citation and bounded study formulation, not certification
    of every amount, stock, chemical form, preparation step or condition in the canonical
    import. Current CCAP sources distinguish stock batches from additions to final
    medium; flattened local entries cannot be treated as the paper''s measured final
