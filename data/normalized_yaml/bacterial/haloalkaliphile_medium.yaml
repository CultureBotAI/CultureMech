preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Add components except Na2CO3 to distilled water and bring volume to
    900 ml. Adjust pH to 6.5 and autoclave. Dissolve Na2CO3 in 100 ml distilled water
    and autoclave separately. Aseptically add the sterile Na2CO3 solution to the medium.
    Check final pH to be 9.0 - 9.5.
