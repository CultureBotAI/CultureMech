  description: Add to the autoclaved medium the following, from sterile stock solutions
- step_number: 3
  action: MIX
  description: The pH of the final medium should be 8.0-8.5.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter sterilise
- step_number: 5
  action: FILTER_STERILIZE
  description: Adjust the pH to 3.0 with HCl and filter sterilise, store at 4°C.
