    medium\nunder the same gas atmosphere into anoxic Hungate-type tubes to 30% of
    their volume\nand autoclave. Solution B is prepared under 80% N2 and 20% CO2 gas
    atmosphere and\nautoclaved. Solutions C, D, and H are autoclaved under a 100%
    N2 gas atmosphere.\nSolutions E, F, G, and I are prepared under 100% N2 gas and
    sterilized by filtration. To\ncomplete the medium appropriate amounts of solutions
    B to I are added to the sterile\nsolution A in the sequence as indicated.\n\n2.
    Note: Some cultures are shipped in semi-solid medium which stimulates growth at
