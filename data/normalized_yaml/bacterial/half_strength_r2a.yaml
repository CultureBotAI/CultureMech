preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.2 with K2HPO4 or KH2PO4.
- step_number: 2
  action: ADD_AGAR
  description: Add agar after adjusting the pH, then boil to dissolve the agar
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
