variant_modifications:
- 'Half Strength R2A halves most components of full-strength R2A: yeast extract, proteose
  peptone, casamino acids, glucose, and starch from 0.5 to 0.25 g/L; K2HPO4 from 0.3
  to 0.15 g/L; MgSO4 x 7 H2O from 0.05 to 0.025 g/L; agar remains 15 g/L. Sodium pyruvate
  is held at 0.25 g/L per DSMZ Medium 1492 (not halved from R2A''s 0.3 g/L).'
