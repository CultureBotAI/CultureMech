preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the basal PYG Medium (K) components thoroughly.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the basal medium under a nitrogen atmosphere.
- step_number: 3
  action: COOL
  description: Cool the autoclaved basal medium.
- step_number: 4
  action: MIX
  description: Aseptically and anaerobically add autoclaved hemin solution and menadione
    solution.
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH to 7.0-7.2, if necessary.
