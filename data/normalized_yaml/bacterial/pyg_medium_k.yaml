  term:
    id: TOGO:M3010
    label: PYG Medium (K)
notes: TOGO M3010 imports JCM Medium 1338 PYG Medium (K). JCM Medium 1338 lists 5
  g trypticase peptone, 5 g peptone, 10 g yeast extract, 2 g KH2PO4, 0.5 g L-Cysteine
  HCl H2O, 1 mg resazurin, 40 ml salt solution from JCM Medium 676, and 940 ml distilled
  water, then instructs anaerobic addition of 10 ml hemin solution and 10 ml menadione
  solution from JCM Medium 469 after autoclaving under N2.
