preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust the pH to 7.3 with NaOH 4M
- step_number: 2
  action: HEAT
  description: 'Add to 1000 ml of medium after autoclaving and cooling to 55°C:'
- step_number: 3
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
