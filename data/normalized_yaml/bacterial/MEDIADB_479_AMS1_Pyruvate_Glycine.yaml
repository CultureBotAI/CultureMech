    p.2 excerpt=''Strain HTCC1062 grew on P i and did not use added DOP''. The five
    organic-P treatments did not exceed the no-added-Pi control; increased yield with
    phosphite had unresolved trace-phosphate, abiotic-oxidation or enzymatic explanations.
