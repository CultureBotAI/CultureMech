variants:
- name: Carini 2014 AMS1 phosphite utilization assay
  description: AMS1 alternate-phosphorus utilization experiment in Carini et al. 2014
    Figures 1-2, reconciled against this imported formulation. Composite differences;
    no single relationship enum selected. Parent preserved.
  modifications:
  - 'Relative to this imported parent: pyruvate 100 micromolar (parent 1 millimolar);
    glycine 5 micromolar (parent 50 micromolar); methionine 5 micromolar (parent DL-methionine
    50 micromolar). The paper does not resolve methionine stereochemistry.'
  - FeCl3 1 micromolar (parent 117 nanomolar). The AMS1 base source specifies FeCl3.6H2O,
    but its 117 nanomolar dose is overridden by the main assay.
  - 'Full vitamin mixture: B1 6 micromolar, B3 800 nanomolar, B5 425 nanomolar, B6
    500 nanomolar, B7 4 nanomolar, B9 4 nanomolar, B12 700 picomolar, myo-inositol
    6 micromolar, 4-aminobenzoate 60 nanomolar. Parent contains only biotin 4 nanomolar
    and thiamine 60 micromolar.'
  - AMS1 Table 1 base uses MgSO4.7H2O at 2.8 millimolar, not parent magnesium sulfate
    28 millimolar. Source hydrate forms also specify CaCl2.2H2O, MnCl2.4H2O, ZnSO4.7H2O,
    CoCl2.6H2O, Na2MoO4.2H2O and NiCl2.6H2O; corresponding parent forms are anhydrous
    or unspecified. Retain Table 1 molar doses for these unchanged-dose salts, without
    mass conversion.
  - 'No phosphate is added to the alternate-P assay base; omit the phosphate of original
    AMS1 Table 1. This is not a claim of zero residual phosphate: the Figure 2 inoculum
    was previously grown on phosphate.'
  - 'Added phosphite: 1.0 micromolar final, numerically equal to the parent''s 0.001
    millimolar. This supports the assay, not the complete parent recipe. Phosphite
    salt is printed as NaPHO3.5H2O; preserve this literal source formula without assigning
    a corrected stoichiometry or converting to mass.'
  - Base preparation follows Carini 2013 Media preparation (inorganic AMS1 autoclaved,
    then carbon-dioxide and air sparging; vitamins and organics added afterward),
    rather than the parent's generic dissolve-all/filter-all steps. Reported base
    pH 7.5-7.7 is not an optimum or a separate measurement of every 2014 assay.
  purpose: Test HTCC7211 utilization of phosphite as an alternate phosphorus source.
  evidence:
  - reference: doi:10.1038/ncomms5346
    supports: SUPPORT
    snippet: pyruvate (100 μM), glycine (5 μM), methionine (5 μM), FeCl 3 (1 μM)
    explanation: 'Assay-specific amendments, Methods p.5 Organism source/Cultivation
      details, Figures 1-2. Independently located exact excerpt (vitamins, Organism
      source): ''B 1 : 6 μM; B 3 : 800 nM; B 5 : 425 nM; B 6 : 500 nM; B 7 : 4 nM;
      B 9 : 4 nM; B 12 : 700 pM; Myo-inositol: 6 μM; 4-aminobenzoate: 60 nM''. Exact
      substrate excerpt (Cultivation details): ''1.0 μM phosphite (as NaPHO 3 ·5H
      2 O)''. Exact final-basis excerpt (Figure 2 caption): ''Each alternate phosphorus
      compound was supplied at a final concentration of 1.0 μM.''. Exact omission
      excerpt (Organism source): ''without added P i''. Exact inoculum excerpt (Figure
      2): ''Cell inoculum was previously grown on P i .''. These are separate contiguous
      excerpts, normalized for whitespace only; chemistry is not repaired. Conversion
      outside quotations: 1 millimolar = 1000 micromolar; 0.001 millimolar = 1 micromolar;
      0.05 millimolar = 50 micromolar; 0.06 millimolar = 60 micromolar; 0.000117 millimolar
      = 117 nanomolar. The 2014 microarray protocol''s 1 millimolar pyruvate/50 micromolar
      glycine/50 micromolar methionine is not this alternate-P assay. Phosphite salt
      is printed as NaPHO3.5H2O; preserve this literal source formula without assigning
      a corrected stoichiometry or converting to mass.'
  - reference: doi:10.1038/ismej.2012.122
    supports: SUPPORT
    snippet: MgSO 4 ·7H 2 O 2.8 mℳ
    explanation: 'Cited base source, Table 1 heading=''Compound Final concentration'';
      separate exact table rows: ''NaCl 481 mℳ''; ''MgCl 2 ·6H 2 O 27 mℳ''; ''CaCl
      2 ·2H 2 O 10 mℳ''; ''KCl 9 mℳ''; ''NaHCO 3 6 mℳ''; ''MgSO 4 ·7H 2 O 2.8 mℳ'';
      ''''; ''(NH 4 ) 2 SO 4 400 μℳ''; ''NaH 2 PO 4 (pH 7.5) 50 μℳ''; ''''; ''FeCl
      3 ·6H 2 O 117 nℳ''; ''MnCl 2 ·4H 2 O 9 nℳ''; ''ZnSO 4 ·7H 2 O 800 pM''; ''CoCl
      2 ·6H 2 O 500 pM''; ''Na 2 MoO 4 ·2H 2 O 300 pM''; ''Na 2 SeO 3 1 nℳ''; ''NiCl
      2 ·6H 2 O 1 nℳ''; ''''; ''B 1 6 μℳ''; ''B 3 800 nℳ''; ''B 5 425 nℳ''; ''B 6
      500 nℳ''; ''B 7 4 nℳ''; ''B 9 4 nℳ''; ''B 12 700 pM''; ''Myo-inositol 6 μℳ'';
      ''4-Aminobenzoic acid 60 nℳ''. Table uses the script-M molarity glyph; m-script-M
      is millimolar, not a mass unit. The main 2014 assay overrides phosphate, FeCl3
      and organic amendments; do not inherit the base phosphate or base Fe dose. Separate
      exact preparation passage (Media preparation): ''Media preparation Artificial
      seawater medium AMS1 ( Table 1 ) was derived from the artificial seawater medium
      AMP1 ( Moore et al. , 2007 ). Organic buffers (for example, HEPES and EDTA)
      were excluded to avoid potential toxic effects ( Zigler et al. , 1985 ) and
      the possibility that they might be used as substrates for growth ( Nörtemann,
      1992 ). After autoclaving, AMS1 was sparged with 0.1 μm-filtered CO 2 for 5
      h followed by sparging with air for 10 h to establish a bicarbonate-based buffer
      system ( Connon and Giovannoni, 2002 ). All vitamins and organics were added
      after autoclaving and sparging. The pH of the resulting AMS1 typically ranged
      from 7.5 to 7.7. ''. No parent amount or preparation step is changed or newly
      certified; this evidence is attached to the named study variant only.'
