preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve Heart Infusion Broth and Agar in 700.0 ml/L distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the basal agar at 121 C for 15 min.
- step_number: 3
  action: MIX
  description: Cool to 55 C and aseptically add 200.0 ml/L heat-inactivated horse
    serum and 100.0 ml/L filter-sterilized 25% Yeast Extract Solution warmed to 55
    C.
- step_number: 4
  action: ADJUST_PH
  description: Adjust final pH to 7.2-7.6.
