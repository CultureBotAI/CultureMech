preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: KOMODO Medium 504.2 sparges Solution A with an 80% N2 and 20% CO2 gas
    mixture, distributes it under the same gas atmosphere, and autoclaves it; Solution
    B is autoclaved separately under 80% N2 and 20% CO2, and Solution E is autoclaved
    under 100% N2.
- step_number: 2
  action: FILTER_STERILIZE
  description: KOMODO Medium 504.2 prepares Solutions C and D under 100% N2 and sterilizes
    them by filtration before adding Solutions B to E to sterile Solution A in sequence.
- step_number: 3
  action: ADJUST_PH
  description: KOMODO Medium 504.2 adjusts the complete medium to pH 7.2-7.4 if necessary.
