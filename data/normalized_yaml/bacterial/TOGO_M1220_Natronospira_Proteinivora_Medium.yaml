preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare Basic mineral salt medium 1, bring it to 1.0 L, adjust pH to
    6.8-6.9 with 1 M K2HPO4, autoclave, cool, then add autoclaved MgCl2 and JCM 1079
    Trace element solutions.
- step_number: 2
  action: MIX
  description: Prepare Basal medium 2, bring it to 1.0 L, confirm pH 9.9-10.0, autoclave,
    let stand for 3 days, decant the clear solution, then add autoclaved NH4Cl, MgCl2,
    and JCM 1079 Trace element solutions.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the 10% Tryptone and 1.0% Yeast extract solutions.
- step_number: 4
  action: MIX
  description: Aseptically combine 500 ml Basic mineral salt medium 1, 500 ml Basal
    medium 2, 15 ml 10% Tryptone solution, and 2 ml 1.0% Yeast extract solution.
