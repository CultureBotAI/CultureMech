preparation_notes: Mix NH4Cl with 1.0 L MJ(-N) synthetic seawater. Adjust to pH 5.5
  and autoclave. After cooling, aseptically add filter-sterilized 5.0 ml/L 8% NaHCO3
  solution, 15.0 ml/L 10% Na2S2O3 x 5 H2O solution, and 10.0 ml/L Trace vitamins.
  Distribute under an N2-CO2-O2 (76:19:5, v/v) gas mixture, seal with butyl rubber
  stoppers, and pressurize to 50 kPa with the same gas mixture.
