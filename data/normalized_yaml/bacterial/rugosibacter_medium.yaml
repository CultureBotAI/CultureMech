preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Adjust solutions A and B to pH 7.0±0.2, autoclave separately and combine
    after cooling.
- step_number: 2
  action: MIX
  description: Add 1.0 ml sterile vitamin B12 solution (50 mg/l) per litre.
- step_number: 3
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
applications:
- Microbial cultivation
