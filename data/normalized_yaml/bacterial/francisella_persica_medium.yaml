preparation_steps:
- step_number: 1
  action: MIX
  description: '2x concentrated stock:'
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 6.8 with NaOH.
- step_number: 3
  action: FILTER_STERILIZE
  description: Fill up to 346ml with demineralized water and filter sterilize through
    0.2µm filter
- step_number: 4
  action: HEAT
  description: Aliquot 17.3ml into 50ml tubes and store at -20°C.
- step_number: 5
  action: MIX
  description: 'When ready to use add:'
- step_number: 6
  action: FILTER_STERILIZE
  description: Filter sterilize each tube through 0.2µm filter.
