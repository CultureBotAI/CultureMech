preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Autoclave solutions A, B and C separately, combine, adjust pH to 8.2.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 9.0 with KOH.
- step_number: 3
  action: ADJUST_PH
  description: First dissolve EDTA in distilled water by adjusting the pH to 7.0 -
