    Trehalose overproduction is genetic biosynthesis, not evidence for trehalose supplementation.
    The abstract names M9-2% glucose but leaves percent basis, complete salts and
    stress-agent amounts/chemical forms unspecified. Separate elevated-temperature
    experiments from hexose, inorganic-salt, pyruvate, xylose and ethanol stress contexts;
    do not combine them into one variant or infer temperature optima. Local comparison:
    Seven native entries include 111 mM glucose. The reported 2% condition is not
    independently converted without its concentration basis; no salt amount, stressor
    addition or trehalose ingredient is inferred. Inventory covers inspected medium-relevant
    passages, not the whole paper or bibliography. Correction/retraction coverage
    is limited to inspected metadata; bounded taxonomy misses do not prove absence.
    Original ingredients, amounts, preparation, history and links are preserved, not
    newly certified. No new native growth assertion, resolved variant or concentration
    evidence.'
