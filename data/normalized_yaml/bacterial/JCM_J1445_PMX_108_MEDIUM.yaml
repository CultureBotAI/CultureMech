preparation_steps:
- step_number: 1
  action: MIX
  description: Mix NH4Cl, KH2PO4, MgCl2 x 6H2O, CaCl2 x 2H2O, sodium acetate trihydrate,
    yeast extract, Casamino acids, tryptone, Trace mineral solution, Se/W solution,
    Trace vitamins solution, resazurin, and distilled water.
- step_number: 2
  action: HEAT
  description: Bring the mixed base to a boil and cool it under N2-CO2 (4:1, v/v)
    gas.
- step_number: 3
  action: ALIQUOT
  description: Distribute the medium under the same gas mixture, for example 20 ml
    medium into 60 ml serum bottles, seal with butyl rubber stoppers, inject 10-20%
    gas-phase volume of H2, and autoclave.
- step_number: 4
  action: MIX
  description: After cooling, aseptically and anaerobically add 8% NaHCO3, 5% L-Cysteine
    HCl H2O, and 5% Na2S x 9H2O solutions at the JCM Medium 1445 per-liter ratios.
