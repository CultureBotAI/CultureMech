preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly, bring to a boil, and cool down under a N2-CO2
    (4:1, v/v) gas stream.
- step_number: 2
  action: MIX
  description: Distribute the medium into culture vessels under the same gas mixture
    (e. g., 20 ml medium in 60 ml serum bottles), seal with butyl rubber stoppers
    and inject 10-20% gas-phase volume of H2, and autoclave.
