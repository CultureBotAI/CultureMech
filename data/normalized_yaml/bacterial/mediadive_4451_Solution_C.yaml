preparation_notes: "Prepare all solutions and autoclave under a N2 atmosphere. After\
  \ cooling, combine the solutions and replace the gas phase with a N2-CO2 (4:1, v/v)\
  \ gas mixture. Then, add the following autoclaved or *filter-sterilized solutions\
  \ to the medium: \nCheck the final pH to be around 7.3.\nDistribute appropriate\
  \ amount of the medium into culture vessels under the same gas mixture (e.g., 40.0\
  \ ml in 120 ml serum bottle) and seal with Viton rubber stoppers. Finally add per\
  \ liter the following solution from an anaerobic stock (autoclaved): \n\nOriginal\
  \ volume: 111 mL"
