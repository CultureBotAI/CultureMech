preparation_steps:
- step_number: 1
  action: MIX
  description: Mix ingredients except Na2S·9H2O, adjust pH to 7.0 with NaOH and autoclaved
    under a N2 atmosphere. Separately autoclave and neutralize Na2S·9H2O as 5% solution
    under a N2 atmosphere. Anaerobically add  Na2S·9H2O solution.
- step_number: 2
  action: MIX
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals. Final pH 7.0 (with KOH).
- step_number: 3
  action: MIX
  description: '**The sulfide is prepared in a vessel sealed with a butyl rubber stopper.
    Autoclave under a N2 atmosphere. After cooling, the pH is adjusted to about 7.3
    by adding of sterile 4-0.2 N H2SO4 drop-wise with a syringe without opening the
    bottle. Appearance of yellow color indicate the pH is about 8. The vessel should
    be shaken continuously to avoid precipitation of elemental sulfur. The final solution
    should be transparent yellow.'
