preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Boil medium under CO2 until the resazurin indicator changes from pink
    to colourless. Cool down under CO2 and adjust pH to 7.6. Switch to N2 to prevent
    further lowering of the pH. Fill up into Hungate tubes under N2 and autoclave.
applications:
- Microbial cultivation
