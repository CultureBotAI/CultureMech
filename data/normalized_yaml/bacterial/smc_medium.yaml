preparation_steps:
- step_number: 1
  action: MIX
  description: Mix PPLO Broth w/o CV, Tryptone, Sorbitol, and Distilled water as the
    basal medium.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the basal medium to pH 7.5.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the basal medium at 121 C for 15 minutes.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter-sterilize the serum, yeast extract, sugar, arginine HCl, and
    phenol red additions.
- step_number: 5
  action: MIX
  description: Aseptically add the filtered stocks to the sterile basal medium.
sterilization:
  method: AUTOCLAVE
