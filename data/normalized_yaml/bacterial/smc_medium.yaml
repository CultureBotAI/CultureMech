notes: TOGO M2181 cites ATCC Medium 668 SMC medium. ATCC Medium 668 lists a basal
  recipe with 21.0 g PPLO Broth w/o CV from BD 255420, 10.0 g Tryptone from BD 211705,
  70.0 g Sorbitol, and 650.0 ml Distilled water; the pH is adjusted to 7.5 and the
  base is autoclaved at 121 C for 15 minutes. The source then filter-sterilizes and
  aseptically adds 200.0 ml Horse serum, 100.0 ml Yeast Extract Solution from GIBCO
  360-8180, 2.0 ml 50% Fructose solution, 20.0 ml 50% Sucrose solution, 2.0 ml 50%
  Glucose solution, 10.0 ml 42% L-Arginine HCl, and 20.0 ml 0.1% Phenol red solution.
