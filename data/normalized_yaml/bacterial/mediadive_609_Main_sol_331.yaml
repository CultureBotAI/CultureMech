preparation_notes: 'Adjust pH to 7.2 - 7.4 with NaOH.

  Prepare the medium anaerobically under 100% nitrogen. Prepare concentrated solutions
  each of yeast extract, glycine, phosphates, NaHCO3 and Na2S separately and sterilize
  under nitrogen by autoclaving.'
