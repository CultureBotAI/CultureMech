preparation_notes: Prepare the liquid medium. Final pH 5.8-6.2. Dispense the medium
  into serum bottles with a medium to headspace ratio of about 1:4. Add 20% methane
  to the gas phase. Sterilize by autoclaving. Incubate the cultures with shaking.
