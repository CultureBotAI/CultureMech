preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the BME/CTVM2 cell-culture medium from 70 ml L-15 (Leibovitz)
    medium, 10 ml tryptose phosphate broth, 20 ml foetal calf serum, and 1 ml 200
    mM L-glutamine.
- step_number: 2
  action: MIX
  description: Use the medium for BME/CTVM2 cells incubated in ordinary air in sealed
    flasks or flat-sided tubes in dry incubators.
- step_number: 3
  action: MIX
  description: For Occidentia massiliensis infection, add 3 ml fresh medium and 1
    ml thawed Occidentia strain to a 25 cm2 flask with 5 ml residual medium, then
    incubate at 28 C with the lid closed and without CO2.
