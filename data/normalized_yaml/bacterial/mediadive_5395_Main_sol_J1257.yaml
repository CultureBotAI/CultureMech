preparation_notes: "Mix components thoroughly, bring to a boil and cool down under\
  \ a N2-CO2 (4:1, v/v) gas mixture. Distribute the medium into culture vessels (e.g.,\
  \ 10 ml in Balch tubes) under the same gas mixture, seal with butyl rubber stoppers\
  \ and autoclave. After cooling, aseptically and anaerobically add per liter the\
  \ following solutions (autoclaved or *filter-sterilized and stored under a N2 gas\
  \ atmosphere; **filter-sterilized and stored under an 80% N2-20% CO2 gas mixture):\
  \ \n\nOriginal volume: 1061 mL"
