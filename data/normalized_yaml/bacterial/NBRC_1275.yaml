notes: Mix ingredients except for vitamin solution, sulfur, and Na2S·9H2O. Dispense
  the medium into suitable culture vessels under a stream of N2/CO2 (80/20), seal
  with butyl rubber stoppers, and autoclave at 121°C for 15 min. Separately neutralize
  and autoclave Na2S·9H2O (5% solution) under N2 atmosphere. Sterilize vitamin solution
  by filtration. Sulfur is sterilized separately by autoclaving for 60 min at 105°C
  on each of 3 successive days. Prior to inoculation, aseptically and anaerobically
  add vitamin, sulfur, and Na2S·9H2O. Final pH is 6.8. First dissolve nitrilotriacetic
  acid and adjust pH to 6.5 with NaOH, and then add minerals. Final pH is 7.0.
