preparation_steps:
- step_number: 1
  action: MIX
  description: Mix ingredients except for vitamin solution, sulfur, and Na2S·9H2O.
- step_number: 2
  action: ALIQUOT
  description: Dispense the medium into culture vessels under a stream of N2/CO2 (80/20)
    and seal with butyl rubber stoppers.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 minutes.
- step_number: 4
  action: AUTOCLAVE
  description: Separately neutralize and autoclave Na2S·9H2O as a 5% solution under
    N2.
- step_number: 5
  action: FILTER_STERILIZE
  description: Filter-sterilize the vitamin solution.
- step_number: 6
  action: AUTOCLAVE
  description: Sterilize sulfur by autoclaving for 60 minutes at 105 C on each of
    3 successive days.
- step_number: 7
  action: MIX
  description: Before inoculation, aseptically and anaerobically add vitamin solution,
    sulfur, and Na2S·9H2O.
