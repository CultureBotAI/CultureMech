preparation_steps:
- step_number: 1
  action: MIX
  description: pH 6.5
- step_number: 2
  action: MIX
  description: Prepare salts (in 850 ml distilled water, do not adjust the pH), glucose
    (50 ml of a 10% solution), and PIPES (100 ml of 400 mM solution, 12.096 g/100
    ml), separately under nitrogen using normal anaerobic techniques. Add glucose
    and PIPES using anaerobic techniques.
applications:
- Microbial cultivation
