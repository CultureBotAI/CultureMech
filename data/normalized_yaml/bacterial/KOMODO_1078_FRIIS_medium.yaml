variants:
- name: friis_medium_mycoplasma_hyopneumoniae_isolate_growth
  description: Modified Friis medium condition supporting growth of seven Mycoplasma
    hyopneumoniae isolates measured by ATP luminometry.
  modifications:
  - Use modified Friis medium as described by Friis 1975.
  - Incubate slowly shaken Mycoplasma hyopneumoniae cultures; source reports isolate-dependent
    behavior across five Friis medium batches.
  purpose: Capture isolate-level Mycoplasma hyopneumoniae growth evidence under the
    parent Friis medium record.
  evidence:
  - reference: PMID:20851152
    supports: SUPPORT
    snippet: Doubling times (Tds) of the isolates grown in slowly shaken cultures
      varied between 4.8 and 7.8 h.
    explanation: The source directly measured growth kinetics for seven named Mycoplasma
      hyopneumoniae isolates in modified Friis medium, supporting this condition as
      a variant of the Friis parent medium.
