    cysteine and sulfide. Sparge medium with 100% N2 gas for 30 - 45 min to make it
    anoxic. Add and dissolve bicarbonate, adjust pH to 6.8 and dispense medium under
    100% N2 gas atmosphere into anoxic Hungate-type tubes or serum vials and autoclave.
    Add cysteine and sulfide from sterile anoxic stock solutions prepared under 100%
    N2 gas. Prior to use check pH of complete medium and adjust to 6.8 - 7.0, if necessary."},
    {"step_number": 2, "action": "DISSOLVE", "description": "First dissolve FeCl2
    in the HCl, then dilute in water, add and dissolve the other salts. Finally make
    up to 1000.00 ml."}, {"step_number": 3, "action": "AUTOCLAVE", "description":
