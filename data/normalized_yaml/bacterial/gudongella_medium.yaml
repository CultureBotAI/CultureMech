  evidence:
  - reference: https://mediadive.dsmz.de/rest/medium/119
    supports: SUPPORT
    snippet: '"Dissolve ingredients except bicarbonate, cysteine and sulfide. Sparge
      medium with 80% H2 and 20% CO2 gas mixture for 30 - 45 min to make it anoxic.
      Add and dissolve bicarbonate, adjust pH to 6.5 and dispense medium under 80%
      H2 and 20% CO2 gas atmosphere into anoxic Hungate-type tubes or serum vials
      to 30% of their volume and autoclave. Add cysteine and sulfide from sterile
      anoxic stock solutions prepared under 100% N2 gas. Prior to use check pH of
      complete medium and adjust to 6.8 - 7.0, if necessary."'
