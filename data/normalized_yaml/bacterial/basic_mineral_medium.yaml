preparation_steps:
- step_number: 1
  action: MIX
  description: pH 7.0-7.2
- step_number: 2
  action: MIX
  description: 'After sterilization add from sterile stock solutions:'
- step_number: 3
  action: DISSOLVE
  description: "might result in colloid formation, especially when added into\r\n\
    hot medium, but dissolves after vigorous shaking"
- step_number: 4
  action: ADJUST_PH
  description: Adjust pH to 3.0-4.0 with HCl.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
- step_number: 6
  action: AUTOCLAVE
  description: 'Note: autoclave in closed bottles'
- step_number: 7
  action: HEAT
  description: Sterilize at 121°C for 20 minutes in 1L Schott bottle
- step_number: 8
  action: MIX
  description: Sterilize by filtration.
- step_number: 9
  action: MIX
  description: Mix the four solutions in the ratio 1:1:1:1.
applications:
- Microbial cultivation
