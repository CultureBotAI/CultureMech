preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust the basal medium to pH 6.6 before autoclaving.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the basal medium, including the hemin input; the source gives
    no fixed cycle temperature or duration.
- step_number: 3
  action: COOL
  description: Cool to 50 C, then add the separately filter-sterilized albumin, glucose
    and cysteine stocks.
variants:
- name: Liquid SC medium
  relationship: PHYSICAL_STATE_VARIANT
  description: DSMZ 751 liquid formulation with altered phosphate batch inputs; not
    a sequential change to the agar base recipe.
  modifications:
  - Omit corn meal agar.
  - Use KH2PO4 1.5 g per batch instead of 1 g.
  - Use K2HPO4 0.5 g per batch instead of 1 g.
  purpose: Liquid medium
  evidence:
  - reference: https://www.dsmz.de/microorganisms/medium/pdf/DSMZ_Medium751.pdf
    supports: SUPPORT
    snippet: |-
      For liquid medium, omit corn meal agar and change the phosphate concentration to
      KH2PO4, 1.5 g and K2HPO4, 0.5 g.
    explanation: 'variants[0].modifications: All three modifications belong together.
