  action: MIX
  description: Mix 0.5 g NH4Cl and 30 g Sea salts (Sigma) in 1 L deionized water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base medium and cool it.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave 50xPYE before use.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter-sterilize the 0.2 mg/ml riboflavin solution.
- step_number: 5
  action: MIX
  description: Aseptically add 20 ml 50xPYE, 2 ml sterile 50% glucose, and 5 ml filter-sterilized
