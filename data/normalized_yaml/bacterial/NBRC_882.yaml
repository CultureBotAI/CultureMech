preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Prepare the basal GYP medium with Tween 80 solution and Salts solution,
    then adjust the medium to pH 6.0.
- step_number: 2
  action: MIX
  description: For the solid medium, add 5 g/L CaCO3 and 15 g/L agar after the pH
    is adjusted.
- step_number: 3
  action: MIX
  description: Prepare the Salts solution with MgSO4·7H2O, MnSO4·4H2O, FeSO4·7H2O,
    NaCl, and distilled water, then add one drop of 12 N HCl to each 500 ml of the
    salts stock.
