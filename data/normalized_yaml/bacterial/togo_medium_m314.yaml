media_term:
  preferred_term: TOGO Medium M314
  term:
    id: TOGO:M314
    label: TOGO Medium M314
notes: TOGO M314 preserves JCM Medium 319. It combines 5 mL Basal salts solution,
  10 mL Phosphate solution, and 1 mL Vitamin solution from Medium M298 with ammonium
  sulfate, sodium succinate, BD-Difco yeast extract, sodium thiosulfate pentahydrate,
  BD-Difco Casamino acids, and distilled water to 1 L. TOGO reports pH 7.2; the current
  JCM Medium 319 URL no longer returns the legacy formulation.
