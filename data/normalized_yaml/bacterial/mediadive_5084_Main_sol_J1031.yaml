preparation_notes: "Mix components, bring to a boil and cool down under a N2 (100%)\
  \ gas stream. While gassing, add the following components to the medium: \nBubble\
  \ N2 for 3 - 4 min and check pH to be 7.6 - 8.0. Readjust pH to the range if necessary.\
  \ Autoclave under a N2 gas atmosphere. Aseptically and anaerobically add the following\
  \ solution to the medium (separately autoclaved under N2): \n\nOriginal volume:\
  \ 1060 mL"
