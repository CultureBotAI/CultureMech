preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Sparge Solution A with 80% N2/20% CO2 to pH below 6 for at least 30
    min, distribute it under the same gas in anoxic Hungate tubes or serum vials,
    and autoclave.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave Solutions C and E separately under 100% N2. Autoclave Solution
    B under 80% N2/20% CO2.
- step_number: 3
  action: FILTER_STERILIZE
  description: Prepare Solution D under 100% N2 and filter-sterilize it; add Solutions
    B to E to sterile Solution A in the listed sequence.
- step_number: 4
  action: ADJUST_PH
  description: Adjust the final medium to pH 7.1-7.4.
- step_number: 5
  action: DISSOLVE
  description: For trace element solution SL-10, first dissolve FeCl2 in HCl, dilute
    in water, add and dissolve the other salts, and bring the solution to 1000 ml.
