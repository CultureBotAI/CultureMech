media_term:
  preferred_term: TOGO Medium M984
  term:
    id: TOGO:M984
    label: IRD Marine Clostridia Medium-2
notes: TOGO M984 imports JCM Medium 938 IRD Marine Clostridia Medium-2, which uses
  JCM Medium 909 IRD Marine Clostrida Medium supplemented with 0.164 g/L sodium acetate
  and 2.0 g/L Trypticase peptone (BD-BBL). Expanded the JCM 909 base and its JCM Medium
  151 trace-minerals stock.
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare JCM Medium 151 Trace minerals by dissolving nitrilotriacetic
    acid, adjusting pH to 6.5 with KOH solution, adding minerals, and adjusting the
    final stock to pH 7.0.
- step_number: 2
  action: AUTOCLAVE
  description: Mix JCM 909 base components and autoclave under an N2-CO2 (4:1, v/v)
    gas mixture.
- step_number: 3
  action: FILTER_STERILIZE
  description: Filter-sterilize the 8% NaHCO3 stock before use.
- step_number: 4
  action: MIX
  description: After cooling, add anaerobic 8% NaHCO3, 10% MgCl2 x 6 H2O, and 1 M
    glucose stocks.
- step_number: 5
  action: MIX
  description: Aseptically distribute the medium under an N2-CO2 (4:1, v/v) stream;
    before inoculation add anaerobic 5% Na2S x 9 H2O stock autoclaved under N2.
applications:
- Microbial cultivation
