preparation_steps:
- step_number: 1
  action: POUR_PLATES
  description: 'Dispense 5 ml aliquots into Hungate tubes. After autoclaving add the
    following components per liter:'
- step_number: 2
  action: MIX
  description: Adjust to pH 6.8.
- step_number: 3
  action: MIX
  description: Incubate in sealed containers. The strain held in the DSMZ has been
    cultivated on methanol, but the original publication indicates that the strain
    will also grow on methane.
- step_number: 4
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
