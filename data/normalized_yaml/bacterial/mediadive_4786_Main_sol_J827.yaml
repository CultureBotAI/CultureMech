preparation_notes: "Mix components thoroughly, bring to a boil and cool down under\
  \ a N2 atmosphere. Add the following solutions from anaerobic stocks, then dispense\
  \ the medium into culture vessels leaving 40 to 50% volume of a gas phase (e.g.,\
  \ 30 ml of the medium in a 50 ml serum bottle) and autoclave under a N2 atmosphere:\
  \ \nAfter cooling, replace the gas phase with a N2-CO2-H2 (8:1:1, v/v) gas mixture.\
  \ Add per liter the following filter-sterilized solutions from anaerobic stocks:\
  \ \nCheck final pH to be about 7.2.\nTo complete the medium, add per liter the following\
  \ filter-sterilized chlorosolvent: \n\nOriginal volume: 1057 mL"
