preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.5. Prepare the medium anaerobically under 100% N2.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave solutions of haemin (dissolved in 0.1 ml 1N NaOH, then diluted
    with water to 10 ml and neutralized), formate, and fumarate separately under nitrogen.
