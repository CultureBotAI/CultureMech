notes: |-
  KOMODO Medium 2027 is the Growth-stimulating factors stock from DSMZ Medium 829. DSMZ Medium 829 defines the stock with 5.00 g each of Isobutyric acid, Valeric acid, 2-Methylbutyric acid, and 3-Methylbutyric acid, 2.00 g Caproic acid, 6.00 g Succinic acid, and 1000.00 ml Distilled water, adjusted to pH 9.0 with NaOH and autoclaved under 100% N2 gas. MediaDive imports the same stock as mediadive.solution:1680.

  The six acid rates are provider-reported by KOMODO2027, not explicit g/L statements in original DSMZ829. The original growth-factor table gives batch masses and 1000 ml water without an explicit final stock volume. Keep the original preparation separate from a claim that its physical denominator was verified.

  Original stock preparation: six separately listed acid masses plus 1000 ml water, adjusted to pH 9.0 with unquantified NaOH and autoclaved under 100% N2. The exact KOMODO table leaves water and NaOH rates null; neither is replaced by a typical rate.

  Full exact-source recipe and stock/preparation tables were inspected. Reconstructed nodes retain explicit source scope; complete prior ingredient/stock assertions, including copied LB mappings and stage conflations, are archived in append-only history. A title alone is not the basis for removal. Unchanged annotations are preserved, not recertified; no new organism-growth association is added.
