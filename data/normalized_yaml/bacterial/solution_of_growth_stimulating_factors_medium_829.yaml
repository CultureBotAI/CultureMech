preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve the organic acids in distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the growth-stimulating factors stock to pH 9.0 with NaOH.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the pH-adjusted stock under 100% N2 gas.
