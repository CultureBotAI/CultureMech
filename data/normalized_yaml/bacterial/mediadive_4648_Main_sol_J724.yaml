preparation_notes: "Mix components except sulfur, adjust pH to 6.0 and autoclave under\
  \ a N2 atmosphere. After cooling, add per liter the following solutions (autoclaved\
  \ and stored anaerobically): \nSteam sulfur for 3 hr on each of 3 successive days.\
  \ Distribute the medium into culture vessels containing sulfur under a N2 atmosphere,\
  \ and seal with butyl rubber stoppers. Then, add the following solution (autoclaved\
  \ and stored under a N2 atmosphere) to the medium: \n\nOriginal volume: 1019 mL"
