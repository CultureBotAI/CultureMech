preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.3.
- step_number: 2
  action: MIX
  description: Prepare the medium anaerobically under 100% nitrogen. Sterilize thioglycolate
    and sulfur separately. Sterilize the sulfur by steaming for 3 h on each of three
    successive days.
