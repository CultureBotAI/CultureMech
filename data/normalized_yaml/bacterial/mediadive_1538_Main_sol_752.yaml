preparation_notes: Liquid medium may be prepared by adding all components together.
  Agar (2%) medium should be prepared without Na2CO3 and sterilised by autoclaving.
  Add 20-30 ml of a sterile 10% Na2CO3 solution to the autoclaved medium containing
  agar so that the final pH is 9.0.
