notes: TOGO M1587 imports NBRC Medium 395 as JXT Medium. NBRC 395 lists 1 g Bacto
  Yeast Extract from Difco, 1 g Trypticase Peptone from BBL, 1 g Na2S2O3·5H2O, and
  1 L sea water at pH 7.0-7.2. The source says to use filtered natural seawater or
  artificial seawater such as Aquamarine from Yashima, and to filter-sterilize thiosulfate
  separately before aseptic addition.
