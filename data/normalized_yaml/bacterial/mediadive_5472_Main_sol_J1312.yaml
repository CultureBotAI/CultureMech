preparation_notes: "Mix ingredients, bring to a boil and cool down under a N2-CO2\
  \ (4:1, v/v) gas stream and autoclave under the same gas mixture. After cooling,\
  \ aseptically and anaerobically add per liter the following solutions (filter-sterilized):\
  \ \nPrior to inoculation, aseptically and anaerobically add 0.01 volume of L-cysteine\
  \ x HCl x H2O to the medium (3% solution, autoclaved and stored under a N2 atmosphere).\n\
  \nOriginal volume: 112 mL"
