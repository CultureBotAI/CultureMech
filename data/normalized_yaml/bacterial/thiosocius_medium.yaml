preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except HEPES buffer, magnesium chloride, bicarbonate,
    thiosulfate and vitamins), dispense medium in test tubes or Erlenmeyrer flasks
    to 20% of volume, close with screw caps and autoclave. Add HEPES buffer, magnesium
    chloride, bicarbonate, thiosulfate and vitamins to the autoclaved medium from
    sterile stock solutions sterilized by filtration. Adjust pH of complete medium
    to 8.0.
- step_number: 2
  action: MIX
  description: pH 3.0-4.0
applications:
- Microbial cultivation
