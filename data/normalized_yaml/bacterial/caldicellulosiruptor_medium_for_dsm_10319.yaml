    snippet: Subcultured into modified DSMZ 640 and included among seven species grown
      on selected substrates.
- preferred_term: Caldicellulosiruptor lactoaceticus
  strain: DSM 9545
  evidence:
  - reference: doi:10.1128/AEM.01400-10
    supports: SUPPORT
    explanation: 'Blumer-Schuette et al. 2010; modified DSMZ 640 variant; 70C, N2
      headspace. Note: no growth on glucose.'
    snippet: Subcultured into modified DSMZ 640; explicitly reported as showing no
      growth on glucose in this comparison.
- preferred_term: Caldicellulosiruptor owensensis
  strain: DSM 13100
  evidence:
  - reference: doi:10.1128/AEM.01400-10
    supports: SUPPORT
    explanation: Blumer-Schuette et al. 2010; modified DSMZ 640 variant; 70C, N2 headspace.
    snippet: Subcultured into modified DSMZ 640 and included among seven species grown
      on selected substrates.
- preferred_term: Caldicellulosiruptor acetigenus
  strain: DSM 7040
  evidence:
  - reference: doi:10.1128/AEM.01400-10
    supports: SUPPORT
    explanation: Blumer-Schuette et al. 2010; modified DSMZ 640 variant; substrate-specific
      growth not shown for this strain.
    snippet: Listed in Table 1 as available from DSMZ and stated in methods as among
      Caldicellulosiruptor species subcultured into modified DSMZ 640.
- preferred_term: Thermoanaerobacterium calidifontis
  strain: Rx1
  evidence:
  - reference: doi:10.1007/s00203-013-0895-5
    supports: SUPPORT
    explanation: 'Shang et al. 2013; strain Rx1 grown on the modified DSMZ 640 variant
      (see variant modified_dsmz_640_shang_2013); full recipe printed; 55C, 100% N2.
      | Identifiers: JCM 18270; CCTCC M 2011109; 16S rRNA AB544080'
    snippet: All culturing of Rx1 was performed in modified DSMZ medium 640, containing
      (per liter) 0.9 g NH4Cl, 0.9 g NaCl, 0.4 g MgCl2.6H2O, 0.75 g KH2PO4, 1.5 g
      K2HPO4, 2.5 mg FeCl3.6H2O, 0.75 g cysteine-HCl.H2O, 2 g tryptone, 1 g yeast
      extract, 1 ml SL-10, 0.5 mg resazurin, 5 ml vitamin solution, 10.0 g substrate;
      pH 7.0; prepared under 100% N2.
variants:
- name: modified_dsmz_640_blumer_schuette_2010
  relationship: DERIVED_FROM
  description: Modified DSMZ medium 640 used for comparative Caldicellulosiruptor
    physiology (Blumer-Schuette et al. 2010).
  modifications:
  - Trypticase, cysteine-HCl, and resazurin omitted relative to standard DSMZ 640.
  - Carbon source increased to 5 g/L; Na2S.9H2O added to 0.5% final.
  - Anaerobic batch cultivation under N2; 70C with orbital shaking; 50 ml in 125 ml
    serum bottle; 24 h.
  purpose: Reusable variant for the 8 Caldicellulosiruptor DSM strains grown in modified
    DSMZ 640 in this study.
  evidence:
  - reference: doi:10.1128/AEM.01400-10
    supports: SUPPORT
    explanation: Blumer-Schuette et al. 2010 methods describe the modified DSMZ 640
      formulation and cultivation.
    snippet: subcultured ... into modified DSMZ medium 640 ... grown at 70C with orbital
      shaking under N2 headspace.
- name: modified_dsmz_640_shang_2013
  relationship: DERIVED_FROM
  description: Modified DSMZ medium 640 for Thermoanaerobacterium calidifontis Rx1
    (Shang et al. 2013); ferric iron, added SL-10/vitamins/resazurin, variable substrate.
  modifications:
  - 'Iron source substituted: FeCl3.6H2O 2.5 mg/L (vs ferrous iron in parent).'
  - Added trace element solution SL-10 (1 ml/L, DSMZ medium 320) and vitamin solution
    (5 ml/L, DSMZ medium 141, filter-sterilized).
  - Added resazurin 0.5 mg/L.
  - Fixed glucose replaced by variable substrate at 10.0 g/L (e.g. oat spelt xylan,
    xylose, glucose).
  - 'Per liter: 0.9 g NH4Cl, 0.9 g NaCl, 0.4 g MgCl2.6H2O, 0.75 g KH2PO4, 1.5 g K2HPO4,
    0.75 g cysteine-HCl.H2O, 2 g tryptone, 1 g yeast extract; pH 7.0; prepared under
    100% N2; dispensed 5 ml into 15 ml Hungate tubes; autoclaved.'
  purpose: Capture the explicit modified DSMZ 640 recipe used to isolate and characterize
    T. calidifontis Rx1.
  evidence:
  - reference: doi:10.1007/s00203-013-0895-5
    supports: SUPPORT
    explanation: Shang et al. 2013 prints the full modified DSMZ 640 recipe with explicit
      deviations from the parent.
    snippet: All culturing of Rx1 was performed in modified DSMZ medium 640, containing
      (per liter distilled water) 0.9 g NH4Cl, 0.9 g NaCl, 0.4 g MgCl2 x 6 H2O, 0.75
      g KH2PO4, 1.5 g K2HPO4, 2.5 mg FeCl3 x 6 H2O, 0.75 g cysteine-HCl x H2O, 2 g
      tryptone, 1 g yeast extract, 1 ml trace element solution SL-10, 0.5 mg resazurin,
      5 ml vitamin solution, 10.0 g substrate.
