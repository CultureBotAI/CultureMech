preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the base components with Salt solution, bring to a boil, and cool
    down under an N2 stream.
- step_number: 2
  action: ADJUST_PH
  description: While gassing, add 5% L-Cysteine HCl H2O solution and adjust to pH
    7.0.
- step_number: 3
  action: ALIQUOT
  description: Distribute the medium into culture vessels under N2 and seal with butyl
    rubber stoppers.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 degrees C for 15 min.
- step_number: 5
  action: COOL
  description: Cool after autoclaving.
- step_number: 6
  action: MIX
  description: Add autoclaved and N2-stored glucose and Na2S2O3 stock solutions aseptically.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Autoclave the medium under N2. Autoclave the glucose and Na2S2O3 stocks separately
    and store them under N2.
