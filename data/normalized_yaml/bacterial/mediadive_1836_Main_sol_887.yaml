  Fill 10 ml medium into 100 ml Serum bottles under a stream of H2/CO2 gas and seal
  with a rubber stopper.

  Autoclave at 121 °C for 20 min.

  After autoclaving add the following (e.g., from sterile stock solutions)

  Adjust the gas atmosphere strain specifically.'
