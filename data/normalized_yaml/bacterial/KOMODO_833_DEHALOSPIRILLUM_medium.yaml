preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare source Solution A from the direct components plus SL-10, selenite-tungstate,
    and 0.1% resazurin stocks at the printed amounts.
- step_number: 2
  action: AUTOCLAVE
  description: Sparge Solution A with 100% N2 for 30-45 minutes, dispense under N2,
    and autoclave. Autoclave Solutions B and H separately under 100% N2. Autoclave
    Solution D under 80% N2 and 20% CO2.
- step_number: 3
  action: FILTER_STERILIZE
  description: Prepare Solutions C, E, F, and G under 100% N2 and sterilize them by
    filtration.
- step_number: 4
  action: MIX
  description: Add Solutions B-H to sterile Solution A in the printed sequence. The
    source batch final volume is 1003 ml.
- step_number: 5
  action: ADJUST_PH
  description: Adjust the complete medium to pH 7.3-7.6 if necessary.
- step_number: 6
  action: FILTER_STERILIZE
  description: Before inoculation, ensure resazurin is colorless. If needed, add 10-20
    mg/L sodium dithionite from freshly prepared, anoxic, filter-sterilized 5% solution.
- step_number: 7
  action: DISSOLVE
  description: For SL-10, first dissolve FeCl2 in 25% HCl, dilute in water, add the
    other salts, and make to 1 litre.
