preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the high-salt LB base from 10 g/L Bacto Tryptone (Difco), 5
    g/L yeast extract, 10 g/L NaCl, 1000 ml/L distilled water, and 15 g/L agar if
    needed.
- step_number: 2
  action: FILTER_STERILIZE
  description: Sterilize the 50 mg/ml ampicillin and 50 mg/ml kanamycin stocks separately
    by filtration.
- step_number: 3
  action: MIX
  description: Add 1.0 ml/L each filter-sterilized Ampicillin solution (50 mg/ml)
    and Kanamycin solution (50 mg/ml) to the high-salt LB base.
