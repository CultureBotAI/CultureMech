notes: pH 6.6 - 7.4 Mix ingredients except for vitamin B12, NaHCO3 and Na2S·9H2O,
  and autoclave under a N2 atmosphere. Separately autoclave Na2S·9H2O solution under
  a N2 atmosphere. Sterilize vitamin B12 and NaHCO3 solutions by filtration. Prior
  to inoculation, aseptically and anaerobically add them. Soluble in hot water. Initially,
  dissolve FeCl2·4H2O in 25% HCl, then add distilled water followed by the other components.
