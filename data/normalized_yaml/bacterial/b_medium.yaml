notes: JCM Medium 458 B Medium lists, per liter, 500 ml distilled water, 500 ml seawater,
  1 g glucose, 0.2 g KH2PO4, 0.05 g MgSO4 x 7H2O, 15 g Bacto agar from BD-Difco, and
  2 g each of Bacto peptone, Casamino acids, and yeast extract from BD-Difco. Adjust
  pH to 7.5-7.8. The current JCM GRMD=458 page no longer exposes the recipe, but both
  TOGO M458 and MediaDive J458 preserve the JCM formulation.
