preparation_steps:
- step_number: 1
  action: MIX
  description: Final pH 9.0
- step_number: 2
  action: AUTOCLAVE
  description: Add all the components together, except Na2CO3 which is added from
    a sterilized stock solution when the autoclaved medium has cooled. Agar is added
    at a concentration of 20 g/l for solid media and should be cooled to about 55°C
    before the Na2CO3.is added.
