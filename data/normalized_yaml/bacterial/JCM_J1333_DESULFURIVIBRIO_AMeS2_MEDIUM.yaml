preparation_steps:
- step_number: 1
  action: MIX
  description: Add Na2CO3, NaHCO3, NaCl, and K2HPO4 to distilled water and bring the
    base volume to 1.0 L.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base in closed bottles.
- step_number: 3
  action: MIX
  description: After cooling, aseptically add MgCl2, NH4Cl, Trace element, Se/W, and
    Trace vitamins stocks at the JCM Medium 1333 per-liter ratios.
- step_number: 4
  action: HEAT
  description: Steam sulfur for 3 hr on each of 3 successive days.
- step_number: 5
  action: MIX
  description: Aseptically and anaerobically distribute the medium and sterilized
    sulfur into culture vessels under an N2 gas stream and seal with butyl rubber
    stoppers.
- step_number: 6
  action: MIX
  description: If the inoculum does not contain sulfide or polysulfide, add 5.0 ml/L
    autoclaved 5% Na2S x 9H2O solution stored under N2.
