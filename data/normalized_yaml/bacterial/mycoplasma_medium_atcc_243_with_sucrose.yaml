preparation_steps:
- step_number: 1
  action: MIX
  description: Combine Heart Infusion Broth, Agar Noble, and 450.0 ml/L distilled
    deionized water.
- step_number: 2
  action: HEAT
  description: Boil to dissolve the Agar Noble.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the basal agar at 121 C for 15 minutes.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter-sterilize Sucrose dissolved in 200.0 ml/L water.
- step_number: 5
  action: HEAT
  description: Heat-inactivate Horse serum at 56 C for 30 minutes.
- step_number: 6
  action: MIX
  description: Cool the basal agar to 50-55 C, warm the serum, yeast extract, and
    sucrose solutions to 50-55 C, and aseptically combine.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Autoclave the basal agar only; add sterile sucrose, commercial 15% yeast
    extract solution, and heat-inactivated horse serum aseptically after cooling.
