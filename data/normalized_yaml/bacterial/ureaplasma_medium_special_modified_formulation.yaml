preparation_steps:
- step_number: 1
  action: MIX
  description: Mix PPLO Broth w/o Crystal Violet, pancreatic digests of casein and
    gelatin, optional agar, and DI Water as the basal medium.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the basal medium to pH 7.4 +/- 0.2.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the basal medium at 121 C and, if agar is used, cool it to
    50-55 C in a water bath.
- step_number: 4
  action: FILTER_STERILIZE
  description: Combine the additive solution and filter-sterilize it through a 0.22
    micrometer filter.
- step_number: 5
  action: MIX
  description: Aseptically add the filter-sterilized additive solution to the basal
    medium.
- step_number: 6
  action: ADJUST_PH
  description: Confirm a final complete-medium pH of 6.0 +/- 0.2 at 25 C.
media_term:
  preferred_term: TOGO Medium M2179
  term:
    id: TOGO:M2179
    label: Ureaplasma Medium – Special Modified Formulation
notes: TOGO M2179 cites ATCC Medium 2616 Ureaplasma Medium - Special Modified Formulation.
  ATCC Medium 2616 lists a 500 ml basal recipe with PPLO Broth w/o Crystal Violet,
  pancreatic digests of casein and gelatin, optional agar, and DI Water, adjusts the
  basal pH to 7.4 +/- 0.2, and autoclaves it at 121 C. The source then prepares a
  500 ml additive solution from CMRL 1066, Yeast Extract Solution, 10% TC Yeastolate,
  heat-inactivated fetal bovine serum, 0.1% Phenol Red Solution, urea, and DI Water;
  filter-sterilizes the additive; combines it with the basal medium; and records a
  final pH of 6.0 +/- 0.2.
