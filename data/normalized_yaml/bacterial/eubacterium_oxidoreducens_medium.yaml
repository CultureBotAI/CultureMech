preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Prepare solution A under 80% N2 and 20% CO2 gas mixture, distribute
    8.9 ml per Hungate-type tube under same gas atmosphere and autoclave. Filter sterilize
    NaHCO3 solution and gas for 20 min with 80% N2 and 20% CO2 gas mixture. Autoclave
    cysteine and sulfide under 100% N2 gas. Complete medium by adding the solutions
    B, C, and D with a syringe to solution A. Adjust final pH of medium to 7.0 - 7.5.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 6.9 before autoclaving.
- step_number: 3
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
