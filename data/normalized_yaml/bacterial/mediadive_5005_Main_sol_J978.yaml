preparation_notes: "Mix components thoroughly and adjust pH to 7.25 with NaOH. Distribute\
  \ the medium into culture vessels (e.g., 5.0 ml in 25 ml serum bottles/Balch tubes)\
  \ under a stream of N2, seal with butyl rubber stoppers and autoclave. After cooling,\
  \ aseptically add per liter the following solutions (autoclaved or *filter-sterilized\
  \ and stored anaerobically): \nBefore inoculation, add filter-sterilized O2 gas\
  \ or air, at a final concentration of 2% O2 in the gas phase.\n\nOriginal volume:\
  \ 1035 mL"
