preparation_notes: 'Adjust pH to 6.8 with 0.5 M KH2PO4.

  Dispense into serum bottles (30 ml medium in 100 ml serum bottles, OR 15 ml in 50
  serum bottles).

  add 20% CO2 to gas phase (in serum bottles)

  Autoclave at 121 °C for 20 min.

  Before inoculation add from sterile stock solutions per liter:'
