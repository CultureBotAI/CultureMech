preparation_notes: 'Dissolve ingredients except vitamins, bicarbonate and malate.
  Adjust pH to 6.5, dispense medium in culture vessels and autoclave. Prior to inoculation
  add vitamins, bicarbonate and malate from stock solutions sterilized by filtration.
  Adjust pH of complete medium to 6.7 - 6.9.


  Original volume: 1003 mL'
