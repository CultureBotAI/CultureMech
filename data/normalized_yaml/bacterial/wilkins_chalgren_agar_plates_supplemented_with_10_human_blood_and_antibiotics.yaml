media_term:
  preferred_term: TOGO Medium M2852
  term:
    id: TOGO:M2852
    label: Wilkins-Chalgren agar plates (supplemented with 10% human blood and antibiotics)
notes: 'TOGO M2852 captures the Helicobacter pylori B38/J99 growth condition from
  Bernarde et al. 2010: commercial Oxoid Wilkins-Chalgren agar plates supplemented
  with 10% human blood, 1 mg/ml vancomycin, 5 mg/ml cefsulodin, 5 mg/ml Fungizone,
  and 1 mg/ml trimethoprim, then incubated 48 h at 37 C under 5% O2, 10% CO2, and
  85% N2.'
