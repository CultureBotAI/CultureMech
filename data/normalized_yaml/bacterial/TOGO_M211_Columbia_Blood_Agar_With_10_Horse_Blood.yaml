ingredients:
- preferred_term: Columbia blood agar base (Oxoid CM331)
  concentration:
    value: '1000'
    unit: ML_PER_L
  source: JCM Medium 218
  notes: TOGO and JCM Medium 218 list one liter of Columbia blood agar base (Oxoid
    CM331) prepared according to the manufacturer's directions.
- preferred_term: Defibrinated horse blood
  concentration:
    value: '10'
    unit: PERCENT_V_V
  source: JCM Medium 218
  notes: JCM Medium 218 adds sterile defibrinated horse blood to 10% final concentration
    after sterilization and cooling.
  term:
    id: UBERON:0000178
    label: blood
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare 1 L Columbia blood agar base (Oxoid CM331) according to the
    manufacturer's directions.
- step_number: 2
  action: AUTOCLAVE
  description: Sterilize the base at 121 C for 15 min.
- step_number: 3
  action: COOL
  description: Cool the sterilized base to about 45 C.
- step_number: 4
  action: MIX
  description: Aseptically add 10% (final) sterile defibrinated horse blood.
- step_number: 5
  action: POUR_PLATES
  description: Mix and quickly dispense into sterile test tubes or petri dishes.
