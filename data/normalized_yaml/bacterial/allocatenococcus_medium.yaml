preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve sodium chloride, hydrogenphosphates, ammonium chloride and
    acetate, adjust pH of solution to 7.0 - 7.2 and autoclave. After autoclaving add
    trace elements, magnesium sulfate, calcium chloride, yeast extract and glucose
    from sterile stock solutions. Adjust pH of complete medium to 7.0, if necessary.
- step_number: 2
  action: MIX
  description: pH 3.0-4.0
