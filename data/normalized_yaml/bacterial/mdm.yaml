  description: anaerobize with nitrogen, can be stored anaerobically for a limited
    time
- step_number: 3
  action: AUTOCLAVE
  description: autoclave
- step_number: 4
  action: MIX
  description: steril filtration
- step_number: 5
  action: HEAT
