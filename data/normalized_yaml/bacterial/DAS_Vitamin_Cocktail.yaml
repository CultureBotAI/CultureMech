notes: 'UTEX DAS Vitamin Cocktail stock solution (100 mL stock recipe normalized to
  1 L: Tricine 9.0 g/L, Thiamine hydrochloride 0.67 g/L, Biotin 0.01 g/L, Vitamin
  B12 0.008 g/L [0.0008 g/100 mL], Calcium D-(+)-pantothenate 0.02 g/L, 4-aminobenzoic
  acid 0.04 g/L; all 6 constituents mapped to canonical ChEBI/MediaIngredientMech
  terms). Sterilization note: the UTEX table component entry for Vitamin B12 includes
  parenthetical ''(add after autoclaving)'', while the UTEX Directions specify filter-sterilizing
  the completed 100 mL cocktail through a 0.45 µm Millipore filter and storing 10
  mL aliquots at -20 °C.'
