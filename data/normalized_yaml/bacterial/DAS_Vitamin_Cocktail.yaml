notes: |
  DAS Vitamin Cocktail for Dasycladales Seawater Medium.
  Provides essential vitamins for marine algae culture.

  Preparation: Add Tricine to approximately 85 mL deionized water while stirring. Adjust pH to 8.0; the source does not specify a titrating reagent. Add the remaining components in the listed order, make up to 100 mL, and filter through a 0.45 um Millipore filter.

  Unresolved preparation conflict: the Vitamin B12 table row says to add after autoclaving, while the directions specify filtration and do not identify an autoclaving step. This record does not resolve that contradiction or invent a heat-treatment sequence.

  Storage: In darkness at freezer temperature; the source does not specify -20 C.

  Concentrations are retained as supplied-product g/L from the stated 100 mL preparation. The printed stock and receiving-DAS molarity columns are not independently verified here; the supplied calcium pantothenate must not be treated as free pantothenic acid. No receiving-medium dose is inferred.
