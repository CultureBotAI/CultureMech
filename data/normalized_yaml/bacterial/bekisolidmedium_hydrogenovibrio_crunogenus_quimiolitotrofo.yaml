preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the base in 1 L distilled water with NaCl, CaCl2 x 2 H2O, NaHCO3,
    and phosphate buffer.
- step_number: 2
  action: MIX
  description: Add Na2S2O4 and prepare the Elemento traza solution from ZnSO4 x 7
    H2O, FeSO4 x 7 H2O, MnCl2 x 4 H2O, CuSO4 x 5 H2O, CuCl2, Fe(III)NH4-EDTA, and
    (NH4)2MoO4.
- step_number: 3
  action: MIX
  description: Add KNO3 and agar to complete the solid medium.
