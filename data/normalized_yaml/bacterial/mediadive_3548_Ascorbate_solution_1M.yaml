preparation_notes: 'In an ice bath ascorbic acid was dissolved in 80 mL anoxic H2Obidest
  (autoclaved, cooled under N2 atmosphere) while flushing with N2. The pH was adjusted
  to 7.0 with NaOH and the solution added up to 100 ml with anoxic H2Obidest. After
  filter-sterilization the solution was stored under N2 atmosphere in a special flask
  (which can be flushed with gas) at 4°C in the dark.


  Original volume: 100 mL'
