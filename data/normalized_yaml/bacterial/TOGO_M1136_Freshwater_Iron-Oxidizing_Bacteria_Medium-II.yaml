preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the bottom layer from FeS solution, Modified Wolfe's solution,
    and Agar, Noble.
- step_number: 2
  action: MIX
  description: Prepare the top layer from Modified Wolfe's solution and Trace minerals.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave both layer solutions at 121 degrees C for 15 min.
- step_number: 4
  action: ALIQUOT
  description: Shortly after autoclaving, pipette the bottom layer into each culture
    vessel, typically 5 ml in a 60 ml glass vial with a cut pipette tip.
- step_number: 5
  action: COOL
  description: Cool the bottom layer for at least 30 min to solidify.
- step_number: 6
  action: FILTER_STERILIZE
  description: After cooling the top layer, add filter-sterilized Trace vitamins and
    8% NaHCO3 solution per liter.
- step_number: 7
  action: MIX
  description: Add the top layer solution at five to six times the bottom-layer volume
    to culture vessels containing solidified bottom layer.
- step_number: 8
  action: MIX
  description: Cap culture vessels with silicone rubber stoppers and replace the gas
    phase with an N2-CO2 (4:1, v/v) gas mixture.
- step_number: 9
  action: STORE
  description: For storage, cap vessels with butyl rubber stoppers instead of silicone
    rubber stoppers and keep the vessels anoxic.
sterilization:
  method: AUTOCLAVE
