preparation_notes: "Mix components, bring to a boil for several seconds and cool down\
  \ under a stream of H2-CO2 (80:20, v/v). Distribute the medium into culture vessels\
  \ (e.g., 5 ml in the Hungate tube) under the same gas mixture, seal with butyl rubber\
  \ stoppers and autoclave. Add per liter the following sterile solutions from anaerobic\
  \ stocks (autoclaved or *filter-sterilized): \nCheck pH of the medium to be about\
  \ 7.0. Pressurize the inoculated bottles to 200 kPa H2-CO2 (80:20, v/v).\n\nOriginal\
  \ volume: 1055 mL"
