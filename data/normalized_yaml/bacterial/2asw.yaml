- name: 2asw_sea_salt_substitution_33_6_g_l
  relationship: SUBSTITUTED_COMPONENT_VARIANT
  description: Modified 2ASW maintenance medium in Hiibel et al. (2015), with sea
    salts substituted for NaCl. Separate from the paper's centrate-screening media;
    the complete base formula is unresolved.
  modifications:
  - Use the study-reported 33.6 g/L sea salts in place of NaCl; this is an undefined
    sea-salt mixture, not 33.6 g/L pure sodium chloride.
  - The sea-salt brand, full constituent composition and other base-recipe details
    are not established by the inspected methods. Do not assume equivalence to this
    parent's seawater alternative or inherit details from the mismatched Gomord base
    citation.
  evidence:
  - reference: doi:10.3389/fenrg.2015.00020
    supports: SUPPORT
    snippet: 33.6 g/L of sea salts were used in place of the NaCl.
    explanation: 'Supports only variants[name=2asw_sea_salt_substitution_33_6_g_l].modifications[0]:
      directly reported sea-salt replacement amount in Materials and Methods / Strains
      and media. It is the maintenance-medium mixture concentration, not a stock or
      pure NaCl value. No arithmetic was performed. The paragraph assigns this modified
      2ASW to the 18 Dunaliella strain rows in Table 1, whose scientific names and
      taxonomy qualifications are preserved in this paper''s citation notes. Centrate
      results are not parent or maintenance-medium growth metrics.'
