variants:
- name: 2asw_1_5_m_nacl
  description: Study-specific 2ASW reported by Liang et al. (2023). Only the explicitly
    stated NaCl concentration and algal cultivation context are resolved; full Table
    S2 formulation remains unverified.
  modifications:
  - The study reports 1.5 M NaCl in its 2ASW culture medium. This is a reported medium
    concentration, not a stock concentration or inferred amount to add.
  - Other ingredients, stock additions, seawater contribution and final-volume preparation
    remain unspecified in the inspected paragraph. No salt-increase/decrease direction
    relative to this imported parent is asserted.
  evidence:
