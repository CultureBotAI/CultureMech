preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the Basal salts, Phosphate, Vitamin, and Trace elements stock
    solutions.
- step_number: 2
  action: MIX
  description: Combine 5 mL Basal salts solution, 5 mL Phosphate solution, 1 mL Vitamin
    solution, the direct PE Medium ingredients, and distilled water; bring the final
    volume to 1 L.
- step_number: 3
  action: ADJUST_PH
  description: Adjust the complete medium to pH 6.8.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min.
