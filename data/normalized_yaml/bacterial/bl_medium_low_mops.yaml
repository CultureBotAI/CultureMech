references:
- reference: doi:10.1128/aem.59.12.4363-4366.1993
  title: Minimal Requirements for Exponential Growth of Lactococcus lactis.
  authors: Jensen PR; Hammer K
  year: 1993
  notes: 'source_type=journal_article; discovery_mode=MediaDB_source_cross_reference;
    source 128; PMID:16349136; PMCID:PMC195913; accessed_on=2026-10-13. Title, authors,
    year and DOI agree between archived PubMed and original article scans; no PubMed
    correction/retraction notice was present. All four page scans were inspected;
    curation here covers Table 1 and the matching Table 3 liquid treatment, not the
    entire organism/medium inventory. Raw scans, provenance and bounded recipe-table
    Markdown: references_cache/papers/primary_scans/jensen-1993/; raw abstract XML/Markdown:
    references_cache/papers/PMID_16349136.{xml,md}. A PDF request returned HTML, so
    no PDF archive is claimed. Source facts were visually checked, not accepted from
    OCR. Numerical amounts match the selected liquid treatment; stock filtration,
    calcium-pantothenate wording and unresolved hydrates are represented in the named
    inline variant. Existing ingredient fields, preparation and any full-record variant
    links are retained; none is recertified by association. Reported scientific name=Lactococcus
    lactis subsp. lactis; strain=MG1363. taxonomy_match=exact_strain_by_designation;
    NCBITaxon:416870; current canonical_label=Lactococcus cremoris subsp. cremoris
    MG1363; rank=strain in NCBI Taxonomy XML retrieved 2026-10-13; source=https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=416870.
    The historical subspecies wording differs from current taxonomy; retain it as
    the reported name, not a current classification. No equivalence between all historical
    L. lactis strains and L. cremoris is inferred. Table 2 also reports NCDO 712 and
    C2 as Lactococcus lactis subsp. lactis on solid formulations, including negative
    controls. Exact caption excerpt, page 4364 Table 2: ''Growth of L. lactis subsp.
    lactis on solid medium containing six or more amino acids''; strain-column labels
    are ''712'', ''C2'' (2 printed as subscript), and ''MG1363''. Page 4363 identifies
    strain NCDO 712. Their mapping is parent_rank_only: Lactococcus, NCBITaxon:1357,
    genus, verified in the archived MG1363 lineage; lookup_on=2026-10-13; source=https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=416870.
    A bounded NCBI exact-name search for NCDO712/NCDO 712 and Lactococcus lactis/cremoris
    C2 returned no taxon; this does not prove no exact entry exists. No MG1363 taxon
    or liquid-culture growth claim is assigned to them. The Table 4 SA/M17 comparisons
    and other cited taxa are outside this BL-liquid curation scope. KGX publication
    remains withheld because its current exporter ignores scoped_to_variant.'
variants:
- name: Jensen 1993 BL Medium, Low MOPS reported preparation
  description: Historical Table 3 liquid-culture treatment with the source's preparation
    and pantothenate form. Numerical parent amounts match the selected Table 1/3 treatment,
    but unresolved hydrate details are not asserted as exact parent equivalence. This
    preparation-qualified inline variant does not duplicate or replace the existing
    BL/low-MOPS full-record relationship.
  modifications:
  - Use the paper's stock-solution filtration through 0.2-micrometer Millipore filters
    rather than the parent's generic 0.22-micrometer filtration of the complete mixture;
    no additional final-medium sterilization step is inferred.
  - Use calcium pantothenate as specified in the text; Table 1 expresses the dose
    as 2 micromolar pantothenate. Do not reinterpret that as 2 micromolar calcium
    salt or add an inferred calcium concentration.
  - Keep the published nominal molar formulation from Table 1 and this Table 3 treatment.
    MgCl2 hydration and the printed molybdate formula/hydration are not resolved by
    the inspected source; the parent's hexahydrate/tetrahydrate labels are not promoted
    to verified study identities. No mass or hydrate conversion is performed.
  - 'Retain this existing treatment dose: MOPS 40 mM. Table 3 footnote b points to
    the Table 1 SA-column Arg/Ser/Trp doses; the Asp and low-MOPS rows state their
    own doses. No new base-versus-child link is created.'
  purpose: Reported liquid batch-culture treatment for MG1363.
  evidence:
  - reference: doi:10.1128/aem.59.12.4363-4366.1993
    supports: SUPPORT
    snippet: All stock solutions were passed through Millipore filters (0.2-μm pore
      size).
    explanation: 'Locator: page 4363, Growth on plates containing eight amino acids,
      preparation paragraph; the next sentence names ''calcium pantothenate''. Table
      1 and its vitamin footnote specify the nominal amounts; page 4364 Table 3 identifies
      the liquid treatment Low MOPS (0.04 M). All numeric ingredient amounts were
      compared with the original scans; micromolar footnote values were divided by
      1000 solely for comparison to existing mM fields. No parent amount was rewritten.
      The printed molybdate formula/hydration remains unresolved; no unsupported exact
      chemical identity is claimed.'
