preparation_steps:
- step_number: 1
  action: MIX
  description: Add 3 g CaCO3 to approximately 300 ml V-8 vegetable juice and stir
    for 2 h.
  duration: 2 h
- step_number: 2
  action: FILTER
  description: Centrifuge and retain 200 ml of the clarified vegetable juice supernatant.
- step_number: 3
  action: MIX
  description: Add 800 ml seawater at 2% salinity and 15 g agar to the 200 ml vegetable
    juice supernatant.
- step_number: 4
  action: ADJUST_PH
  description: Adjust pH to 7.0.
notes: TOGO M1418 imports NBRC Medium 15 as Vegetable Juice Seawater Agar (V-8 SWA).
  NBRC 15 lists 200 ml Vegetable juice, 3 g CaCO3, 800 ml Seawater at 2% salinity,
  and 15 g Agar at pH 7.0.
