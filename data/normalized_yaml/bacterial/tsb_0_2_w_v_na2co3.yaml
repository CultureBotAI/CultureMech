preparation_steps:
- step_number: 1
  action: MIX
  description: Suspend 30 g Bacto Tryptic Soy Broth and 15 g agar, if needed, in 1
    L distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Sterilize 2 g Na2CO3 separately by autoclaving.
- step_number: 3
  action: MIX
  description: Add the separately autoclaved Na2CO3 to the other ingredients; the
    final pH is around 8.5.
notes: TOGO M1678 imports NBRC Medium 883 as TSB + 0.2%(w/v) Na2CO3. NBRC 883 lists
  30 g Bacto Tryptic Soy Broth, 2 g Na2CO3 sterilized separately by autoclaving, 15
  g Agar if needed, and 1 L Distilled water; the final pH is around 8.5.
