preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Filter--sterilize KSCN solution and separately autoclave Trace elements
    solution and MgCl2・6H2O solution. Aseptically add KSCN solution, Trace elements
    solution and MgCl2・6H2O solution to the medium.
- step_number: 2
  action: FILTER_STERILIZE
  description: Use the Medium No. [310] without KSCN solution. Aseptically add 40.0ml
    of 2 M Na2S2O3 solution (filter--sterilized) and 5.0 ml of 1 M KNO3 solution (filter--sterilized)
    to the medium (1.0 L).
