preparation_notes: "Mix components and adjust pH to 7.2 - 7.4. Boil Mineral medium\
  \ and cool down under a N2-CO2 (4:1, v/v) gas stream. Distribute Mineral medium\
  \ into culture vessels (e.g., 9.0 ml of the medium in tubes) under the same gas\
  \ mixture, seal with Teflon-coated rubber stoppers and autoclave. After cooling,\
  \ add the following components (per 9.0 ml Mineral medium) from sterile anoxic stock\
  \ solutions (autoclaved or *filter-sterilized): \n\nOriginal volume: 901 mL"
