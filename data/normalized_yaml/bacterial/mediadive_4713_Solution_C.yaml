preparation_notes: 'Mix components thoroughly and filter-sterilize. Stock the solution
  under a N2-CO2 (80:20, v/v) gas mixture.

  To complete the medium, combine Solutions A, B and C aseptically and anaerobically
  under a N2-CO2 (80:20, v/v) gas mixture. Check the final pH to be 6.9 - 7.2.


  Original volume: 50 mL'
