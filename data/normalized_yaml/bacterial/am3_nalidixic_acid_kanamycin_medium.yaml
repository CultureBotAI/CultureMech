media_term:
  preferred_term: TOGO Medium M2023
  term:
    id: TOGO:M2023
    label: AM3 + Nalidixic acid, Kanamycin medium
notes: NBRC Medium 1314 defines AM3 + Nalidixic acid, Kanamycin medium with 1.5 g
  beef extract, 1.5 g yeast extract, 5 g peptone, 1 g glucose, 3.5 g NaCl, 3.68 g
  K2HPO4, 1.32 g KH2PO4, 15 g agar if needed, 1 L distilled water, 1 ml Nalidixic
  acid solution (100 mg/ml), and 1 ml Kanamycin solution (25 mg/ml) per liter. The
  pH is unadjusted; the antibiotic solutions are sterilized separately by filtration.
references:
- reference: https://togomedium.org/medium/M2023
- reference: https://www.nite.go.jp/nbrc/catalogue/NBRCMediumDetailServlet?NO=1314
preparation_steps:
- step_number: 1
  action: MIX
  description: Mix beef extract, yeast extract, peptone, glucose, NaCl, K2HPO4, KH2PO4,
    and agar in distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the basal AM3 medium.
- step_number: 3
  action: FILTER_STERILIZE
  description: Filter-sterilize the Nalidixic acid solution (100 mg/ml) and Kanamycin
    solution (25 mg/ml) separately.
- step_number: 4
  action: MIX
  description: Aseptically add 1.0 ml/L Nalidixic acid solution and 1.0 ml/L Kanamycin
    solution to the autoclaved basal medium.
sterilization:
  method: AUTOCLAVE
  notes: Autoclave the basal AM3 medium and filter-sterilize the nalidixic acid and
    kanamycin stock solutions separately before aseptic addition.
applications:
- Microbial cultivation
