  Medium as a 1.034 L anoxic N2 medium containing 1.0 L distilled water, 1.0 ml each
  of FeCl2 solution and Trace element solution from JCM Medium 187, 0.5 mg resazurin,
  2.0 ml 10% CaCl2 x 2 H2O, 20.0 ml 12.5% Na2S2O3 x 5 H2O, and 10.0 ml 5% Na2S x 9
  H2O stocks.
