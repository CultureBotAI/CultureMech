  \ a N2-CO2 (80:20, v/v) gas atmosphere. After cooling, aseptically and anaerobically\
  \ add the following solutions (autoclaved or *filter-sterilized): \nAseptically\
  \ distribute the medium into culture vessels under the same gas mixture and seal\
  \ with butyl rubber stoppers. Finally, add per liter the following solutions from\
  \ anaerobic stocks (autoclaved and stored under a N2 atmosphere): \nReadjust pH\
  \ to 7.2, if necessary.\n\nOriginal volume: 1021 mL"
