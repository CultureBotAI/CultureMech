preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Mix all ingredients except vitamin solution, cysteine-HCl, and Na2S·9H2O.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the medium under H2/CO2 (80/20).
- step_number: 3
  action: AUTOCLAVE
  description: Separately autoclave cysteine-HCl and Na2S·9H2O as 6% solutions under
    an N2 atmosphere.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter-sterilize the vitamin solution.
- step_number: 5
  action: MIX
  description: Aseptically and anaerobically add filter-sterile vitamin solution and
    the cysteine-HCl and Na2S·9H2O solutions.
- step_number: 6
  action: MIX
  description: Pressurize inoculated bottles to 150 kPa with H2/CO2.
- step_number: 7
  action: ADJUST_PH
  description: For the trace elements solution, first dissolve NTA, adjust pH to 6.5
    with NaOH, then add minerals; final pH is 7.0.
