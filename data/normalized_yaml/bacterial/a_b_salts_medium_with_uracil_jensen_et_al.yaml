    Minimal medium with and without uracil is contrasted in the abstract. Its growth
    comparison does not supply the A+B salts formula or uracil amount. MediaDB plasmid-bearing
    strain labels require methods-level verification. Full-text retrieval attempts
    failed; the complete PubMed abstract is archived. The existing uracil-supplemented
    owner is a local variant candidate, not a newly paper-verified exact formulation.
    Local pair MEDIADB:142/143 differs by uracil; the other ten ingredient entries
    agree. No new duplicate variant is created and the uracil amount is not certified
    by the abstract. Inventory covers the inspected medium-relevant passages, not
    every organism in the full paper or its bibliography. Correction/retraction coverage
    is limited to inspected publication metadata. Bounded taxonomy misses do not establish
    absence. All original ingredients, amounts, preparation, history and links are
    preserved, not newly certified. No new native growth assertion, resolved variant
    or concentration evidence.
