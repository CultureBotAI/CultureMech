preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Mix components except NaHCO3 and adjust pH to 6.5. Bring to a boilfor
    5--10 sec, then, cool down under a stream of N2--CO2 (80:20, v/v) and add NaHCO3
    to the solution. Dispense 0.9 volume of the medium into culturevessels (e.g.,
    18 ml of the medium in 50 ml serum bottle) under a stream of N2--CO2 (80:20, v/v)
    and seal with butyl rubber stoppers. After autoclaving, stand the medium overnight.
- step_number: 2
  action: FILTER_STERILIZE
  description: Adjust pH to 7.0 and filter--sterilize. Keep the solution under a N2
    atmosphere.
- step_number: 3
  action: AUTOCLAVE
  description: To complete the medium, add 0.1 volume of Solution B to the culture
    vesselscontaining Solution A. Prior to inoculation, aseptically and anaerobically
    add 0.01 volume of L--cysteine・HCl・H2O and Na2S・9H2O solutions to the medium (3%
    solutions, autoclaved and stored under a N2 atmosphere).
- step_number: 4
  action: MIX
  description: 'Comment: For strain JCM 10971, incubate with a 10% inoculum.'
- step_number: 5
  action: MIX
  description: Use Medium No. [284] supplemented with final 0.2 g yeast extract in
    Solution A (per 900 ml), and with 0.332 g/L o--phthalic acid in Solution B (per
    100 ml) instead of sodium pyruvate. Otherwise, prepare the medium as described
    in therecipe of Medium No. [284].
- step_number: 6
  action: MIX
  description: 'Comment: For strain JCM 12282, incubate with a 15 -- 20% inoculum.'
applications:
