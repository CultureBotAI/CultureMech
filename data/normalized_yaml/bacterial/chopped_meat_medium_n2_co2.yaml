preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: DSMZ Medium 78b boils lean chopped beef or horse meat with water and
    NaOH for 15 min, filters while retaining meat particles and filtrate, adds Casitone,
    yeast extract, K2HPO4, resazurin, and water to 700 ml, sparges with 80% N2/20%
    CO2 for 30-45 min, adds L-cysteine HCl x H2O, adjusts pH to 7.0, dispenses under
    the same gas into Hungate tubes with meat particles, and autoclaves at 121 C for
    20 min.
- step_number: 2
  action: FILTER_STERILIZE
  description: When the DSMZ catalogue specifies Haemin, Vitamin K1, or Vitamin K3,
    prepare those stocks separately, filter-sterilize them, and add them to the autoclaved
    chopped-meat medium.
