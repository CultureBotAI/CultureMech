  preferred_term: TOGO Medium M2682
  term:
    id: TOGO:M2682
    label: Obsidian Pool fermentor (OPF) medium (modified from M. B. Allen, 1959)
notes: TOGO M2682 imports the Obsidian Pool fermentor medium from Elkins et al. 2008.
  The source lists 1000 ml distilled water, modified Allen salts and organics, 1 ml
  Wolfe's Vitamin Solution (1000X), 10 uL/L LiCl/Na2WO4/NaSeO3/Ni(NH4)2(SO4) stock,
  and N2/CO2 (80:20) gas bubbling at 85 C.
