preparation_notes: "Dispense 5 ml aliquots into Hungate tubes. After autoclaving add\
  \ the following components per liter: \nAdjust to pH 6.8.\nIncubate in sealed containers.\
  \ The strain held in the DSMZ has been cultivated on methanol, but the original\
  \ publication indicates that the strain will also grow on methane."
