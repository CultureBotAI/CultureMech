preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: "Dissolve  the  TRIS  buffer  into 900  ml distilled  water,  then\
    \ add  the  remaining \r\ncomponents.  Bring  to 1  litre  with distilled  water.\
    \  For  agar  add  15 g  per  litre \r\nBacterial Agar. Autoclave at 15 psi for\
    \ 15 minutes.  Final pH should be 7.5."
- step_number: 2
  action: MIX
  description: "Add to 1000 ml of distilled water 0.75 g Na2EDTA and the minerals\
    \ in exactly the \r\nfollowing sequence:"
- step_number: 3
  action: FILTER_STERILIZE
  description: Filter sterile
- step_number: 4
  action: FILTER_STERILIZE
  description: Take 1 ml of this solution and add 99 ml Deionised water. Filter sterile.
- step_number: 5
  action: FILTER_STERILIZE
  description: Filter sterile.
