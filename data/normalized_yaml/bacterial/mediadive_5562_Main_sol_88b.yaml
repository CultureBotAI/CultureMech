preparation_notes: 'Prepare medium M.88, then add (per litre):

  Adjust the pH to 6.0 with H2SO4 (25% v/v). Prepare the medium under 100% N2 gas
  phase and distribute anaerobically into rubber stoppered tubes or bottles (presterilized
  by autoclaving). The medium is sterilized by heating 2 hours at 85 °C on each of
  two following days.'
