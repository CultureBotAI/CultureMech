notes: TOGO M2176 imports ATCC Medium 1108 as Renibacterium KDM-2 medium. ATCC 1108
  lists 1.0% w/v peptone, 0.05% w/v yeast extract, 0.1% w/v L-Cysteine . HCl, 1.5%
  w/v agar, and 20.0% fetal bovine serum. The ATCC preparation dissolves peptone,
