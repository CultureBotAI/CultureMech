notes: pH 7.0-7.3 Mix ingredients except for yeast extract, bicarbonate, vitamin,
  thiamine, cyanocobalamin and sulfide solutions. Dispense the medium into suitable
  culture vessels under a stream of the N2/CO2 (80/20) mixed gas, seal with butyl
  rubber stoppers, and autoclave at 121°C for 15 min. Aseptically and anaerobically
  add other ingredients using sterile syringes. Adjust pH to 7.0-7.3 using compact
  pH meter. Sterilized by autoclaving. Sterilized by autoclaving. Saturated with CO2
  gas. Tightly sealed in bottles filled with CO2 gas and then sterilized by autoclaving.
  Sterilized by filtration. Sterilized by filtration. Sterilized by filtration. Sterilized
  by filtration and stored under N2 gas.
