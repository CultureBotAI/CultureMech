preparation_steps:
- step_number: 1
  action: MIX
  description: Use Medium No. 284 supplemented with final 0.2 g/L yeast extract
    and 1.0 ml Trace vitamins solution in Solution A (per 900 ml), replacing
    sodium pyruvate in Solution B with 0.18 g of glucose (per 100 ml).
    Otherwise, prepare the medium as described in the recipe of Medium No. 284.
- step_number: 2
  action: MIX
  description: 'Comment: For strain JCM 17151, incubate with a 5% inoculum.'
