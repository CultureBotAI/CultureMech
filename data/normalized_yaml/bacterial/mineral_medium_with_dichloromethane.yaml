preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Prepare medium 465 with optional 50 mg/l bromothymol blue as pH indicator
    and autoclave. For DSM 6813, add 10 ml/l instead of 1 ml/l trace element solution
    SL-4.
- step_number: 2
  action: MIX
  description: Grow cells in medium 465 with methanol supplied via incubation atmosphere
    up to 10 ml methanol per liter medium, then feed dichloromethane via the incubation
    atmosphere at 2 mmol/l or less.
- step_number: 3
  action: ADJUST_PH
  description: Maintain pH 7.25 and readjust the culture with sterile 1 M NaOH if
    necessary.
- step_number: 4
  action: MIX
  description: Rehydrate lyophilized cells in the appropriate complex medium and then
    cultivate on mineral medium with the appropriate carbon source.
- step_number: 5
  action: ADJUST_PH
  description: For trace element solution SL-4, first dissolve EDTA in distilled water
    and adjust to pH 7.0 with 2 N NaOH, then add the other compounds.
