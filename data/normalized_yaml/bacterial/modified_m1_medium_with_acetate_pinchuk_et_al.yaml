  authors: Kieft TL; Fredrickson JK; Onstott TC; Gorby YA; Kostandarithes HM; Bailey
    TJ; Kennedy DW; Li SW; Plymale AE; Spadoni CM; Gray MS
  year: 1999
  notes: source_type=journal_article_submitted_manuscript; discovery_mode=Pinchuk_2010_reference_56;
    accessed_on=2026-10-13; PMID:10049886; supporting Wolfe stock protocol, not a
    Shewanella growth paper. PubMed XML/abstract=references_cache/papers/PMID_10049886.{xml,md};
    full scanned manuscript/Markdown=references_cache/papers/primary_pdf/kieft-1999-osti-submitted-manuscript.{pdf,md};
    https://www.osti.gov/servlets/purl/762040. Title, ordered authors and journal
    match PubMed; OSTI deposit date conflicts with publication year and its metadata
    supplies no DOI. The bibliography year 1999 is from PubMed, not the deposit date.
    Version not verified against final published typesetting. Inspected PDF page 6
    (printed page 3), lines 11-18, for vitamin/mineral stock composition; visual formula
    H3BO4 is retained as an unresolved source token. Stock mass concentrations per
    liter of deionized water are not automatically final-medium molar concentrations.
    No source amount is corrected or certified in this parent. The cited stock-composition
    sentences name no growth organism; Thermus enrichment results elsewhere are not
    evidence of Shewanella growth. Bounded supporting-protocol citation only.
variants:
- name: Pinchuk 2010 reported batch M1 with acetate
  relationship: SUBSTITUTED_COMPONENT_VARIANT
  description: 'Figure S4, panel C: 45 mM acetate with ammonium chloride. The variant
    denotes the source-described batch assay, not an exact normalized expansion of
    all stock chemicals. The paper specifies Wolfe vitamin/mineral stock additions;
    the imported parent instead flattens those stocks into molar amounts. Their equivalence
    is not certified: Kieft''s submitted manuscript prints H3BO4 and multiple hydrate-specific
    salts, while the parent contains boric acid and some anhydrous/generalized terms.
    The original stock formula and final-volume basis remain unresolved at ingredient-normalization
    level. Parent amounts, terms and generic preparation are unchanged. '
  modifications:
  - Use the paper's 4.35 mM sodium dihydrogen phosphate monohydrate (NaH2PO4.H2O),
    not the parent's dibasic sodium phosphate.
  - Retain the paper-described Wolfe vitamin/mineral stocks without claiming equivalence
    to the parent's flattened molar stock components.
  - Use the batch formulation at pH 7.0 with 30 mM PIPES; do not import the chemostat's
    3 mM PIPES, Fe(III)-NTA supplement or anaerobic formulation.
  evidence:
  - reference: doi:10.1371/journal.pcbi.1000822
    supports: SUPPORT
    snippet: 4.35 mM NaH2PO4•H2O
    explanation: 'Supports variants[].modifications phosphate identity and 4.35 mM
      amount only; main Methods/Bacterial Strains and Growth Media. Separate exact
      stock excerpt=''10 ml each of 10× Wolfe''s vitamin solution and 10× mineral
      solution''. Separate exact PIPES excerpt=''30 mM and 3 mM for batch and chemostat
      cultivation, respectively''; pH excerpt=''modified M1 medium (pH 7.0)''. Figure
      S4, panel C: 45 mM acetate with ammonium chloride. See the archived Figure S1
      or S4 for assay substrate/nitrogen identity. The variant denotes the source-described
      batch assay, not an exact normalized expansion of all stock chemicals. The paper
      specifies Wolfe vitamin/mineral stock additions; the imported parent instead
      flattens those stocks into molar amounts. Their equivalence is not certified:
      Kieft''s submitted manuscript prints H3BO4 and multiple hydrate-specific salts,
      while the parent contains boric acid and some anhydrous/generalized terms. The
      original stock formula and final-volume basis remain unresolved at ingredient-normalization
      level. Parent amounts, terms and generic preparation are unchanged. '
target_organisms:
- preferred_term: Shewanella oneidensis MR-1
  strain: MR-1 (wild type)
