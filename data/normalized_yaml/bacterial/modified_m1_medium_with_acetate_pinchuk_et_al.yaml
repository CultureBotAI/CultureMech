  scoped_to_variant: Pinchuk 2010 reported batch M1 with acetate
  evidence:
  - reference: doi:10.1371/journal.pcbi.1000822
    supports: SUPPORT
    snippet: Growth dynamics of S. oneidensis MR-1 wild-type
    explanation: 'Figure S4, panel C: 45 mM acetate with ammonium chloride. The filled-circle
      wild-type growth curves were visually inspected in the one-page source PDF.
      The common batch methods specify 30 degrees C, with microplates for S1 or shaken
      crimp-sealed serum bottles for S4. No maximum OD, rate, doubling time, well
      dilution or optimum is inferred. Scientific name and canonical label=Shewanella
      oneidensis MR-1; NCBITaxon:211586; rank=strain; taxonomy_match=exact; ATCC 700550
      is an NCBI equivalent name. Lookup_on=2026-10-13; https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=211586&retmode=xml;
      archive=references_cache/papers/taxonomy/shewanella-mr1-20261013.{xml,md}. This
      verifies the wild-type background, not an independent exact taxonomy identity
      for every engineered derivative. Growth is supported only on the named source-described
      inline variant, not on the unmodified imported parent. Unresolved chemical normalization
      is retained in that variant; the source''s qualitative cultivation result is
      not a certification of the flattened parent recipe. Current KGX export does
      not honor scoped_to_variant; this curation is not authorization to publish an
      unscoped parent edge.'
