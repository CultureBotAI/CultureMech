references:
- reference: doi:10.1371/journal.pcbi.1000822
  title: 'Constraint-based model of Shewanella oneidensis MR-1 metabolism: a tool
    for data analysis and hypothesis generation.'
  authors: Pinchuk GE; Hill EA; Geydebrekht OV; De Ingeniis J; Zhang X; Osterman A;
    Scott JH; Reed SB; Romine MF; Konopka AE; Beliaev AS; Fredrickson JK; Reed JL
  year: 2010
  notes: 'source_type=journal_article; discovery_mode=MediaDB_source_cross_reference;
    accessed_on=2026-10-13; MediaDB sourceID=72, medID=181. Publication identity was
    checked against archived PubMed metadata and the exact SQL joins. Database growth
    rates are discovery leads, not imported experimental measurements. The historical
    Mazumdar import note remains database provenance. No correction/retraction notice
    appears in the inspected PubMed entry; this is a bounded notice check. PMID:20589080;
    PMC2891590.1. Full article and Markdown=references_cache/papers/primary_xml/pinchuk-2010-pmc.{xml,md};
    Table S6, Text S1, Figures S1 and S4 archived and converted under references_cache/papers/supplements/pinchuk-2010-s{006,008,011,014}.*.
    Assay=Figure S4, panel C: 45 mM acetate with ammonium chloride. Variant_destination=''Pinchuk
    2010 reported batch M1 with acetate''. The variant denotes the source-described
    batch assay, not an exact normalized expansion of all stock chemicals. The paper
    specifies Wolfe vitamin/mineral stock additions; the imported parent instead flattens
    those stocks into molar amounts. Their equivalence is not certified: Kieft''s
    submitted manuscript prints H3BO4 and multiple hydrate-specific salts, while the
    parent contains boric acid and some anhydrous/generalized terms. The original
    stock formula and final-volume basis remain unresolved at ingredient-normalization
    level. Parent amounts, terms and generic preparation are unchanged. Figure S4
    compares wild type with delta SO0781 (gcvP); both plotted curves increase, with
    treatment-dependent differences. Text S1''s acetate cross-reference to S4B conflicts
    with the actual figure (acetate is panel C); its later glycine reference to S6C
    also conflicts with the S4 glycine panel. The actual plot labels establish this
    variant''s assay scope; no conflicting-panel metric is imported. Scientific name
    and canonical label=Shewanella oneidensis MR-1; NCBITaxon:211586; rank=strain;
    taxonomy_match=exact; ATCC 700550 is an NCBI equivalent name. Lookup_on=2026-10-13;
    https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=211586&retmode=xml;
    archive=references_cache/papers/taxonomy/shewanella-mr1-20261013.{xml,md}. This
    verifies the wild-type background, not an independent exact taxonomy identity
    for every engineered derivative. Table S6 identifies these deletions as MR-1 derivatives;
    taxonomy_match=parent_rank_only for each mutant, with MR-1 (NCBITaxon:211586,
    rank=strain) as its verified background parent, not an exact mutant taxon match.
    Non-growth-target organisms in Table S6: Escherichia coli EC100D pir-116 and Top10
    (cloning hosts), WM3064 lambda-pir (mating host). Exact role excerpt for WM3064=''Host
    used for mating with MR-1.'' Scientific name=Escherichia coli; verified parent=Escherichia
    coli, NCBITaxon:562, rank=species; taxonomy_match=parent_rank_only for the reported
    strains. Exact quoted-name searches did not resolve WM3064, EC100D or Top10 to
    strain nodes; this is not proof that no alternate-name node exists. Lookup_on=2026-10-13;
    https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=562&retmode=xml;
    archive=references_cache/papers/taxonomy/ecoli-species-20261013.{xml,md}. No E.
    coli growth on this M1 variant is inferred. Organism inventory is bounded to the
    growth-media/assay passages and Table S6, not the whole paper or organisms named
    only inside cited bibliography. Other mutant rescue/selection media are separate
    experiments. The existing 20/18 mM parent-child link is preserved and does not
    certify the source phosphate or expanded stocks.'
