preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: 'Mix components thoroughly. For preparation of solid medium, add 15.0
    g/L agarose. Autoclave and, after cooling to 60C, add the following solutions
    (autoclaved or *filter-sterilized):'
- step_number: 2
  action: AUTOCLAVE
  description: Adjust pH to 6.5 - 7.0 with 0.2 N H2SO4 solution (autoclaved). Cultivate
    under an air containing 10% (v/v) methane in gas tight flasks or jars leaving
    &; 80% gas phase by volume.
- step_number: 3
  action: MIX
  description: 'Trace element solution:'
- step_number: 4
  action: MIX
  description: 'Vitamins solution:'
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH to 3.6.
applications:
- Microbial cultivation
