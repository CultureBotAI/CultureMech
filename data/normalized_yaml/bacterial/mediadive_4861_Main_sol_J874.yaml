preparation_notes: "Mix components thoroughly, adjust pH to 7.5 with KOH and autoclave\
  \ under a N2-CO2 (4:1, v/v) gas mixture. After cooling, add the following solutions\
  \ (autoclaved and stored under N2, or *filter-sterilized and stored under N2-CO2,\
  \ 4:1, v/v): \nAseptically distribute the medium into culture vessels under the\
  \ same gas mixture and seal with butyl rubber stoppers. Finally, add per liter the\
  \ following solutions (autoclaved and stored under N2): \n\nOriginal volume: 1028\
  \ mL"
