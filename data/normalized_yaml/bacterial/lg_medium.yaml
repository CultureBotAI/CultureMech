    entries match. Table 1 LSG uses 20 mM succinate, while Table 3''s supplemented
    LG tests use 25 mM: these experiments must not be collapsed. The local glucose,
    phosphate and other major salts are broadly consistent with the named family,
    but zinc identity and preparation prevent exact local-formulation certification.
    Inventory covers inspected medium-relevant passages, not the whole paper or bibliography.
