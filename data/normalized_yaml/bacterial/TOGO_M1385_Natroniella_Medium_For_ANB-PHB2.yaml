preparation_steps:
- step_number: 1
  action: MIX
  description: Add Na2CO3, NaHCO3, NaCl, and K2HPO4 to distilled water and bring the
    volume to 1.0 L.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 9.6 with 6N HCl.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the base medium.
- step_number: 4
  action: MIX
  description: After cooling, aseptically add autoclaved and filter-sterilized stock
    solutions.
- step_number: 5
  action: ALIQUOT
  description: Aseptically and anaerobically distribute the medium into culture vessels
    under an argon gas stream and seal with butyl rubber stoppers.
