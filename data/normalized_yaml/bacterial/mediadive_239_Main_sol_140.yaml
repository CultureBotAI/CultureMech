preparation_notes: Dissolve ingredients (except carbonate, cellobiose and reducing
  agents), bring medium to the boil, then cool to room temperature under 100% CO2
  gas atmosphere. Use either clarified rumen fluid  or sludge fluid as supplement.
  Dispense medium under same gas atmosphere into anoxic Hungate-type tubes or serum
  vials and autoclave. Add cellobiose, sulfide and cysteine from sterile anoxic stock
  solutions prepared under 100% N2 gas and carbonate from a sterile anoxic stock solution
  prepared under 80% N2 and 20% CO2 gas mixture. Cellobiose has to be sterilized by
  filtration. Adjust pH of complete medium to 6.8, if necessary.
