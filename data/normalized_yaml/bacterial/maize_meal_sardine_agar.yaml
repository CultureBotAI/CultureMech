notes: JCM Medium J1054 Maize Meal-Sardine Agar lists 20 g maize meal, 20 g small
  dried sardine, 20 g agar, and 1 L distilled water. JCM instructs boiling the maize
  meal and sardine with 500 ml distilled water for 20 min, filtering through cloth,
  bringing the filtrate to 1 L, adding agar, and boiling until dissolved; JCM's standing
  instruction is to autoclave media at 121 C for 15 min unless otherwise stated.
