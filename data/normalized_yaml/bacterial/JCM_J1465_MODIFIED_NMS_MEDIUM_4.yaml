preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components and autoclave.
- step_number: 2
  action: MIX
  description: Aseptically distribute the medium into sterile serum bottles (leave
    ≥ 80% gas phase by volume) and seal with rubber stoppers.
- step_number: 3
  action: MIX
  description: Replace the gas phase with an air-methane gas mixture (82:18, v/v).
