preparation_notes: Add components except yeast extract to distilled water and bring
  volume to 1.0 L. Adjust pH to 7.0 with NaOH and sterilize by filtration. Autoclave
  yeast extract as a 10% (w/v) solution and aseptically add to the mineral solution.
