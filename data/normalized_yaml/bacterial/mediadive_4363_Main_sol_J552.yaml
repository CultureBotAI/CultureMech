preparation_notes: 'Mix ingredients except L-sodium lactate and L-cysteine x H2O x
  HCl, adjust pH to 7.5 and autoclave under a N2 atmosphere. Separately autoclave
  L-sodium lactate and L-cysteine x H2O x HCl in 10 ml distilled water under a N2
  atmosphere and add to the medium. Readjust pH to 7.5 with 1 N NaOH (from a sterile
  stock solution).

  For preparation of solid medium, add 15 g/L agar (BD-Difco).


  Original volume: 1003 mL'
