  to artificial seawater and mix thoroughly. Gently heat and bring to a boil. Autoclave
  and then cool to 45 - 50C. Aseptically add the filter-sterilized glucose solution
  and Vitamin solution. Adjust pH to 7.5 with sterile KOH, if necessary.
