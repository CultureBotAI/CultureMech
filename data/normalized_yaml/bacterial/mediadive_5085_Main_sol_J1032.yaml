preparation_notes: "Mix components, bring to a boil and cool down under a CO2 (100%)\
  \ gas stream. While gassing, add the following components to the medium: \nBubble\
  \ N2 for 3 - 4 min and check pH to be 6.5 - 6.8. Readjust pH to the range if necessary.\
  \ Autoclave under a CO2 gas atmosphere. Add the following solution to the medium\
  \ (separately autoclaved under N2): \n\nOriginal volume: 1050 mL"
