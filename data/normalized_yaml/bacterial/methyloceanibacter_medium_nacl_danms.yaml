preparation_steps:
- step_number: 1
  action: MIX
  description: Dilute 20 ml of solution 1 to 700ml with distilled water.
- step_number: 2
  action: MIX
  description: "Add 100mL of solution 5, 50 mL of solution 8, 20mL of solution 6 and\
    \ 7 and 10 mL of\r\nsolution 3."
- step_number: 3
  action: MIX
  description: Add 1ml trace element solution.
- step_number: 4
  action: MIX
  description: Add 0.4 mL solution 2.
- step_number: 5
  action: MIX
  description: Add 0.1 mL solution 4.
- step_number: 6
  action: MIX
  description: Add 1.0 mL solution 9.
- step_number: 7
  action: MIX
  description: Disolve and bring to 1L.
- step_number: 8
  action: AUTOCLAVE
  description: "Adjust pH to 7.8 with HCl or NaOH.\r\nAutoclave medium."
- step_number: 9
  action: FILTER_STERILIZE
  description: After autoclaving add 10mL per liter of filter sterilized methanol.
- step_number: 10
  action: HEAT
  description: May be stored at 4°C in the dark
- step_number: 11
  action: DISSOLVE
  description: Dissolve the ingredients listed above (in that order) in about 700
    ml of distilled water, and then make up to 1 litre
applications:
- Microbial cultivation
