notes: |
  EDTA stock solution for Bold Basal Medium (BBM) and related algae culture media.
  Provides chelating agent for metal micronutrients, improving metal bioavailability
  and preventing precipitation.

  Preparation: Add 50 g EDTA free acid, then 31 g KOH, to approximately 900 mL deionized water with continuous stirring; make up to 1 L.

  Storage: In darkness at room temperature.

  Source discrepancy: the preparation amount is 50 g EDTA acid per final liter, but the source also prints an approximate 8.5 uM annotation. That annotation is not accepted as a verified stock molarity and no replacement molarity is asserted. The supplied EDTA is the free acid; its subsequent solution speciation is not established here. The earlier assertion of primarily disodium EDTA is unsupported by this acid-plus-KOH preparation and is removed.
