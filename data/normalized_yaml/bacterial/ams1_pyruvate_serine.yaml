      20 C, shaking and a 12-hour light/dark cycle. No growth metric is normalized
      from the table and no optimality is inferred. Reported scientific name=Candidatus
      Pelagibacter ubique; strain=HTCC1062; taxonomy_match=exact_strain; NCBITaxon:335992;
