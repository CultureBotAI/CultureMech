preparation_steps:
- step_number: 1
  action: HEAT
  description: Use a volumetric flask dry-heat treated at 180 C or above for at least
    2 hours to remove endotoxins.
- step_number: 2
  action: MIX
  description: Preload 500-700 ml sterile cell-culture-grade water, add components
    in the printed order, and bring the final volume to 1 litre.
- step_number: 3
  action: MIX
  description: Stir slowly for 1.5 hours, no longer, while protecting the medium from
    light.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter through a 0.22 micrometre filter into storage bottles.
- step_number: 5
  action: STORE
  description: Check a 4-5 ml aliquot from each bottle for sterility at 37 C. Confirm
    pH 5.5-6.5 and, if possible, 415 +/- 10 mOsm/L. Store protected from light at
    4 C; the source states it keeps for months.
