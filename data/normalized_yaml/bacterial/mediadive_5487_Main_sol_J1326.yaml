  \ each solution in the appropriate amount of distilled water. Bring solution A to\
  \ a boil and cool down to room temperature under a N2 gas stream. Add solutions\
  \ Band C to the medium, then, adjust pH to 7.3 with NaOH. While swirling the medium,\
  \ dispense into culture vessels under a N2 gas stream, seal with butyl rubber stoppers\
  \ and autoclave.\n\nOriginal volume: 1012 mL"
