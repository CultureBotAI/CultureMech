preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: "Make up to 1 litre with 75% filtered seawater: 25% deionized water.\
    \ Autoclave at 15 psi for\r\n15 minutes. Cool to approx. 55 °C and add sterile\
    \ marine supplement."
- step_number: 2
  action: MIX
  description: 'First prepare primary stocks for marine supplement stock:'
- step_number: 3
  action: AUTOCLAVE
  description: "Autoclave at 15 psi for 15 minutes. Once at room temperature add Primary\
    \ stock 2 (Vitamin\r\nmix)."
- step_number: 4
  action: FILTER_STERILIZE
  description: "Dissolve vitamins one at a time; adjust the pH to 7 with 1 M NaOH\
    \ or 1 M HCl if\r\nnecessary, to dissolve the biotin and folic acid. Filter sterilise.\
    \ Dispense excess into 1\r\nml aliquots and freeze."
