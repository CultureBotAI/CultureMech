preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Adjust pH to 7.2. Autoclave and dispense into slopes. When the agar
    has solidified, place a strip of sterile filter paper onto the surface of each
    slope. Inoculate onto the filter paper.
