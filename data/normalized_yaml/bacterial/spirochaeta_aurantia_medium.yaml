preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare Solution A and adjust its pH to 7.5 with KOH.
- step_number: 2
  action: MIX
  description: Prepare the 1 M K-phosphate buffer at about pH 7.0 from 1 M K2HPO4
    and 1 M KH2PO4 stocks.
- step_number: 3
  action: MIX
  description: For anaerobic cultivation, sparge Solutions A and B for 30-45 min with
    100% N2 gas and distribute Solution A into anoxic Hungate-type tubes or serum
    vials.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave Solutions A and B separately at 121 C for 15 min and combine
    them after sterilization.
