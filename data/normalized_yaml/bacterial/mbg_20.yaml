  description: Adjust pH to 7.0.
- step_number: 2
  action: DISSOLVE
  description: Dissolve Sea salts (Sigma) in distilled water.
- step_number: 3
  action: FILTER_STERILIZE
  description: Sterilize the Sea salts solution by filtration.
- step_number: 4
  action: AUTOCLAVE
  description: Separately autoclave Peptone, Yeast extract, and Glucose solutions.
- step_number: 5
  action: MIX
  description: Add the sterile Peptone, Yeast extract, and Glucose solutions to the
    sterile Sea salts solution.
- step_number: 6
  action: MIX
  description: Make the liquid medium anaerobic by repeated cycles, three times, of
    degassing and charging with argon.
