preparation_notes: 'Dissolve ingredients (except cysteine), then sparge medium for
  30 - 45 min with 100% N2 gas atmosphere to make it anoxic. Add cysteine, adjust
  pH to 7.1 and dispense medium under same gas atmosphere into anoxic Hungate-type
  tubes or serum vials and autoclave.  The pH of the complete medium should be 7.0
  - 7.2.


  Original volume: 1010 mL'
