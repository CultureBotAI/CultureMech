preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Dissolve ingredients (except glucose, yeast extract, vitamin solution
    and reducing agents), adjust pH to 3.5 using HCl and sparge medium with 80% N2
    and 20% CO2 gas mixture for 30 - 45 min to make it anoxic. Dispense medium under
    same gas atmosphere into anoxic Hungate-type tubes or serum vials. After autoclaving
    add glucose, yeast extract, vitamin solution, cysteine and sulfide from sterile
    anoxic stock solutions prepared under 100% N2 gas. The vitamin solution should
    be sterilized by filtration. Adjust pH of complete medium to 3.5, if necessary.
- step_number: 2
  action: ADJUST_PH
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals. Adjust final to pH 7.0 with KOH.
