preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the main salts, Modified Allen's trace metal solution, sodium thiosulfate,
    and distilled water thoroughly and adjust pH to 5.2.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base medium under an N2-CO2 (4:1, v/v) gas mixture.
- step_number: 3
  action: MIX
  description: After cooling, anaerobically and aseptically add the MgSO4, CaCl2,
    Trace vitamins, yeast extract, L-cysteine HCl, and FeCl2 solutions.
ph_value: 5.2
