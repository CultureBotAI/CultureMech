preparation_notes: 'Adjust to pH 6.8-7.2

  Note: for Agar plates, autoclave NaCl separately.  Otherwise the salts will precipitate
  and the plates not solidify properly.

  Note: especially for strains DSM 17983 and 17984, yeast extract from ThermoFisher
  has to be used. Yeast extract from other vendors might not support growth.'
