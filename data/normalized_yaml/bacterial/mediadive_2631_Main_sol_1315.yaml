preparation_notes: Distribute to gas tight vessels, gas with 90% N2 +10% CO2 to achieve
  anaerobic conditions and autoclave. After cooling, add the phosphate solution, substrate
  solution, vitamin solution and trace element solution. After mixing, pH should be
  7.1 - 7.5.
