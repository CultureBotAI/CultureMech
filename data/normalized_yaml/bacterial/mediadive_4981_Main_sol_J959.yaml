  \ the medium into culture vessels under a N2-CO2 (4:1, v/v) gas mixture, seal with\
  \ butyl rubber stoppers and autoclave. After cooling, add the following solutions\
  \ (per 935 ml of the medium) from anaerobic stocks (autoclaved or *filter-sterilized):\
  \ \n\nOriginal volume: 1009 mL"
