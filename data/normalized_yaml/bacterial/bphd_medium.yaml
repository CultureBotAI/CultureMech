preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Dissolve phosphates separately, Adjust pH to 6.5. Add cresol/phenol
    and vitamin solution after autoclaving.
- step_number: 2
  action: MIX
  description: '(e.g.: 20 ml/l of a 4.7 g/l phenol-solution)'
- step_number: 3
  action: ADJUST_PH
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals. Adjust final to pH 7.0 with KOH.
