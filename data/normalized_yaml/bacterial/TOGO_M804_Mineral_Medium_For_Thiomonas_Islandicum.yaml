preparation_steps:
- step_number: 1
  action: MIX
  description: Mix Mineral Medium for Hydrogenophilus islandicum components thoroughly
    and adjust pH to 6.8.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the basal medium.
- step_number: 3
  action: MIX
  description: After cooling, add autoclaved 0.5% MgSO4 x 7 H2O and 0.1% Fe(NH4) citrate
    solutions.
- step_number: 4
  action: ALIQUOT
  description: Aseptically distribute the medium into culture vessels, seal with butyl
    rubber stoppers, and pressurize to 100 kPa with H2-CO2 (4:1, v/v).
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH to 4.0 for JCM Medium 775.
