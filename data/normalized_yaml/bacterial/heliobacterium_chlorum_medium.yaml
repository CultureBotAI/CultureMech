preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.0 .
- step_number: 2
  action: HEAT
  description: "Boil the medium for few minutes under nitrogen gas. Add sodium ascorbate\
    \ (0.5 g) and\r\ncontinue to bubble with nitrogen gas."
- step_number: 3
  action: ADJUST_PH
  description: Adjust pH to 6.8.
- step_number: 4
  action: MIX
  description: Fill immediately about 10 ml medium in 15 mL hungate tubes (with rubber
    septum).
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
