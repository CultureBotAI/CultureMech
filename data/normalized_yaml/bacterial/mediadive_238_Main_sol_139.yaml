preparation_notes: Dissolve ingredients, adjust pH to 7.2, bring medium to the boil,
  then cool to room temperature under 100% N2 gas atmosphere. Dispense under same
  gas atmosphere into anoxic Hungate-type tubes or serum vials and autoclave.
