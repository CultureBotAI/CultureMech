preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the base with distilled water, Ferric citrate, MgSO4 x 7H2O,
    yeast extract, NaCl, CaCl2 x 2H2O, KH2PO4, NH4Cl, sodium pyruvate, and micronutrient
    solution SL7.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 6.8.
- step_number: 3
  action: MIX
  description: After autoclaving, add 1.0 ml/L vitamin B12 solution at 2 mg/ml and
    NaHCO3 to 0.1% final.
- step_number: 4
  action: MIX
  description: Use 1.0 mM final Na2S x 9H2O instead of the 2.0 mM final Na2S2O3 in
    Roseospira Medium.
