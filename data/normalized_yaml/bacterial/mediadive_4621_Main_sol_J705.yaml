preparation_notes: "Mix components and adjust pH to 7.0. Bring to a boil for several\
  \ seconds and cool down to room temperature under a stream of N2-CO2 (4:1, v/v).\
  \ Distribute the medium into culture vessels under the same gas mixture, seal with\
  \ butyl rubber stoppers and autoclave. Prior to use, add per liter the following\
  \ sterile solutions (autoclaved): \n\nOriginal volume: 1020 mL"
