notes: TOGO M203 preserves JCM Medium 210 as Modified Medium 10. TOGO M203 records
  850 ml distilled water, 0.5 g each of cellobiose, glucose, soluble starch, and Yeast
  extract from BD-Difco, 18 g agar, 2 g Trypticase peptone from BD-BBL, 0.5 ml 0.1%
  Resazurin solution, 1 ml 1.0% Hemin solution, 100 ml 4% Na2SO3 solution, 2 ml 25%
  L-Ascorbic acid solution, 10 ml 5% L-Cysteine HCl H2O solution, and VFA and salt
  stocks from Medium 10 / TOGO M124, with pH adjusted to 6.7-6.8. It uses Medium 10
  from JCM Medium 133 with 1 ml/L final 1% hemin solution and omits Toray silicone
  solution. The current JCM Medium 210 URL no longer exposes the recipe.
