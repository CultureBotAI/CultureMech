preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the basal ingredients with KH2PO4, Na2HPO4, NH4Cl, MgSO4·7H2O,
    distilled water, and agar if needed; leave pH unadjusted.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the basal ingredients.
- step_number: 3
  action: AUTOCLAVE
