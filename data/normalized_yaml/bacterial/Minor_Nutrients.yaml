notes: "Minor Nutrients solution for Snow Algae Medium and related cold-adapted algae\
  \ culture.\nProvides comprehensive micronutrient mixture including trace metals\
  \ for psychrophilic algae.\n\nPreparation: Add components in the listed order to\
  \ approximately 950 mL deionized water while stirring. The source labels this as\
  \ a 1 L total preparation and reports g/L amounts; it does not separately state\
  \ a makeup step. \n\nStorage: Refrigerator temperature; no exact temperature is\
  \ established by this source.\n\nThe source also prints a Final Concentration column\
  \ and a stock-solution footnote. Those annotations are retained as a source interpretation\
  \ issue, not asserted here as independently verified stock molarities. The structured\
  \ values use the explicit g/L Amount column. No receiving-medium dose or replacement\
  \ molarity is inferred.\n\nNote: This formulation includes a broader range of trace\
  \ elements including Ni, V, and Al\nwhich may be beneficial for cold-adapted algae\
  \ species.\n"
