notes: pH 7 Dispense the medium into suitable culture vessels, seal with butyl rubber
  stoppers, and autoclave at 121°C for 15 min. After cooling to room temperature,
  the pH is adjusted to pH 7 by adding of sterile pH-adjusting agent with a syringe
  without opening the vessel. Prior to inoculation, aseptically add the filter-sterilized
  methane gas to the vessel. The methane and air ratio in the headspace is about 1:4.
  Methane should be of high purity.
