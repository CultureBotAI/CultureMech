preparation_steps:
- step_number: 1
  action: ALIQUOT
  description: Dispense the medium into culture vessels and seal with butyl rubber
    stoppers.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 minutes.
- step_number: 3
  action: COOL
  description: Cool to room temperature.
- step_number: 4
  action: ADJUST_PH
  description: Adjust pH to 7.0 with sterile pH-adjusting agent by syringe without
    opening the vessel.
- step_number: 5
  action: FILTER_STERILIZE
  description: Filter-sterilize high-purity methane gas.
- step_number: 6
  action: MIX
  description: Before inoculation, aseptically add methane to an approximately 1:4
    methane-to-air headspace.
