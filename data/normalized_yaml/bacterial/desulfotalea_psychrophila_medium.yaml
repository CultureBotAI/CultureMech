preparation_steps:
- step_number: 1
  action: MIX
  description: DSMZ Medium 861a sparges Solution A with an 80% N2 and 20% CO2 gas
    mixture to pH below 6, dispenses it under the same gas atmosphere into serum vials,
    and autoclaves it.
- step_number: 2
  action: FILTER_STERILIZE
  description: DSMZ Medium 861a prepares Solutions B and F under 80% N2 and 20% CO2
    and prepares sterile Solutions C, D, and E under 100% N2; Solutions D and F are
    sterilized by filtration.
- step_number: 3
  action: MIX
  description: DSMZ Medium 861a completes the medium by adding appropriate amounts
    of Solutions B to F to sterile Solution A in sequence.
- step_number: 4
  action: ADJUST_PH
  description: DSMZ Medium 861a final pH should be 7.0-7.2.
