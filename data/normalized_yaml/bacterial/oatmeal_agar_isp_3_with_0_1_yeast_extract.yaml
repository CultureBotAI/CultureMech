ph_value: 7.2
preparation_steps:
- step_number: 1
  action: HEAT
  description: Cook or steam 20 g oatmeal in 1 L distilled water for 20 min, then
    filter through cheesecloth.
- step_number: 2
  action: MIX
  description: Bring the filtrate back to 1 L with distilled water, then add 1 mL
    Trace salts solution and 18 g agar.
- step_number: 3
  action: ADJUST_PH
  description: Adjust the complete medium to pH 7.2.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min.
sterilization:
