  action: DISSOLVE
  description: Suspend 44 g Columbia Blood Agar Base in 1 L deionized water and heat
    to boiling.
- step_number: 2
  action: AUTOCLAVE
  description: Sterilize in an autoclave for 15 min at 121 C.
- step_number: 3
  action: COOL
  description: Cool to 45 C, add 5% sterile defibrinated blood, and mix well.
