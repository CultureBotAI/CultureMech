notes: pH unajusted Mix ingredients except vitamin, bicarbonate, cysteine and sulfide,
  and dispense the medium into suitable culture vessels under a stream of N2/CO2 (80/20)
  and seal with butyl rubber stoppers. After autoclaving (121°C, 15 min), aseptically
  and anaerobically add vitamin solution, bicarbonate solution, and cysteine and sulfide
  solutions using sterile syringes. The bicarbonate and vitamin solutions should be
  sterilized by filtration. First dissolve NTA in 200 ml of water and adjust the pH
  to 6.5 with KOH.
