preparation_notes: 'Adjust pH to 6.0. Sterilize by filtration. Aseptically dispense
  the medium into culture vessels (e.g., 20 ml medium in 120 ml serum bottles) under
  a stream of H2-CO2 (4:1, v/v) gas mixture and seal with butyl rubber stoppers. Replace
  the gas phase with a H2-CO2-O2 (79:20:1, v/v) gas mixture and pressurize to 200
  kPa with the same gas mixture. Readjust pH to 5.5-6.0, if necessary.


  Original volume: 1020 mL'
