preparation_notes: 'Dissolve ingredients (except carbonate, pyruvate, yeast extract,
  vitamins, and reducing agents) and sparge medium with 80% N2 and 20% CO2 gas mixture
  for 30 - 45 min to make it anoxic. Dispense medium under same gas atmosphere into
  anoxic Hungate-type tubes or serum vials and autoclave. Add pyruvate, yeast extract,
  vitamins, cysteine, and sulfide from sterile anoxic stock solutions prepared under
  100% N2 gas and carbonate from a sterile anoxic stock solution prepared under 80%
  N2 and 20% CO2 gas atmosphere. Stock solutions of vitamins and pyruvate should be
  sterilized by filtration. The pH of the complete medium should be 7.0.

  Note: Use 10% (v/v) as inoculum.


  Original volume: 1002 mL'
