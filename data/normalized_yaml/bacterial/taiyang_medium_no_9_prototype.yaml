preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve all Artifical Sea Water components in water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the Artifical Sea Water at 121 C for 20 min and store at
    room temperature.
- step_number: 3
  action: FILTER_STERILIZE
  description: Dissolve 50 mg Haemin in 1 ml 1 N NaOH, make up to 100 ml with distilled
    water, filter sterilize, and store refrigerated.
- step_number: 4
  action: MIX
  description: Mix clarified rumen fluid, 50 ml Artifical Sea Water, peptone, yeast
    extract, NaCl, cellulose, pectin, starch, inulin, dextrin, agar, and water; leave
    out trehalose, sodium pyruvate, L-Cysteine HCl, sheep blood, and Haemin solution
    until after autoclaving.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave the main medium at 121 C for 15 min.
- step_number: 6
  action: MIX
  description: Add filter-sterilized trehalose, sodium pyruvate, L-Cysteine HCl, and
    Haemin solution, then add sheep blood after autoclaving.
- step_number: 7
  action: STORE
  description: Place the completed medium or agar in an anaerobic workstation before
    use.
sterilization:
  method: AUTOCLAVE
  notes: The main medium is autoclaved; trehalose, sodium pyruvate, L-Cysteine HCl,
    sheep blood, and Haemin solution are added after autoclaving.
