notes: TOGO M2056 imports NBRC Medium 1357 as B-CYE alpha agar medium. NBRC 1357 lists
  10 g yeast extract, 0.4 g L-Cysteine hydrochloride, 0.25 g soluble iron pyrophosphate,
  2 g activated carbon, 10 g ACES, 1 g alpha-Ketoglutarate potassium, 15 g agar, 1
  L distilled water, and pH 6.9. NBRC 1357 notes that the prepared E-MP96 medium is
  available from Eiken Chemical Co., Ltd.
