preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except cysteine and vitamins), sparge medium
    with 100% N2 gas for 30 - 45 min to make it anoxic. Then add cysteine, adjust
    pH to 7.0, dispense medium under the same gas atmosphere in anoxic Hungate-type
    tubes or serum vials, and autoclave. After sterilization, add vitamins from a
    sterile anoxic stock solution prepared under 100% N2 gas and sterilized by filtration.
    Check the pH of the complete medium and adjust to 7.0 if necessary.
- step_number: 2
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
- step_number: 3
  action: ADJUST_PH
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals. Adjust final to pH 7.0 with KOH.
applications:
- Microbial cultivation
