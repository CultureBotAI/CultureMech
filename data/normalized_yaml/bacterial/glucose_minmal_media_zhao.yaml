    not identify strain designations or provide full formulas. MediaDB's BW25113 and
    BW25113_zwf- assignments are secondary discovery leads, not independently strain-verified
    paper assertions. The carbon-source distinction supports study relevance, not
    exact identity of every local trace ingredient or amount. Formulation-unresolved;
    retain the two existing owners without creating a redundant variant or new growth
    assertion. Local pair MEDIADB:128/129 substitutes glucose with acetate while thirteen
    other ingredient entries agree; source-specific amounts and chemical forms remain
    unverified. Inventory covers the inspected medium-relevant passages, not every
