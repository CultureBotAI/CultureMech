preparation_steps:
- step_number: 1
  action: MIX
  description: Mix all ingredients except Acetoin and Na2S x 9H2O, including 1 ml/L
    Trace element solution SL-10.
- step_number: 2
  action: MIX
  description: Dispense the medium into suitable culture vessels under an N2/CO2 gas
    stream at 80:20 by volume and seal with butyl rubber stoppers.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the dispensed medium, and separately autoclave the 3.6% Na2S
    x 9H2O solution under an N2 atmosphere.
- step_number: 4
  action: FILTER_STERILIZE
  description: Prepare a filter-sterile Acetoin solution.
- step_number: 5
  action: MIX
  description: Aseptically and anaerobically add the sterile Na2S x 9H2O solution,
    and add filter-sterile Acetoin just before inoculation.
- step_number: 6
  action: ADJUST_PH
  description: Adjust the complete medium to pH 7.2.
