preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Suspend 400 g farm soil in 1 L distilled water and autoclave for 30
    min to prepare Soil extract.
- step_number: 2
  action: FILTER
  description: Remove solids by filtration to prepare Soil extract.
- step_number: 3
  action: MIX
  description: Combine 2 g/L Yeast extract, 1 g/L Bacto Tryptone (Difco), 1 g/L Sodium
    acetate, 50 ml/L Soil extract, and 950 ml/L Distilled water.
- step_number: 4
  action: MIX
  description: Add 15 g/L agar when solid NBRC Medium 220 is needed.
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH to 7.4.
