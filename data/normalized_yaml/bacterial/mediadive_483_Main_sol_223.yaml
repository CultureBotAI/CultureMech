preparation_notes: 'Adjust pH to 7.2 (use pH indicator-paper).

  Aseptically add one or more sterile strips of filter paper to slants or plates.
  Inoculate the filter papers with a small (5 mm x 5mm) agar cube or a piece of filter
  paper overgrown with the strain.'
