preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the base components with Trace minerals and 0.1% Na2SeO3 solution
    and bring the volume to 1.0 L.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the base medium to pH 7.0.
- step_number: 3
  action: ALIQUOT
  description: Dispense the medium into culture vessels under N2 gas, for example
    10 ml medium in Hungate tubes, and seal with butyl rubber stoppers.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 degrees C for 15 min.
- step_number: 5
  action: COOL
  description: Cool after autoclaving.
- step_number: 6
  action: MIX
  description: Aseptically and anaerobically add filter-sterilized Trace vitamins
    and 1 M Sodium thiosulfate stocks per liter.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Autoclave the sealed base under N2. Add the filter-sterilized Trace vitamins
    and Sodium thiosulfate stocks aseptically and anaerobically after cooling.
