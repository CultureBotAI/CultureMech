preparation_steps:
- step_number: 1
  action: MIX
  description: Mix main-solution components including FeCl2 solution, Trace element
    solution, and 967.118 ml/L distilled water under a N2 atmosphere.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the main solution under a N2 atmosphere.
- step_number: 3
  action: MIX
  description: After cooling, add 1.93424 ml/L 10% CaCl2 x 2 H2O solution, 19.3424
    ml/L 12.5% Na2S2O3 x 5 H2O solution, and 9.67118 ml/L 5% Na2S x 9 H2O solution
    from sterile anaerobic stocks stored under N2; the thiosulfate stock is filter-sterilized.
- step_number: 4
  action: ADJUST_PH
  description: Adjust pH to 6.7-6.8 if necessary.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: JCM's default instruction is to autoclave media at 121 C for 15 min.
