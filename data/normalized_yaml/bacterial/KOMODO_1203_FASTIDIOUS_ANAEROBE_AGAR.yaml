  description: Autoclave the mixed medium at 121 C for 15 min.
- step_number: 3
  action: COOL
  description: Cool the sterilized medium to 47 C.
  temperature:
    value: 47.0
    unit: CELSIUS
- step_number: 4
  action: MIX
  description: Aseptically add 5-10% sterile defibrinated horse blood, mix well, and
    pour plates.
