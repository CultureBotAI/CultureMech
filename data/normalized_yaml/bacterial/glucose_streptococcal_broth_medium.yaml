notes: TOGO M2884 lists glucose streptococcal broth as 1 L distilled water, 5 g yeast
  extract, 7.2 g Sodium-beta-glycerophosphate, 10 g glucose, 10 g meat extract, 5
  g tryptose, and 5 g tryptone. TOGO cites Arendt et al. 1994 for Lactococcus lactis
  strains grown at 30 C in M17 medium supplemented with glucose or glucose streptococcal
  broth.
