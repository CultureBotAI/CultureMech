preparation_steps:
- step_number: 1
  action: MIX
  description: Add all basal medium ingredients without vitamins.
- step_number: 2
  action: MIX
  description: Sparge medium with 80% N2 and 20% CO2 gas mixture for 10 min Bubble
    the medium with N2:CO2 (80:20) to make anoxic.
- step_number: 3
  action: ADJUST_PH
  description: Adjust pH to 6.8-7.0.
- step_number: 4
  action: POUR_PLATES
  description: Dispense into serum bottles (using 10ml medium in 100 ml bottles with
    N2:CO2 headspace).
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
- step_number: 6
  action: MIX
  description: After autoclaving, add the following solutions to a final volume of
    10ml/L each.
- step_number: 7
  action: STORE
  description: 'Note: This medium should not be exposed to direct sunlight! Store
    out of direct light.'
applications:
- Microbial cultivation
