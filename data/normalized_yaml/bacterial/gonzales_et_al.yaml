    Growth-on-acetate methods explicitly link Gabara DSM 2160 to Text S1 Table 1;
    Figure 2 of that supplement reports actual cultivation, unlike the separate model
    predictions. Text S1 pages 2-3 were visually checked against the PDF. Its thirteen
    table entries numerically correspond to the local molar amounts after unit scaling,
    but chemical-form identity remains unresolved: the source specifies calcium chloride
    dihydrate and ferrous sulfate heptahydrate where local labels explicitly say anhydrous,
    plus hydrated magnesium, copper and zinc sulfates and unusual phosphate-hydrate
    labels. The phosphate entries are retained as printed in the archived table, not
    silently swapped or corrected. The source table reports pH 9.2, absent from the
    native recipe. These may represent import/chemical-form errors rather than biological
    medium variants; do not manufacture a resolved variant before reconciling identity.
    The source''s later Table S4 reference is inconsistent with its explicit Text
    S1 Table 1 citation; both locators are retained as a source discrepancy. Analytical
    TOC, oxygen-consumption and extraction reagents are not medium ingredients. HTML
    formula images leave gaps in Markdown and are not reconstructed from guesses.
    Local category bacterial conflicts with the verified archaeal study organism;
    classification correction remains a separate unresolved finding. Historical source/owner
    spelling Gonzales differs from primary Gonzalez; DOI, title and year establish
    identity. No parent-medium growth or concentration certification is added. MEDIADB:175
    remains the authoritative owner; inherited preparation and classification are
    not recertified. See Text S1 chemical-form comparison, not a new resolved variant.
    Inventory covers the inspected medium-relevant passages, not every organism in
    the full paper or its bibliography. Correction/retraction coverage is limited
    to inspected publication metadata. Bounded taxonomy misses do not establish absence.
    All original ingredients, amounts, preparation, history and links are preserved,
    not newly certified. No new native growth assertion, resolved variant or concentration
    evidence.'
