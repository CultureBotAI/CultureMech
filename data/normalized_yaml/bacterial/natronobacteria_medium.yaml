preparation_steps:
- step_number: 1
  action: MIX
  description: Add distilled water to give a final volume of 1000 ml.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 6.5 before autoclaving!
- step_number: 3
  action: ADJUST_PH
  description: Sterilize Na2CO3 separate from medium, add after cooling. Check final
    pH to be 9.0 - 9.5.
- step_number: 4
  action: DISSOLVE
  description: If agar medium is prepared, heat and dissolve agar before adding sodium
    chloride.
- step_number: 5
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
