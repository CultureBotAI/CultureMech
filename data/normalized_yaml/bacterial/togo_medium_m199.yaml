preparation_steps:
- step_number: 1
  action: MIX
  description: Mix ingredients, except sulfur and Na2S·9H2O, and adjust pH to 6.5
    with H2SO4.
- step_number: 2
  action: FILTER
  description: Sterilize by filtration while gassing with H2-CO2 (80:20) gas mixture.
- step_number: 3
  action: HEAT
  description: Steam sulfur for 3 hr on each of 3 successive days.
- step_number: 4
  action: AUTOCLAVE
  description: Neutralize Na2S·9H2O as a 5% solution, and autoclave under a N2 atmosphere.
- step_number: 5
  action: MIX
  description: Aseptically and anaerobically add sterile sulfur to the medium under
    a H2-CO2 (80:20) atmosphere.
- step_number: 6
  action: MIX
  description: Prior to inoculation, add the sterile Na2S·9H2O solution.
