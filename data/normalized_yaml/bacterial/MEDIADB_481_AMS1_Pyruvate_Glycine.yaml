  title: Methane production by phosphate-starved SAR11 chemoheterotrophic marine bacteria.
  authors: Carini P; White AE; Campbell EO; Giovannoni SJ
  year: 2014
  notes: 'source_type=journal_article; accessed_on=2026-10-13; discovery_mode=MediaDB_source_cross_reference;
    MediaDB sourceID=151; medID=481. The source SQL title/year/PMID and exact medium
    ID/name were verified; its growth rows are discovery provenance, not growth evidence.
    The old import event''s generic Mazumdar et al. citation is retained as historical
    provenance; the specific study source is Carini et al. 2014. No relevant correction/retraction
    notice occurs in the archived PubMed entries. PMID:25000228. Main paper HTML/Markdown=references_cache/papers/primary_html/carini-2014-methane-publisher.{html,md};
    PDF/Markdown=references_cache/papers/primary_pdf/carini-2014-methane.{pdf,md};
    supplement PDF/Markdown=references_cache/papers/primary_pdf/carini-2014-methane-supplement.{pdf,md};
    PubMed abstract=references_cache/papers/PMID_25000228.md. Formulation scope=Figures
    1-2 alternate-P utilization, Methods p.5; not the 10 micromolar MPn methane experiment
    or microarray assays. Supplementary Tables 1-5 concern gene expression and add
    no recipe formulation here. Parent ingredients and generic preparation are retained,
    not certified. Variant-only growth is not published because the current KGX exporter
    does not preserve scoped_to_variant. The paper does not specify D/L stereochemistry
    for this phosphorus substrate; do not certify the parent''s stereoisomer. Organism
    inventory is limited to the inspected main-paper abstract, Introduction, Results,
    Methods and figure captions, excluding its bibliography and generic community/class
    descriptions. Experimental Pelagibacterales sp. strain HTCC7211 maps to Candidatus
    Pelagibacter sp. HTCC7211, NCBITaxon:439493, actual rank=species, taxonomy_match=exact_named_taxon;
    retain strain=HTCC7211. Experimental ''Candidatus Pelagibacter ubique'' strain
    HTCC1062 maps to Candidatus Pelagibacter ubique HTCC1062, NCBITaxon:335992, rank=strain,
    taxonomy_match=exact_strain. Results p.2 excerpt=''Strain HTCC1062 grew on P i
    and did not use added DOP''. The five organic-P treatments did not exceed the
    no-added-Pi control; increased yield with phosphite had unresolved trace-phosphate,
    abiotic-oxidation or enzymatic explanations. The latter is not certified as phosphite
    utilization, and no positive HTCC1062 association is added here. Methods p.6 microarray-probe
    mention HTCC1002 maps to Candidatus Pelagibacter ubique HTCC1002, NCBITaxon:314261,
    rank=strain; probe design only, not cultivation in these assays. Introduction
    p.2 background mentions, with exact name excerpts and verified taxonomy: ''Nitrosopumilus
    maritimus SCM1'' -> NCBITaxon:436308 (same canonical name, strain); ''Trichodesmium
    erythraeum IMS101'' -> NCBITaxon:203124 (same canonical name, strain); ''Escherichia
    coli'' -> NCBITaxon:562 (same name, species); ''Pseudomonas'' -> NCBITaxon:286
    (same name, genus); ''Trichodesmium'' -> NCBITaxon:1205 (same name, genus); ''Vibrionales''
    -> NCBITaxon:135623 (same name, order); ''Rhodobacterales'' -> NCBITaxon:204455
    (same name, order); ''Pelagibacterales'' / SAR11 -> NCBITaxon:54526 (canonical
    Candidatus Pelagibacterales, order; NCBI equivalent/included names checked). These
    contextual taxa have no new growth edges; genus/order mentions are not expanded
    into species. Taxonomy lookup_on=2026-10-13; https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=338192,204455,203124,198252,135623,54526,1205,286,439493,436308,314261,335992,562&retmode=xml;
    archived XML=references_cache/papers/taxonomy/carini-phosphorus-20261013.xml. '
