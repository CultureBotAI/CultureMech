    to one ChEBI molecule.
- preferred_term: Distilled water
  concentration:
    value: '800'
    unit: ML_PER_L
  source: JCM Medium 1305
  notes: JCM Medium 1305 lists 80.0 ml distilled water in the source batch; this row
    is normalized 10x to one liter.
  term:
    id: CHEBI:15377
    label: water
  mediaingredientmech_chebi_term:
    id: CHEBI:15377
    label: water
- preferred_term: Conc. HCl
  concentration:
    value: '1.35'
    unit: ML_PER_L
  source: JCM Medium 1305
  notes: JCM Medium 1305 adds 135 microliter concentrated HCl after autoclaving; this
    row is normalized 10x to one liter.
  term:
    id: CHEBI:17883
    label: hydrogen chloride
  mediaingredientmech_chebi_term:
    id: CHEBI:17883
    label: hydrogen chloride
- preferred_term: Fetal bovine serum (Biowest; heat inactivated)
  concentration:
    value: '200'
    unit: ML_PER_L
  source: JCM Medium 1305
  notes: JCM Medium 1305 aseptically adds 20.0 ml heat-inactivated fetal bovine serum
    from Biowest; this row is normalized 10x to one liter.
- preferred_term: Vitox (Oxoid)
  concentration:
    value: '20'
    unit: ML_PER_L
  source: JCM Medium 1305
  notes: JCM Medium 1305 aseptically adds 2.0 ml Vitox prepared from one Oxoid vial
    in 10 ml rehydration fluid; this row is normalized 10x to one liter.
- preferred_term: Skirrow supplement (Oxoid)
  concentration:
    value: '4'
    unit: ML_PER_L
  source: JCM Medium 1305
  notes: JCM Medium 1305 aseptically adds 0.4 ml Skirrow supplement prepared from
    one Oxoid vial in 2 ml sterile purified water; this row is normalized 10x to one
    liter.
- preferred_term: Amphotericin B (5 mg/ml DMSO)
  concentration:
    value: '1'
    unit: ML_PER_L
  source: JCM Medium 1305
  notes: JCM Medium 1305 aseptically adds 100 microliter of the 5 mg/ml amphotericin
    B in DMSO stock; this row is normalized 10x to one liter and represents a stock
    solution, not neat amphotericin B.
preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Autoclave Brucella broth in distilled water and cool to 50 C.
- step_number: 2
  action: MIX
  description: Aseptically add concentrated HCl, heat-inactivated fetal bovine serum,
    Vitox, Skirrow supplement, and amphotericin B in DMSO at the JCM Medium 1305 proportions.
- step_number: 3
  action: MIX
  description: For stable culture, incubate 5 ml broth in a 25 cm2 polystyrene culture
    flask at 37 C under 5% O2 and 12% CO2 with shaking at 50 rpm.
