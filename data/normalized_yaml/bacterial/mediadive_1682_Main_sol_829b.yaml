preparation_notes: 'Dissolve ingredients (except carbonate, yeast extract, vitamins,
  growth-stimulating factors and Na-dithionite), boil medium for 1 min, then cool
  to room temperature under 80% H2 and 20% CO2 gas atmosphere. Adjust pH to 6.0 and
  dispense medium under same gas atmosphere into anoxic Hungate-type tubes or serum
  vials to 30% of their volume and autoclave. Add yeast extract, vitamins, and growth-stimulating
  factors from sterile anoxic stock solutions prepared under 100% N2 gas atmosphere
  and carbonate and Na-dithionite  from sterile anoxic stock solution prepared under
  80% N2 and 20% CO2 gas mixture. Vitamins and Na-dithionite are sterilized by filtration.
  Adjust pH of the complete medium to 6.5, if necessary.

  After inoculation use 2 bar overpressure of sterile 80% H2 and 20% CO2 gas mixture.


  Original volume: 1005 mL'
