preparation_steps:
- step_number: 1
  action: MIX
  description: Mix 1 L Modified Wolfe's solution with 10 ml Trace minerals.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base at 121 degrees C for 15 min.
- step_number: 3
  action: FILTER_STERILIZE
  description: 'Aseptically add sterile stocks per liter: 10 ml 1 M MES solution,
    5 ml filter-sterilized 1 M NaHCO3 solution, 10 ml filter-sterilized Trace vitamins,
    and 10 ml filter-sterilized 1 M Na2S2O3 x 5H2O solution.'
- step_number: 4
  action: ADJUST_PH
  description: Check the final pH is 6.0-6.5.
- step_number: 5
  action: ALIQUOT
  description: Dispense into culture vessels, replace the gas phase with N2-CO2-O2
    (79:20:1, v/v/v), and seal with butyl rubber stoppers.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Filter-sterilize the starred NaHCO3, Trace vitamins, and Na2S2O3 x 5H2O stocks
    separately before aseptic addition.
