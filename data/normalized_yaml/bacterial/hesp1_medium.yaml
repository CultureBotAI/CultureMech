preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix components thoroughly, distribute the medium into culture vessels
    (e.g., 5 ml of the medium in the Hungate tubes) under a N2-CO2 (4:1, v/v) gas
    mixture, seal with butyl rubber stoppers and autoclave. After cooling, add per
    liter the following solutions from anaerobic stocks (autoclaved or *filter-sterilized).
    Prior to use adjust pH to 7.0 - 7.2.
- step_number: 2
  action: DISSOLVE
  description: Dissolve FeCl2 x 4H2O first in HCl. Then dilute in distilled water
    and add the remaining salts.
applications:
- Microbial cultivation
