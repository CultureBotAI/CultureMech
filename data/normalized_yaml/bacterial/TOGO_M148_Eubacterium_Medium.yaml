notes: TOGO M148 imports JCM_M157 as Eubacterium Medium and lists 1 L distilled water,
  10 g yeast extract, 1.3 g sodium thioglycolate, 0.3 g beef brain powder, and 29.5
  g Fluid thioglycolate (BD-BBL). MediaDive J157 preserves the same JCM formula as
  1000 ml water with the same four dry-component amounts. The JCM GRMD=157 URL named
  by TOGO and MediaDive no longer returns the recipe; no pH, incubation condition,
  or preparation steps are available from these accessible source records.
