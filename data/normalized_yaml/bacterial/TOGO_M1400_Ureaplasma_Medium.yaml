preparation_steps:
- step_number: 1
  action: MIX
  description: Mix PPLO broth w/o Crystal Violet, 1% Phenol red solution, Hipolypepton,
    and distilled water at the JCM Medium 1303 ratios.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the base to pH 6.0-6.2.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the base at 121 C for 15 min.
- step_number: 4
  action: COOL
  description: Cool the autoclaved base to 50-55 C.
- step_number: 5
  action: MIX
  description: Aseptically add filter-sterilized heat-inactivated bovine calf serum
    and 1% Urea - 4% yeast extract solution.
- step_number: 6
  action: ALIQUOT
  description: Dispense the completed medium into sterilized plastic tubes, for example
    5 ml medium in 15 ml tubes, and inoculate with 100-200 microliter culture solution
    before incubation.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Autoclave the base before cooling to 50-55 C and aseptically adding filter-sterilized
    bovine calf serum and 1% Urea - 4% yeast extract solution.
culture_vessel: sterilized 15 ml plastic tubes
