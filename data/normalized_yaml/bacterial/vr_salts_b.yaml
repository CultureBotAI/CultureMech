id: CultureMech:004981
name: vr_salts_b
original_name: VR salts B
category: bacterial
record_kind: SOLUTION
medium_type: DEFINED
composition_type: DEFINED
physical_state: LIQUID
notes: Rogosa 1969 defines VR salts solution B as a one-liter stock made from magnesium,
  calcium, iron, zinc, manganese, cobalt, vanadium, molybdate, and copper salts, HCl,
  nitrilotriacetic acid, distilled water, and 10 N NaOH to dissolve the NTA. KOMODO
  imported only the NaOH pH-buffer note for this submedium.
preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve the magnesium, calcium, iron, zinc, manganese, cobalt, vanadium,
    molybdate, and copper salts in about 700 ml water by applying heat and adding
    2 ml HCl.
- step_number: 2
  action: ADJUST_PH
  description: Separately add nitrilotriacetic acid to 300 ml distilled water with
    stirring and add 10 N NaOH until the pH tends to stabilize at 7.0 to 7.4 and the
    NTA dissolves.
- step_number: 3
  action: MIX
  description: Slowly add the NTA solution to the stirred mixed-salts solution until
    the stock becomes fairly clear.
- step_number: 4
  action: MIX
  description: Adjust the volume of VR salts solution B to 1 liter.
- step_number: 5
  action: FILTER
  description: Filter VR salts solution B through paper.
- step_number: 6
  action: STORE
  description: Refrigerate the filtered VR salts solution B stock.
