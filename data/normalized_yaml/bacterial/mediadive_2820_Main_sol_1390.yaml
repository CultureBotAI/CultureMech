preparation_notes: 'Adjust ph to 7.0

  Prepare the medium under N2 gas without the NaHCO3, Na2S x 9 H2O, VA-Vitamin solution
  and vitamin B12. Autoclave and add the VA-Vitamin solution and vitamin B12 from
  a filter-sterilised stock solution and the NaHCO3, Na2S x 9 H2O, from sterile stock
  solutions. The final pH of the medium should be 7.0.'
