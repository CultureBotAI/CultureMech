  Commercial Product: LB Medium (Luria-Bertani, Miller formulation)
  Supplier: Multiple suppliers (Difco, Sigma, etc.)
  Catalog: Multiple (L3522 Sigma, 244520 BD)
  Source: https://www.laboratorynotes.com/preparation-of-luria-bertani-lb-miller-broth/
  Accessed: 2026-03-28

  Constituent composition researched from product specification.

  False LB constituent expansion is withdrawn. Source-specific amounts and preparation boundaries supersede flattened concentrations. Existing chemical annotations and earlier history are preserved, not recertified; no organism-growth association is added.

  Source preparation context (main preparation): Heat if necessary to dissolve the medium completely. Sterilize by autoclaving at 15 lbs. pressure (121°C) for 10 minutes.

  Source preparation context (main preparation): Cool to 45 °C or below and aseptically add 1 vial ofMiddlebrook ADC Growth Supplement. Mix well before dispensing.
