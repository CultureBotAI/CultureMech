preparation_steps:
- step_number: 1
  action: MIX
  description: Mix Artificial sea water (ASW) 2x, HEPES, and a magnetic stir bar,
    then fill to 650 ml with MilliQ water.
- step_number: 2
  action: MIX
  description: Wash the Bacto agar with ultrapure water, allow the agar to settle,
    remove the overlaying water, and repeat the wash twice.
- step_number: 3
  action: AUTOCLAVE
  description: Directly before autoclaving, mix agar and liquid, autoclave, cool to
    60 C, and hold at 55 C.
- step_number: 4
  action: MIX
  description: Add sterile Trace element solution SL-8, Selenite-tungstate solution
    II, phosphate, ammonium, glucose, cellobiose, yeast extract, Casamino acids, Tryptone
    peptone, magnesium chloride, and magnesium sulfate stocks.
- step_number: 5
  action: MIX
  description: Adjust to pH 7.5 with sterile 1 M HCl or 1 M NaOH, then add sterile
    MilliQ water to a final volume of 700 ml while avoiding bubbles.
