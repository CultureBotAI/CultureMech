notes: "Macro Component 1 for J Medium (UTEX).\nFirst of two macronutrient stock solutions\
  \ for J Medium.\nProvides nitrogen and phosphorus sources, plus buffering capacity.\n\
  \nPreparation: Add components in the listed order to approximately 900 mL deionized\
  \ water while stirring. Adjust pH to 8.5-8.8; the source does not specify a titrating\
  \ reagent. Make up to a final volume of 1 L. \n\nStorage: Refrigerator temperature;\
  \ no exact temperature is established by this source.\n\nThe source also prints\
  \ a Final Concentration column and a stock-solution footnote. Those annotations\
  \ are retained as a source interpretation issue, not asserted here as independently\
  \ verified stock molarities. The structured values use the explicit g/L Amount column.\
  \ No receiving-medium dose or replacement molarity is inferred.\n\nNote: Tricine\
  \ provides buffering capacity to maintain pH in the alkaline range\nsuitable for\
  \ freshwater algae.\n"
