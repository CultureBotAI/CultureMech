preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Mix 0.2 g NaNO2, 2.0 g MES, 100 ml Stock solution, and 1.0 ml Trace
    element solution in 900 ml distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 6.3.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min.
