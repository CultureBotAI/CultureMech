preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Dissolve Bacto peptone, beef extract, yeast extract, glucose, NaCl,
    soluble starch, L-cysteine hydrochloride monohydrate, and sodium acetate in 1.0
    L distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 6.8.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min.
