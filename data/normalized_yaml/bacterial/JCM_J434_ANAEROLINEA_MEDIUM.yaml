preparation_steps:
- step_number: 1
  action: MIX
  description: Use Medium No. 284 supplemented with final 1.0 ml Trace vitamins solution
    in Solution A (per 900 ml), and with 7.2 g sucrose in Solution B (per 100 ml)
    instead of sodium pyruvate. Otherwise, prepare the medium as described in the
    recipe of Medium No. 284.
- step_number: 2
  action: MIX
  description: 'Comment: For strains JCM 12577 and JCM 12578, incubate with a 10%
    inoculum.'
