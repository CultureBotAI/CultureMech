preparation_notes: Thiamine hydrochloride may be replaced by 2 g/l yeast extract.
  The pH of the medium is adjusted to pH 9.0 with filter sterilised 10% Na2CO3. 10
  ml sterile methanol (filter sterilised, or autoclaved in crimp top sealed bottles)
  is added to the sterilised medium.
