preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients except thiosulfate and adjust the pH to 6.6. Dispense
    in suitable culivation vials and autoclave. Add thiosulfate to the autoclaved
    medium from a sterile stock solution.
