preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: "Dispense nutrient and vitamin solutions separately into 10 ml and\
    \ 1 ml respectively \r\nand autoclave at 15 psi for 15 minutes.  Add an aliquot\
    \ of each aseptically to 10\r\nlitres of sterilised seawater."
- step_number: 2
  action: MIX
  description: Make up to 1 litre with distilled water.
- step_number: 3
  action: MIX
  description: Make up to 100 ml with distilled water.
- step_number: 4
  action: MIX
  description: "Make  up  to 100  ml with distilled  water.  This solution is  normally\
    \ \r\ncloudy.  Acidify with a few drops of conc. HCl to give a clear solution."
