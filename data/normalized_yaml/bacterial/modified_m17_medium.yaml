notes: 'TOGO M2214 describes Modified M17 medium with glucose replacing lactose: 1000
  ml distilled water, 1 ml 1.0 M MgSO4.7H2O, 0.5 g ascorbic acid, 19 g beta-disodium
  glycerophosphate, 5 g glucose, 2.5 g BBL yeast extract, 5 g BBL beef extract, 5
  g BBL Polypeptone, and 5 g BBL Phytone peptone per liter. The broth is autoclaved
  at 121 C for 15 min and has pH 7.15 +/- 0.05 at 22 to 25 C.'
