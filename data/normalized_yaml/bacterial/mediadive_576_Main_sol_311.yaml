preparation_notes: 'Dissolve ingredients (except phosphates, carbonate, vitamins,
  cysteine and sulfide) and sparge medium with 80% N2 and 20% CO2 gas mixture for
  30 - 45 min to make it anoxic. Dispense medium under same gas atmosphere into anoxic
  Hungate-type tubes or serum vials and autoclave. Add phosphates, vitamins (sterilized
  by filtration), cysteine and sulfide to the medium after autoclaving from sterile
  stock solutions prepared under 100% N2 gas and carbonate from a sterile anoxic stock
  solution prepared under 80% N2 and 20% CO2 gas mixture. Adjust pH of complete medium
  to pH 7.0, if necessary.


  Original volume: 1005 mL'
