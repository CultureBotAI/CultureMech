preparation_steps:
- step_number: 1
  action: MIX
  description: Mix tryptone, yeast extract, natural seawater, and distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 7.0.
- step_number: 3
  action: COOL
  description: Bring the medium to a boil and cool under an N2 gas atmosphere.
- step_number: 4
  action: ALIQUOT
  description: Distribute the medium in culture vessels under N2 and seal with butyl
    rubber stoppers.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave at 121 degrees C for 15 min.
