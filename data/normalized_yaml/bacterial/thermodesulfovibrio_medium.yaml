preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare JCM Medium 284 Solution A without yeast extract by mixing salts,
    trace stocks, resazurin, and 900 ml distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust Solution A to pH 6.5 before bicarbonate addition.
- step_number: 3
  action: HEAT
  description: Bring Solution A to a boil and cool under N2-CO2 (80:20, v/v).
- step_number: 4
  action: AUTOCLAVE
  description: Add bicarbonate to Solution A, distribute into culture vessels under
    N2-CO2, seal with butyl rubber stoppers, autoclave, and stand overnight.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave Solutions B and C under a N2 atmosphere.
- step_number: 6
  action: MIX
  description: Aseptically add Solution B, Solution C, L-cysteine stock, and Na2S
    stock to the culture vessels under anaerobic conditions.
applications:
- Microbial cultivation
