preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve Bacto Casitone and Yeast extract in Seawater.
- step_number: 2
  action: MIX
  description: Add Agar when a solid SP5 medium is needed.
- step_number: 3
  action: ADJUST_PH
  description: Bring SP5 Medium to pH 7.2.
