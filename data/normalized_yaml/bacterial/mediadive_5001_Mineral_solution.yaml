preparation_notes: 'Adjust pH to 6.0 with KOH.

  Comment: Consistent growth in serum tubes requires pretreatment of butyl rubber
  stoppers by boiling in 1% sodium sulfide solution (1 hr) followed by boiling in
  distilled H2O (1 hr, twice).'
