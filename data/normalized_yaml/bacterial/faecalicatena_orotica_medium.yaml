preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients and adjust pH to 7.5. Sparge medium with 100%
    N2 gas for 30 - 45 min to make it anoxic. Distribute medium under same gas atmosphere
    in anoxic Hungate-type tubes or serum vials and autoclave.
