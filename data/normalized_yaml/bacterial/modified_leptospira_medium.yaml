preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve 0.3 g Peptone, 0.2 g Beef Extract, 0.5 g NaCl, and 1.5 g Agar
    in 900 ml DI Water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the base to pH 7.4.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min.
- step_number: 4
  action: MIX
  description: Cool the base to 50 C and aseptically add sterile Supplement A.
- step_number: 5
  action: ADJUST_PH
  description: Adjust the final medium to pH 7.3 +/- 0.1.
sterilization:
  method: AUTOCLAVE
