  Provider aerobic=true and pH=7.5 metadata disagree with the linked DSMZ anoxic preparation and complete-medium pH 6.8-7.0. Retain provider scope without asserting a resolved oxygen requirement.

  The linked original uses anoxic preparation; its individual stock inputs and strain instructions must not silently replace this provider's reported medium rates.

  Linked original instruction (For DSM 1093, DSM 1125, DSM 11977, DSM 11978, DSM 11995, DSM 16643): Supplement medium after autoclaving with 1 ml/l Wolin's vitamin solution (10x, see medium 120), 0.30 g/l DL-dithiothreitol, and 0.15 g/l coenzyme M (2-mercaptoethanesulfonic acid) from anoxic stock solutions sterilized by filtration. Omit Na2S x 9 H2O and L-Cysteine HCl x H2O. This is a separate source/strain prescription, not an overwrite of the KOMODO table or new growth evidence. Any disagreement remains explicit.

  Linked original instruction (For DSM 16632): Replace sludge fluid with the same volume of clarified rumen fluid (see medium 1310) and supplement medium with 2.00 g/l Trypticase peptone and 10.00 ml/l of Wolin's vitamin solution (see medium 141). This is a separate source/strain prescription, not an overwrite of the KOMODO table or new growth evidence. Any disagreement remains explicit.

