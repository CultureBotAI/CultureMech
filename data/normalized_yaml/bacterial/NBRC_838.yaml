  as 5% solutions under a N2 atmosphere. Aseptically and anaerobically add filter-sterile
  vitamin solution to the medium. Prior to inoculation, add the sterile Na2S·9H2O
  and cysteine-HCl solutions, and adjust pH to 6.8. Wako Pure Chemicals Ind. Ltd.,
  Osaka, Japan. Adjust pH to 7.0 with 1 N KOH
