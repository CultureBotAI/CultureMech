preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix ingredients except Trace vitamins, Na2S·9H2O, and Cysteine-HCl;
    autoclave the basal medium under an N2/CO2 (80/20) atmosphere.
- step_number: 2
  action: AUTOCLAVE
  description: Separately autoclave Na2S·9H2O and Cysteine-HCl as 5% solutions under
    an N2 atmosphere.
- step_number: 3
  action: FILTER_STERILIZE
  description: Filter-sterilize the Trace vitamins stock solution and add it aseptically
    and anaerobically to the autoclaved basal medium.
- step_number: 4
  action: ADJUST_PH
  description: Before inoculation, add the sterile Na2S·9H2O and Cysteine-HCl solutions
    and adjust the final medium to pH 6.8.
- step_number: 5
  action: ADJUST_PH
  description: Prepare the Trace mineral solution by dissolving nitrilotriacetic acid,
    adding mineral salts, and adjusting the stock to pH 7.0 with 1 N KOH.
