preparation_steps:
- step_number: 1
  action: MIX
  description: Rehydrate and grow lyophilized cells from the ampoule in 5 ml liquid
    broth 545. Subsequent subculturing may be carried out in liquid medium 545 or
    on agar plates.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 7.3.
- step_number: 3
  action: MIX
  description: Medium 545 is the same as Caso Bouillon (Merck or Oxoid, Germany).
- step_number: 4
  action: MIX
  description: pH 7.3
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave at 121°C for 15 min.
