preparation_steps:
- step_number: 1
  action: MIX
  description: Mix ingredients except for Na2CO3 and cysteine-HCl.
- step_number: 2
  action: ALIQUOT
  description: Dispense under N2/CO2 (80/20) into culture vessels and seal with butyl
    rubber stoppers.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 115 C for 25 minutes.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter-sterilize Na2CO3 and cysteine-HCl solutions.
- step_number: 5
  action: MIX
  description: Aseptically and anaerobically add filter-sterile Na2CO3 and cysteine-HCl
    solutions.
- step_number: 6
  action: ADJUST_PH
  description: Adjust pH to 7.0 with 3 N HCl.
