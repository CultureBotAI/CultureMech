preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix components, adjust pH to 8.0 with NaOH, then distribute the medium
    into culture vessels (e.g., 20-50 ml per 120 ml serum bottles), seal with butyl
    rubber stoppers and autoclave at 110C for 5 min. Allow to stand the autoclaved
    medium overnight. Add ethane to the gas phase (10 to 50% of the gas phase by volume).
- step_number: 2
  action: FILTER_STERILIZE
  description: Artificial seawater can be replaced with natural seawater. In this
    case, filtrate seawater (pore size, 02 ï¿½m) and boil. After cooling, filtrate
    again (pore size, 0.45 ï¿½m).
