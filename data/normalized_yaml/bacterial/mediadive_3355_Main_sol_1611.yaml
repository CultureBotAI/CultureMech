preparation_notes: 'Dissolve ingredients except NaHCO3, hemin, cysteine in water and
  boil for 10 min, then add fatty acids:

  Cool down to room temperature while gassing with 100% CO2. Add the NaHCO3, hemin,
  cysteine.

  Adjust pH to 6.7-6.8.'
