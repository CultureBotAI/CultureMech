preparation_notes: "Mix components and autoclave. For preparation of solid medium,\
  \ add 15.0 g/L agar before autoclaving. After cooling to 55C, add the following\
  \ solutions (autoclaved or *filter-sterilized) to the medium: \nDistribute the culture\
  \ medium into culture tubes (leave > 80% volume of a gas phase)and seal with butyl\
  \ rubber stoppers. Finally, add methane to make a concentration of 50% in the gas\
  \ phase (by volume)."
