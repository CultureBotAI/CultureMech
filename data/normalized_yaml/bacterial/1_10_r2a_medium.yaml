preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Final pH 7.2; adjust with crystalline K2HPO4 or KH2PO4 before
    adding agar. Add agar, heat medium to boiling to dissolve agar, and
    autoclave for 15 min at 121°C.
