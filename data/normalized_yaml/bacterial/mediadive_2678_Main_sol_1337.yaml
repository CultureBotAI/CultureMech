preparation_notes: 'Adjust to pH 8.0 and sterilize by autoclaving. The medium may
  be solidified by adding 20.0 g/l agar.

  After autoclaving cool down and add the following to 1 litre medium. Methanol  and
  Vitamine B12 are filter sterilized. Solution T and Wolfe''s Mineral Solution are
  separately autoclaved. Final pH 8.0.'
