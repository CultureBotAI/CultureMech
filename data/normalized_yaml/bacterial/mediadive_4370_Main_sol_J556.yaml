preparation_notes: "Mix components and autoclave. After cooling, add the following\
  \ solutions (autoclaved or filter-sterilized) to the medium: \nDistribute the culture\
  \ medium into culture tubes (leave >80% volume as a gas phase) and seal with butyl\
  \ rubber stoppers.\nFinally, replace the gas phase with 20% methane and 5% CO2 in\
  \ air (by volume).\n\nOriginal volume: 1002 mL"
