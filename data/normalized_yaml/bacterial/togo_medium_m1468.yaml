preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the basal medium with 21 g/L Bacto PPLO Broth (Difco) and 700
    ml/L Distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the PPLO broth base and cool it.
- step_number: 3
  action: HEAT
  description: Boil 250 g dried baker's yeast suspended in 1 L distilled water for
    30 min to prepare 25% Fresh baker's yeast extract.
- step_number: 4
  action: FILTER
  description: Remove yeast cells from the boiled 25% Fresh baker's yeast extract
    by centrifugation.
- step_number: 5
  action: FILTER_STERILIZE
  description: Sterilize Active horse serum and 25% Fresh baker's yeast extract by
    filtration.
- step_number: 6
  action: MIX
  description: Add 200 ml/L filter-sterilized Active horse serum and 100 ml/L filter-sterilized
    Fresh baker's yeast extract (25% solution) to the autoclaved and cooled PPLO broth
    base.
