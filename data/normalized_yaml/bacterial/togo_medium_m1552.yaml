preparation_steps:
- step_number: 1
  action: MIX
  description: Combine 10 g/L Hipolypepton, 2 g/L Yeast extract, 1 g/L MgSO4·7H2O,
    and 1 L Distilled water.
- step_number: 2
  action: MIX
  description: Add 15 g/L agar when solid NBRC Medium 351 is needed.
- step_number: 3
  action: FILTER_STERILIZE
  description: Sterilize N-Acetyl glucosamine separately by filtration.
- step_number: 4
  action: MIX
  description: Add 30 mg/L filter-sterilized N-Acetyl glucosamine.
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH to 7.0.
notes: TOGO M1552 imports NBRC Medium 351, which lists 10 g/L Hipolypepton from Wako
  Pure Chemical Industries, 2 g/L Yeast extract, 30 mg/L N-Acetyl glucosamine, 1 g/L
  MgSO4·7H2O, 15 g/L Agar if needed, and 1 L Distilled water at pH 7.0. The N-Acetyl
  glucosamine is sterilized separately by filtration.
