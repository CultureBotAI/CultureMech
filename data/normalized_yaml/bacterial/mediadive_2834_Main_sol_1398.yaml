preparation_notes: 'pH 7.0

  Prepare the medium without the vitamin solution under an atmosphere of N2 and dispense
  into Hungate tubes. Seal under an atmosphere of nitrogen with rubber stoppers and
  autoclave. Aseptically add the vitamin solution from a filter sterilised stock solution
  to the sterile medium.

  SII '
