notes: pH unadjusted Mix ingredients except KP buffer, vitamin solution, Na2CO3 and
  Na2S·9H2O. Dispense the medium into suitable culture vessels under a stream of H2/CO2
  (80/20) and seal with butyl rubber stoppers. Separately autoclave KP buffer and
  Na2S·9H2O (5% solution) under a N2 atmosphere. Sterilize vitamin and 10% Na2CO3
  solutions by filtration. Prior to inoculation, aseptically and anaerobically add
  KP buffer, vitamin, Na2CO3 and Na2S·9H2O solutions. Pressurize the inoculated vessels
  to 150 kPa with H2/CO2 (80/20). Autoclaved under N2. First dissolve nitrilotriacetic
  acid and adjust pH to 6.5 with NaOH, and then add minerals. Final pH 7.0.
