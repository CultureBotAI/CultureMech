preparation_steps:
- step_number: 1
  action: MIX
  description: Mix ingredients except KP buffer, Vitamin solution, Na2CO3, and Na2S·9H2O;
    dispense under a stream of H2/CO2 (80/20) and seal the vessels with butyl rubber
    stoppers.
- step_number: 2
  action: AUTOCLAVE
  description: Separately autoclave KP buffer and Na2S·9H2O as a 5% solution under
    an N2 atmosphere.
- step_number: 3
  action: FILTER_STERILIZE
  description: Sterilize Vitamin solution and 10% Na2CO3 solution by filtration.
- step_number: 4
  action: MIX
  description: Before inoculation, aseptically and anaerobically add KP buffer, Vitamin
    solution, Na2CO3, and Na2S·9H2O solutions, then pressurize the inoculated vessels
    to 150 kPa with H2/CO2 (80/20).
- step_number: 5
  action: ADJUST_PH
  description: Prepare the Trace elements solution by dissolving nitrilotriacetic
    acid, adjusting to pH 6.5 with NaOH, adding minerals, and leaving the final stock
    at pH 7.0.
