notes: 'Source: NBRC Medium 857 | Link: https://www.nite.go.jp/nbrc/catalogue/NBRCMediumDetailServlet?NO=857


  NBRC lists Sulfate Reducer Medium with KP buffer, MgCl2·6H2O, CaCl2·2H2O, NH4Cl,
  Na2S2O3, Na2SO4, trace element and vitamin stocks, Resazurin, Na2CO3, Na2S·9H2O,
  and distilled water. The pH is unadjusted; the basal medium is dispensed under H2/CO2,
  KP buffer and Na2S·9H2O are autoclaved separately under N2, vitamin and 10% Na2CO3
  solutions are filter-sterilized, and inoculated vessels are pressurized to 150 kPa
  with H2/CO2.'
