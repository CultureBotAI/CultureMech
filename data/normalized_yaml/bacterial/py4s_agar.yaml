    label: PY4S AGAR
notes: JCM Medium 363 PY4S Agar lists, per liter, 75 ml Salt solution I from JCM Medium
  133, 75 ml Salt solution II from JCM Medium 133, 10.0 g Trypticase peptone (BD-BBL),
  5.0 g Yeast extract (BD-Difco), 0.25 g each Glucose, Cellobiose, Maltose, and Soluble
  starch, 1.0 ml 0.1% resazurin-Na, 2.5 ml 8% Na2CO3, 0.3 g L-Cysteine HCl H2O, 15.0
  g Bacto agar (BD-Difco), and 850 ml Distilled water. The final pH is 6.7, and the
  medium is prepared anaerobically and poured into rubber-stopped tubes under oxygen-free
  N2-CO2 (95:5).
