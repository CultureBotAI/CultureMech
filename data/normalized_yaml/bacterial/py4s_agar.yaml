preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare PY4S Agar with Salt solution I, Salt solution II, Trypticase
    peptone, Yeast extract, Glucose, Cellobiose, Maltose, Soluble starch, resazurin-Na,
    Na2CO3, L-Cysteine HCl H2O, Bacto agar, and distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 6.7.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min unless otherwise stated.
- step_number: 4
  action: ALIQUOT
  description: Prepare anaerobically and pour into rubber-stopped tubes under oxygen-free
    N2-CO2 (95:5).
