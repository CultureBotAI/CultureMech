preparation_steps:
- step_number: 1
  action: MIX
  description: Adjust to pH 6 and sterilize by autoclaving. The medium may be solidified
    by adding 12.0 g/l agar. After autoclaving add sterile methylamine (0.2% v/v)
    to the sterile main solution.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 6.0 with NaOH.
