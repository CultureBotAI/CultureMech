preparation_steps:
- step_number: 1
  action: MIX
  description: Combine 5 g/L Bacto Tryptone (Difco), 3 g/L Yeast extract, 0.87 g/L
    CaCl2·2H2O, and 700 ml/L Distilled water.
- step_number: 2
  action: MIX
  description: Add 15 g/L agar when solid NBRC Medium 918 is needed.
- step_number: 3
  action: FILTER_STERILIZE
  description: Sterilize Kanamycin solution (500 ug/ml), Rifampicin solution (500
    ug/ml), and Spectinomycin solution (500 ug/ml) separately by filtration.
- step_number: 4
  action: MIX
  description: Add 100 ml/L filter-sterilized Kanamycin solution (500 ug/ml), 100
    ml/L filter-sterilized Rifampicin solution (500 ug/ml), and 100 ml/L filter-sterilized
    Spectinomycin solution (500 ug/ml).
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH to 7.0.
