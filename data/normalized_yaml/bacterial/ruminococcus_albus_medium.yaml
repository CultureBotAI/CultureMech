notes: |-
  Source: DSMZ | Link: https://www.dsmz.de/microorganisms/medium/pdf/DSMZ_Medium436.pdf

  Superseded historical provenance, not a current formulation claim:
  Commercial Product: LB Medium (Luria-Bertani, Miller formulation)
  Supplier: Multiple suppliers (Difco, Sigma, etc.)
  Catalog: Multiple (L3522 Sigma, 244520 BD)
  Source: https://www.laboratorynotes.com/preparation-of-luria-bertani-lb-miller-broth/
  Accessed: 2026-03-28

  Constituent composition researched from product specification.

  Preserve original preparation descriptions, but withdraw the incorrect HEAT encoding of incubation: Boil and cool under CO2. Under a gentle stream of CO2 add:
  Adjust pH to 7.0, distribute under N2 into appropriate vessels and sterilize.
  Inoculate under CO2 and incubate at 37°C.

  The original supplies 920 ml water, two 40 ml mineral inputs and a separate 1 ml acid input. Their sum is not an explicit final volume. Literal mineral percentages have no declared basis; no g/L or molarity is inferred.

  Complete source rows determine the reconstructed formulation. Archive the prior flattened nodes, unsupported LB additions and stock links in append-only history. Unrelated annotations are preserved, not recertified.
