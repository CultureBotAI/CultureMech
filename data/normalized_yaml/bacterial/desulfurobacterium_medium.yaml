    Additional exact excerpt: "Add 1 N NaOH to distilled water and make the solution anoxic by sparging with 100% N2 gas. Then dissolve the Na-dithionite and filter-sterilize the solution into anoxic Hungate tubes. The final pH of the solution should be between 9 and 10. Store the prepared solution in a dark and cool place. Prepare only small amounts of stock solution, as Na-dithionite decomposes rapidly."
    solutions[5].preparation_notes: Keep this complete instruction on the named stock, not at receiving-medium root. No unstated density, final volume, percent basis or chemical identifier is inferred. Locator=data.solutions[5].steps[0].step; accessed=2026-10-09T03:35:44.735733+00:00; capture SHA256=54c997401523e6c060779343949740b757edd33ced21467873ba7f3c3e6ffd7e.

    Additional exact excerpt: "Dissolve ingredients (except sulfur, carbonate, vitamins, growth-stimulating factors and Na-dithionite), boil medium for 1 min, then cool to room temperature under 80% H2 and 20% CO2 gas atmosphere. Adjust pH to 6.0 and dispense under 80% H2 and 20% CO2 gas atmosphere into anoxic Hungate-type tubes or serum vials which contain already the appropriate amount of sulfur, only to 30% of their volume to allow for a large head space. Autoclave at a temperature of <b>110\u00b0C</b> for 20 min! Add vitamins and growth-stimulating factors from sterile anoxic stock solutions prepared under 100% N2 gas and carbonate and Na-dithionite from sterile anoxic stock solution prepared under 80% N2 and 20% CO2 gas atmosphere. Vitamins and Na-dithionite are sterilized by filtration. Adjust pH of the complete medium to 6.0, if necessary."
    preparation_steps: Only main-recipe instructions remain at root; stock instructions are preserved on their exact stock descriptors. No unstated density, final volume, percent basis or chemical identifier is inferred. Locator=data.solutions[0].steps[0].step; accessed=2026-10-09T03:35:44.735733+00:00; capture SHA256=54c997401523e6c060779343949740b757edd33ced21467873ba7f3c3e6ffd7e.

