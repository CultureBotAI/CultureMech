    label: MJ MEDIUM FOR MICROAEROPHILIC AUTOTROPHS
notes: JCM Medium 902, MediaDive J902, and TOGO M943 describe MJ Medium for Microaerophilic
  Autotrophs as 0.25 g/L NH4Cl in 1.0 L MJ(-N) synthetic seawater from TOGO M260/JCM
  Medium 268; after pH 5.5 adjustment, autoclaving, and cooling, 5.0 ml/L 8% NaHCO3
  solution, 15.0 ml/L 10% Na2S2O3 x 5 H2O solution, and 10.0 ml/L Trace vitamins from
  TOGO M190/JCM Medium 197 are added aseptically and the medium is sealed under an
  N2-CO2-O2 (76:19:5, v/v) gas mixture at 50 kPa.
