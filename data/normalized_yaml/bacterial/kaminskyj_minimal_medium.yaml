ph_value: 6.5
evidence:
- reference: https://www.fgsc.net/fgn48/Kaminskyj.htm
  supports: SUPPORT
  snippet: 20X nitrate salts (see below) 50 ml
  explanation: 'solutions[0].concentration: 50 mL nitrate stock / 1 L final MM = 50
    mL/L. Other exact MM table excerpts: ''Trace elements (see below) 1 ml'' and ''1%
    thiamine 1 ml'', supporting solutions[1] and [2] at 1 mL/L each. Separate MM preparation
    paragraph: ''Add nutritional supplements if necessary. Adjust pH to 6.5 with 1M
    NaOH. Make to 1 liter with distilled water. For solid medium add 18 g agar. Autoclave.''
    This supports ph_value=6.5, solutions[3] as an unquantified 1 M NaOH titrant,
    water makeup and preparation_steps including autoclaving, not the former 0.22
    um filtration. No autoclave temperature or duration is specified. Optional supplements
    and solid-medium agar are not unconditional base ingredients. Nitrate preparation
    excerpt: ''Add distilled water to 1 liter. Autoclave. Store at 4oC.'' Trace preparation
    excerpt: ''Add the compounds in order. Boil. Cool to 60oC. Adjust pH to 6.5 with
    KOH. Cool to room temperature. Adjust volume to 100 ml with distilled water. With
    storage this forms a purple solution with a rusty brown precipitate that should
    be resuspended before use.'' The trace table''s separate ''distilled water 60
    ml'' is initial water, not the final stock volume. These excerpts support solutions[0:2].preparation_notes.
    Withdraw imported stock/final-medium mixing; do not convert through inferred molecular
    weights or substitute the CM vitamin solution or Hill formulation. Source: doi:10.4148/1941-4765.1175;
    accessed 2026-10-09.'
variants:
- name: Anhydrous magnesium sulfate option
  relationship: SUBSTITUTED_COMPONENT_VARIANT
  modifications:
  - In the 20X nitrate stock, replace 10.4 g magnesium sulfate heptahydrate per 1
    L stock with 5.2 g anhydrous magnesium sulfate per 1 L stock. Keep the stock addition
    at 50 mL/L final medium.
  evidence:
  - reference: https://www.fgsc.net/fgn48/Kaminskyj.htm
    supports: SUPPORT
    snippet: MgSO 4 ·7H 2 O 10.4 g (5.2 g if anhydrous)
    explanation: 'variants[0]: nitrate-stock magnesium row, source-explicit alternative,
      not an extra ingredient. Separate volume excerpt: ''Add distilled water to 1
      liter.'' Thus 5.2 g / 1 L = 5.2 g/L anhydrous salt in stock; 5.2 * 0.050 = 0.26
      g/L final medium. Source: doi:10.4148/1941-4765.1175; accessed 2026-10-09.'
- name: Solid minimal medium
  relationship: PHYSICAL_STATE_VARIANT
  modifications:
  - Add 18 g agar to the one-litre MM preparation for solid medium; retain the source's
    autoclaving step.
  evidence:
  - reference: https://www.fgsc.net/fgn48/Kaminskyj.htm
    supports: SUPPORT
    snippet: For solid medium add 18 g agar.
    explanation: 'variants[1]: MM preparation, not CM (which instead specifies 15
      g). Separate excerpt: ''Make to 1 liter with distilled water.'' Source states
      18 g per one-litre preparation; no separate post-agar final volume is invented.
      Base remains LIQUID. Source: doi:10.4148/1941-4765.1175; accessed 2026-10-09.'
