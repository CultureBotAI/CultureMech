preparation_steps:
- step_number: 1
  action: MIX
  description: Combine 10 g D-glucose, 50 mL 20X nitrate stock, 1 mL trace stock and
    1 mL 1% thiamine solution for one litre of MM. Add nutritional supplements only
    if required by the strain.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 6.5 using 1 M sodium hydroxide. The amount required is
    not specified.
- step_number: 3
  action: MIX
  description: Make up to a final volume of 1 L with distilled water.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave. The source does not specify temperature or duration for
    this step.
