preparation_notes: '1) Dissolve 17.9 g sodium EDTA and 3.28 g NaOH in 186 ml of distilled
  water.

  2) Dissolve 13.7 g FeSO4 x 7 H2O in 364 ml of distilled ater, bubbling with air
  overnight, and store in a brown glass bottle.

  3) Combine the two solutions and make up to 1 litre with distilled water.'
