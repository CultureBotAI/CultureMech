preparation_notes: 'Dissolve ingredients, adjust pH to 7.6 with KOH and sparge medium
  with 100% N2 gas for 30 - 45 min to make it anoxic. Distribute medium under same
  gas atmosphere into anoxic Hungate-type tubes or serum vials and autoclave.

  For stabs add 10.0 g/l agar.'
