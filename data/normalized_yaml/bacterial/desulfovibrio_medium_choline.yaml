preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Dissolve the Solution A ingredients in 980 ml distilled water.
- step_number: 2
  action: HEAT
  description: Bring Solution A to the boil, then cool to room temperature while sparging
    with 100% N2 gas.
- step_number: 3
  action: MIX
  description: Add Solution B, containing FeSO4 x 7 H2O in 10 ml distilled water,
    and Solution C, containing Na-thioglycolate and ascorbic acid in 10 ml distilled
    water.
- step_number: 4
  action: ADJUST_PH
  description: Adjust pH to 7.8 with NaOH.
- step_number: 5
  action: ALIQUOT
  description: Distribute under 100% N2 gas in anoxic Hungate-type tubes while continuously
    swirling the medium to keep the grey precipitate suspended.
- step_number: 6
  action: AUTOCLAVE
  description: Autoclave for 15 minutes at 121 C.
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 minutes
- step_number: 7
  action: ADJUST_PH
  description: After autoclaving, check the medium pH and adjust to pH 6.8-7.0 if
    necessary.
