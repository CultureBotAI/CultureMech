ingredients: []
preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve components, except NaHCO3, dithiothreitol and mannitol,in
    900 ml distilled water and autoclave under a N2--CO2 (4:1, v/v) atmosphere. Separately
    autoclave 3% (w/v) dithiothreitol solution and 1 M mannitol solution under a N2
    atmosphere. Add filter--sterilized 5% NaHCO3 [storedunder a N2--CO2 (4:1, v/v)
    atmosphere] to the medium. Prior to inoculation,add the sterile dithiothreitol
    and mannitol solutions.
- step_number: 2
  action: MIX
  description: Use Trace element solution of Medium No. [243] without Na2SeO3・5H2O.
- step_number: 3
  action: AUTOCLAVE
  description: Use Medium No. [480] with 3.6 g/L D--glucose instead of mannitol. Autoclave
    1 M glucose solution separately under a N2 atmosphere, and add to the medium.
- step_number: 4
  action: ADJUST_PH
  description: Dissolve nitrilotriacetic acid first in 200 ml of distilled water,and
    adjust pH to 6.5 with KOH. Then add the remaining salts and adjust volume to 1.0
    L. Readjust pH to 7.0 with KOH.
