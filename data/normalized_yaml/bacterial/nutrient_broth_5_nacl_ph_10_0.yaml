preparation_steps:
- step_number: 1
  action: MIX
  description: Suspend Nutrient Broth (OXOID), NaCl, and optional agar in 900 ml distilled
    water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the nutrient-broth NaCl base.
- step_number: 3
  action: AUTOCLAVE
  description: Sterilize the 100 ml NaHCO3 and Na2CO3 sodium-sesquicarbonate stock
    separately.
- step_number: 4
  action: MIX
  description: Aseptically add the sterile sodium-sesquicarbonate stock to the sterile
    base.
sterilization:
  method: AUTOCLAVE
  notes: Autoclave the complex nutrient-broth base and sterilize the alkaline carbonate
    stock separately before aseptic addition.
