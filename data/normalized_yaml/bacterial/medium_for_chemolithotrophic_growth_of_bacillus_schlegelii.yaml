preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.1. Agar if necessary 15.0 g. Distribute in 30 - 50 ml
    amounts in Erlenmeyer flasks and sterilize for 15 minutes at 121°C.
- step_number: 2
  action: MIX
  description: "Incubate at 65C without agitation under 5% (v/v)\r\nO2, 10% CO2,\
    \ 45% H2"
applications:
- Microbial cultivation
