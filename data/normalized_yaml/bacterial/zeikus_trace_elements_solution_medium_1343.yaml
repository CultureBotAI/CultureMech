ph_value: 6.5
notes: 'KOMODO 3134 lists Zeikus trace elements solution (medium 1343) as a defined
  submedium at pH 6.5. DSMZ Medium 1343 and MediaDive solution 2698 provide the complete
  stock composition: 12.5 g/L Nitrilotriacetic acid, 0.2 g/L FeCl3 x 4 H2O, 0.1 g/L
  ZnCl2, 0.1 g/L MnCl2 x 4 H2O, 0.01 g/L H3BO3, 0.017 g/L CoCl2 x 6 H2O, 0.02 g/L
  CuCl2 x 2 H2O, 0.1 g/L CaCl2 x 2 H2O, 0.01 g/L Na2MoO4 x 2 H2O, 1.0 g/L NaCl, 0.02
  g/L Na2SeO3, distilled water to 1000 mL, and KOH to neutralise the nitrilotriacetic
  acid to pH 6.5 before adding the other trace elements. The DSMZ PDF and KOMODO page
  abbreviate the borate row as H3BO; MediaDive identifies the same DSMZ compound row
  as H3BO3.'
preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Neutralise the nitrilotriacetic acid to pH 6.5 with KOH before adding
    the other trace elements.
- step_number: 2
  action: MIX
  description: Add the iron, zinc, manganese, borate, cobalt, copper, calcium, molybdate,
    sodium chloride, and selenite trace elements, then bring the Zeikus trace elements
    solution stock to 1 L with distilled water.
