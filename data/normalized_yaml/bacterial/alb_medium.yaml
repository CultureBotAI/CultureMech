- preferred_term: Distilled water
  concentration:
    value: '1000.0'
    unit: ML_PER_L
  source: NBRC Medium 1063
  notes: NBRC Medium 1063 lists 1 L distilled water as 1000.0 ml/L.
  term:
    id: CHEBI:15377
    label: water
  mediaingredientmech_chebi_term:
    id: CHEBI:15377
    label: water
- preferred_term: Agar (if needed)
  concentration:
    value: '15.0'
    unit: G_PER_L
  source: NBRC Medium 1063
  notes: NBRC Medium 1063 lists 15.0 g/L agar if needed.
  term:
    id: CHEBI:2509
    label: agar
  mediaingredientmech_chebi_term:
    id: CHEBI:2509
    label: agar
  physicochemical_roles:
