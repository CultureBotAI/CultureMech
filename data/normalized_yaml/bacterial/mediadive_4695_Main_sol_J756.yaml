  \ replace the gas phase with a N2-CO2 (4:1, v/v) gas mixture and add the following\
  \ solutions from sterile anaerobic stocks (autoclaved or *filter-sterilized): \n\
  Distribute the medium into sterile culture vessels (e.g., 20 ml of the medium in\
  \ 50 ml serum bottles) under a N2-CO2 (4:1, v/v) gas mixture and seal with sterile\
  \ butyl rubber stoppers. Adjust pH to 7.0, if necessary. Prior to use, add per liter\
  \ the following solution from an anaerobic stock (autoclaved): \n\nOriginal volume:\
  \ 1012 mL"
