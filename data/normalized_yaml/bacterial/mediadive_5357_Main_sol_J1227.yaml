  \ \nAfter the medium is cooled to room temperature, adjust pH to 6.0 - 6.1. Dispense\
  \ the medium into culture vessels (e.g., 10 ml in Balch type tubes) under the same\
  \ gas mixture, seal with butyl rubber stoppers and autoclave.\n\nOriginal volume:\
  \ 2010 mL"
