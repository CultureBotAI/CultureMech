preparation_notes: "Heat the medium to boiling while bubbling with a N2-CO2 (4:1,\
  \ v/v) gas mixture. After boiling, cool the medium in a water bath. Continue bubbling\
  \ with the same gas mixture. While the medium is still warm, add the following:\
  \ \nAfter the medium is cooled to room temperature, adjust pH to 6.0 - 6.1. Dispense\
  \ the medium into culture vessels (e.g., 10 ml in Balch type tubes) under the same\
  \ gas mixture, seal with butyl rubber stoppers and autoclave.\n\nOriginal volume:\
  \ 2010 mL"
