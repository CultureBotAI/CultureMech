preparation_notes: 'Dissolve ingredients (except sulfide and cysteine) and adjust
  pH to 6.5. Boil medium for 1 min, then cool to room temperature under 100% N2 gas
  atmosphere. Dispense under same gas atmosphere into anoxic Hungate-type tubes or
  serum vials to 30% of volume and autoclave. Add sulfide and cysteine from sterile
  anoxic stock solutions prepared under 100% N2 gas. Adjust pH of complete medium
  to 6.5, if necessary.


