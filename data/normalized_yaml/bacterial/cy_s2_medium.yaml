preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Adjust pH to 7.0 and autoclave.
- step_number: 2
  action: MIX
  description: 'After autoclaving, add from separate sterile solutions per liter medium:'
- step_number: 3
  action: MIX
  description: Aseptically fill sterile 10-ml screwcap tubes almost completely with
    the medium. Make stab inoculation.
