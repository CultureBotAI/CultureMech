variants:
- name: Villasenor 2011 MMP reported formulation
  description: Published MMP formulation and staged preparation, distinct from the
    unverified imported vitamin molarities and generic preparation. Retains exact
    source units and chemical forms.
  modifications:
  - Use the reported 10 micrograms/mL biotin and 10 micrograms/mL thiamine, rather
    than certifying the parent's 0.00409316 mM biotin and 0.033243 mM thiamine as
    equivalent. Salt form and molecular-weight conversions are not inferred.
  - Specify 1.49 mM CaCl2 dihydrate and 0.0184 mM FeCl3 hexahydrate; the parent instead
    labels calcium chloride anhydrous and does not specify the iron salt hydrate.
    Equal molar numbers do not establish identical supplied chemical forms.
  - Retain the reported 10 mM succinate, 10 mM NH4Cl, 1.26 mM K2HPO4 and 0.83 mM MgSO4;
    do not infer an unreported succinate counterion or MgSO4 hydrate.
  - Adjust the succinate/NH4Cl/phosphate/MgSO4 base to pH 6.8 and sterilize it, then
    add the separately filter-sterilized iron salt and vitamins and separately autoclaved
    CaCl2. Do not inherit the parent's generic whole-medium 0.22-micrometer filtration;
    the paper specifies neither the base sterilization method nor filter pore size.
  - Include 1 micromolar calcium pantothenate, equivalent to the existing 0.001 mM
    salt entry (1/1000 mM); do not double it or reinterpret it as a pantothenate-anion
    dose.
  purpose: Reported pantothenate biosynthesis and complementation growth assays.
  evidence:
  - reference: doi:10.1186/1471-2180-11-66
    supports: SUPPORT
    snippet: 10 μg ml -1 biotin and 10 μg ml -1 thiamine (both filter sterilized)
    explanation: 'Locator: Methods, Bacterial strains and culture conditions. Separately
      checked exact excerpts (HTML subscript boundaries rendered as spaces): succinate=''10
      mM succinate as carbon source''; ammonium=''10 mM NH 4 Cl as nitrogen source'';
      phosphate=''1.26 mM K 2 HPO 4''; magnesium=''0.83 mM MgSO 4''; iron=''0.0184
      mM FeCl 3 6H 2 O (filter sterilized)''; calcium=''1.49 mM CaCl 2 2H 2 O (autoclaved
      separately)''; ph=''was adjusted to pH 6.8 and sterilized.''; final_basis=''After
      sterilization the following components were added to the final concentration
      indicated''; pantothenate=''MMP contains the same components plus 1 μM calcium
      pantothenate.''. Values are final-medium concentrations, not stock recipes.
      No mass-to-molar conversion is performed; MMP 1 micromolar = 0.001 mM is the
      only unit scaling. Methods, Bacterial strains and culture conditions: 30 C;
      PY preculture, washing and a 24-hour MM depletion passage before the 15-hour
      MM/MMP assay. Methods give OD600 while figures label OD620; only qualitative
      growth is asserted, with no normalized growth metric. Antibiotic concentrations
      are listed generally but not assigned to individual plotted assays, so no antibiotic
      addition or antibiotic-free claim is inferred. '
