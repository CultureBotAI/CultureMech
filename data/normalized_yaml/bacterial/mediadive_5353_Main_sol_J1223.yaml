preparation_notes: "Mix components, adjust pH to 7.5 and autoclave under a N2 gas\
  \ atmosphere. After cooling, add the following solutions from sterile anaerobic\
  \ stocks (autoclaved or *filter-sterilized): \nReadjust pH to 7.5, if necessary.\
  \ Separately autoclave and dry iron metal (grain). Aseptically distribute the medium\
  \ and iron metal into culture vessels (e.g., 10 ml medium and 100 mg iron in Hungate\
  \ tubes) under a N2 gas stream and seal with butyl rubber stoppers. Prior to use,\
  \ add per liter the following solution: \n\nOriginal volume: 1002 mL"
