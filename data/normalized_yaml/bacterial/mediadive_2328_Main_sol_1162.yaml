preparation_notes: 'Adjust to pH 7.5

  Bubble the medium with nitrogen gas and fill 10 ml in 15 ml tubes with a rubber
  septum under a stream of nitrogen gas.

  Notes: Filter-sterilized Vitamin B12, Na2S x 9 H2O, Na2S2O3 x 5 H2O are to be added
  only after autoclaving the medium.'
