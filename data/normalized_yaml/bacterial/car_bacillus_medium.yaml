preparation_steps:
- step_number: 1
  action: MIX
  description: 'Use the Vero E6 cell culture supernatant fluid (see below). Incubate
    the microorganism in the supernatant fluid in a polystyrene culture flask (75
    cm2 flask, canted neck, vent cap, coated with Ultra-Low Attachment Surface, Corning:
    Cat. No. 3814) at 37C under 5% CO2.'
- step_number: 2
  action: MIX
  description: 'Incubate Vero E6 cells (ATCC CRL-1586) in Iscove''s Modified Dulbecco''s
    Medium (IMDM, GlutaMAXTM) (Life Technologies: Cat. No. 31980030) supplemented
    with 10% fetal bovine serum (FBS; inactivated at 56C for 30 min) at 37C under
    5% CO2. After cultivation, centrifuge the culture medium. Use the supernatant
    fluid for cultivation of the microorganism as described above.'
