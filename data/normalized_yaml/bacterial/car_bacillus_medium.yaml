ingredients: []
preparation_steps:
- step_number: 1
  action: HEAT
  description: Heat-inactivate fetal bovine serum at 56 C for 30 minutes.
- step_number: 2
  action: MIX
  description: Supplement IMDM (GlutaMAX) with 10% heat-inactivated FBS.
- step_number: 3
  action: MIX
  description: Incubate Vero E6 cells (ATCC CRL-1586) in the supplemented medium at
    37 C under 5% CO2.
- step_number: 4
  action: MIX
  description: After cell cultivation, centrifuge the culture medium and retain the
    clarified supernatant fluid.
- step_number: 5
  action: MIX
  description: Cultivate the microorganism in the supernatant in the specified ultra-low-attachment
    75 cm2 flask at 37 C under 5% CO2.
applications:
- Microbial cultivation
