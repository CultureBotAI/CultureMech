notes: Mix ingredients except yeast extract, sulfur and Na2S·9H2O, and autoclave under
  a N2 atmosphere. Separately autoclave yeast extract as a 10% solution and Na2S·9H2O
  as a 5% solution under a N2 atmosphere. Sulfur is autoclaved for 60 min at 105℃
  on each of 3 successive days. Aseptically and anaerobically add yeast extract and
  sulfur to the medium. Prior to inoculation, add sterile Na2S·9H2O solution, and
  adjust pH to 4.5-5.0 with sterile 1 N H2SO4.
