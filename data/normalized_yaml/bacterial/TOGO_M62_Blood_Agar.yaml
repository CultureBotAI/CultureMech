id: CultureMech:010030
name: blood_agar
original_name: Blood Agar
category: bacterial
medium_type: COMPLEX
composition_type: UNDEFINED
physical_state: SOLID_AGAR
ingredients:
- preferred_term: Blood agar base (BD-Difco)
  concentration:
    value: '1000'
    unit: ML_PER_L
  source: JCM Medium 70
  notes: TOGO and JCM Medium 70 list one liter of Blood agar base (BD-Difco) prepared
    according to the manufacturer's directions.
- preferred_term: Defibrinated rabbit blood
  concentration:
    value: '5'
    unit: PERCENT_V_V
  source: JCM Medium 70
  notes: JCM Medium 70 adds sterile defibrinated rabbit blood to 5% final concentration
    after sterilization and cooling.
  term:
    id: UBERON:0000178
    label: blood
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare 1 L Blood agar base (BD-Difco) according to the manufacturer's
    directions.
- step_number: 2
  action: AUTOCLAVE
  description: Sterilize the base at 121 C for 15 min.
- step_number: 3
  action: COOL
  description: Cool the sterilized base to about 45 C.
- step_number: 4
  action: MIX
  description: Aseptically add 5% (final) sterile defibrinated rabbit blood.
- step_number: 5
  action: POUR_PLATES
  description: Mix and quickly dispense into sterile test tubes.
