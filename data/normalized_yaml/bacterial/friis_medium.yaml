preparation_steps:
- step_number: 1
  action: MIX
  description: Adjust to pH 7.4.
- step_number: 2
  action: MIX
  description: 'After autoclaving add:'
- step_number: 3
  action: AUTOCLAVE
  description: 25 ml solution 1 (4 g NaCl, 0.2 g KCl, 0.05 g MgSO4 x 7 H2O, 0.05 g
    MgCl2 x 6 H2O dissolved in 25 ml distilled water; then 0.0925 g CaCl2 added and
    dissolved) and 25 ml of solution 2 (0.075 g Na2HPO4 x 2 H2O, 0.03 g KH2PO4 dissolved
    in 25 ml distilled water) are autoclaved separately and then combined with 450
    ml sterile H2O.
