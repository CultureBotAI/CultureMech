preparation_notes: 'Reduction of the medium by addition of 20 ml Na2S (2.5%); then
  adjust pH to 5.5 with sulfuric acid.

  Gas phase: H2/CO2=80/20 (250 kPa).

  After autoclaving add 0.04% yeast extract.

  Incubation at 90°C for 1-2 days.'
