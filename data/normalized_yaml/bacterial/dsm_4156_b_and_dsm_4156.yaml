notes: Archived DSMZ Medium 409 defines SYNTROPHUS BUSWELLII II MEDIUM as DSMZ Medium
  194 with 3.0 g/L sodium benzoate and 1.0 g/L sodium acetate replacing propionate,
  3 microgram/L Na2SeO3 x 5 H2O, 60 mg/L Na2S x 9 H2O, and 10-20 mg/L sodium dithionite;
  this record expands archived DSMZ Media 193, 194, 320, 141, and 409 into final per-liter
