variants:
- name: Teusink 2005 Table 1 complete CDM on reported mass basis
  relationship: DERIVED_FROM
  description: 'Source-described Table 1 formulation, not an exact certification of
    the imported molar parent. Source mass doses and boldface minimal membership take
    precedence over inferred conversions. Hydration, counterion equivalence, other
    molar conversions and generic parent preparation remain unverified. Poolman 1988
    is the cited starting protocol; its separate lactococcal batch/continuous overrides
    are not inherited wholesale. '
  modifications:
  - Use the Table 1 Ca-(D)-(+)-pantothenate dose of 0.001 g/liter, rather than certifying
    the parent's 0.00456 mM calcium pantothenate.
  - Retain the source's full Table 1 composition and footnote b components; do not
    infer exact chemical-form equivalence from the imported molar ingredient list.
    Pyridox-x is a joint-omission experiment, not an ingredient.
  evidence:
  - reference: doi:10.1128/AEM.71.11.7253-7262.2005
    supports: SUPPORT
    snippet: Ca-( d )-(+)-pantothenate (vitamin B 5 ) 0.001
    explanation: 'Supports variants[].modifications calcium pantothenate source dose;
      Table 1 column 2 heading is ''Concn (g/liter)''. Calculation separate from quote:
      the encoded CHEBI:31345 formula 2C9H16NO5.Ca has average mass 476.536 g/mol;
      0.001 g/L / 476.536 g/mol * 1000 = 0.00209848 mM formula units, not 0.00456
      mM. Even two pantothenate equivalents would be about 0.00419695 mM. This conditional
      comparison is not a hydration or parent-basis certification. Chemistry authority=https://www.ebi.ac.uk/chebi/CHEBI:31345;
      archived JSON/Markdown=references_cache/papers/chemistry/chebi-31345-20261013.*.
      The ontology supplies chemical identity/mass, not the recipe amount. Source-described
      Table 1 formulation, not an exact certification of the imported molar parent.
      Source mass doses and boldface minimal membership take precedence over inferred
      conversions. Hydration, counterion equivalence, other molar conversions and
      generic parent preparation remain unverified. Poolman 1988 is the cited starting
      protocol; its separate lactococcal batch/continuous overrides are not inherited
      wholesale. '
