preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: DSMZ Medium 194 sparges Solution A with an 80% N2 and 20% CO2 gas mixture
    to reach pH below 6, distributes it under the same gas atmosphere into anoxic
    Hungate-type tubes or serum vials, and autoclaves it.
- step_number: 2
  action: MIX
  description: DSMZ Medium 194 autoclaves Solution B under 80% N2 and 20% CO2, autoclaves
    Solutions C and E under 100% N2, filter-sterilizes Solution D under 100% N2, then
    adds Solutions B to E to sterile cooled Solution A in sequence.
- step_number: 3
  action: ADJUST_PH
  description: DSMZ Medium 194 adjusts the final pH to 7.1-7.4.
- step_number: 4
  action: FILTER_STERILIZE
  description: DSMZ Medium 194 notes that growth of some strains may be stimulated
    with 10-20 mg/L sodium dithionite from a freshly prepared anoxic 5% w/v solution
    sterilized by filtration.
