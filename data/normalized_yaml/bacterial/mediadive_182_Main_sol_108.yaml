preparation_notes: In liquid medium, the pH should be adjusted to 3.5 with H2SO4.
  In solid medium, the pH should be adjusted to 4.5 with H2SO4 after autoclaving the
  medium. Sterilize the glucose separately and add to the sterile medium.
