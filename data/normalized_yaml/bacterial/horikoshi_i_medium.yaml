notes: 'Source: JCM Medium 181 | Link: https://www.jcm.riken.jp/cgi-bin/jcm/jcm_grmd?GRMD=181


  JCM Medium 181 Horikoshi-I medium prepares a 900 mL agar base with glucose, Hipolypepton,
  yeast extract, dipotassium hydrogen phosphate, magnesium sulfate heptahydrate, and
  agar, then aseptically adds 100 mL sterile 10% Na2CO3 solution after autoclaving
  for a final pH of about 10.0.'
