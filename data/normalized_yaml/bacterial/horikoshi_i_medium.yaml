preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the Horikoshi-I agar base in 900 mL water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave at 121 C for 15 min.
- step_number: 3
  action: MIX
  description: Aseptically add 100 mL of sterile 10% Na2CO3 solution.
- step_number: 4
  action: ADJUST_PH
  description: Check the final pH to be about 10.0.
