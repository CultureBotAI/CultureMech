preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Use JCM Medium No. 462 without Na2S x 9H2O, and with 20 mM sodium acetate
    and 30 mM ferric citrate instead of sodium lactate. Reduce the medium with 0.5
    g/L L-cysteine x HCl (5% solution, autoclaved and stored under N2).
