preparation_notes: 'Dissolve ingredients (except bicarbonate, vitamins, and sulfide)
  and sparge medium with 80% N2 and 20% CO2 gas mixture for 30 - 45 min to make it
  anoxic. Add and dissolve bicarbonate, then dispense medium under 80% N2 and 20%
  CO2 gas atmosphere into anoxic Hungate-type tubes or serum vials and autoclave.
  Add vitamins and sulfide from sterile anoxic stock solutions prepared under 100%
  N2 gas. The vitamin solution should be sterilized by filtration. Prior to use check
  pH of complete medium and adjust to 7.2 - 7.4, if necessary.


  Original volume: 1003 mL'
