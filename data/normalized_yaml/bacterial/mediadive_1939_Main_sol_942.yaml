preparation_notes: Adjust pH to 7.2, autoclave and pour plates. Grow Escherichia coli
  in liquid culture, collect cells by centrifugation, and resuspend them in enough
  water to receive a thick but ready-to-pipet suspension. Autoclave the suspension
  separately. Place three separate drops on one CaCl2-agar plate, streak every drop
  once to receive Escherichia coli lines about 3 cm long, and inoculate the lines/drops
  with myxobacteria.
notes: MediaDive solution 1939 is the DSMZ Medium 942 main-solution import for Agar
  with E. coli as Feed.
