preparation_steps:
- step_number: 1
  action: MIX
  description: Mix Artificial saltwater and Wolfe's mineral solution, distribute the
    medium into culture vessels, and seal with butyl rubber stoppers.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave at 121 degrees C for 15 min.
- step_number: 3
  action: FILTER_STERILIZE
  description: Aseptically add filter-sterilized Trace vitamins, 8% NaHCO3 solution,
    and freshly prepared 0.2 M FeCl2 solution per liter.
- step_number: 4
  action: MIX
  description: Replace the gas phase with an N2-CO2-O2 (80:20:3, v/v/v) gas mixture
    and pressurize to 200 kPa with the same gas mixture.
sterilization:
  method: AUTOCLAVE
  temperature:
    value: 121.0
    unit: CELSIUS
  duration: 15 min
  notes: Filter-sterilize Trace vitamins, 8% NaHCO3 solution, and freshly prepared
    0.2 M FeCl2 solution separately.
