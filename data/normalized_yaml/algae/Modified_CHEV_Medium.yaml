preparation_steps:
- step_number: 1
  action: ALIQUOT
  description: Add CR1 Soil, MgCO3, dH2O, and F/2 Medium to 15 mL glass tubes.
- step_number: 2
  action: AUTOCLAVE
  description: Process the soil and liquid mixture within 6 hours; autoclave for 15
    minutes for routine maintenance, or pasteurize just above 98 C for 2 hours on
    three successive days.
- step_number: 3
  action: STORE
  description: Allow tubes to gas-equilibrate for 2 days before use.
light_intensity: Varies by species; typically 50-100 µmol photons m⁻² s⁻¹
