  description: Optionally add a grain for organisms that benefit from it.
- step_number: 3
  action: ALIQUOT
  description: Carefully add deionized water to a depth of 7-10 cm above the soil.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 15 psi for 15 minutes on each of two consecutive days.
- step_number: 5
  action: STORE
  description: Allow to stand for at least one further day before inoculation.
