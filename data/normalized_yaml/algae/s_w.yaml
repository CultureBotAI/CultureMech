- step_number: 3
  action: ALIQUOT
  description: Add deionized water carefully to a depth of 7-10 cm, then plug or cover.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 15 psi for 15 minutes on each of two consecutive days.
- step_number: 5
  action: STORE
  description: Let stand for at least one further day before inoculation.
