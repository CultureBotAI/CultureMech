preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 900 mL dH2O, add each component except vitamins in
    the order specified while stirring continuously.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the medium to pH 7.0.
- step_number: 3
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 4
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 5
  action: MIX
  description: Allow the medium to cool, then add sterile vitamins.
- step_number: 6
  action: STORE
  description: Store at refrigerator temperature.
