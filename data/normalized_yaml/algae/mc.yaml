preparation_steps:
- step_number: 1
  action: MIX
  description: Add casein digest, Na2HPO4.7H2O, KH2PO4, yeast extract, D-glucose,
    and liver digest in the order shown to 900 ml deionized water, allowing each to
    dissolve completely before adding the next.
- step_number: 2
  action: MIX
  description: Adjust to pH 6.9.
- step_number: 3
  action: ALIQUOT
  description: Dispense into 5 x 180 ml aliquots.
- step_number: 4
  action: AUTOCLAVE
  description: Sterilize by pressure cooking at 10 psi for 15 minutes.
- step_number: 5
  action: MIX
  description: Aseptically add 20 ml sterile foetal calf serum to each aliquot, giving
    a final concentration of 10%.
- step_number: 6
  action: STORE
  description: Store at 4 C.
