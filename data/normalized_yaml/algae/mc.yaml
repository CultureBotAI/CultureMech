description: Algae culture medium from CCAP Culture Collection. Suitable for freshwater
  algae cultivation. Recipe available in PDF format.
notes: CCAP MC lists casein digest, Na2HPO4.7H2O, KH2PO4, Oxoid yeast extract, D-glucose,
  and Oxoid liver digest in 900 ml deionised water; after pH adjustment to 6.9 and
  10 psi pressure cooking, it adds sterile foetal calf serum to a final concentration
  of 10% and stores the medium at 4 C.
