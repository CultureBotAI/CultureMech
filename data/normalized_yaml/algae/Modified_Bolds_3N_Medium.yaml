preparation_steps:
- step_number: 1
  action: MIX
  description: 'To approximately 900 mL dH2O, add the Bristol mineral stocks and P-IV
    Metal Solution and Soilwater: GR+ Medium.'
- step_number: 2
  action: ADJUST_PH
  description: Adjust the medium to pH 6.2.
- step_number: 3
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 4
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 5
  action: MIX
  description: Add sterile vitamin stocks after the medium cools.
- step_number: 6
  action: STORE
  description: Store at refrigerator temperature.
