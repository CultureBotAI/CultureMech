preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Dissolve 15 g natural sea-salt in approximately 900 mL non-pasteurized
    seawater.
- step_number: 2
  action: MIX
  description: Add the F/2 nutrient stocks and Trace Metals Solution while stirring.
- step_number: 3
  action: MIX
  description: Bring the total volume to 1 L with non-pasteurized seawater.
- step_number: 4
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 5
  action: STORE
  description: Store at refrigerator temperature.
