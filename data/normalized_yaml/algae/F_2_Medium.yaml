preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 950 mL non-pasteurized seawater at 30 ppt, add the
    F/2 nutrient stocks and Trace Metals Solution while stirring.
- step_number: 2
  action: MIX
  description: Bring the total volume to 1 L with non-pasteurized seawater at 30 ppt.
- step_number: 3
  action: AUTOCLAVE
  description: Cover and autoclave the medium or filter-sterilize it.
- step_number: 4
  action: MIX
  description: When cooled, add the sterile vitamin stocks.
- step_number: 5
  action: STORE
  description: Store at refrigerator temperature.
