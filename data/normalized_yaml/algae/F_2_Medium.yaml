original_name: F/2 Medium
variants:
- name: n_replete_second_stage_tetraselmis_marina
  description: F/2 culture followed by nitrogen-replete second-stage cultivation for
    enhanced biomass and lipid productivity of Tetraselmis marina.
  modifications:
  - Grow cells in F/2 medium for seven days as the first stage.
  - Shift to a nitrogen-replete second stage with 4.41 mM NaNO3 for three days.
  purpose: Capture a study-specific F/2-derived nitrogen repletion variant used to
    increase Tetraselmis marina biomass and lipid productivity.
  evidence:
  - reference: PMID:28456040
    supports: SUPPORT
    snippet: After second stage of cultivation of T. marina for further 3-days under
      N-replete condition (4.41mM NaNO3) increased biomass concentration of 1900mg/L
      and lipid content of 50% were observed
    explanation: Literature evidence describes a nitrogen-replete second-stage variant
      after initial F/2 cultivation.
  - reference: doi:10.1016/j.biortech.2017.04.008
    supports: SUPPORT
    snippet: N-replete condition (4.41mM NaNO3)
    explanation: 'Claims: variants[0].modifications[0:2], study-specific first-stage
      F/2 and second-stage nitrate concentration. Locator: abstract. Additional exact
      excerpt: "F/2-medium for seven days in the first stage". Retain 4.41 mM NaNO3
      without conversion; the abstract separately gives the three-day second stage.
      The phosphorus-repletion condition is a separate experiment. This does not define
      the complete medium or certify a strain; original PMID evidence is preserved.'
- name: f_2asw_diatom_culture
  description: F/2 artificial seawater culture conditions used for marine diatom maintenance
    and transformation studies.
  modifications:
  - Use artificial seawater supplemented with half-strength Guillard f solution.
  - Maintain cultures at 20 deg C under continuous illumination at 30-75 umol photons
    m-2 s-1.
  - Aerate cultures with ambient air or 1% CO2 depending on the experiment.
  purpose: Represent F/2ASW as a study-specific F/2 medium implementation for marine
    diatoms.
  evidence:
  - reference: DOI:10.1104/pp.18.00453
    supports: SUPPORT
    explanation: 'Matsui et al. define F/2ASW as artificial seawater plus half-strength
      Guillard f solution and report use with Phaeodactylum tricornutum UTEX 642 and
      Thalassiosira pseudonana CCMP1335. Claim: variants[1].modifications[0]. Locator:
      Materials and Methods / Cells and Culture Conditions. The excerpt supports this
      relative formulation strength only, not equivalence to the UTEX natural-seawater
      parent. Experimental nitrogen treatments are separate from maintenance medium.
      Source type: journal article; discovery: existing record reference; manually
      inspected full text.'
    snippet: artificial seawater supplemented with one-half-strength Guillard’s f
      solution
- name: modified_f_2asw_sodium_response
  description: Modified F/2 artificial seawater used for sodium and CO2 response experiments
    with Chaetoceros gracilis.
  modifications:
  - Use the modified F/2ASW formulation in Table S1, including 1 nM sodium selenite
    and 0.1 mM sodium metasilicate nonahydrate.
  - Adjust sodium concentration by altering NaCl addition to the basal medium.
  - Vary CO2 availability to distinguish sodium-dependent growth effects.
  purpose: Capture an experimental F/2ASW variant used to study carbon concentrating
    mechanism physiology.
  evidence:
  - reference: DOI:10.1007/s10126-021-10037-4
    supports: SUPPORT
    explanation: Tsuji et al. report Chaetoceros gracilis UTEX LB2658 growth experiments
      using a modified F/2ASW formulation.
  - reference: https://media.springernature.com/original/springer-static/esm/art%3A10.1007%2Fs10126-021-10037-4/MediaObjects/10126_2021_10037_MOESM1_ESM.pdf
    supports: SUPPORT
    snippet: '0.001'
    explanation: 'Claim: variants[2].modifications[0], Table S1 formulation only.
      Locator: page 1, Na2SeO3 row; separately quoted heading: "Trace elements (μM)".
      Calculation: 0.001 micromolar x 1000 nanomolar/micromolar = 1 nanomolar, not
      the earlier 10 nM. Sodium metasilicate nonahydrate is separately shown in the
      Na2SiO3.9H2O row with exact value "0.1" under "Basal seawater components (mM)".
      This is the complete study-specific modified artificial-seawater formulation,
      not two supplements added to canonical UTEX F/2. Parent DOI: 10.1007/s10126-021-10037-4.
      The main methods were not inspected; possible main-text/table disagreement and
      the existing UTEX LB2658 claim remain unverified. No parent concentrations or
      growth claims change.'
