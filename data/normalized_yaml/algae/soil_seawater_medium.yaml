description: Algae culture medium from UTEX Culture Collection. Suitable for saltwater
  algae cultivation.
notes: UTEX prepares this 30 ppt marine soil medium by steaming Green House Soil with
  Pasteurized Seawater.
ingredients:
- preferred_term: Green House Soil
  notes: The source fixes the soil dose at 1 tsp/200 mL of Seawater for its 200 mL
    recipe. Teaspoon size and soil density are not established; no mass or standardized
    volume conversion is asserted.
  evidence:
  - reference: https://utex.org/products/soil-plus-seawater-medium
    supports: SUPPORT
    snippet: 1 tsp/200 mL of Seawater
    explanation: 'Supports ingredients[0].notes and associated ingredient/preparation
      notes. Original field: ingredients[0].concentration.  The source specifies a
      fixed teaspoon dose, not a variable quantity. Remove the misleading VARIABLE
      concentration and retain the exact dose in notes and evidence; teaspoon size
      and soil density are not established. Calculation: No numerical conversion applied.
      Separate basis excerpt: ''For 200 mL Total''. Locator: Formulation table row
      position 1; Directions total-volume heading.'
- preferred_term: Pasteurized Seawater
  term:
    id: ENVO:00002149
    label: sea water
  notes: Use 200 mL Pasteurized Seawater before soil and optional carbonate addition.
    This is a batch input, not an independently established per-final-liter fraction.
  physicochemical_roles:
  - OSMOTIC_AGENT
  evidence:
  - reference: https://utex.org/products/soil-plus-seawater-medium
    supports: SUPPORT
    snippet: 200 mL
    explanation: 'Supports ingredients[1].notes and associated ingredient/preparation
      notes. Original field: ingredients[1].concentration.  Remove the unsupported
      per-final-liter seawater fraction; preserve the 200 mL carrier input before
      adding soil and optional carbonate. Calculation: No numerical conversion applied.
      Separate basis excerpt: ''For 200 mL Total''. Locator: Formulation table row
      position 2; Directions total-volume heading.'
solutions: []
preparation_steps:
- step_number: 1
  action: MIX
  description: Combine Green House Soil and Pasteurized Seawater; add calcium carbonate
    only for the optional supplemented formulation.
- step_number: 2
  action: HEAT
  description: Cover the medium container and steam for two consecutive days, three
    hours on each day. Raise temperature gradually to approximately 95 C in 15 minutes,
    then just over 98 C for the three-hour duration. Cool gradually at room temperature.
- step_number: 3
  action: STORE
  description: Refrigerate for at least 24 hours, then bring to room temperature before
    use.
salinity: saltwater
light_intensity: Varies by species; typically 50-100 µmol photons m⁻² s⁻¹
light_cycle: Varies by species; commonly 12:12 or 16:8 light:dark
temperature_range: 15-30°C depending on species
applications:
