solutions:
- preferred_term: Liver extract infusion
  concentration:
    value: '40'
    unit: ML_PER_L
  composition:
  - preferred_term: dH2O
    term:
      id: CHEBI:15377
      label: water
    mediaingredientmech_chebi_term:
      id: CHEBI:15377
      label: water
    notes: Start with approximately 40 mL dH2O and bring the liver-extract preparation
      to 50 mL total with additional dH2O before heating and filtration. The exact
      combined water dose is not specified.
    evidence:
    - reference: https://utex.org/products/liver-extract-infusion
      supports: SUPPORT
      snippet: Bring the total volume to 50 mL with dH2O.
      explanation: 'Supports solutions[0].composition[0].notes for dH2O. Remove the
        unsupported final-fraction slot while retaining the source preparation input
        in notes. No final water/carrier fraction can be calculated from an initial
        portion and unspecified makeup dose. Separate basis excerpt: ''For 50 mL Total''.
        Locator: #recipe, composition table and Directions.'
  - preferred_term: Liver extract
    concentration:
      value: '50'
      unit: G_PER_L
      per_volume: per liter of prepared stock before heating and filtration
    term:
      id: MICRO:0001363
      label: Liver extract
    supplier_catalog:
      supplier_name: Difco Bacto
      catalog_number: '0133'
    notes: Use 2.5 g liver extract in 50 mL total stock before heating and filtration,
      equivalent to a 50 g/L preparation input. The recovered filtrate concentration
      is not measured by this recipe.
    nutritional_roles:
    - NITROGEN_SOURCE
    evidence:
    - reference: https://utex.org/products/liver-extract-infusion
      supports: SUPPORT
      snippet: 2.5 g/50 mL
      explanation: 'Supports solutions[0].composition[1].concentration for Liver extract.
        Retain the numeric value with exact source evidence and any explicitly stated
        preparation basis. 2.5 g / 0.050 L prepared stock = 50 g/L before heating
        and filtration. No recovery or filtrate concentration is inferred. Separate
        basis excerpt: ''For 50 mL Total''. Locator: #recipe, composition table and
        Directions. Component cell: ''Liver extract(Difco Bacto 0133)''; amount cell:
        ''2.5 g/50 mL''.'
  notes: UTEX adds 40 mL Liver extract infusion per liter of Ochromonas Medium. Prepare
    the stock to 50 mL, heat in a 50 C water bath for approximately 1 hour, then in
    an 80 C water bath for 3-5 minutes, and filter. Its 50 g/L component amount is
    a pre-filtration preparation input.
preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 900 mL dH2O, add each component in the order specified
    while stirring continuously.
- step_number: 2
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the medium.
- step_number: 4
  action: STORE
  description: Store at refrigerator temperature.
