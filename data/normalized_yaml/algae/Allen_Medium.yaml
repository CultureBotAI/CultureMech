preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 950 mL dH2O, add HEPES buffer, NaNO3, P-IV Metal Solution,
    and the listed mineral stocks.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the medium to pH 7.8.
- step_number: 3
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 4
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 5
  action: STORE
  description: Store at refrigerator temperature.
