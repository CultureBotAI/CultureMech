preparation_steps:
- step_number: 1
  action: MIX
  description: Add all J Medium components to approximately 950 mL dH2O while stirring
    continuously.
- step_number: 2
  action: MIX
  description: Bring the final volume to 1 L with dH2O.
- step_number: 3
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 4
  action: STORE
  description: Store at refrigerator temperature.
