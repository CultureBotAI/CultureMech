preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Prepare Spir solution 1 by adding NaHCO3, Na2CO3, and K2HPO4 to approximately
    450 mL dH2O while stirring.
- step_number: 2
  action: MIX
  description: Bring Spir solution 1 to 500 mL with dH2O.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave Spir solution 1.
- step_number: 4
  action: DISSOLVE
  description: Prepare Spir solution 2 by adding NaNO3, K2SO4, NaCl, MgSO4 x 7 H2O,
    CaCl2 x 2 H2O, P-IV Metal Solution, Chu Micronutrient Solution, and Vitamin B12
    to approximately 450 mL dH2O while stirring.
- step_number: 5
  action: MIX
  description: Bring Spir solution 2 to 500 mL with dH2O.
- step_number: 6
  action: AUTOCLAVE
  description: Autoclave Spir solution 2.
- step_number: 7
  action: MIX
  description: Transfer Spir solution 2 into Spir solution 1 and swirl thoroughly.
- step_number: 8
  action: STORE
  description: Store at refrigerator temperature.
