preparation_steps:
- step_number: 1
  action: MIX
  description: Combine the stock solutions, direct ingredients, and water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 7.0 or, for the source alternative, pH 8.0 with 1 N NaOH.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave following the SAG general guidance.
- step_number: 4
  action: COOL
  description: Cool and add sterile vitamin B12 and vitamin B1 solutions.
