preparation_steps:
- step_number: 1
  action: MIX
  description: 'Important Notes To Consider: The quality of water, including natural
    seawater, is important.'
- step_number: 2
  action: MIX
  description: The term 'dH2O' generally refers to distilled, deionized, distilled/deionized
    water, Milli-Q water (Millipore Corp.), etc.
- step_number: 3
  action: DISSOLVE
  description: Natural seawater and natural freshwater should be obtained from a non-polluted
    source. When dissolving chemicals, wait for the first component to dissolve before
    adding the second.
- step_number: 4
  action: DISSOLVE
  description: Stirring, and sometimes the addition of heat, is often required to
    dissolve the chemicals efficiently.
- step_number: 5
  action: MIX
  description: Preparation of stock solutions for frequently made algal culture media
    make preparing media convenient but also necessary to avoid errors from weighing
    very tiny amounts. Attention should be given to the pH of the final medium.
- step_number: 6
  action: ADJUST_PH
  description: In most cases, if pH adjustment is required, this occurs before sterilization.
- step_number: 7
  action: AUTOCLAVE
  description: Please note that autoclaving removes carbon dioxide from media lacking
    carbonate stabilizing buffers.
- step_number: 8
  action: AUTOCLAVE
  description: This would make the medium very alkaline soon after removal from the
    autoclave.
- step_number: 9
  action: MIX
  description: In these cases, you should wait approximately 24 hours for gaseous
    equilibrium before inoculating the medium.
notes: A+ MediumDirectionsFor 1 L TotalLiquid media:To approximately 900 mL of dH2O
  add the first 8 components in the order specified while stirring continuously.Bring
  total volume to 1 L with dH2O.Cover and autoclave medium.Add filter sterilized A+
  Trace Components.Allow to cool then store at refrigerator temperature.Agar media:To
  approximately 390 mL of dH2O add the first 8 components in the order specified while
  stirring continuously.Bring total volume to 500 mL with dH2O.In a separate container
  add 15 g of agar to 500 mL of dH2O (Final 1.5% w/v).Cover and autoclave both solutions.In
  a water bath allow both solutions to cool to 45-50°C.Add sterile Sodium Thiosulfate
  to agar solution and mix well.Add filter sterilized A+ Trace Components.Combine
  both agar and liquid solutions, mix well. Note the agar can solidify quickly.Allow
  to cool then store at refrigerator temperature.#ComponentAmountStock Solution ConcentrationFinal
