preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 900 mL dH2O, add NaCl, MgSO4 x 7 H2O, Na2EDTA x 2
    H2O, KCl, CaCl2 x 2 H2O, NaNO3, KH2PO4, and Trizma Base in the UTEX order while
    stirring.
- step_number: 2
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 3
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 4
  action: FILTER_STERILIZE
  description: Add filter-sterilized A+ Trace Components.
- step_number: 5
  action: STORE
  description: Allow to cool, then store at refrigerator temperature.
notes: UTEX prepares liquid A+ Medium by adding NaCl, MgSO4 x 7 H2O, Na2EDTA x 2 H2O,
  KCl, CaCl2 x 2 H2O, NaNO3, KH2PO4, and Trizma Base to dH2O, autoclaving, and then
  adding filter-sterilized A+ Trace Components.
