preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare 1 L of Bristol Medium and discard 40 mL.
- step_number: 2
  action: FILTER
  description: 'Filter prepared Soilwater: GR+ Medium to remove soil particles.'
- step_number: 3
  action: MIX
  description: 'Add 40 mL of Soilwater: GR+ Medium supernatant to the remaining 960
    mL Bristol Medium.'
- step_number: 4
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 5
  action: FILTER_STERILIZE
  description: When cooled, add filter-sterilized sodium metasilicate.
- step_number: 6
  action: STORE
  description: Store at refrigerator temperature.
