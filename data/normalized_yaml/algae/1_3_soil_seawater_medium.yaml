solutions: []
preparation_steps:
- step_number: 1
  action: MIX
  description: Combine Green House Soil and Pasteurized Seawater with dH2O; add calcium
    carbonate only for the optional supplemented formulation.
- step_number: 2
  action: HEAT
  description: Cover the medium container and steam for two consecutive days, three
    hours on each day. Raise temperature gradually to approximately 95 C in 15 minutes,
    then just over 98 C for the three-hour duration. Cool gradually at room temperature.
- step_number: 3
  action: STORE
  description: Refrigerate for at least 24 hours, then bring to room temperature before
    use.
