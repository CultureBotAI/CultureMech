  description: Add Tricine and the three stock solutions at the stated amounts.
- step_number: 2
  action: MIX
  description: Make up to 1 L with filtered natural seawater.
- step_number: 3
  action: ADJUST_PH
  description: Adjust to pH 7.6-7.8 with 1 M NaOH or 1 M HCl.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 15 psi for 15 minutes.
