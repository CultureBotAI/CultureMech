id: CultureMech:015893
name: fcgm_freshwater_cereal_grass_medium
original_name: FCGM (Freshwater Cereal Grass Medium)
category: algae
sources:
- database: CCAP
  database_id: FCGM
  url: https://www.ccap.ac.uk/wp-content/uploads/MR_FCGM.pdf
medium_type: COMPLEX
composition_type: UNDEFINED
physical_state: LIQUID
description: Freshwater Cereal Grass Medium from the CCAP FCGM medium sheet.
notes: CCAP prepares FCGM by boiling Ward's cereal grass leaves in deionised water,
  steeping, filtering, and autoclaving.
ingredients:
- preferred_term: Deionised water
  concentration:
    value: '1000'
    unit: ML_PER_L
  term:
    id: CHEBI:15377
    label: water
  mediaingredientmech_chebi_term:
    id: CHEBI:15377
    label: water
  notes: CCAP lists 500 mL deionised water per 500 mL medium.
- preferred_term: Cereal grass leaves
  concentration:
    value: '1.25'
    unit: G_PER_L
  source: CCAP Medium MR_FCGM.pdf
  notes: Ward's cereal grass leaves; CCAP lists 0.625 g per 500 mL medium.
preparation_steps:
- step_number: 1
  action: HEAT
  description: Bring the deionised water to the boil.
- step_number: 2
  action: MIX
  description: Add the cereal grass leaves, boil for 5 minutes, then leave to steep
    for 3 hours.
- step_number: 3
  action: FILTER
  description: Filter through a Buchner funnel.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 15 psi for 15 minutes.
applications:
- Protozoa cultivation
sterilization:
  method: AUTOCLAVE
  pressure: 15
  duration: 15 minutes
