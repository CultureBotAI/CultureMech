preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Prepare, adjust, dispense, and autoclave the ES-enrichment stock.
- step_number: 2
  action: MIX
  description: Add one 20 mL tube of ES-enrichment to 1000 mL pasteurized, filtered
    seawater.
- step_number: 3
  action: STORE
  description: Store ES-enrichment stock at 10 C.
