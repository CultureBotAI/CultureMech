preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve NaCl and TRIS in water, then add the mineral and trace stocks.
- step_number: 2
  action: ADJUST_PH
  description: Adjust to pH 8.0 with 1 N HCl.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave the base medium.
- step_number: 4
  action: COOL
  description: Cool and add sterile vitamin B12 and vitamin B1 stocks.
- step_number: 5
  action: MIX
  description: For half-strength ASM15 use 15 g/L NaCl; agar at 15 g/L is an optional
    solid variant.
