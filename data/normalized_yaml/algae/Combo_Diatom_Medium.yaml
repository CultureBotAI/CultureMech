preparation_steps:
- step_number: 1
  action: ALIQUOT
  description: Add CR1 Soil, MgCO3, and Modified COMBO Medium in order to 15 mL glass
    tubes.
- step_number: 2
  action: HEAT
  description: Within 6 hours of mixing soil and liquid, pasteurize the tubes by heating
    them to just over 98 C for 2 hours.
- step_number: 3
  action: COOL
  description: Allow the tubes to cool to room temperature for 20 to 24 hours, then
    repeat the pasteurization cycle for 3 successive days.
- step_number: 4
  action: AUTOCLAVE
  description: For routine maintenance and transfer, autoclave the tubes for 15 minutes
    instead of pasteurizing them.
- step_number: 5
  action: STORE
  description: Allow pasteurized or autoclaved tubes to gas-equilibrate for 2 days
    before use.
