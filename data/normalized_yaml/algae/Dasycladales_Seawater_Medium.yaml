id: CultureMech:000161
name: dasycladales_seawater_medium
category: algae
medium_type: COMPLEX
composition_type: UNDEFINED
physical_state: LIQUID
media_term:
  preferred_term: Dasycladales Seawater Medium
  term:
    id: UTEX:dasycladales-seawater-medium
    label: Dasycladales Seawater Medium
description: Algae culture medium from UTEX Culture Collection. Suitable for saltwater
  algae cultivation.
notes: 'UTEX prepares Dasycladales Seawater Medium from 30 ppt Pasteurized Seawater,
  Soil+Seawater Medium, DAS Macro Solution, Modified P-IV chelated Micronutrient Solution,
  and DAS Vitamin Cocktail. Unresolved source-volume conflict: both HTML and the linked
  PDF say "For 3 L Total", yet direct preparation of 3 L seawater followed by 121.5
  mL of supplements. The seawater fraction is unquantified; four supplement doses
  explicitly use starting-seawater volume, without substituting an assumed 3.1215
  L final volume. Literal batch inputs remain 3 L seawater, 50 mL Soil+Seawater Medium,
  40 mL DAS Macro Solution, 30 mL Modified P-IV stock and 1.5 mL vitamin cocktail.
  Stock compositions are independent of this receiving-volume conflict; no final DAS
  molarity is recalculated.'
ingredients:
- preferred_term: Pasteurized Seawater
  term:
    id: ENVO:00002149
    label: sea water
  notes: UTEX lists 3 L for the recipe labelled 3 L total. The directions start with
    3 L seawater before supplement addition, so the final-volume basis remains unresolved.
    This literal input is not asserted as a per-final-liter concentration.
  physicochemical_roles:
  - OSMOTIC_AGENT
  evidence:
  - reference: https://utex.org/products/dasycladales-seawater-medium
    supports: SUPPORT
    snippet: 3 L
    explanation: 'Supports removal of the unsupported final-volume assertion at ingredients[0].concentration
      and the replacement notes. UTEX lists 3 L for the recipe labelled 3 L total.
      The directions start with 3 L seawater before supplement addition, so the final-volume
      basis remains unresolved. This literal input is not asserted as a per-final-liter
      concentration. Separate basis excerpt: ''Prepare 3 L of Pasteurized Seawater
      (30 ppt).''. Locator: Formulation table row 1; Directions 1-2 and total-volume
      heading.'
- preferred_term: Soil+Seawater Medium
  concentration:
    value: '16.66666666666666666666666667'
    unit: ML_PER_L
    per_volume: per liter of starting Pasteurized Seawater before supplement addition
  culturemech_term:
    id: CultureMech:000221
    label: Soil+Seawater Medium
  notes: Add 50 mL to the initial 3 L of Pasteurized Seawater. The structured dose
    is per liter of starting seawater, not per liter of final DAS medium.
  evidence:
  - reference: https://utex.org/products/dasycladales-seawater-medium
    supports: SUPPORT
    snippet: 50 mL/3 L
    explanation: 'Supports ingredients[1].concentration, its per_volume basis, and
      replacement notes. 50 mL / 3 L starting seawater = 16.66666666666666666666666667
      mL/L of starting seawater (repeating decimals rounded to the existing 28-digit
      precision). Separate directions excerpt: ''Prepare 3 L of Pasteurized Seawater
      (30 ppt).''. Separate heading excerpt: "For 3 L Total". The source heading conflicts
      with the preparation sequence; no final-volume concentration or additive final
      volume is inferred. Locator: Formulation table row 2; Directions 1-2 and total-volume
      heading.'
