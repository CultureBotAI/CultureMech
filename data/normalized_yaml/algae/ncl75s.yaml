preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare 75% seawater from natural filtered seawater and deionized water.
- step_number: 2
  action: HEAT
  description: Bring 500 mL of 75% seawater to the boil and add cereal leaves.
- step_number: 3
  action: HEAT
  description: Continue to boil for 5 minutes.
- step_number: 4
  action: MIX
  description: Cool and restore the extracted volume to 500 mL.
- step_number: 5
  action: FILTER
  description: Filter through GF/C paper and decant into the remaining 500 mL.
- step_number: 6
  action: AUTOCLAVE
  description: Autoclave at 15 psi for 15 minutes.
