preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 500 mL dH2O, add each component in the UTEX order
    while stirring continuously.
- step_number: 2
  action: MIX
  description: Bring the total volume to 1 L with dH2O; pH is 5.1-5.3.
  notes: UTEX lists optional solid Snow Algae Medium as 15 g agar per liter.
- step_number: 3
  action: AUTOCLAVE
  description: Cover and autoclave medium.
- step_number: 4
  action: STORE
  description: Store at refrigerator temperature.
