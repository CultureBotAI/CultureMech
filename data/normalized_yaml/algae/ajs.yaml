preparation_steps:
- step_number: 1
  action: MIX
  description: Mix 970 mL JM with 30 mL SE2 per approximately 1 L final medium.
- step_number: 2
  action: ADJUST_PH
  description: Add 10 mL concentrated H2SO4 to obtain approximately pH 1.5.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 15 psi for 15 minutes.
