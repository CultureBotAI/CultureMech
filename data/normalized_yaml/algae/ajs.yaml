  description: Emami et al. (2015) AJS study context for Dunaliella acidophila CCAP
    19/35. Hydrochloric-acid adjustment differs from the CCAP sulfuric-acid recipe;
    full study formula remains unresolved.
  modifications:
  - Use hydrochloric acid for the reported adjustment to pH 1.5, rather than inheriting
    the canonical sulfuric-acid instruction. HCl strength and dose are not quantified;
    no dose or substitution arithmetic is inferred.
