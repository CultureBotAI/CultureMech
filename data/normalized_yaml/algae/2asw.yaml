original_name: 2ASW
variants:
- name: f_2asw
  description: Artificial seawater supplemented with half-strength Guillard f nutrients
    for marine diatom culture.
  modifications:
  - Supplement the artificial seawater base with half-strength Guillard f solution.
  - Use liquid or agar-solidified F/2ASW depending on maintenance, transformation,
    or selection protocol.
  - Reported diatom conditions include 20 deg C, continuous illumination at 30-75
    umol photons m-2 s-1, and aeration with ambient air or CO2-enriched air.
  purpose: Capture F/2 nutrient-supplemented artificial seawater as a recognizable
    variant of the 2ASW parent formulation.
  evidence:
  - reference: DOI:10.1104/pp.18.00453
    supports: SUPPORT
    explanation: Matsui et al. explicitly define F/2ASW as artificial seawater plus
      half-strength Guillard f solution for Phaeodactylum tricornutum UTEX 642 and
      Thalassiosira pseudonana CCMP1335 cultivation.
- name: modified_f_2asw_sodium_response
  description: Modified F/2 artificial seawater used to assay sodium and CO2 dependence
    in Chaetoceros gracilis UTEX LB2658.
  modifications:
  - Supplement F/2ASW with 10 nM sodium selenite and 0.1 mM sodium metasilicate.
