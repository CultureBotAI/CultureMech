preparation_steps:
- step_number: 1
  action: ALIQUOT
  description: Add CR1 Soil, MgCO3, dH2O, and Pasteurized Seawater in order to 15
    mL glass tubes.
- step_number: 2
  action: AUTOCLAVE
  description: Process the soil and liquid mixture within 6 hours; autoclave for 15
    minutes for routine maintenance.
- step_number: 3
  action: STORE
  description: Allow tubes to gas-equilibrate for 2 days before use.
