preparation_steps:
- step_number: 1
  action: MIX
  description: Add six 10 mL mineral-stock portions to 940 mL water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the mineral base.
- step_number: 3
  action: COOL
  description: Add filter-sterilized vitamin and PIV metal solutions after cooling.
- step_number: 4
  action: MIX
  description: The 3NBBM+V variant uses 30 rather than 10 mL/L NaNO3 stock.
