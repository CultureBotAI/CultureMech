original_name: Bold Basal Medium
variants:
- name: bbm_estradiol_exposure_assay
  description: Study-specific BBM stock-culture and estradiol assay conditions. The
    study cites Stein 1973 for BBM; exact equivalence to this UTEX parent formulation
    is not established.
  modifications:
  - Adjust pH to 7.0 before use.
  - Aerate 250 mL Erlenmeyer flask cultures during the 11-day experiment.
  - Test separate 17-beta-estradiol treatments at 0.25, 0.75, 2.50, 5.0 and 15.0 ng/L,
    with a no-hormone control.
  - Maintain the pre-experiment Scenedesmus quadricauda stock culture in modified
    BBM containing 4.5 ppm NH4Cl; do not assert this as a universal final assay-medium
    dose.
  purpose: Experimental hormone-exposure growth assay using BBM as the base medium.
  evidence:
  - reference: PMID:35807621
    supports: SUPPORT
    snippet: 'The study was conducted using three types of media: Bold Basal Medium
      (BBM)'
    explanation: The paper explicitly used BBM as one of three media for the Scenedesmus
      quadricauda CPCC-158 growth experiment.
  - reference: doi:10.3390/plants11131669
    supports: SUPPORT
    snippet: 0.25, 0.75, 2.50, 5.0, and 15.0 ng/L
    explanation: 'variants[0].modifications[0:4]: the listed E2 levels are discrete
      active-estradiol concentrations, with a no-hormone control, not chemical-powder
      concentrations. Separately inspected Methods 2.1 excerpts: "NH4Cl was added
      to 4.5 ppm" (pre-experiment stock culture; unspecified ppm basis) and "250 mL
      Erlenmeyer flasks" (vessel capacity, not culture volume). Methods 2.2 states
      "adjusted to 7" for assay-medium pH. The study cites Stein 1973 for BBM; no
      exact equivalence to the UTEX parent or universal NH4Cl assay dose is asserted.
      Locator: Methods 2.1-2.3; reference 45.'
