original_name: Bold Basal Medium
variants:
- name: bbm_estradiol_exposure_assay
  description: Bold Basal Medium assay formulation used for 17β-estradiol exposure
    tests with Scenedesmus quadricauda CPCC-158.
  modifications:
  - Adjust pH to 7.0 before use.
  - Aerate 250 mL Erlenmeyer flask cultures during the 11-day experiment.
  - Add 17β-estradiol at 0.25-15.0 ng/L for exposure treatments; include no-hormone
    controls.
  - Maintain Scenedesmus quadricauda stock in BBM modified with NH4Cl at 4.5 ppm.
  purpose: Experimental hormone-exposure growth assay using BBM as the base medium.
  evidence:
  - reference: PMID:35807621
    supports: SUPPORT
    snippet: 'The study was conducted using three types of media: Bold Basal Medium
      (BBM)'
    explanation: The paper explicitly used BBM as one of three media for the Scenedesmus
      quadricauda CPCC-158 growth experiment.
