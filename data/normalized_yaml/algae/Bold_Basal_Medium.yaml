preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 900 mL dH2O, add the six Bristol mineral stocks and
    one drop each of EDTA, Iron, Boron, and Bold Trace stocks.
- step_number: 2
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 3
  action: ALIQUOT
  description: Transfer the medium to a 2 L Erlenmeyer flask and cover.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave the covered Bold Basal Medium.
light_intensity: Varies by species; typically 50-100 µmol photons m⁻² s⁻¹
light_cycle: Varies by species; commonly 12:12 or 16:8 light:dark
temperature_range: 15-30°C depending on species
applications:
- Algae cultivation
- Phytoplankton culture
- Microalgae research
