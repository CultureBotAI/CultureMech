preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 850 mL dH2O, add each component except Vitamin B12
    and Thiamine Vitamin Solution in the UTEX order while stirring continuously.
- step_number: 2
  action: MIX
  description: Bring total volume to 1 L with dH2O.
- step_number: 3
  action: AUTOCLAVE
  description: Cover and autoclave medium.
- step_number: 4
  action: COOL
  description: Cool the autoclaved medium.
- step_number: 5
  action: MIX
  description: Add Vitamin B12 and Thiamine Vitamin Solution.
- step_number: 6
  action: STORE
  description: Store at refrigerator temperature.
