preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare 1 L Waris Medium without pH adjustment and prepare 200 mL Euglena
    Medium.
- step_number: 2
  action: MIX
  description: Discard 200 mL of the Waris preparation. Combine the remaining 800
    mL with the prepared 200 mL Euglena in a 2 L Erlenmeyer flask.
- step_number: 3
  action: AUTOCLAVE
  description: Cover the flask and autoclave the combined medium.
- step_number: 4
  action: STORE
  description: Store at refrigerator temperature.
