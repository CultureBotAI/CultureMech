solutions:
- preferred_term: Bristol Medium
  culturemech_term:
    id: CultureMech:000037
    label: Bristol Medium
  notes: Start with approximately 825 mL prepared Bristol Medium, then use additional
    reserved Bristol Medium to bring the supplemented recipe to 1 L. The combined
    initial and makeup dose is not quantified; 825 mL/L is not the total dose.
- preferred_term: 'Soilwater: GR+ Medium'
  concentration:
    value: '140'
    unit: ML_PER_L
  culturemech_term:
    id: CultureMech:000225
    label: 'Soilwater: GR+ Medium'
  notes: 'UTEX lists 140 mL prepared Soilwater: GR+ Medium per liter.'
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare 1 L of Bristol Medium, transfer approximately 825 mL to a 2
    L Erlenmeyer flask, and save the remaining Bristol Medium.
- step_number: 2
  action: MIX
  description: To the approximately 825 mL Bristol Medium, add the listed components
    in order while stirring continuously.
- step_number: 3
  action: MIX
  description: Bring the total volume to 1 L with the reserved Bristol Medium.
- step_number: 4
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 5
  action: STORE
  description: Store at refrigerator temperature.
