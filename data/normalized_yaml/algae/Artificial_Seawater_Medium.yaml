preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 850 mL dH2O, add the salts, Tricine, P-II Metal Solution,
    Chelated Iron Solution, and NH4Cl.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the medium to pH 8.1.
- step_number: 3
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 4
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 5
  action: MIX
  description: Add sterile Vitamin B12 after the medium cools.
- step_number: 6
  action: STORE
  description: Store at refrigerator temperature.
