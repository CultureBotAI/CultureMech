solutions:
- preferred_term: Soil+Seawater Medium
  culturemech_term:
    id: CultureMech:000221
    label: Soil+Seawater Medium
  notes: Filter 1 L prepared Soil+Seawater Medium before adding sea-salt and agar.
    The source does not measure a final carrier fraction after those additions.
preparation_steps:
- step_number: 1
  action: FILTER
  description: Filter 1 L of Soil+Seawater Medium to remove soil particles.
- step_number: 2
  action: DISSOLVE
  description: Add 15 g natural sea-salt to the filtered 1 L prepared medium and wait
    until fully dissolved.
- step_number: 3
  action: AUTOCLAVE
  description: Add 15 g agar to the flask; do not mix. Cover and autoclave the medium.
- step_number: 4
  action: STORE
  description: Store at refrigerator temperature.
