preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 900 mL dH2O, add WC Trace Elements Solution and each
    non-vitamin WC component in the UTEX order.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the medium to pH 7.8.
- step_number: 3
  action: MIX
  description: Bring total volume to 1 L with dH2O.
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter sterilize the medium.
- step_number: 5
  action: MIX
  description: Aseptically add sterile Vitamin B12, Thiamine Vitamin Solution, and
    Biotin Vitamin Solution.
- step_number: 6
  action: STORE
  description: Store at refrigerator temperature.
