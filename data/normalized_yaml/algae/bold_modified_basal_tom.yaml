preparation_steps:
- step_number: 1
  action: MIX
  description: Add 10 mL of each mineral stock and 1 mL of each trace stock; make
    to 1 L.
- step_number: 2
  action: MIX
  description: Add 0.715 g HEPES, 1.5% glucose, and 2% proteose peptone for TOM.
- step_number: 3
  action: ADJUST_PH
  description: Adjust TOM to pH 7.1.
- step_number: 4
  action: MIX
  description: The PDF lists a vitamin stock but gives no unambiguous final addition
    rate, so it is not asserted.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave following the SAG general preparation guidance.
ph_range:
  min: 7.1
  max: 7.1
sterilization:
  method: AUTOCLAVE
