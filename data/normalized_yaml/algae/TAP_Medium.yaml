original_name: TAP Medium
variants:
- name: tap_delftia_chlorella_vulgaris_coculture
  description: TAP medium co-culture condition for Chlorella vulgaris with Delftia
    sp. used to test algae-bacteria interaction effects on algal growth.
  modifications:
  - Co-culture Chlorella vulgaris with Delftia sp. in TAP medium.
  - Include TAP medium nitrogen and carbon context with NH4Cl and acetic acid.
  purpose: Capture a study-specific TAP co-culture condition that changed Chlorella
    vulgaris growth compared with algal culture controls.
  evidence:
  - reference: PMID:39168352
    supports: SUPPORT
    snippet: Under laboratory conditions, we found that Delftia sp. had a negative
      effect on C. vulgaris growth when co-cultured in a TAP medium.
    explanation: Literature evidence supports a TAP medium co-culture variant for
      Chlorella vulgaris and Delftia sp.
- name: ab_wsf_tap_derived_chlorella_sorokiniana
  description: Acetate-based water-soluble fertilizer medium developed from TAP for
    Chlorella sorokiniana cultivation.
  modifications:
  - Replace TAP trace and macroelements with water-soluble fertilizer.
  - Replace Tris in TAP medium with HAc-NaAc for pH balance.
  - Use the medium in fed-batch, semicontinuous, and outdoor cultures.
  purpose: Capture a TAP-derived lower-cost medium variant for Chlorella sorokiniana
    biomass production.
  evidence:
  - reference: PMID:40484141
    supports: SUPPORT
    snippet: To address these problems, a novel acetate-based water-soluble fertilizer
      (Ab-WSF) was developed on the basis of TAP media, where the trace and macroelements
      in TAP were replaced by water-soluble fertilizer (WSF).
    explanation: Literature evidence describes a TAP-derived formulation variant for
      Chlorella sorokiniana cultivation.
