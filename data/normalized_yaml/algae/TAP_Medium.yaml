preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 1600 mL dH2O, add Beijerinck's Solution, Phosphate
    Buffer Stock Solution, Hunter's Trace Stock Solution, and Tris Acetate Stock Solution
    in the UTEX order.
- step_number: 2
  action: MIX
  description: Bring total volume to 2 L with dH2O.
  notes: UTEX lists optional solid TAP Medium as 30 g agar per 2 L.
- step_number: 3
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 4
  action: COOL
  description: Cool the autoclaved medium.
- step_number: 5
  action: STORE
  description: Store at refrigerator temperature.
