  term:
    id: UTEX:bristol-nacl-medium
    label: Bristol-NaCl Medium
description: Algae culture medium from UTEX Culture Collection. Suitable for saltwater
  algae cultivation.
notes: UTEX adds 3.6 g NaCl to the Bristol mineral preparation before final volume
  adjustment to 1 L, rather than to a one-litre aliquot of finished Bristol Medium.
