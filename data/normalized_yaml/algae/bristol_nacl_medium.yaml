    id: CHEBI:26710
    label: sodium chloride
  supplier_catalog:
    supplier_name: Fisher
    catalog_number: S271-500
  notes: UTEX lists 3.6 g/L NaCl, equivalent to 0.062 M.
  physicochemical_roles:
  - OSMOTIC_AGENT
  evidence:
  - reference: https://utex.org/products/bristol-nacl-medium
    supports: SUPPORT
    snippet: 0.062 M
    explanation: 'ingredients[0].concentration: source-reported concentration for
      the added NaCl row, separately listed as 3.6 g/L. Do not represent this as total
      NaCl including the Bristol base or independently re-convert rounded molarity.
      This evidence also supports root notes about adding salt before final make-up.
      Locator: Directions 1-2 and recipe table.'
solutions:
- preferred_term: Bristol mineral base (before volume adjustment)
  culturemech_term:
    id: CultureMech:000037
    label: Bristol Medium
  notes: Use Bristol mineral preparation through step one at the one-litre recipe
    scale; add 3.6 g NaCl before making the child up to 1 L. This is not a one-litre
    aliquot of completed Bristol Medium.
preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare Bristol Medium through step one.
- step_number: 2
  action: DISSOLVE
  description: Add NaCl and bring the total volume to 1 L with dH2O.
- step_number: 3
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 4
  action: STORE
  description: Store at refrigerator temperature.
salinity: saltwater
light_intensity: Varies by species; typically 50-100 µmol photons m⁻² s⁻¹
light_cycle: Varies by species; commonly 12:12 or 16:8 light:dark
temperature_range: 15-30°C depending on species
applications:
- Algae cultivation
- Phytoplankton culture
- Microalgae research
