- reference: doi:10.1104/pp.16.01628
  title: The Plastid Genome of Polytoma uvella Is the Largest Known among Colorless
    Algae and Plants and Reflects Contrasting Evolutionary Paths to Nonphotosynthetic
    Lifestyles.
  authors: Figueroa-Martinez F; Nedelcu AM; Smith DR; Reyes-Prieto A
  year: 2017
  notes: source_type=journal_article; discovery_mode=primary_literature_followup;
    accessed_on=2026-10-14; PMID:27932420; PMCID:PMC5291040; source_url=https://www.arrogantgenome.com/wp-content/uploads/2013/12/Polytoma_ptDNA.pdf;
    raw_archive=references_cache/papers/primary_pdf/polytoma-2017-author-egjm-bristol-followup-20261014.pdf;
    markdown_archive=references_cache/papers/primary_pdf/polytoma-2017-author-egjm-bristol-followup-20261014.md;
    access_scope=full primary article; bounded cultivation passages, not a whole-paper
    organism inventory; locator=PDF page 10, printed 941, Materials and Methods /
    Algal Cultures; exact excerpt="Cultures of Chlamydomonas leiostraca (strain SAG
    11-49) were maintained in standard Volvox medium (Kirk et al., 1999)"; This is
    a named Volvox-medium literature citation, not proof that the study used this
    exact source-specific formulation. The current SAG and UTEX recipes differ in
    mineral stock additions and vitamins; do not collapse them into one exact formula.
    The study keeps P. uvella UTEX 964 in Polytomella medium and C. leiostraca SAG
    11-49 in standard Volvox medium citing Kirk et al. (1999). Its Polytomella percentages
    do not specify a w/v basis or acetate hydration. Its Volvox recipe is not reproduced.
    Species, shaking and other study conditions must not be transferred between these
