preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 950 mL dH2O, add the salts, glycylglycine, and P-IV
    Metal Solution in order while stirring continuously.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the medium to pH 8.0.
- step_number: 3
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 4
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 5
  action: MIX
  description: Allow the medium to cool, then add Vitamin B12 and Biotin Vitamin Solution.
