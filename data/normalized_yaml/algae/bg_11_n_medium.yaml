preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 900 mL dH2O, add the first 7 BG-11(-N) mineral stocks
    and BG-11 Trace Metals Solution while stirring.
- step_number: 2
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 3
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 4
  action: STORE
  description: Allow to cool, then store at refrigerator temperature.
notes: UTEX prepares liquid BG-11(-N) Medium from seven mineral stocks and BG-11 Trace
  Metals Solution diluted in dH2O before autoclaving; this nitrogen-free BG-11 recipe
  omits NaNO3.
