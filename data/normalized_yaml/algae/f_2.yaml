original_name: f/2
source_environment:
- preferred_term: marine environment
  term:
    id: ENVO:00002149
    label: sea water
  notes: 'Synthetic community assembled in laboratory culture to model diatom-bacteria
    interactions in marine phytoplankton. Members were isolated from marine environments
    and maintained under controlled conditions to study dynamic relationships between
    the diatom and associated bacteria.

    '
preparation_steps:
- step_number: 1
  action: MIX
  description: Bring to 1 L with filtered natural seawater.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 8.0 with 1 M NaOH or 1 M HCl before autoclaving.
- step_number: 3
  action: ADD_AGAR
  description: For an agar formulation, add 15 g/L Bacteriological Agar.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 15 psi for 15 minutes.
variants:
- name: f_2_silicate_supplement_1_06e_4_m
  relationship: SUPPLEMENTED_VARIANT
  description: Emami et al. (2015) f/2 supplemented with silicate for Isochrysis galbana
    CCAP 927/1; bounded supplement claim, not a fully resolved recipe.
  modifications:
  - The study reports f/2 supplemented with 1.06e-4 M silicate. Preserve this stated
    supplementation concentration without assigning an unreported silicate salt, hydrate,
    stock recipe or additional mass conversion.
  - Other nutrients, total silicate including the base, final-volume preparation and
    equivalence to local f/2 + Si records remain unresolved.
  evidence:
  - reference: doi:10.1038/srep10036
    supports: SUPPORT
    snippet: Isochrysis galbana was cultured using f/2 supplemented with 1.06 × 10−4
      M silicate
    explanation: 'Supports only variants[name=f_2_silicate_supplement_1_06e_4_m].modifications[0].
      Locator: Methods / Microalgae and cyanobacteria strains and culture conditions.
      Reported scientific name=Isochrysis galbana; strain=CCAP 927/1; canonical scientific
      name=Isochrysis galbana; NCBITaxon:37099; actual rank=species; taxonomy_match=exact_name_at_species_rank;
      lookup_url=https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=37099;
      scope=silicate-supplemented f/2. Directly stated supplement value in the study
      medium, not a stock concentration or calculated total including background.
      No calculation. Local f/2 + Si owners specify sodium silicate nonahydrate and
      differently encoded stock amounts; the paper does not establish exact equivalence.'
- name: f_2_nitrate_supplement_29_4_mm
  relationship: SUPPLEMENTED_VARIANT
  description: Emami et al. (2015) nitrate-supplemented f/2 at pH 8 for reported Arthrospira
    platensis CCMP 1295; current NCBI synonym maps to Limnospira platensis.
  modifications:
  - The study reports f/2 supplemented with 29.4 mM NaNO3 and adjusted to pH 8. Retain
    the stated supplement concentration; do not infer whether it includes the base-medium
    nitrate or calculate a total nitrate concentration.
  - Remaining formulation details, chemical stock forms and equivalence to a specific
    canonical amount set are unresolved.
  evidence:
  - reference: doi:10.1038/srep10036
    supports: SUPPORT
    snippet: A. platensis was cultured using f/2 supplemented with 29.4 mM NaNO3 and
      adjusted to pH 8.
    explanation: 'Supports only variants[name=f_2_nitrate_supplement_29_4_mm].modifications[0].
      Locator: Methods / Microalgae and cyanobacteria strains and culture conditions.
      Reported scientific name=Arthrospira platensis; strain=CCMP 1295; canonical
      scientific name=Limnospira platensis; NCBITaxon:118562; actual rank=species;
      taxonomy_match=verified_synonym_at_species_rank; lookup_url=https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=118562;
      scope=nitrate-supplemented f/2 at pH 8. Directly reported supplementation value
      and study pH, not a stock quantity or a universal optimum. No arithmetic; base-plus-supplement
      total remains unresolved.'
- name: f_2_penicillin_g_dihydrostreptomycin_supplement
  relationship: SUPPLEMENTED_VARIANT
  description: Emami et al. (2015) antibiotic-treated f/2 cultures of Dunaliella polymorpha
    CCAP 19/7A and CCAP 19/7C, separated from untreated controls and later bacterial
    marine-agar sampling.
  modifications:
  - 'Reported penicillin G treatment concentration: 200 micrograms per mL in the treated
    f/2 culture; no unreported salt form, stock strength or conversion is assigned.'
  - 'Reported dihydrostreptomycin sulphate treatment concentration: 50 micrograms
    per mL in the same treated culture; not streptomycin, not a stock concentration,
    and no hydrate assumption.'
  - The untreated comparator remains separate. Unspecified base formulation details
    and the later marine-agar bacterial assay must not be combined into this study
    variant.
  evidence:
  - reference: doi:10.1038/srep10036
    supports: SUPPORT
    snippet: 'treated with the antibiotics penicillin G and dihydrostreptomycin sulphate
      in a ratio of 200 μg mL−1: 50 μg mL−1.'
    explanation: 'Supports only variants[name=f_2_penicillin_g_dihydrostreptomycin_supplement].modifications[0:2].
      Locator: Methods / Bacterial interference experiment. Reported scientific name=Dunaliella
      polymorpha; strain=CCAP 19/7A; canonical scientific name=Dunaliella polymorpha;
      NCBITaxon:346903; actual rank=species; taxonomy_match=exact_name_at_species_rank;
      lookup_url=https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=346903;
      scope=f/2 or double-strength f/2; general maintenance assignment unresolved.
      Reported scientific name=Dunaliella polymorpha; strain=CCAP 19/7C; canonical
      scientific name=Dunaliella polymorpha; NCBITaxon:346903; actual rank=species;
      taxonomy_match=exact_name_at_species_rank; lookup_url=https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=346903;
      scope=f/2 or double-strength f/2; general maintenance assignment unresolved.
