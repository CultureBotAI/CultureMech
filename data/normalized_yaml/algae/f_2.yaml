      / Bacterial interference experiment, not an unresolved maintenance-strength
      assignment. The two directly stated culture-treatment amounts share this exact
      excerpt; no arithmetic. Marine-agar sampling concerns co-occurring bacteria,
      not growth of Dunaliella on that agar.'
- name: f_2_2asw_vitamin_replacement_hiibel_2015
  relationship: SUBSTITUTED_COMPONENT_VARIANT
  description: Hiibel et al. (2015) f/2 maintenance medium with a reported 2ASW vitamin-solution
    replacement; composition and dose unresolved.
  modifications:
  - The vitamin solution described as coming from 2ASW replaces the original f/2 vitamin
    solution; the paper states it contains additional vitamin components.
  - Vitamin identities, stock composition, addition dose and resulting final concentrations
    are not quantified in the inspected methods. The cited Gomord 2010 reference is
    a plant glycosylation paper and cannot supply these missing details.
  - Other formulation details, physical-state equivalence, and exact correspondence
    to this imported stock encoding remain unresolved. This is not the silicate, nitrate,
    antibiotic or Quad formulation.
  purpose: Maintenance of the Table 1 brackish Nannochloropsis cohort, separate from
    wastewater screening.
  evidence:
  - reference: doi:10.3389/fenrg.2015.00020
    supports: SUPPORT
    snippet: the vitamin solution from the 2ASW medium (Gomord et al., 2010), which
      contained additional vitamin components, was used in place of that described
      for the original f/2 medium.
    explanation: 'Supports only the stated replacement in variants[name=f_2_2asw_vitamin_replacement_hiibel_2015].modifications[0].
