solutions: []
preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 900 mL dH2O, add each Bristol mineral stock while
    stirring continuously.
- step_number: 2
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 3
  action: AUTOCLAVE
  description: Cover and autoclave the medium.
- step_number: 4
  action: STORE
  description: Store at refrigerator temperature.
