preparation_steps:
- step_number: 1
  action: MIX
  description: Add the nutrient, micronutrient, and vitamin stocks to filtered seawater.
- step_number: 2
  action: MIX
  description: For diatom culture, the source recommends 1 mL/L of a 30 g/L Na2SiO3
    x 9 H2O stock.
- step_number: 3
  action: FILTER_STERILIZE
  description: Filter sterilize, or acidify slightly and autoclave.
- step_number: 4
  action: COOL
  description: If autoclaved, add the vitamin working stock after cooling.
sterilization:
  method: FILTER
  notes: The source alternatively permits slight acidification followed by autoclaving.
