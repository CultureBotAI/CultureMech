preparation_steps:
- step_number: 1
  action: MIX
  description: To approximately 900 mL dH2O, add all non-vitamin components in the
    listed order while stirring continuously.
- step_number: 2
  action: ADJUST_PH
  description: Adjust the medium to pH 7.8.
- step_number: 3
  action: MIX
  description: Bring the total volume to 1 L with dH2O.
- step_number: 4
  action: MIX
  description: Add the sterile vitamin stocks to the flask.
- step_number: 5
  action: FILTER_STERILIZE
  description: Filter-sterilize the medium; UTEX notes not to autoclave it.
- step_number: 6
  action: STORE
  description: Store at refrigerator temperature.
