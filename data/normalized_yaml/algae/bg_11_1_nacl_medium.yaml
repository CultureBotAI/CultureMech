variants:
- name: Optional agar formulation
  relationship: PHYSICAL_STATE_VARIANT
  description: Source-described two-portion preparation; sodium-thiosulfate dose remains
    unresolved.
  modifications:
  - For the agar alternative, perform BG-11 preparation step one, add the formulation-specific
    NaCl, and make this portion up to 500 mL with dH2O.
  - In another container, add 15 g agar to 500 mL dH2O. Autoclave both preparations
    separately, then cool them to 45-50 degrees C in a water bath.
  - Mix sterile sodium thiosulfate into the agar preparation before combining both
    portions. The salt-variant page does not specify a thiosulfate dose; no amount
    is inferred from the linked base recipe. Mix promptly, allow to cool and refrigerate.
  evidence:
  - reference: https://utex.org/products/bg-11-plus-1-percent-nacl-medium
    supports: SUPPORT
    snippet: 15 g
    explanation: 'variants[0].modifications: Agar Directions 2-3 specify two portions
      involving "500 mL"; the separate agar amount is "15 g". Directions 4-8 describe
      separate autoclaving, cooling to "45-50" degrees C, addition of sterile "Sodium
      Thiosulfate", combination, cooling and refrigeration. The whole agar subsection
      was inspected and contains no local thiosulfate amount. The 15 g is a batch
      addition; final volume after sterile supplement is not measured here.'
