preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except bicarbonate, vitamins, formate and reducing
    agents), then sparge medium with 80% N2 and 20% CO2 gas mixture for 30 - 45 min
    to make it anoxic. Add solid bicarbonate, adjust pH to 6.8 - 7.0, dispense medium  under   80%  N2   and   20%  CO2
    gas atmosphere into anoxic Hungate-type tubes or serum vials and autoclave. Add
    vitamins (sterilized by filtration), formate, cysteine and sulfide from sterile
    anoxic stock solutions prepared under 100% N2 gas. The pH of the complete medium
    should be 6.5 - 6.8.
- step_number: 2
  action: ADJUST_PH
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals. Adjust final to pH 7.0 with KOH.
applications:
- Microbial cultivation
