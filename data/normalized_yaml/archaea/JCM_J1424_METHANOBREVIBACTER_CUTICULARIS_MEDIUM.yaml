preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly, bring to a boil for 5-10 seconds, then,
    cool down under a stream of H2-CO2 (80:20 v/v).
- step_number: 2
  action: MIX
  description: Distribute the medium into suitable culture vessels (e.g., 4.6 ml medium
    in Hungate tubes) under the same gas mixture and seal with butyl rubber stoppers.
- step_number: 3
  action: MIX
  description: Autoclave.
- step_number: 4
  action: MIX
  description: 'After cooling, aseptically and anaerobically add per liter the following
    solutions (autoclaved or *filter-sterilized): Prior to inoculation, add per liter
    the following solution (freshly prepared and filtersterilized): Adjust pH 7.7,
    if necessary.'
- step_number: 5
  action: MIX
  description: Pressurize the inoculated vessels to 200 kPa H2-CO2 (80:20v/ v).
applications:
- Microbial cultivation
