preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Before autoclaving adjust pH to 7.0 with NaOH.
- step_number: 2
  action: DISSOLVE
  description: For solid medium sterilize the MgCl2 x 6 H2O dissolved in 500 ml distilled
    water by autoclaving. Dissolve the remaining ingredients in 500 ml distilled water
    (including 20.0 g agar), sterilise by autoclaving, cool to about 50°C and then
    mix with the warm sterile MgCl2 solution before pouring the plates.
