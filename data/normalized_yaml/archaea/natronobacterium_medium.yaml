preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Dissolve agar by heating before adding sodium chloride. Adjust pH to
    7.0 before autoclaving. Adjust pH to 8.5 with sterile 5% Na2CO3 after heat sterilization
    of the medium.
