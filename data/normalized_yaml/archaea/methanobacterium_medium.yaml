    - 45 min to make it anoxic. Add and dissolve bicarbonate, adjust pH to 6.5 and
    dispense medium under 80% H2 and 20% CO2 gas atmosphere into anoxic Hungate-type
    tubes or serum vials to 30% of their volume and autoclave. Add cysteine and sulfide
    from sterile anoxic stock solutions prepared under 100% N2 gas. Prior to use check
    pH of complete medium and adjust to 6.8 - 7.0, if necessary."}, {"step_number":
    2, "action": "MIX", "description": "Note: After growth has started and the culture
    is becoming turbid add sterile 80% H2 and 20% CO2 gas mixture to 0.5 - 1 bar overpressure."},
