preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly, except NaHCO3, and adjust pH to 6.5.
- step_number: 2
  action: MIX
  description: Bring to a boil for 5-10 sec, then, cool down under a stream of H2-CO2
    (80:20, v/v) and add NaHCO3 to the medium.
- step_number: 3
  action: MIX
  description: Dispense the medium into suitable culture vessels (e.g., 5 ml medium
    in Hungate tubes) under the same gas mixture and seal with butyl rubber stoppers.
- step_number: 4
  action: MIX
  description: After autoclaving, stand the medium overnight.
- step_number: 5
  action: MIX
  description: 'Aseptically and anaerobically add per liter the following solutions
    (autoclaved and stored under a N2 atmosphere): Adjust pH of the medium to 6.7-7.0,
    if necessary.'
- step_number: 6
  action: MIX
  description: Pressurize the inoculated bottles to 200 kPa H2-CO2 (80:20, v/v).
applications:
- Microbial cultivation
