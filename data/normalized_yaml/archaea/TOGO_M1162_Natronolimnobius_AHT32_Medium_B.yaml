preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare 1.0 L of sterilized JCM 1081 Soda based mineral medium.
- step_number: 2
  action: MIX
  description: Aseptically add Trace vitamins, yeast extract, sodium butyrate, and
    sodium acetate stocks.
- step_number: 3
  action: MIX
  description: Distribute into culture vessels, replace the gas phase with N2 containing
    5% O2, and seal with butyl rubber stoppers.
