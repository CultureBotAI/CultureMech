preparation_steps:
- step_number: 1
  action: MIX
  description: Combine MDS salt water, JCM 1079 Trace element solution, yeast extract,
    and distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the base medium before adding sterile NH4Cl, phosphate, vitamin,
    and cellobiose stocks.
- step_number: 3
  action: ADJUST_PH
  description: Readjust pH to 7.0 with sterilized 10% Na2CO3 solution if necessary.
