preparation_steps:
- step_number: 1
  action: MIX
  description: Adjust to pH 7.0 and sterilize by autoclaving.
- step_number: 2
  action: AUTOCLAVE
  description: The medium may be solidified by adding 20.0 g/l agar. In this case,
    NaCl needs to be autoclaved separately.
