ph_value: 6.5
preparation_steps:
- step_number: 1
  action: MIX
  description: Mix direct ingredients and Trace minerals, boil for 5 minutes, and
    cool under N2-CO2.
- step_number: 2
  action: AUTOCLAVE
  description: Dispense under N2-CO2, seal with butyl rubber stoppers, and autoclave.
- step_number: 3
  action: MIX
  description: After autoclaving, add sterile anaerobic NaHCO3, CaCl2, acetate, vitamin,
    Coenzyme M, and Na2S stocks.
- step_number: 4
  action: ADJUST_PH
  description: Add filter-sterilized CO2 to 30% of the gas phase and check final pH
    at 6.5.
