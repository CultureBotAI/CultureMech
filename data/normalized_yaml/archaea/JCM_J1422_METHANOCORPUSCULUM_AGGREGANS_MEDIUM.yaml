preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Mix components except 8% NaHCO3 solution, 5% L-cysteine·HCl·H2O solution
    and 5% Na2S·9H2O solution in 940 ml distilled water.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 7.0.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave under a N2-CO2 (4:1, v/v) gas mixture and cool under the
    same gas atmosphere.
- step_number: 4
  action: FILTER_STERILIZE
  description: Aseptically and anaerobically add 50 ml of filter-sterilized 8% NaHCO3
    solution saturated with CO2.
- step_number: 5
  action: MIX
  description: Distribute the medium into culture vessels under a stream of H2-CO2
    (4:1, v/v) and seal with butyl rubber stoppers.
- step_number: 6
  action: MIX
  description: Prior to inoculation, reduce the medium by adding 5% L-cysteine·HCl·H2O
    and 5% Na2S·9H2O solutions (autoclaved and stored under N2) and pressurize the
    inoculated vessels to 100 kPa with a H2-CO2 (4:1, v/v) gas mixture.
applications:
