- preferred_term: Sulfur
  term:
    id: CHEBI:26833
    label: sulfur atom
  notes: 'Source batch input: 10 g powdered sulfur, sterilized separately by steaming
    for 3 h on each of three successive days and added to the autoclaved mineral salt
    preparation. The former 10 g/L is not retained as a final-medium concentration;
    final volume is unspecified.'
  mediaingredientmech_chebi_term:
    id: CHEBI:26833
    label: sulfur atom
  evidence:
  - reference: https://www.dsmz.de/microorganisms/medium/pdf/DSMZ_Medium265.pdf
    supports: SUPPORT
    snippet: "sulfur (10 g)-sterilized by steaming for 3 h on each of \nthree successive\
      \ days"
    explanation: 'ingredients[0].notes (withdraw_rate), locator=page 1, recipe/preparation:
      Retain the explicit 10 g batch input and separate sterilization, without asserting
      g/L. Additional exact table excerpt: Sulfur, powdered 10.00 g. Chemical mapping
      is unchanged. Source SHA256=904a0973cffadca97f2da8c6b8cd2a89f5f842d53bdb98212d27aa86741ab173;
      accessed_on=2026-10-07. Ingredient ontology mappings remain unchanged.'
preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust final pH to 5.2.
- step_number: 2
  action: MIX
  description: 'Prepare the medium anaerobically under 100% nitrogen. The following
    constituents are prepared separately and added to the autoclaved mineral salt
    solution: Yeast extract (20 ml of 10% w/v solution)-boiled for few minutes, not
    autoclaved; sucrose (20 ml of 10% w/v solution)-filter-sterilized; sulfur (10
    g)-sterilized by steaming for 3 h on each of three successive days; polar lipid
    fraction (6 - 12ml)-prepared as described by W. Zillig et al. (1983), Syst. Appl.
    Microbiol. 4: 79 - 87; Na2S x 9 H2O (10 ml of 3% w/v solution)-autoclaved under
    nitrogen atmosphere.'
- step_number: 3
  action: MIX
  description: Sparge medium with 100% N2 gas mixture to make anoxic.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave the mineral salt preparation at 121 °C for 15 min; prepare
    the supplements separately as specified.
- step_number: 5
  action: MIX
  description: 'after autoclaving add the following sterile solutions:'
- step_number: 6
  action: FILTER_STERILIZE
  description: "Note: lipid fraction can be prepared from fresh or freeze-dried biomass.\
    \ Cells are disrupted by autoclaving or sonication, then filter-sterilized.\r\n\
    \r\nUse 5 g wet or 0,2 g dried biomass in 10 ml water or buffer, and use 10ml/l\
    \ of the sterile-filtered extract. Prepare under N2 conditions.\r\n\r\nModified\
    \ from  W. Zillig et al. (1983), Syst. Appl. Microbiol. 4: 79 - 87"
applications:
- Microbial cultivation
