preparation_steps:
- step_number: 1
  action: MIX
  description: pH 7.4
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave for 15 min. Add 1 ml of sterile SL-4 (see medium 14) and
    100 ml of filter-sterilized phenol-solution (4.7g/l).
- step_number: 3
  action: ADJUST_PH
  description: First dissolve EDTA in distilled water and adjust pH to 7.0 using 2
    N NaOH; then add other compounds.
