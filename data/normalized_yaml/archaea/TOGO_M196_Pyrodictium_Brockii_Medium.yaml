- step_number: 1
  action: AUTOCLAVE
  description: Mix components except sulfur, adjust pH to 5.5 with H2SO4 and autoclave
    under a N2 gas atmosphere.
- step_number: 2
  action: HEAT
  description: Steam sulfur for 3 hr on each of 3 successive days.
- step_number: 3
  action: ALIQUOT
  description: Aseptically distribute the medium and sulfur into culture vessels (e.g.,
    20 ml of the medium and 0.6 g sulfur in 120 ml serum bottles) under a stream of
    a H2-CO2 (80:20, v/v) gas mixture and seal with butyl rubber stoppers.
- step_number: 4
  action: MIX
  description: 'Prior to inoculation, add per litter the following solution (autoclave
    and stored under a N2 atmosphere): 5% Na2S·9H2O solution (pH 7.0) 10.0 ml'
- step_number: 5
  action: ADJUST_PH
  description: Readjust pH to 5.5, if necessary.
