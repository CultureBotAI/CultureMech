notes: |-
  Source: JCM | Link: https://www.jcm.riken.jp/cgi-bin/jcm/jcm_grmd?GRMD=1008

  Ingredient amounts use the exact formulation and preparation stage. Separate preparation excerpt: "Add components to distilled water and bring volume to 1.0 L.". Conditional solid option: "For preparation of solid medium, add 20.0 g/L agar.". Agar is included only in M372/M960 in this reviewed variant cohort; no step ordering is invented. JCM1008 explicitly states the modified 270 g/L NaCl and 15 g/L magnesium sulfate heptahydrate formulation, corroborated by TOGO M1065's g/L rows. The word supplemented leaves an operational ambiguity: adding magnesium to the unchanged 20 g/L base cannot lower its concentration to 15 g/L. No 35 g/L magnesium or 470 g/L sodium chloride sum is inferred, and this curation does not resolve that preparation ambiguity.
