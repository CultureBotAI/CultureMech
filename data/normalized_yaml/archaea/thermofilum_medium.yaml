preparation_steps:
- step_number: 1
  action: POUR_PLATES
  description: 'Prepare the liquid medium. Boil the medium in a water bath and cool
    under N2 to room temperature. Adjust to pH 5.8-6.2. Dispense the medium into Hungate
    tubes or serum bottles under gassing with N2. Sterilize by autoclaving. Before
    inoculation add from sterile stock solutions:'
- step_number: 2
  action: POUR_PLATES
  description: "Prepare the liquid medium. Boil the medium in a water bath and cool\
    \ under N2 to room\r\ntemperature. Adjust to pH 5.8-6.2. Dispense the medium into\
    \ Hungate tubes or serum\r\nbottles under gassing with N2. Sterilize by autoclaving.\
    \ Before inoculation add from\r\nsterile stock solutions:"
- step_number: 3
  action: FILTER_STERILIZE
  description: "Strain DSM 18924 was inoculated into anaerobic tube, containing 10ml\
    \ of the medium\r\nmentioned above. Glucose (2g/l) and yeast extract (0,6g/l)\
    \ were added as substrate.\r\nAfter 3 days of incubation culture was filtered\
    \ throuth 0,22nm filter. Filtered culture\r\nbroth is used for the cultivation\
    \ of the strain at a concentration of 1% as a source of\r\ngrowth factor"
