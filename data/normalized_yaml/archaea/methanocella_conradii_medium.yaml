preparation_steps:
- step_number: 1
  action: MIX
  description: Dissolve all ingredients except carbonate, vitamins, cysteine, and
    DTT. Include SL-10, selenite-tungstate, and resazurin stocks.
- step_number: 2
  action: AUTOCLAVE
  description: Sparge with 80% N2 and 20% CO2 for 30-45 minutes, dispense under that
    atmosphere to 30% of vessel volume, and autoclave.
- step_number: 3
  action: FILTER_STERILIZE
  description: Add filter-sterilized vitamin stocks and sterile anoxic cysteine and
    DTT stocks prepared under 100% N2. Add carbonate from a sterile anoxic stock prepared
    under 80% N2 and 20% CO2.
- step_number: 4
  action: ADJUST_PH
  description: The complete medium should have pH 7.0.
- step_number: 5
  action: MIX
  description: After inoculation, pressurize vials to 1 bar overpressure with sterile
    100% H2 gas.
- step_number: 6
  action: DISSOLVE
  description: For SL-10, first dissolve FeCl2 in 25% HCl, dilute in water, add the
    other salts, and make to 1 litre.
