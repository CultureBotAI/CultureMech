- step_number: 1
  action: AUTOCLAVE
  description: 'Mix components thoroughly and autoclave under a N2-CO2 (80:20, v/v)
    gas atmosphere. After cooling, add the following solutions (autoclaved or *filter-sterilized):'
- step_number: 2
  action: ALIQUOT
  description: 'Aseptically and anaerobically distribute the medium into culture vessels
    under a N2-CO2 (80:20, v/v) gas mixture and seal with butyl rubber stoppers. Finally,
    add per liter the following solution from an anaerobic stock (autoclaved and stored
    under a N2 atmosphere):'
