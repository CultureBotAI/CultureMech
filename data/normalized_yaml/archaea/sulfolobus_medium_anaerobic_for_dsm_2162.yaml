variants:
- name: aerobic_brocks_salts_dsm88_sulfur_yeast_extract
  relationship: DERIVED_FROM
  description: Aerobic low-sulfate Brock's salts (DSMZ medium 88) formulation used
    by Willard et al. 2024 for a broad set of Sulfolobales. Distinct from the anaerobic
    parent in atmosphere and nitrogen source; grouped here as a derived aerobic variant.
  modifications:
  - Low-sulfate Brock's salts base (MgSO4 reduced/replaced); NH4Cl instead of (NH4)2SO4
  - 10 g/L elemental sulfur; species-specific 0.2-1 g/L yeast extract (or sucrose
    + NZ-Amine)
  - 'AEROBIC: vented serum bottles with foam stoppers; NO Na2S reducing agent; NO
    N2 gas phase'
  - 65-75C; pH 2-3 (acidified with H2SO4 or HCl)
  purpose: Aerobic sulfur-oxidation / comparative physiology cultivation of Sulfolobales
    (A. brierleyi, M. hakonensis, M. prunae, S. ohwakuensis, S. tokodaii).
  evidence:
  - reference: doi:10.1128/mbio.01033-24
    supports: SUPPORT
    explanation: Willard et al. 2024 is the shared source for the aerobic DSM-88 variant
      across these strains.
    snippet: 'All Sulfolobaceae species were grown in a low-sulfate formulation of
      Brock’s Salts (DSM-88 medium) containing:'
- name: reduced_anaerobic_mbsy_h2_co2
  relationship: DERIVED_FROM
  description: Reduced anaerobic modified Brock's basal salt medium with yeast extract
    (MBSY) used by Sakai & Kurosawa 2017 for anaerobic growth tests of Sulfodiicoccus
    acidiphilus HS-1T. The genuinely anaerobic member of the DSM 2162 evidence set.
  modifications:
  - Modified Brock's basal salts + 1 g/L yeast extract (MBSY)
  - Reduced with Na2S (0.5 g/L) + resazurin (1 mg/L)
  - Headspace H2/CO2 (80:20) at 100 kPa; optional 10 g/L elemental sulfur
  - 65-75C; pH 3.0
  purpose: Anaerobic growth testing of Sulfodiicoccus acidiphilus HS-1T.
  evidence:
  - reference: doi:10.1099/ijsem.0.001881
    supports: SUPPORT
    explanation: Sakai & Kurosawa 2017 Methods. Basal MBS recipe cited to another
      reference.
