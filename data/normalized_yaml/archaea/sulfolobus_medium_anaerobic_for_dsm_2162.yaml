- name: reduced_anaerobic_mbsy_h2_co2
  relationship: DERIVED_FROM
  description: Anaerobic MBSY test formulation for Sulfodiicoccus acidiphilus HS-1T.
    The author's2019 dissertation reports no growth in this formulation after four
    weeks; it is not successful anaerobic cultivation.
  modifications:
  - Modified Brock's basal salts + 1 g/L yeast extract (MBSY)
  - Anaerobic test medium reduced with Na2S.9H2O (0.5 g/L) and resazurin (1 mg/L),
    as specified in Sakai2019 dissertation section3.2.3.3.
  - Anaerobic test headspace H2/CO2 (80:20) at110kPa; separate tests with and without10g/L
    elemental sulfur (Sakai2019 dissertation).
  - Anaerobic test at65C and pH3.0; HS-1T did not grow even after four weeks (Sakai2019
    dissertation sections3.2.3.3 and3.3.2.3).
  purpose: Preserve the negative anaerobic growth-test formulation and its ingredients
    without asserting a growth-supporting medium.
  evidence:
  - reference: https://soka.repo.nii.ac.jp/record/39772/files/kogakukenkyuka_SAKAI-HIROYUKI%28%E5%85%A8%E6%96%87%29.pdf
    supports: REFUTE
    snippet: Strain HS-1T did not grow under anaerobic conditions
    explanation: Dissertation3.3.2.3 reports no growth after four weeks; Methods3.2.3.3
      documents the test ingredients. REFUTE applies to anaerobic growth, not to the
      recorded test formulation. Full2017 journal Methods were not retrieved; the
      explicit updated conditions are attributed to2019 dissertation.
  ingredient_changes:
  - action: ADD
    ingredient:
      preferred_term: yeast extract
      concentration:
        value: '1'
        unit: G_PER_L
    stage: Sakai2019 dissertation HS-1T negative anaerobic growth test; no growth
