    stage: Willard2024 species-specific medium pH adjustment
    source_modification_index: 3
    source_text: 65-75C; species-specific pH2-3, adjusted with concentrated HCl in
      the Willard2024 formulation.
    evidence:
    - reference: doi:10.1128/mbio.01033-24
      supports: SUPPORT
      snippet: media pH-adjusted with concentrated HCl
      explanation: Culture Methods name concentrated HCl only; H2SO4 was an unsupported
