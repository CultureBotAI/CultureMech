  curator: deep-research-edison-phase2
  action: ENRICHED
  notes: 'Phase-2 CAUTION: this parent record is explicitly ANAEROBIC (DSMZ 88a /
    TOGO M2670; Na2S reducing agent + N2 gas phase). Every literature strain retrieved
    (Willard et al. 2024) was cultivated on AEROBIC low-sulfate Brock''s salts (DSM-88)
    in vented serum bottles, using NH4Cl instead of (NH4)2SO4 and without Na2S/N2.
    These strains are therefore scoped to an aerobic Brock''s-salts MediaVariant and
    their evidence explanations explicitly state growth is NOT verified on the anaerobic
    parent. S. acidocaldarius MW001, Saccharolobus solfataricus P2, and Sulfuracidifex
    tepidarius DSM 104736 were EXCLUDED entirely because phase-2 judged their medium
    a distinct record, not a variant. Sulfodiicoccus acidiphilus HS-1T is the only
    strain with a genuinely anaerobic (MBSY + Na2S + H2/CO2) formulation and is the
    closest to the parent, though its basal recipe is also cited transitively. [added
    6 organism(s), 2 variant(s)]'
