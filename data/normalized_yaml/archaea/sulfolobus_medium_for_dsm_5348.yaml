target_organisms:
- preferred_term: Metallosphaera sedula
  term:
    id: NCBITaxon:43687
    label: Metallosphaera sedula
  strain: DSM 5348T (TH2)
  genome_assembly_id:
  - GCA_000016605.1
  evidence:
  - reference: doi:10.1128/AEM.02019-07
    supports: SUPPORT
    explanation: 'Auernik et al. 2008 directly reports DSMZ 88 cultivation of the
      DSM 5348 type strain (exact parent match). Full DSMZ 88 recipe is referenced
      by name rather than printed; parent formulation is inherited from this record.
      | Identifiers: DSM 5348T; GenBank CP000682; RefSeq NC_009440.1'
    snippet: Cells (DSMZ 5348) were grown aerobically at 70°C in an orbital shaking
      oil bath at 70 rpm on DSMZ 88 medium (pH 2), supplemented with 0.1% yeast extract
      (YE).
- preferred_term: Sulfuracidifex metallicus
  term:
    id: NCBITaxon:47303
    label: Sulfuracidifex metallicus
  strain: DSM 6482
  genome_assembly_id:
  - GCA_009729515.1
  evidence:
  - reference: doi:10.1128/mbio.01033-24
    supports: SUPPORT
    explanation: 'Willard et al. 2024 prints a DSM-88/Brock''s salts formulation for
      DSM 6482. Relative to the parent (which lists sulfide ore) this is a recognizable
      supplemented MediaVariant rather than the exact parent recipe. | Identifiers:
      DSM 6482; also classified as Sulfuracidifex metallicus'
variants:
- name: dsmz88_sulfolobus_supplemented_yeast_extract_ferrous_iron
  relationship: SUPPLEMENTED_VARIANT
  description: DSMZ medium 88 / Sulfolobus medium with organic and/or ferrous-iron
    supplementation used for M. sedula DSM 5348 cultivation (Auernik 2008).
  modifications:
  - Base DSMZ medium 88 (Brock's salts), pH 2.0, 70C, aerobic
  - Add 0.1% yeast extract (mixotrophic) or 0.1% tryptone (heterotrophic)
  - Optional ~7.5 g/L FeSO4.7H2O, or FeS2/pyrite as sole energy source
  purpose: Mixotrophic/heterotrophic and iron/pyrite-oxidizing cultivation of Metallosphaera
    sedula DSM 5348.
  evidence:
  - reference: doi:10.1128/AEM.02019-07
    supports: SUPPORT
    explanation: Auernik et al. 2008 documents the supplement set.
