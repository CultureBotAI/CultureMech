  action: ENRICHED
  notes: 'Phase-2: Metallosphaera sedula DSM 5348T (the type strain named in the record)
    is directly supported on DSMZ medium 88 (Sulfolobus medium) at pH 2.0, 70C (Auernik
    2008). Sulfolobus (Sulfuracidifex) metallicus DSM 6482 grows on recognizable DSM-88
    variants. Sulfolobus acidocaldarius DSM 639 was deliberately EXCLUDED: phase-2
    found it grows on a plain Brock''s basal-salts medium (a distinct medium family,
    not the DSM-88 formulation captured here) that warrants its own record, not an
    addition here. [added 2 organism(s), 1 variant(s)]'
