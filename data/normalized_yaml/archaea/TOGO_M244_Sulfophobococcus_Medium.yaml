notes: |-
  Source: https://togomedium.org/medium/M244
  Original source: JCM - JCM_M252
  Original URL: https://www.jcm.riken.jp/cgi-bin/jcm/jcm_grmd?GRMD=252

  Superseded historical provenance (not a current formulation claim):
  Commercial Product: LB Medium (Luria-Bertani, Miller formulation)
  Supplier: Multiple suppliers (Difco, Sigma, etc.)
  Catalog: Multiple (L3522 Sigma, 244520 BD)
  Source: https://www.laboratorynotes.com/preparation-of-luria-bertani-lb-miller-broth/
  Accessed: 2026-03-28

  Constituent composition researched from product specification.

  The exact recipe specifies albumin, not LB broth. Remove only the three reviewed LB supplier nodes and restore albumin at its source-defined preparation stage. Genuine yeast extract and unrelated annotations are preserved.

  Withdraw the unsupported high_metal classification, not replace it with false. Its schema definition requires total metal concentration >=1049.84 mM. Source quantities include milligram batch inputs, one liter of water, and later stocks; a final-volume denominator and all molecular-form conversions are not established. The former g/L fields cannot support this classification.
