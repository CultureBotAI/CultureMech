ph_value: 5.7
preparation_steps:
- step_number: 1
  action: MIX
  description: Mix Major metals, Trace metal 2 solution, and distilled water thoroughly.
- step_number: 2
  action: AUTOCLAVE
  description: Boil for 5 minutes, cool under N2-CO2, dispense under the same gas
    mixture, seal, and autoclave.
- step_number: 3
  action: MIX
  description: For each 5 ml tube, add sterile anaerobic TiNTA, MES, vitamin, yeast
    extract, Coenzyme M, sodium acetate, and Na2S stocks.
- step_number: 4
  action: ADJUST_PH
  description: Pressurize tubes to 70 kPa H2-CO2 (80:20, v/v), stand at least 7 hr,
    and check final pH at about 5.7.
