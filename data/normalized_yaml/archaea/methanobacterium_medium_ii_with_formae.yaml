preparation_steps:
- step_number: 1
  action: MIX
  description: Mix the base components except NaHCO3, Na2S x 9H2O, and trace vitamins.
- step_number: 2
  action: HEAT
  description: Bring the medium to a boil for several seconds and cool under N2-CO2
    (80:20, v/v).
- step_number: 3
  action: AUTOCLAVE
  description: Distribute under N2-CO2, seal with butyl rubber stoppers, and autoclave.
- step_number: 4
  action: MIX
  description: Add the sterile NaHCO3, Na2S x 9H2O, and trace vitamin solutions per
    liter.
- step_number: 5
  action: ADJUST_PH
  description: Check pH of the medium to be about 7.0.
- step_number: 6
  action: MIX
  description: Pressurize inoculated bottles to 200 kPa with N2-CO2 (80:20, v/v).
applications:
- Microbial cultivation
