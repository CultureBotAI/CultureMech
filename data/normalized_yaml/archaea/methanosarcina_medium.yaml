preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except bicarbonate, vitamins, methanol, cysteine
    and sulfide) and sparge medium with 80% N2 and 20% CO2 gas mixture for 30 - 45
    min to make it anoxic. Then add and dissolve bicarbonate, adjust pH to 6.5 and
    dispense medium under 80% N2 and 20% CO2 gas atmosphere into anoxic Hungate-type
    tubes or serum vials to 30% of their volume and autoclave. Methanol (50% v/v stock
    solution) and the reducing agents are each autoclaved separately under 100% N2
    gas atmosphere as concentrated solutions in tightly closed tubes. Vitamins are
    prepared under 100% N2 gas atmosphere and sterilized by filtration. Appropriate
    volumes of the stock solutions are injected into the sterile medium with hypodermic
    syringes. Adjust pH of the complete medium to 6.8 - 7.0, if necessary.
- step_number: 2
  action: MIX
  description: The ferrous sulfate solution is not stable and should be freshly prepared.
- step_number: 3
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
applications:
- Microbial cultivation
variants:
- name: slow_growth_phase_methanosarcina_acetivorans
  description: Slow-growth phase condition for Methanosarcina acetivorans on Methanosarcina
    Medium.
  modifications:
  - Capture slow-growth phase physiology separately from faster growth conditions.
  - Use Methanosarcina acetivorans as the target organism.
  purpose: Represent growth-phase-specific doubling time evidence without creating
    a separate medium record.
  evidence:
  - reference: PMID:21097629
    supports: SUPPORT
    snippet: M. acetivorans was found to be polyploid during fast growth (t(D) = 6
      h; 17 genome copies) and oligoploid during slow growth (doubling time = 49 h;
      3 genome copies).
    explanation: Literature evidence supports modeling the slow-growth phase as a
      condition variant under the parent Methanosarcina Medium record.
