variants:
- name: half_sme_s0_ignicoccus
  relationship: DERIVED_FROM
  description: Half-strength SME (synthetic seawater) medium supplemented with elemental
    sulfur and reduced with Na2S, used by Koschnitzki 2017 for all Ignicoccus representatives.
    Recognizable variant of the parent Ignicoccus medium.
  modifications:
  - Half-strength SME synthetic-seawater base
  - Add elemental sulfur (S0) as electron acceptor
  - Reduce with Na2S
  - 'Additional/trace components vs parent: explicit NaHCO3, SrCl2.6H2O, KI'
  - H2/CO2 (80:20) headspace, ~1.5 bar; pH 5.5-6.0; 90C
  purpose: Routine cultivation of Ignicoccus representatives (I. hospitalis DSM 18386T,
    I. islandicus DSM 13165T, I. pacificus DSM 13166T) under sulfur-reducing chemolithoautotrophic
    conditions.
  evidence:
  - reference: doi:10.5283/epub.34741
    supports: SUPPORT
    explanation: Koschnitzki 2017 prints the formulation and strain list.
    snippet: ½ SME+S0 medium for all Ignicoccus representatives (Paper et al., 2007)
      Substance Amount Concentration SME 500 ml ½ x KH2PO4 0.5 g 3.7 mM (NH4)2SO4
      0.25 g 1.9 mM NaHCO3 0.16 g 1.9 mM Resazurin (0.1 %) 1 ml 0.0001 % Na2S x 7-9
      H2O 0.5 g 2.1 mM ddH2O ad 1000 ml
  ingredient_changes:
  - action: ADD
    ingredient:
      preferred_term: elemental sulfur
    stage: Koschnitzki2017 serum-bottle preparation after20mL medium dispensing
    source_modification_index: 1
    source_text: Add elemental sulfur (S0) as electron acceptor
    evidence:
    - reference: doi:10.5283/epub.34741
      supports: SUPPORT
      snippet: one spatula of elemental sulfur added
      explanation: Printed page28. This is an uncalibrated spatula amount, not a mass
        concentration.
    notes: One spatula per prepared bottle; do not manufacture a gram or g/L dose.
  - action: ADD
    ingredient:
      preferred_term: Na2S.7-9H2O
    stage: Koschnitzki2017 reduction of the prepared half-SME batch
    source_modification_index: 2
    source_text: Reduce with Na2S
    evidence:
    - reference: doi:10.5283/epub.34741
      supports: SUPPORT
      snippet: Na2S x 7-9 H2O (0.5 g dissolved in 2 ml ddH2O)
      explanation: Printed page28. Preserve the source's hydration range; do not silently
        select nonahydrate from the separate reagent list.
    amount:
      value: '0.5'
      unit: G
      basis: PER_BATCH
      basis_statement: Added in2mL water after the half-SME preparation had been adjusted
