target_organisms:
- preferred_term: Ignicoccus hospitalis
  term:
    id: NCBITaxon:160233
    label: Ignicoccus hospitalis
  strain: KIN4/I (= KIN4/IT), DSM 18386T
  genome_assembly_id:
  - GCA_000017945.1
  evidence:
  - reference: doi:10.1128/JB.06130-11
    supports: SUPPORT
    explanation: 'Mayer et al. 2012 explicitly cultivates the DSM 18386 type strain
      in 1/2 SME-Ignicoccus medium, the medium this record represents. Ingredient-level
      recipe is cited transitively (Paper et al. 2007), so parent-formulation identity
      is strong by name but not printed in this source. | Identifiers: DSM 18386T;
      RefSeq NC_009776.1; 16S Gene ID 5562932'
    snippet: I. hospitalis KIN4/IT (DSM 18386) was grown in 1/2 SME-Ignicoccus medium
      at 90C under H2/CO2 (80:20, v/v) at 250 kPa, H2 as electron donor and elemental
      sulfur as electron acceptor.
- preferred_term: Ignicoccus islandicus
  term:
    id: NCBITaxon:54259
    label: Ignicoccus islandicus
  strain: Kol8, DSM 13165T
  genome_assembly_id:
  - GCA_001481685.1
  evidence:
  - reference: doi:10.5283/epub.34741
    supports: SUPPORT
    explanation: 'Growth supported on the 1/2 SME+S0 variant of the Ignicoccus medium
      family (extra NaHCO3, SrCl2.6H2O, KI and different S0/Na2S vs parent). Curate
      against the half_sme_s0_ignicoccus variant rather than asserting identity with
      the parent. | Identifiers: DSM 13165T; NZ_CP006867'
    snippet: Ignicoccus pacificus LPC33, DSM 13166T • Ignicoccus islandicus Kol8,
      DSM 13165T
- preferred_term: Ignicoccus pacificus
  term:
    id: NCBITaxon:114376
    label: Ignicoccus pacificus
  strain: LPC33, DSM 13166T
  evidence:
  - reference: doi:10.5283/epub.34741
    supports: SUPPORT
    explanation: 'Growth supported on the 1/2 SME+S0 variant. Phase-2 flagged that
      this formulation differs from the parent (KI, SrCl2.6H2O, NaHCO3, different
      boric acid level); treat as variant-scoped evidence, not parent identity. |
      Identifiers: DSM 13166T'
variants:
- name: half_sme_s0_ignicoccus
  relationship: DERIVED_FROM
  description: Half-strength SME (synthetic seawater) medium supplemented with elemental
    sulfur and reduced with Na2S, used by Koschnitzki 2017 for all Ignicoccus representatives.
    Recognizable variant of the parent Ignicoccus medium.
  modifications:
  - Half-strength SME synthetic-seawater base
  - Add elemental sulfur (S0) as electron acceptor
  - Reduce with Na2S
  - 'Additional/trace components vs parent: explicit NaHCO3, SrCl2.6H2O, KI'
  - H2/CO2 (80:20) headspace, ~1.5 bar; pH 5.5-6.0; 90C
  purpose: Routine cultivation of Ignicoccus representatives (I. hospitalis DSM 18386T,
    I. islandicus DSM 13165T, I. pacificus DSM 13166T) under sulfur-reducing chemolithoautotrophic
    conditions.
  evidence:
  - reference: doi:10.5283/epub.34741
    supports: SUPPORT
    explanation: Koschnitzki 2017 prints the formulation and strain list.
    snippet: ½ SME+S0 medium for all Ignicoccus representatives (Paper et al., 2007)
      Substance Amount Concentration SME 500 ml ½ x KH2PO4 0.5 g 3.7 mM (NH4)2SO4
      0.25 g 1.9 mM NaHCO3 0.16 g 1.9 mM Resazurin (0.1 %) 1 ml 0.0001 % Na2S x 7-9
      H2O 0.5 g 2.1 mM ddH2O ad 1000 ml
- name: half_sme_ignicoccus_plus_0_1pct_yeast_extract
  relationship: SUPPLEMENTED_VARIANT
  description: Mixotrophic version of 1/2 SME-Ignicoccus medium with 0.1% (w/v) yeast
    extract added, used by Mayer 2012 to compare autotrophic vs mixotrophic growth
    of I. hospitalis DSM 18386.
  modifications:
  - Add yeast extract to 0.1% (w/v)
  purpose: Mixotrophic growth / physiology comparison vs the autotrophic baseline.
  evidence:
  - reference: doi:10.1128/JB.06130-11
    supports: SUPPORT
    explanation: Mayer et al. 2012 describes the yeast-extract supplementation explicitly.
    snippet: Comparison of autotrophic growth with mixotrophic growth where 0.1% yeast
      extract was added to the normal culture medium of I. hospitalis DSM 18386.
