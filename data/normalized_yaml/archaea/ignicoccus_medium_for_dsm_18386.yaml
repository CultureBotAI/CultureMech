      preferred_term: NaHCO3
    stage: Koschnitzki2017 half-SME base before reducing-agent addition
    source_modification_index: 3
    source_text: 'Additional/trace components vs parent: explicit NaHCO3, SrCl2.6H2O,
      KI'
    evidence:
