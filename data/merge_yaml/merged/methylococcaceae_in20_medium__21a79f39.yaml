preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: 'Mix components thoroughly, adjust pH to 5.7 with HCl and autoclave.
    After cooling, add the following solutions (filter-sterilized) to the medium:'
- step_number: 2
  action: FILTER_STERILIZE
  description: Aseptically distribute the medium into culture vessels (leave >80%
    volume gas phase), and seal with butyl rubber stoppers. Then, add methane (filter-sterilized)
    to the culture vessels to give a 30% concentration by volume in the gas phase
    (overpressured). Check final pH of the medium to be 6.4-6.8.
- step_number: 3
  action: ADJUST_PH
  description: Dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH. Then,
    proceed to add minerals. Adjust final pH to 7.0.
applications:
- Microbial cultivation
