preparation_steps:
- step_number: 1
  action: MIX
  description: The CTM-Medium consists of two parts. Part one is autoclavable and
    called CTM-Medium basis. Part two is named mixed solution and contains non-autoclavable
    components. Solid CTM-Medium contains 1% three times washed Bactoagar and is added
    to the CTM-Medium basis prior autoclaving.
- step_number: 2
  action: MIX
  description: 'Note: Bacto peptone can be omitted with only using amino acids as
    carbon source, which will maker it a defined medium. Amount of amino acids will
    then have to be increased to 100mg/L each.'
- step_number: 3
  action: MIX
  description: Make up to 970 ml with distilled water.
- step_number: 4
  action: MIX
  description: Adjust pH to 7.0 with NaOH (2M).
- step_number: 5
  action: MIX
  description: Autoclave at 121 °C for 20 min.
- step_number: 6
  action: MIX
  description: Seal medium bottle immediately after autoclaving in order to avoid
    oxygenation.
- step_number: 7
  action: MIX
  description: Cool down to 70 °C (in a water bath).
- step_number: 8
  action: MIX
  description: Add mixed solution to the CTM basis for completing the CTM-Medium (30
    mL),
- step_number: 9
  action: MIX
  description: 'Note: Always prepare freshly! Mix the following components (e.g.,
    in a volume of approx. 30 mL) and add the filter sterilized mixture to the autoclaved
    CTM-Medium basis:'
- step_number: 10
  action: MIX
  description: Keep CTM-Medium tightly sealed and between 50-70˚C prior usage.
- step_number: 11
  action: MIX
  description: It is strongly recommended to use up the CTM-Medium as soon as possible
    after preparation! Short term storage of CTM-Medium basis possible under strictly
    anaerobic conditions. Mixed solutions should then be added freshly before use.
- step_number: 12
  action: MIX
  description: Pour CTM-Medium into flasks, bottles or similar and leave a quarter
    air headspace and seal them.
