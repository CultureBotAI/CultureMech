preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Mix components, adjust pH to 6.5 with NaOH, then distribute the medium
    into culture vessels (e.g., 50 ml per 120 ml serum bottles), seal with butyl rubber
    stoppers and autoclave at 110C for 5 min. Replace the gas phase with N2-air-H2S-CO2
    (52:32:13:3, by vol).
- step_number: 2
  action: FILTER_STERILIZE
