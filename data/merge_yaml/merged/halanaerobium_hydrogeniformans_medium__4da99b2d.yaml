    After cooling, combine both solutions and add the following solution (autoclaved
    and stored under N2):'
- step_number: 4
  action: AUTOCLAVE
  description: 'Aseptically and anaerobically, distribute the medium into culture
    vessels (e.g., 10 ml in Balch type tubes) under a N2 gas stream and seal with
    butyl rubber stoppers. Finally, add per liter the following solutions (autoclaved
    and stored under N2):'
- step_number: 5
  action: ADJUST_PH
  description: Dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH solution.
    Then proceed to add minerals. Adjust final pH to 7.0.
