preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients except carbonates, trimethylamine, vitamins, cysteine
    and sulfide, then sparge medium with 80% N2 and 20% CO2 gas mixture for 30 - 45
    min to make it anoxic. Dispense medium under same gas atmosphere into anoxic Hungate-type
    tubes or serum vials and autoclave. Complete medium by adding sterile anoxic stock
    solutions of trimethylamine, vitamins (sterilized by filtration), cysteine and
    sulfide prepared under 100% N2 gas atmosphere and bicarbonate and carbonate from
    sterile anoxic stock solutions prepared under 80% N2 and 20% CO2 gas mixture.
    Adjust pH of complete medium to 6.9 - 7.0, if necessary.
- step_number: 2
  action: ADJUST_PH
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals. Adjust final to pH 7.0 with KOH.
