variants:
- name: atcc_1490_base_no_formate_fumarate
  relationship: OMITTED_COMPONENT_VARIANT
  description: ATCC medium 1490 (Modified Chopped Meat medium) used WITHOUT the added
    formate and fumarate of the parent record.
  modifications:
  - Formate and fumarate omitted relative to the parent (ATCC 1490 + formate + fumarate).
  - Base ATCC 1490 Modified Chopped Meat medium; anaerobic, 37C, 24-48 h.
  purpose: Several BV-associated and gut anaerobes are reported on plain ATCC 1490
    without the formate/fumarate supplement; model as the base variant rather than
    asserting growth on the formate+fumarate parent.
  evidence:
  - reference: doi:10.1186/1471-2334-11-200
    supports: SUPPORT
    explanation: O'Hanlon et al. 2011 distinguishes the plain ATCC 1490 base from
      the formate+fumarate parent formulation.
    snippet: Fusobacterium nucleatum ATCC 25586 and Porphyromonas levii ATCC 29147
      were all grown in ATCC medium 1490 (Modified chopped meat medium).
- name: atcc_1490_carbonate_co2_buffered
  relationship: SUPPLEMENTED_VARIANT
  description: ATCC 1490 modified chopped meat medium buffered with carbonate/CO2
    (Johnston et al. 2001).
  modifications:
  - Carbonate/CO2 buffering added to ATCC 1490 base (exact carbonate species/concentration
    and gas composition not printed).
  - For MIC assays, medium clarified through a 0.8 um filter (assay-use processing).
  - Anaerobic glove bag; serum bottle technique; 38C.
  purpose: Capture the carbonate/CO2-buffered ATCC 1490 variant used for Fusobacterium
    necrophorum growth and MIC assays.
  evidence:
  - reference: doi:10.1002/ptr.765
    supports: SUPPORT
    explanation: Johnston et al. 2001; ATCC 1490-derived variant with carbonate/CO2
      buffering; no formate/fumarate, so distinct from the parent.
    snippet: Fusobacterium necrophorum (ATCC 27852) was grown in a modified chopped
      meat medium (ATCC 1490) buffered with carbonate/CO2. For MIC assays, this medium
      was clarified through a 0.8 um filter.
