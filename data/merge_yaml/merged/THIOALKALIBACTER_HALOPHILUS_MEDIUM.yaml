preparation_steps:
- step_number: 1
  action: HEAT
  description: Sterilize at 120°C 20 min in a closed vessel (i.e. a serum tube or
    bottle) with an air to liquid ratio of 10:1. pH after sterilization will be about
    10.
- step_number: 2
  action: MIX
  description: 'After sterilization add:'
- step_number: 3
  action: DISSOLVE
  description: (a white colloid will form which will rapidly dissolve after mixing)
- step_number: 4
  action: HEAT
  description: Final pH should be 3, add HCl if needed. Sterilization - 120°C 20 min.
