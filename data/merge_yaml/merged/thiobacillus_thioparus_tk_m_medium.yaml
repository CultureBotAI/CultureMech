preparation_steps:
- step_number: 1
  action: FILTER_STERILIZE
  description: Sterilize the phosphates separately in 1/10 of medium volume and mix
    with the other salts when cool. Add filter-sterilized vitamin solution after autoclaving
    to sterile medium. Adjust pH of complete medium to 7.1, if necessary.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 7.0.
- step_number: 3
  action: ADJUST_PH
  description: Dissolve EDTA in distilled water and adjust pH to 7.0 using 2 N NaOH;
    then add other compounds. Adjust pH of final solution to 6.0 with NaOH.
