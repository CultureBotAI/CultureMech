- Microbial cultivation
variants:
- name: aluminum_sulfate_stress_acidiphilium_cryptum
  description: Acidiphilium cryptum growth in acidic glucose-mineral medium under
    aluminum sulfate stress.
  modifications:
  - Maintain pH 3.0.
  - Add aluminum sulfate at the stress concentration reported by the source study.
  - Use Acidiphilium cryptum as the target organism.
  purpose: Capture aluminum-stress growth evidence under the parent Acidiphilium Medium
    record.
  evidence:
  - reference: PMID:12420179
    supports: SUPPORT
    snippet: with a doubling time of 7.6 h, as compared to 5.2 h of growth without
      aluminum
    explanation: Literature evidence supports modeling the aluminum sulfate growth
      condition as a variant of the parent Acidiphilium Medium record.
