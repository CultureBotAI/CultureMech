preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Add gellan gum and boil to dissolve. Then add the remaining ingredients
    (except magnesium chloride, yeast extract and vitamins), adjust the pH value to
    5.0 to 5.3 and fill the medium under an air atmosphere into tubes of the Hungate
    type or similar vials up to 30% their volume. After autoclaving add magnesium
    chloride, yeast extract and vitamins from steril stock solutions. Vitamins should
    be sterilized by filtration.
- step_number: 2
  action: MIX
  description: 'Note: Incubation with shaking may improve cell yield.'
- step_number: 3
  action: ADJUST_PH
  description: Dissolve EDTA in 800 ml distilled water, adjust pH to 7 using 2 N NaOH
    and add ferrous chloride. After ferrous chloride has dissolved add other compounds.
    Finally adjust pH to 6.0 and bring volume to 1000 ml.
