preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.0.
- step_number: 2
  action: AUTOCLAVE
  description: 'Autoclave Solutions A, B and C separately. After cooling, aseptically
    and anaerobically combine the three solutions under a stream of N2-CO2 (80:20,
    v/v), then add the following solutions (filter-sterilized):'
- step_number: 3
  action: AUTOCLAVE
  description: Distribute the medium into culture vessels under the same gas mixture
    and seal with butyl rubber stoppers. Prior to inoculation, reduce the medium with
    0.025% L-cysteine x HCl x H2O and 0.025% Na2S x 9H2O (use 5% solutions autoclaved
    and stored under a N2 atmosphere).
