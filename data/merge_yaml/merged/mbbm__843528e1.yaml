preparation_steps:
- step_number: 1
  action: MIX
  description: Add to 1000 ml of 3N­BBM+V 1g of Bacto peptone and 5g of sucrose.
- step_number: 2
  action: AUTOCLAVE
  description: "Make up to 1 litre with distilled water.  For agar add 15 g per litre\
    \ Bacterial Agar.\r\nAutoclave at 15 psi for 15 minutes."
- step_number: 3
  action: MIX
  description: "Add to 1000 ml of distilled water 0.75 g Na2EDTA and the minerals\
    \ in exactly the \r\nfollowing sequence:"
- step_number: 4
  action: FILTER_STERILIZE
  description: Filter sterile
- step_number: 5
  action: FILTER_STERILIZE
  description: Take 1 ml of this solution and add 99 ml Deionised water. Filter sterile.
