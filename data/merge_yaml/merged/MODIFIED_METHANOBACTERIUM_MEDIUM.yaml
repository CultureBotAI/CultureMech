preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components and autoclave under a N2-CO2 (80:20, v/v) gas mixture.
- step_number: 2
  action: MIX
  description: 'After cooling, aseptically and anaerobically, add the following solutions
    from anaerobic stocks (filtersterilized): Dispense the medium into culture vessels
    (e.g., 5 ml medium in Hungate tubes) under a H2-CO2 (80:20, v/v) gas stream and
    seal with butyl stoppers.'
- step_number: 3
  action: MIX
  description: 'Prior to inoculation, add per liter the following solutions (autoclaved
    and stored under a N2 atmosphere): After inoculation, pressurize the inoculated
    culture vessels to 100 kPa H2-CO2 (80:20, v/v).'
