preparation_steps:
- step_number: 1
  action: MIX
  description: Use Medium No. 872 with final 0.4 g/L NaCl.
- step_number: 2
  action: AUTOCLAVE
  description: 'Comment: Sludge fluid can be replaced with a human fecal extract.
    The extract is prepared as follows: autoclave equal quantities of human feces
    and water at 121C for 30 min. Remove the sludge by centrifugation. Adjust pH of
    the supernatant to 7.0-7.2 and sterilize at 121C for 15 min under a N2 atmosphere.'
