preparation_steps:
- step_number: 1
  action: MIX
  description: Make up to <span class='amount' data-volume='1000'>1000</span> ml with
    natural sea water (Helgolandwasser).
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 20 min.
- step_number: 3
  action: FILTER_STERILIZE
  description: 'After cooling, add the following filter sterilized components:'
- step_number: 4
  action: MIX
  description: "Fill 300ml garden soil in a 1 l laboratory flask and fill up with\
    \ H2Odist to 700 ml\r\n(The soil should not contain too much humus and not too\
    \ much clay – avoid soil\r\ncontaminated with fertilizers, herbicides or fungicides)"
- step_number: 5
  action: MIX
  description: Shake vigorously
- step_number: 6
  action: AUTOCLAVE
  description: Autoclave for 1 h at 121 °C and let cool down
- step_number: 7
  action: AUTOCLAVE
  description: After 24 h autoclave for a second time (for 1 h at 121 °C)
- step_number: 8
  action: MIX
  description: Remove bigger particles and debris by centrifugation
- step_number: 9
  action: FILTER_STERILIZE
  description: Filter through Whatmanfilter 595 (1/2, 320 mm) to remove residual particles
- step_number: 10
  action: FILTER_STERILIZE
  description: Filter sterilize (PES membrane, pore size 0,22 µm)
- step_number: 11
  action: HEAT
  description: Store at 4°C – 10°C
- step_number: 12
  action: MIX
  description: Make up to <span class='amount' data-volume='1000'>1000</span> ml with
    Milli Q water.
- step_number: 13
  action: HEAT
  description: Prepare aliquots and store them at -20 °C.
