preparation_steps:
- step_number: 1
  action: MIX
  description: Mix ingredients except yeast extract, starch, sulfur and Na2S·9H2O,
    and filter-sterilize while gassing with N2. Autoclave yeast extract and starch
    as 10% solutions and Na2S·9H2O as a 5% solution under a N2 atmosphere. Sulfur
    is sterilized separately by autoclaving for 60 min at 105C on each of 3 successive
    days. Aseptically and anaerobically add the yeast extract and starch solutions,
    and sulfur to the medium. Prior to inoculation, add the sterile Na2S·9H2O solution,
    and adjust pH to 5.5 with sterile 1 N H2SO4.
