preparation_steps:
- step_number: 1
  action: MIX
  description: pH 8.0
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave and add, on cooling 20.0 ml sterile Hutner's salts (see medium
    590), 1.0 ml vitamin solution, and 20.0 ml sterile phosphate supplement.
- step_number: 3
  action: FILTER_STERILIZE
  description: Filter-sterilized.
- step_number: 4
  action: DISSOLVE
  description: Dissolve the nitrilotriacetic acid.
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH to 7.0 with KOH (~7.3 g).
- step_number: 6
  action: DISSOLVE
  description: Dissolve other salts separately and combine.
- step_number: 7
  action: ADJUST_PH
  description: Adjust pH to 6.8 with NaOH or H2SO4.
- step_number: 8
  action: DISSOLVE
  description: Dissolve the EDTA and add a few drops of concentrated H2SO4 to retard
    precipitation of the heavy metal ions.
