preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except bicarbonate, fumarate and vitamins), sparge
    medium with 80% N2 and 20% CO2 gas mixture for 30 - 45 min to make it anoxic.
    Add bicarbonate and equilibrate the medium with 80% N2 and 20% CO2 gas mixture
    to reach a pH of 6.8, then dispense medium under the same gas atmosphere into
    anoxic Hungate-type tubes or serum vials and autoclave. After autoclaving add
    fumarate and vitamins from anoxic stock solutions prepared under 100% N2 gas atmosphere
    and sterilized by filtration. Check medium pH and adjust to 6.8, if necessary.
- step_number: 2
  action: ADJUST_PH
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals. Adjust final to pH 7.0 with KOH.
applications:
- Microbial cultivation
variants:
- name: acetate_fumarate_geobacter_sulfurreducens_growth
  description: Geobacter sulfurreducens growth with acetate as electron donor and
    fumarate as electron acceptor.
  modifications:
  - Use acetate as the electron donor.
  - Use fumarate as the electron acceptor.
  - Use Geobacter sulfurreducens as the target organism.
  purpose: Capture electron donor/acceptor-specific growth evidence under the parent
    Geobacter sulfurreducens Medium record.
  evidence:
  - reference: PMID:35960254
    supports: SUPPORT
    snippet: engineering of the slow-growing Geobacter sulfurreducens (a doubling
      time of 5 h with acetate as the electron donor and fumarate as the electron
      acceptor)
    explanation: Literature evidence supports modeling the acetate/fumarate growth
      condition under the parent Geobacter sulfurreducens Medium record.
