preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Autoclave the Na2CO3, NaHCO3 and the lactate separately from the medium
    and combine after cooling. Vitamin B12 is added from a sterile stock solution.
    The final pH of the medium should be 9.5. Add 15.0 g/l agar for solid media.
