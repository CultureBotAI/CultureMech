preparation_steps:
- step_number: 1
  action: MIX
  description: 'Prepare medium M.88, then add (per litre):'
- step_number: 2
  action: ADJUST_PH
  description: Adjust the pH to 6.0 with H2SO4 (25% v/v). Prepare the medium under
    100% N2 gas phase and distribute anaerobically into rubber stoppered tubes or
    bottles (presterilized by autoclaving). The medium is sterilized by heating 2
    hours at 85 °C on each of two following days.
- step_number: 3
  action: ADJUST_PH
  description: Adjust pH of final solution to 2 with 1 N HCl.
