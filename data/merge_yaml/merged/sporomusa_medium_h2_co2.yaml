preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except phosphates, carbonate, vitamins, and dithiothreitol)
    and sparge medium with 80% H2 and 20% CO2 gas mixture for 30 - 45 min to make
    it anoxic. Dispense under the same gas atmosphere in anoxic Hungate-type tubes
    or serum vials to 30% of their volume and autoclave. Add phosphates to the medium
    after autoclaving from sterile stock solutions prepared under 100% N2 gas and
    carbonate from a sterile stock solution prepared under 80% N2 and 20% CO2 gas
    mixture. Vitamins and dithiothreitol should be prepared under N2 gas and sterilized
    by filtration. Adjust the pH of the completed medium to pH 7.0.
- step_number: 2
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
