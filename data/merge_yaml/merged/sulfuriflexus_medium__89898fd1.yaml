preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except thiosulfate, bicarbonate and vitamins),
    adjust pH to 6.0 and dispense medium under air atmosphere into serum vials up
    to a volume of 20%, close with rubber septa and autoclave. Add thiosulfate, vitamins
    and bicarbonate to the autoclaved medium from sterile stock solutions sterilized
    by filtration. Adjust pH of the complete medium to 7.2.
- step_number: 2
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
