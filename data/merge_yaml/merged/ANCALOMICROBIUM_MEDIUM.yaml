preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.0.
- step_number: 2
  action: MIX
  description: Separately sterilize Vitamin solution by filtration and aseptically
    add to the medium.
- step_number: 3
  action: FILTER_STERILIZE
  description: Filter-sterilize.
- step_number: 4
  action: ADJUST_PH
  description: Dissolve nitrilotriacetic acid and adjust pH to 7.0 with KOH (about
    7.3 g). Then proceed to add salts. Readjust pH to 6.8 with NaOH or H2SO4.
