preparation_steps:
- step_number: 1
  action: MIX
  description: pH unadjusted
- step_number: 2
  action: MIX
  description: Adjust volume to 1 L with distilled water.
- step_number: 3
  action: MIX
  description: Dissolve and neutralize the nitrilotriacetic acid with KOH (7.3 g);
    add the other ingredients and adjust the pH to 6.6-6.8 before bringing the volume
    to 1.0 L with distilled water.
- step_number: 4
  action: MIX
  description: Dissolve the EDTA and add a few drops of concentrated H2SO4 to retard
    precipitation of the heavy metal ions. Store in the dark and cold (5C).
