preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Autoclave solutions A, B and C separately and combine after cooling
    100 ml solution A, 5 ml solution B and 5 ml solution C.
- step_number: 2
  action: ADJUST_PH
  description: Dissolve 30.0 mg benzothiazole in 90 ml 10% NaOH, bring pH to 7.0 with
    concentrated HCl.
- step_number: 3
  action: DISSOLVE
  description: Dissolve 300 mg KH2PO4 in 50 ml distilled water.
