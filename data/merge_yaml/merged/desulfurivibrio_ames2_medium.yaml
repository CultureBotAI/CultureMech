preparation_steps:
- step_number: 1
  action: MIX
  description: Add components, except sulfur, to distilled water and bring volume
    to 1.0 L.
- step_number: 2
  action: MIX
  description: Autoclave in closed bottles.
- step_number: 3
  action: MIX
  description: 'After cooling, aseptically add per liter the following solutions (autoclaved
    or *filter-sterilized): Steam sulfur for 3 hr on each of 3 successive days.'
- step_number: 4
  action: MIX
  description: Aseptically and anaerobically distribute the medium and sterilized
    sulfur into culture vessels (e.g., 10 ml medium and 0.05 g sulfur in Hungate tubes)
    under a N2 gas steam and seal with butyl rubber stoppers.
