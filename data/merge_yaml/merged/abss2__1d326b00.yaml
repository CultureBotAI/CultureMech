    add per liter the following solutions (autoclaved or *filter-sterilized):'
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 7.5 by bubbling with a N2-CO2 (4:1, v/v) gas mixture.
- step_number: 3
  action: DISSOLVE
  description: Initially, dissolve FeCl2 x 4H2O in 25% HCl, then add distilled water
    followed by the other components.
