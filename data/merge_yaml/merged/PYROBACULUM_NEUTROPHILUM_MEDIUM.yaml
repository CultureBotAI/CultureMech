preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 6.5 with NaOH, bring to boil for 5 min, then cool to room
    temperature under H2 + CO2 (80% + 20%) gas mixture. Add 0.85 g NaHCO3 per liter
    and equilibrate the pH to c. 6.5 by further gassing.
- step_number: 2
  action: POUR_PLATES
  description: Dispense in serum bottles (10 ml/30 ml bottle), seal and heat the bottles
    for one hour at 85°C on each of three successive days.
- step_number: 3
  action: MIX
  description: Before inoculation, add from anaerobic stock solutions 0.02% yeast
    extract (for mixotrophic growth only) and neutralized Na2S x 9 H2O solution, 10%
    (w/v). After inoculation, pressurize to 1 bar H2 + CO2 overpressure.
- step_number: 4
  action: MIX
  description: 'Prepare medium, then add per liter:'
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH of final solution to 2 with 1 N HCl.
- step_number: 6
  action: ADJUST_PH
  description: Adjust pH to 7.0.
