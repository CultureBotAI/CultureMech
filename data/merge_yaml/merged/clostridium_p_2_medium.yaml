preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients except glucose, cysteine and sulfide. Sparge medium
    with 100% N2 gas for 30 - 45 min to make it anoxic, then dispense under same gas
    atmosphere into anoxic Hungate-type tubes or serum vials and autoclave. Add glucose,
    cysteine and sulfide from sterile anoxic stock solutions prepared under 100% N2
    gas. Adjust pH of the complete medium to 7.0 - 7.2, if necessary.
