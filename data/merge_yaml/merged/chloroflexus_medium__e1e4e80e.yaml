preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: After autoclaving, add 1 ml of 5% Na2S x 9H2O solution (autoclaved),
    1 ml of 5% CaCl2 x 2H2O solution (autoclaved) and 10 ml of 3% NaHCO3 solution
    (filter-sterilized). Adjust pH to 7.5.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 3 with HCl.
