preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components, except NaHCO3, and bring to a boil for 5-10 seconds.
- step_number: 2
  action: MIX
  description: Cool down under a stream of N2-CO2 (80:20 v/v), and add NaHCO3 to the
    medium.
- step_number: 3
  action: MIX
  description: Adjust pH to 7.3 -7.6.
- step_number: 4
  action: MIX
  description: Dispense the medium into culture vessels under a stream of H2-CO2 (80:20
    v/v), seal with butyl rubber stoppers and autoclave.
- step_number: 5
  action: MIX
  description: Prior to inoculation, add per liter the following solutions (autoclaved
    and stored under a N2 atmosphere).
- step_number: 6
  action: MIX
  description: Pressurize inoculated vessels to 100 kPa with a H2-CO2 (80:20 v/v)
    gas mixture.
