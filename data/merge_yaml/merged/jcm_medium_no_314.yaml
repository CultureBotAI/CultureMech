preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Filter-sterilize Na2S2O3 solution and KNO3 solution, and separately
    autoclave Trace elements solution and MgCl2 x 6H2O solution. Aseptically add Na2S2O3
    solution, KNO3 solution, Trace elements solution and MgCl2 x 6H2O solution to
    the medium.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 3 with HCl.
