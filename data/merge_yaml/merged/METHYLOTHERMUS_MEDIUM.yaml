preparation_steps:
- step_number: 1
  action: MIX
  description: or
- step_number: 2
  action: POUR_PLATES
  description: Prepare the liquid medium. Adjust to pH 6.2 with HCl or NaOH. Dispense
    the medium into serum bottles under gassing with N2:CO2 (80:20 v/v) for one minute.
    20% methane and 5% air is added to the gas phase
- step_number: 3
  action: ADJUST_PH
  description: Adjust pH to 6.2.
- step_number: 4
  action: POUR_PLATES
  description: Dispense the medium into serum bottles under gassing with N2:CO2 (80:20
    v/v) for one minute.
- step_number: 5
  action: MIX
  description: 20% methane and 5% air is added to the gas phase.
- step_number: 6
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 20 min.
- step_number: 7
  action: MIX
  description: 'Before inoculation add from sterile stock solutions:'
