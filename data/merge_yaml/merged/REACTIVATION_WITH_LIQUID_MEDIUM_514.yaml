preparation_steps:
- step_number: 1
  action: MIX
  description: Rehydrate and grow lyophilized cells from the ampoule in 5 ml liquid
    medium 514. Subsequent subculturing may be carried out in liquid medium or on
    agar plates.
- step_number: 2
  action: HEAT
  description: Final pH should be 7.6 ± 0.2 at 25°C. If using the complete medium
    from Difco add 37.4 g to 1 litre water.
