preparation_steps:
- step_number: 1
  action: MIX
  description: For solid medium, add 5.0 g/L gelrite (Gellan Gum).
- step_number: 2
  action: FILTER_STERILIZE
  description: Add 0.2 ml filter-sterilized Solution 2 to Solution 1.
- step_number: 3
  action: FILTER_STERILIZE
  description: Filter-sterilize.
- step_number: 4
  action: ADJUST_PH
  description: Dissolve nitrilotriacetic acid and adjust pH to 7.0 with KOH (about
    7.3 g). Then proceed to add salts. Readjust pH to 6.8 with NaOH or H2SO4.
