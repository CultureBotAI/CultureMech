preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: "Make up to 1 litre with deionized water. Adjust pH to 7.1 with 1M\
    \ NaOH or HCl.\r\nFor agar add 15.0 g per litre of Bacteriological Agar (Thermo\
    \ Scientific&trade; Oxoid&trade; Agar No.1).\r\nAutoclave at 15 psi for 15 minutes."
- step_number: 2
  action: AUTOCLAVE
  description: "Due to precipitation, larger volumes require stocks of citric acid\
    \ and ammonium ferric citrate to be autoclaved separately in 100ml\r\ndeionized\
    \ water or alternatively they can be autoclaved separately in test tubes and added\
    \ to\r\nsterile medium in the airflow cabinet."
applications:
- Microbial cultivation
references:
- reference: doi.org/10.1128/br.35.2.171-205.1971
variants:
- name: optimized_bg11_synechocystis_pcc6803
  description: Optimized BG11 growth condition for Synechocystis sp. PCC 6803.
  modifications:
  - Use Synechocystis sp. PCC 6803 as the target organism.
  - Apply optimized growth conditions reported by the source study.
  purpose: Capture optimized BG11 growth-rate evidence under the parent BG11 record.
  evidence:
  - reference: PMID:29577667
    supports: SUPPORT
    snippet: Optimizing these growth conditions resulted in a so far highest growth
      rate of 0.16 h-1 (4.3 h doubling time), which is significantly higher than the
      textbook value of 0.09 h-1 (8 h doubling time).
    explanation: Literature evidence supports a PCC 6803 optimized-growth condition
      variant under the parent BG11 record.
- name: ambient_co2_bg11_synechococcus_pcc11801
  description: Ambient-CO2 BG11 growth condition for Synechococcus elongatus PCC 11801.
  modifications:
  - Use Synechococcus elongatus PCC 11801 as the target strain.
  - Culture under ambient CO2 conditions.
  purpose: Capture strain-specific BG11 growth evidence under ambient CO2.
  evidence:
  - reference: PMID:30413737
    supports: SUPPORT
    snippet: PCC 11801 shows a doubling time of 2.3 h, that is the fastest growth
      for any cyanobacteria reported so far under ambient CO2 conditions.
    explanation: Literature evidence supports an ambient-CO2 PCC 11801 condition variant
      under the parent BG11 record.
- name: high_co2_high_light_bg11_synechococcus_pcc11802
  description: High-CO2, high-light BG11 growth condition for Synechococcus elongatus
    PCC 11802.
  modifications:
  - Use Synechococcus elongatus PCC 11802 as the target strain.
  - Culture at 1% CO2.
  - Culture at 1000 umole photons m-2 s-1.
  purpose: Capture strain-specific high-CO2/high-light BG11 growth evidence.
  evidence:
  - reference: PMID:31932622
    supports: SUPPORT
    snippet: The new isolate has a doubling time of 2.8 h at 1% CO2, 1000 µmole photons.m-2.s-1
      and grows faster under high CO2 and temperature compared to PCC 11801 thus making
      it an attractive host for outdoor cultivations and eventual applications in
      the biorefinery.
    explanation: Literature evidence supports a high-CO2/high-light PCC 11802 condition
      variant under the parent BG11 record.
