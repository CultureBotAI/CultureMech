preparation_steps:
- step_number: 1
  action: MIX
  description: pH 7.0
- step_number: 2
  action: FILTER_STERILIZE
  description: Prepare the medium without methanol and vitamin B12 in closed vessels
    with a medium to headspace ratio of 1:5 to 1:10. Adjust pH to 7.0 and sterilize.
    Allow to cool to about 45°C before adding 1mL filter-sterilized Vitamin B12 stock
    solution (0.1mg/100ml) and 10 mL filter-sterilized methanol per litre medium.
