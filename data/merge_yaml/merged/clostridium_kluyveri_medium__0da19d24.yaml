preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve all ingredients (except ethanol, carbonate, vitamins, cysteine
    and sulfide) and sparge medium with 80% N2 and 20% CO2 gas mixture for 30 - 45
    min to make it anoxic. Add ethanol, then dispense medium under same gas atmosphere
    in Hungate-type tubes or serum vials and autoclave. After autoclaving, add carbonate
    from a sterile stock solution prepared under 80% N2 and 20% CO2 gas atmosphere
    and vitamins from an anoxic and filter-sterilized stock solution prepared under
    100% N2 gas. Before inoculation, add cysteine and sulfide from sterile anoxic
    stock solutions prepared under 100% N2 gas. Adjust pH of medium to 6.8 - 7.0,
    if necessary.
- step_number: 2
  action: FILTER_STERILIZE
  description: 'Note: If reduction of medium is not complete after inoculation, add
    10 - 20 mg/l sodium dithionite from a 5% w/v solution freshly prepared under 100%
    N2 gas and filter sterilized.'
- step_number: 3
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
