preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except cysteine, carbonate and sulfide), sparge
    medium with 80% N2 and 20% CO2 gas mixture for 30 - 45 min to make it anoxic.
    Then, add cysteine, distribute medium under 80% N2 and 20% CO2 gas atmosphere
    in anoxic Hungate-type tubes or serum vials and autoclave. After sterilization
    add sulfide from a sterile anoxic stock solution prepared under 100% N2 gas atmosphere
    and carbonate from a sterile anoxic stock solution prepared under 80% N2 and 20%
    CO2 gas atmosphere. Check pH of complete medium and adjust to pH 7.0, if necessary.
- step_number: 2
  action: ADJUST_PH
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals. Adjust final to pH 7.0 with KOH.
