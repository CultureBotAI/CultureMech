preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly, except sulfur, and autoclave under a N2-CO2
    (4:1, v/v) gas atmosphere.
- step_number: 2
  action: MIX
  description: 'After cooling, add the following solutions from anaerobic stocks (autoclaved
    or *filter-sterilized): Steam sulfur for 3 hr on each of 3 successive days.'
- step_number: 3
  action: MIX
  description: Aseptically and anaerobically, distribute the medium into culture vessels
    containing appropriate amount of sulfur under the same gas mixture (e.g., 20 ml
    in 60 ml-serum bottles containing 0.05 g sulfur) and seal with butyl rubber stoppers.
