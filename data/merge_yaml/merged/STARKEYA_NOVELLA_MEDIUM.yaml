preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Solutions A, B, C and D are sterilized separately by autoclaving and
    mixed when cooled to room temperature. Adjust pH of complete medium to 8.5 with
    sterile 0.5 N NaOH.
- step_number: 2
  action: ADJUST_PH
  description: Dissolve EDTA in distilled water, adjust pH to 7 using 2 N KOH, then
    add remaining compounds. Adjust pH of final solution to 6.0 with KOH.
