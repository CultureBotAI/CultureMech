preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare the medium without the vitamins.
- step_number: 2
  action: ADJUST_PH
  description: Adjust pH to 7.0 with 10M KOH.
- step_number: 3
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 20 min.
- step_number: 4
  action: FILTER_STERILIZE
  description: After cooling add vitamins from a filter sterilised stock solution.
- step_number: 5
  action: ADJUST_PH
  description: First dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH,
    then add minerals. Adjust final to pH 7.0 with KOH.
