preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
- step_number: 2
  action: ADJUST_PH
  description: 'Note: Dissolve and neutralize the nitrilotriacetic acid with KOH (7.3
    g); add the other ingredients and adjust the pH to 6.6 - 6.8 before bringing the
    volume to 1.0 L with distilled water.'
- step_number: 3
  action: MIX
  description: "Note: Initially add a few drops of H2SO4 to the distilled water to\
    \ retard\r\nprecipitation."
