- step_number: 2
  action: MIX
  description: Bring up to 1 liter
- step_number: 3
  action: POUR_PLATES
  description: Combine the distilled water and Solutions A-D in an Erlenmeyer flask
    and dispense into glass serum bottles.
- step_number: 4
  action: MIX
  description: Seal the serum bottles with butyl rubber stoppers and crimp seals.
    Using a syringe and needle, inject pure 10% methane.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave the serum bottles for 20 minutes at 121 °C.
- step_number: 6
  action: FILTER_STERILIZE
  description: Upon cooling to room temperature, add solution E from a filter-sterilized
    stock solution.
- step_number: 7
  action: MIX
  description: The final pH of the medium should be 7.0
- step_number: 8
  action: DISSOLVE
  description: Dissolve the ingredients listed above (in that order) in about 700
