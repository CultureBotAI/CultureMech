preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Mix components except phosphate buffer stock solution and vitamin solution
    in 987 ml distilled water.
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave the basal medium and the phosphate buffer stock solution
    separately.
- step_number: 3
  action: FILTER_STERILIZE
  description: After cooling, aseptically add 10.0 ml autoclaved phosphate buffer
    stock solution and 1.0 ml filter-sterilized vitamin solution; final pH should
    be 6.7.
