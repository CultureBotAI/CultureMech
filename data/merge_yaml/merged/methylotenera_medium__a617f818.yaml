preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: 'Mix components thoroughly, adjust pH to 7.6 and autoclave. For preparation
    of solid medium, add 15.0 g/L agar. After cooling, aseptically add the following
    solutions (autoclaved in a tightly stoppered bottle or *filter-sterilized):'
- step_number: 2
  action: ADJUST_PH
  description: Dissolve nitrilotriacetic acid and adjust pH to 6.5 with KOH solution.
    Then proceed to add minerals. Adjust final pH to 7.0.
