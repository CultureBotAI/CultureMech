preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly and adjust pH to 6.5, then distribute the
    medium into culture vessels under a N2-CO2 (80:20, v/v) gas mixture and seal with
    butyl rubber stoppers.
- step_number: 2
  action: MIX
  description: After autoclaving, stand the medium overnight.
- step_number: 3
  action: MIX
  description: 'Prior to use, add per liter the following solutions (autoclaved or*
    filter-sterilized, and stored under a N2 atmosphere): Adjust pH to 7.0 if necessary.'
