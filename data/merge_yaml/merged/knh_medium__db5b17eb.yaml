preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Solution A is sparged with 80% H2 and 20% CO2 gas mixture to reach
    a pH below 6 (at least 30 min), then distributed under the same gas atmosphere
    in anoxic Hungate-type tubes or serum vials to 30% of their volume and autoclaved.
    Solution B is autoclaved separately under 80% N2 and 20% CO2 gas atmosphere. Solution
    C is autoclaved under 100% N2 gas. Solutions D and E are prepared under 100% N2
    gas atmosphere and sterilized by filtration. To complete the medium solutions
    B to E are added to the sterile solution A in the sequence as indicated. Final
    pH of the medium should be 7.1 - 7.4.
- step_number: 2
  action: MIX
  description: After inoculation add 1 bar overpressure of sterile 80% H2 and 20%
    CO2 gas mixture.
- step_number: 3
  action: MIX
  description: Sterilize by filtration.
- step_number: 4
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
