    (autoclaved or *filter-sterilized):'
- step_number: 2
  action: AUTOCLAVE
  description: 'Distribute the medium into culture vessels (e.g., 20 ml of the medium
    in 120 ml serum bottles) under a stream of N2-CO2 (4:1, v/v) gas mixture and seal
    with butyl rubber stoppers. Finally add per liter the following solution (autoclaved
    and stored under a N2 atmosphere):'
- step_number: 3
  action: ADJUST_PH
  description: First adjust pH to 1.0 with diluted H2SO4, then dissolve the salts.
