preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly and adjust pH to 7.5 with NaOH.
- step_number: 2
  action: MIX
  description: Distribute the medium into culture vessels (e.g., 5.0 ml in 25 ml serum
    bottles/Balch tubes) under a stream of N2, seal with butyl rubber stoppers and
    autoclave.
- step_number: 3
  action: MIX
  description: 'After cooling, aseptically add per liter the following solutions (autoclaved
    or filter-sterilized): Prior to inoculation, add filter-sterilized O2 gas or air,
    to make a final concentration of 10% O2 in the gas phase.'
- step_number: 4
  action: MIX
  description: 'Mineral solution A: Adjust pH to 6.5 with HCl.'
applications:
- Microbial cultivation
