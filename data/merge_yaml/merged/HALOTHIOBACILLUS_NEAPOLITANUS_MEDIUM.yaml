preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients except thiosulfate, dispense into suitable cultivation
    vessels and autoclave. Add thiosulfate to the autoclaved medium from a sterile
    stock solution. Adjust pH of complete medium to 6.6 - 7.0.
- step_number: 2
  action: ADJUST_PH
  description: Dissolve EDTA in distilled water, adjust pH to 7 using 2 N KOH, then
    add remaining compounds. Adjust pH of final solution to 6.0 with KOH.
