preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.2.
- step_number: 2
  action: MIX
  description: Agar und die restlichen Bestandteile getrennt autoklavieren (20 g Agar
    in 500 ml dest. H2O + Rest der Zutaten in 440 ml dest. H2O)
- step_number: 3
  action: MIX
  description: Vitaminlösung erst nach dem Autoklavieren dazugeben
- step_number: 4
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
- step_number: 5
  action: FILTER_STERILIZE
  description: Filter sterilize the solution.
