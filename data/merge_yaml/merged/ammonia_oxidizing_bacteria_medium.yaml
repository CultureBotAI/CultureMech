preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Prepare Solution A ((NH4)2SO4 2.0 g, NaCl 0.5 g, MgSO4·7H2O 0.05 g,
    CaCl2·2H2O 0.02 g in 800 ml distilled water) and Solution B (KH2PO4 0.5 g in 200
    ml distilled water) and autoclave separately.
- step_number: 2
  action: FILTER_STERILIZE
  description: Prepare Solution C (Fe-EDTA solution), Solution D (trace element solution),
    and 0.05% (w/v) phenol red solution (adjusted to pH 7.0 with NaOH) and sterilize
    each by filtration.
- step_number: 3
  action: MIX
  description: After cooling, combine Solution A and Solution B and aseptically add
    0.5 ml Solution C, 1.0 ml Solution D, and 2.5 ml 0.05% phenol red solution.
- step_number: 4
  action: ADJUST_PH
  description: Adjust pH to 7.8 with filter-sterilized 10% (w/v) NaHCO3 solution.
    During cultivation, re-adjust pH to ~7.8 with sterile 10% NaHCO3 solution whenever
    the medium turns yellow-orange due to nitrite production.
