preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 6.0 - 6.5.
- step_number: 2
  action: AUTOCLAVE
  description: Prepare sodium sulfide separately as 5% (w/v) solution, autoclave under
    a nitrogen atmosphere and neutralize with 1 N HCl before use. Sterilize glucose
    separately.
- step_number: 3
  action: DISSOLVE
  description: First, dissolve nitrilotriacetic acid and adjust to pH 6.5 with KOH.
