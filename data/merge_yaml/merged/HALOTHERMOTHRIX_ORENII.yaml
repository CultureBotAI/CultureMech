applications:
- Microbial cultivation
variants:
- name: strict_anaerobic_halothermothrix_orenii_h168_growth
  description: DSMZ/KOMODO Halothermothrix orenii medium condition representing the
    original strain H168 thermohalophilic anaerobic growth evidence.
  modifications:
  - Maintain strict anaerobic cultivation conditions.
  - Use high-salt growth conditions centered on 100 g/L NaCl, matching the parent
    medium's approximately 101 g/L NaCl formulation.
  - Incubate at 60 C for optimal growth of strain H168.
  purpose: Capture strain-specific growth evidence for Halothermothrix orenii H168
    under the existing parent medium instead of creating a duplicate organism-named
    medium record.
  evidence:
  - reference: PMID:7520742
    supports: SUPPORT
    snippet: A long rod, present only in the 40- to 60-cm layer, was isolated at 60
      degrees C
    explanation: The source directly reports isolation of strain H168 at 60 C in a
      medium containing 100 g/L NaCl, which matches the high-salt Halothermothrix
      parent medium closely enough for a variant-level record.
  - reference: https://www.ncbi.nlm.nih.gov/bioproject/16377
    supports: SUPPORT
    explanation: NCBI BioProject PRJNA16377 links Halothermothrix orenii H168 to complete
      genome assembly GCA_000020485.1 and BioSample SAMN00623047.
