preparation_steps:
- step_number: 1
  action: MIX
  description: After sterilization add sterile 1M Na-sesquicarbonate solution to achieve
    the pH of 9.5 (see medium 31).
- step_number: 2
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
