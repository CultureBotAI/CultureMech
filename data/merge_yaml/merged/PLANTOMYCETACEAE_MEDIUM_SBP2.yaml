preparation_steps:
- step_number: 1
  action: POUR_PLATES
  description: 'Prepare the liquid medium. Dispense the medium into culture vessels.
    Sterilize by autoclaving. Before inoculation add from sterile stock solutions:'
- step_number: 2
  action: AUTOCLAVE
  description: The 8% NaHCO3 solution may be either filter sterilized or autoclaved.
    When the solution is autoclaved use tightly closed vessels that are filled to
    a maximum of 50% of the total volume.
- step_number: 3
  action: MIX
  description: The final pH of the medium should be adjusted to pH 7.6-8.0.
