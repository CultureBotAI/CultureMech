preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: 'Mix components thoroughly. Distribute the medium into culture vessels
    (e.g., 20 ml medium in 50 ml serum bottles) under a N2-CO2 (4:1, v/v) gas mixture,
    seal with butyl rubber stoppers and autoclave. After cooling, add per liter the
    following solutions (*filter-sterilized or autoclaved, and stored anaerobically)
    to the medium:'
- step_number: 2
  action: ADJUST_PH
  description: Pressurize the culture vessels to 200 kPa N2-CO2 (4:1, v/v) . Check
    final pH to be 6.0-6.5.
- step_number: 3
  action: MIX
  description: 'Comment: MJ(-N) synthetic seawater can be replaced with commercially
    available synthetic seawater such as Jamarin S (Jamarin Laboratory). Addition
    of rumen fluid clarified (10.0 ml/L, see Medium No. 266) may stimulate growth.
    For strain JCM 15506, incubate with a 5-10% inoculum.'
