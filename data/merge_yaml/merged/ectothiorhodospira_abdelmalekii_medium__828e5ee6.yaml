preparation_steps:
- step_number: 1
  action: DISSOLVE
  description: Dissolve and bring to the boil.
- step_number: 2
  action: COOL
  description: Allow to cool down to room temperature under N2 gas phase. Then add
    bicarbonate.
- step_number: 3
  action: ADJUST_PH
  description: Adjust pH to 8.5.
- step_number: 4
  action: POUR_PLATES
  description: Dispense into appropriate vessels, e.g. Hungate tubes, under N2 atmosphere.
- step_number: 5
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
- step_number: 6
  action: FILTER_STERILIZE
  description: After autoclaving add sterile-filtered vitamin and sulfide solutions.
- step_number: 7
  action: ADJUST_PH
  description: Adjust pH to 2.0 - 3.0.
- step_number: 8
  action: AUTOCLAVE
  description: The sulfide solution is prepared in a 250 ml screw-capped bottle with
    a butyl rubber septum and a magnetic stirrer. The solution is bubbled with nitrogen
    gas, closed and autoclaved for 15 min. at 121°C. After cooling to room temperature
    the pH is adjusted to about 7.0 by adding of sterile 2 M H2SO4 drop-wise with
    a syringe without opening the bottle.
