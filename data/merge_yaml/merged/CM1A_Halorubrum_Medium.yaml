preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 7.5 with 1 M HCl or 1 M NaOH
- step_number: 2
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 20 min.
- step_number: 3
  action: MIX
  description: 'Before inoculation add from sterile stock solutions:'
- step_number: 4
  action: DISSOLVE
  description: Dissolve salts completely then add CaCl2 x H2O.
- step_number: 5
  action: ADJUST_PH
  description: Adjust pH to 7.5 with Tris-HCl at pH=7.5
- step_number: 6
  action: MIX
  description: Don't use Difco Bacto-peptone, it was reported in 1988 to contain bile
    salts that lyse halobacteria, this was still the case in 2001
- step_number: 7
  action: ADJUST_PH
  description: Adjust pH to 7.5
- step_number: 8
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
- step_number: 9
  action: FILTER_STERILIZE
  description: filter sterilized
- step_number: 10
  action: FILTER_STERILIZE
  description: filter sterilized
- step_number: 11
  action: MIX
  description: mix 0.25 ml Vit 1 and 0.75 ml Vit2
