preparation_steps:
- step_number: 1
  action: ADJUST_PH
  description: Adjust pH to 6.75 with NaOH.
- step_number: 2
  action: AUTOCLAVE
  description: Dissolve and autoclave at 121C for 15 min.
- step_number: 3
  action: MIX
  description: 'Comment: For strain JCM 21281, good growth can be obtained in semisolid
    medium (1.0 g/L agar).'
- step_number: 4
  action: ADJUST_PH
  description: Add nitrilotriacetic acid to 500 ml of distilled water. Dissolve by
    adjusting pH to 6.5 with KOH. Add the remaining components and distilled water.
    Readjust pH to 7.2.
