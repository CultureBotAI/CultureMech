preparation_steps:
- step_number: 1
  action: MIX
  description: 'The growth medium contains the following components (per liter):'
- step_number: 2
  action: POUR_PLATES
  description: Combine the distilled water and Solutions 1,3,4 in an Erlenmeyer flask
    and dispense into glass serum bottles.
- step_number: 3
  action: MIX
  description: Flush the headspace of the serum bottles with pure N2. Seal the serum
    bottles with butyl rubber stoppers and crimp seals. Using a syringe and needle,
    inject pure methane and oxygen to final headspace concentrations of 5-10% CH4
    and 21% O2.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave the serum bottles for 20 minutes at 121 °C.
- step_number: 5
  action: FILTER_STERILIZE
  description: Upon cooling to room temperature, add Solutions 2 and 5 from a filter-sterilized
    stock solution.
- step_number: 6
  action: MIX
  description: The final pH of the medium should be 7.8 - 7.9.
- step_number: 7
  action: DISSOLVE
  description: Dissolve the ingredients listed above (in that order) in about 700
    ml of distilled water, and then make up to 1 litre
- step_number: 8
  action: MIX
  description: "Contains the following components per liter\r\nof deionized water:"
- step_number: 9
  action: ADJUST_PH
  description: Adjust pH 7.8-7.9
applications:
