preparation_steps:
- step_number: 1
  action: MIX
  description: Mix components thoroughly, sparge the medium with a N2-CO2 (80:20,
    v/v) gas mixture and autoclave under the same gas mixture.
- step_number: 2
  action: MIX
  description: 'After cooling, aseptically and anaerobically add the following solutions
    from sterile anaerobic stocks (autoclaved or *filter-sterilized): Prior to use,
    add per liter the following solution (autoclaved and stored under a N2 atmosphere):
    Adjust pH to 6.5, if necessary.'
- step_number: 3
  action: MIX
  description: 'Trace element solution: Dissolve nitrilotriacetic acid first in 200
    ml of distilled water, and adjust pH 6.5 with KOH.'
- step_number: 4
  action: MIX
  description: Then, add the remaining salts and adjust volume to 1000 ml.
- step_number: 5
  action: MIX
  description: Readjust pH to 6.5.
