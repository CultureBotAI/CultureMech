preparation_steps:
- step_number: 1
  action: MIX
  description: Prepare solution 1 (mineral salts)
- step_number: 2
  action: MIX
  description: Prepare solution 2
- step_number: 3
  action: ALIQUOT
  description: Combine solutions 1 + 2. If desired aliquot into  hungate tubes, filling
    them up fully.
- step_number: 4
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
- step_number: 5
  action: MIX
  description: Before inoculation add the following from anaerobic, sterile stock
    solutions.
- step_number: 6
  action: MIX
  description: check pH and adjust to 7.0 if necessary
- step_number: 7
  action: AUTOCLAVE
  description: Autoclave at 121°C for 15 min
- step_number: 8
  action: ADJUST_PH
  description: Adjust pH to 7.0.
- step_number: 9
  action: COOL
  description: allow to cool before combining with solution 2
- step_number: 10
  action: FILTER_STERILIZE
  description: "Boil briefly and bubble with CO2 for 30 minutes and filter sterilize\
    \ into a sterile, gas-tight\r\nscrew-cap bottle."
- step_number: 11
  action: HEAT
  description: "Degas water by bringing to a boil for a minute or two. Meanwhile,\
    \ wash sulfide before\r\nweighing – using plastic-forceps, dip a small chunk into\
    \ dd H2O and dry sulfide and\r\nforceps with lint-free wipes. Drop weighed sulfide\
    \ chunk into the degassed water."
- step_number: 12
  action: AUTOCLAVE
  description: Autoclave at 121 °C for 15 min.
- step_number: 13
  action: ADJUST_PH
  description: Adjust pH to 7.0.
