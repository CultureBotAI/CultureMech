preparation_steps:
- step_number: 1
  action: MIX
  description: Solution A is prepared under 100% N2 gas atmosphere and sterilized
    by autoclaving at 121⁰C for 15 min. Solution C is sterilized by autoclaving under
    an atmosphere of 80% N2 and 20% CO2 gas mixture. Solutions B, D, and E are prepared
    under a 100% N2 gas atmosphere and sterilized by filtration. Appropriate amounts
    of solutions B to E are added to the sterile solution A in the sequence as indicated.
    Check the pH of the complete medium and adjust to pH 7.0-7.2, if necessary.
- step_number: 2
  action: ADJUST_PH
  description: First dissolve EDTA in distilled water and adjust pH to 7.0 using 2
    N NaOH; then add other compounds.
