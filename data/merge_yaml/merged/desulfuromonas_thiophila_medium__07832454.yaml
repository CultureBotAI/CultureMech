preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients (except sulfur, carbonate, pyruvate, vitamins
    and sulfide), then sparge medium with 80% N2 and 20% CO2 gas mixture for 30 -
    45 min to make it anoxic. Dispense medium under same gas atmosphere into anoxic
    Hungate-type tubes or serum vials and autoclave. Sulfur is sterilized by steaming
    for 3 hours on each of 3 successive days (see medium 35) and added aseptically
    to the sterile medium while retaining anoxic conditions. Complete the medium by
    adding pyruvate, vitamins and sulfide from sterile anoxic stock solutions prepared
    under 100% N2 gas atmosphere and carbonate from a sterile anoxic stock solution
    prepared under 80% N2 and 20% CO2 gas atmosphere. Stock solutions of pyruvate
    and vitamins are sterilized by filtration. Adjust pH of the complete medium to
    7.0 - 7.2, if necessary.
- step_number: 2
  action: DISSOLVE
  description: First dissolve FeCl2 in the HCl, then dilute in water, add and dissolve
    the other salts. Finally make up to 1000.00 ml.
