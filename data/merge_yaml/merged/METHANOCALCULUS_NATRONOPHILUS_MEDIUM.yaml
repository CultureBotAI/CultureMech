preparation_steps:
- step_number: 1
  action: AUTOCLAVE
  description: Dissolve ingredients except carbonate, bicarbonate, vitamins and sulfide,
    then sparge medium with 80% H2 and 20% CO2 gas mixture for 30 - 45 min to make
    it anoxic. Add and dissolve carbonates and sulfide while gassing the head space
    only. Dispense under same gas atmosphere into anoxic Hungate-type tubes or serum
    vials and autoclave. Before use add vitamins from an anoxic stock solution sterilized
    by filtration. Adjust pH of the complete medium to 9.0 - 9.5.
- step_number: 2
  action: ADJUST_PH
  description: Dissolve EDTA in 800 ml distilled water, adjust pH to 7 using 2 N NaOH
    and add ferrous chloride. After ferrous chloride has dissolved add other compounds.
    Finally adjust pH to 6.0 and bring volume to 1000 ml.
