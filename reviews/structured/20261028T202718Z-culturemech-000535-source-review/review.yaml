- assessment_id: grounding
  area: grounding
  topic: Supplied forms and current ontology/MIM scope
  outcome: concern
  summary: Every asserted slot and exact preferred-term/current-MIM lookup is inventoried.
    Most salt hydrates, D-biotin and sodium L-lactate match their supplied forms.
    Nickel hexahydrate is contradicted by the anhydrous ID; generic calcium pantothenate
    has unresolved D specificity. Vitamin B12 remains a vitamer class, so no molecular
    conversion is certified. Present secondary links, exact current row membership
    and canonical-label agreement use distinct populations; none alone proves supplied
    form. Exact MIM NiCl2 x 6 H2O rows are REJECTED despite identifying CHEBI:53542;
    the proposed hydrate is supported independently by primary formula and fresh OLS,
    not certified by that mapping status. CoCl2 x 6 H2O also has REJECTED spelling
    rows but MAPPED cobalt-hexahydrate rows; both retain the chemically matching CHEBI:53503.
    Mixed D/DL pantothenate aliases do not resolve stereochemistry.
