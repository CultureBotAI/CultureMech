- assessment_id: forms
  area: grounding
  topic: Chemical forms and limits of secondary index matches
  outcome: supported
  summary: Water and sodium chloride labels resolve, and the explicitly written MgSO4·7H2O
    source form matches CHEBI:31795 heptahydrate metadata and formula. All three current
    secondary keys have pinned-index rows. That index also assigns CHEBI:31795 to
    a MgSO4·H2O label, so secondary key presence alone is not evidence for hydrate
    correctness; here the source spelling and primary ontology metadata provide the
    form support. Yeast extract and agar remain undefined materials without invented
    pure-molecule mappings.
