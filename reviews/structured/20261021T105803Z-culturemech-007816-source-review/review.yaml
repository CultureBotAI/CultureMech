    tetrathionate, phosphate, ammonium sulfate, NaCl, water and sulfuric acid. The
    missing trace definition must retain zinc/cobalt heptahydrates, copper pentahydrate,
    nickel hexahydrate, molybdate/tungstate dihydrates and the explicit variable xH2O
    forms of manganese and chromium sulfates. No trace-composition IDs are currently
    asserted in this target; do not import unrelated helper mappings or unverified
    provider mmol/L values.
