- assessment_id: stock-scope
  area: quantity
  topic: Primary and provider hierarchy without double counting
  outcome: concern
  summary: The primary requires fresh filtered B, combines it with A, then adds autoclaved
    trace. MediaDive 5316 instead incorporates trace 5294 into B and declares 101
    mL for stock concentration calculations. These formulations carry the same listed
    material amounts but different represented stages; preserve the exact primary
    ordering and annotate provider context rather than silently flattening it. Current
    direct A/B components plus wrong references and an empty trace placeholder fail
    to encode either source faithfully.
