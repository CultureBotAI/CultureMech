limitations:
- Focused self-review only. Every parent ingredient amount is enumerated as preserved,
  not newly verified.
- Teusink minimal growth is a results-not-shown narrative; omission percentages and
  computational columns do not establish combined-minimal outcomes.
- Poolman is represented by abstract/metadata and two inspected scans, not an archived
  complete body transcription.
- Cocaign-Bousquet and Letort are abstract-only. Metadata-only HAL notices do not
  supply missing formulation evidence.
- Chemical authority supports identity/formula mass, never the recipe amount. Conditional
  arithmetic does not silently resolve hydration or concentration basis.
- Organism inventories are bounded to inspected medium-relevant passages. Background
  and base-protocol organisms receive qualified mappings but no positive targets.
- Required reference failures and existing global merge diagnostics remain explicit;
  no output publication or status promotion.
- 295 MediaDB candidate source-owner links remain; the queue is not an exhaustive
  literature inventory.
