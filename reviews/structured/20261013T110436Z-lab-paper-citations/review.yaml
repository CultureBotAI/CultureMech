  details: '[{"preferred_term": "Lactococcus cremoris subsp. cremoris MG1363", "strain":
    "MG1363", "term": {"id": "NCBITaxon:416870", "label": "Lactococcus cremoris subsp.
    cremoris MG1363"}, "scoped_to_variant": "Nordkvist 2003 reported microaerobic
    MS10 with manganese sulfate", "evidence": [{"reference": "doi:10.1128/AEM.69.6.3462-3468.2003",
    "supports": "SUPPORT", "snippet": "Biomass and end product time courses under
    microaerobic conditions", "explanation": "Figure 1A top-row diamond biomass curve
    increases; caption and full Methods establish the treatment and MG1363 identity.
    The microaerobic bioreactor experiment is at 30 degrees C, 350 rpm, pH 6.6, DOT
    5%, working volume 1.5 liters. Unamended panel A later slows despite residual
    glucose; this is not no growth, and acetate is not asserted universally necessary
    in every aeration regime. No rates, yields, maxima or optimum are imported. Reported
    organism=Lactococcus lactis subsp. lactis MG1363; scientific name and canonical
    label=Lactococcus cremoris subsp. cremoris MG1363; NCBITaxon:416870; rank=strain;
    taxonomy_match=exact strain with documented historical reclassification. Wegmann
    2007 Discussion (doi:10.1128/JB.01768-06) explicitly reconciles the former lactis
    classification with the later cremoris classification; NCBI lists the older cremoris
    name as a synonym of its current node. Lookup_on=2026-10-13; https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=416870&retmode=xml;
    archive=references_cache/papers/taxonomy/mg1363-20261013.{xml,md}. Growth is limited
    to the named source-described variant, not the unmodified parent. Source-described
    bioreactor assay, not a fully normalized expansion of MS10. The cited Cocaign-Bousquet
    1995 base is available only as an abstract. The parent''s 42.92 mM K2HPO4 and
    66.13 mM KH2PO4 are not certified: Nordkvist specifies threefold-higher phosphate
    for precultures, and the complete base formula needed to resolve the reactor concentrations
    is unavailable. Do not automatically divide these parent amounts or import preculture
    buffering into the reactor. Chemical hydrates, stereochemistry, and the generic
    parent filter-sterilization step remain unverified. Current KGX export does not
    honor scoped_to_variant; no unscoped parent-medium edge is authorized or published.
    "}]}]'
