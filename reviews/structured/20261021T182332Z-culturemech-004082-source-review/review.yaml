  topic: Literal calcium hydrate and mixture boundaries
  outcome: concern
  summary: The PDF image and text both print CaCl2 x 7 H2O. CHEBI:3312 instead has
    formula Ca.2Cl, and both primary and secondary local keys repeat that anhydrous
    identity. Do not silently change the source to dihydrate or invent a heptahydrate
    term. Magnesium heptahydrate and the ordinary Na/K salts agree at their stated
    forms. HEPES is a valid current term; FAC CHEBI:31604 is an indefinite-composition
    mixture, so a fixed molar mass is not justified.
