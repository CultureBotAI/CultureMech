limitations:
- Partial self-review, not independent adversarial approval or complete record review.
- Eight abstracts; one full HTML inspected selectively; one publisher subscription
  preview. Images and inherited base formulas not certified.
- Parent mappings and actual no-rank nodes retained explicitly. Bounded name queries
  do not establish taxon absence.
- Three pre-existing per-record reference failures and global merge diagnostic failures
  remain visible.
- No generated source, edge or page publication. Candidate queues overlap and do not
  establish citation exhaustion.
