  description: 'Formulation_unresolved: The abstract separates model-predicted requirements,
    physical omission experiments and an optimal CDM, but does not enumerate either
    local formulation. The publisher page is a subscription preview, not full methods.
    Missing local amino-acid/vitamin amounts remain unavailable; no withdrawn VARIABLE
