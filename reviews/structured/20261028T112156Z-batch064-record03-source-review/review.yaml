limitations:
- Both exact KOMODO detail routes and the catalogue returned 403. Historical excerpts
  retain accession/title/pH context, but the original catalogue and strain-specific
  formulation remain unverified; completion is partial.
- DSM769 base quantities and preparation are not automatically evidence for DSM5262/769.2.
  Every existing variant concentration and pH claim is retained as unsupported, with
  no replacement formulation proposed.
- The primary specifies water inputs, not measured final makeup. API main g_l is provider-defined
  nominal normalization; no unqualified final-volume denominator is invented. Buffer
  salt composition and unquantified late-stock amounts remain unresolved.
- No growth phenotype, organism taxonomy or physiological atmosphere is inferred from
  a medium name, DSM strain identifier or generic source preparation. All original
  history remains append-only.
notes:
- Fresh review; historical lost snapshots were not reconstructed. All inspected source
  files remain unchanged.
- No formal review validation/save, Git mutation or publication was performed by this
  author.
