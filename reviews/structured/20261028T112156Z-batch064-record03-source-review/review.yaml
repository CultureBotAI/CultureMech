summary: The DSM769 base is authenticated by fresh primary/provider bytes, including
  the exact historical API digest. The generated record flattens a vitamin stock,
  misrepresents a liquid phosphate-buffer dose as mass concentration, loses the DSM
  owner preparation and mixes a separately repaired DSM5262 variant into the base.
  Sodium resazurin is assigned the neutral dye identifier. Exact KOMODO routes remain
  inaccessible, so variant amounts and accession-specific claims stay unresolved.
