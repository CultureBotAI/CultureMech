limitations:
- Exact JCM253 returned HTTP 200 with Nothing found. TOGO M245 and MediaDive J253
  preserve the 4% formulation, but neither is a newly recovered live JCM253 primary
  recipe. The available JCM38 page describes the distinct 2% parent and does not establish
  accession253-specific sterilization.
- Source amounts are 40 g malt extract, 20 g agar and 1 L water for M245, versus 20
  g malt extract, 20 g agar and 1 L water for M30. These are nominal recipe quantities;
  no measured final volume or density was verified. Do not convert a water batch amount
  into a final mass concentration.
- The bacterial folder and generic cultivation application are not strain-specific
  growth evidence. No taxon, strain, genome or literature-growth assertion is added.
  Malt extract and agar remain mixtures with source grade retained where stated.
- A schema/term pass does not establish chemical identity, correct source quantities,
  or growth. Reference-check coverage must be read from its actual output; direct
  source comparisons are separately documented.
- No record, curation history, merge output, or scientific status was changed. No
  new experiment or exhaustive literature review was performed. Full-corpus regeneration,
  ID/product/merge gates are acceptance checks for follow-up changes, not executed
  by this read-only single-record review.
