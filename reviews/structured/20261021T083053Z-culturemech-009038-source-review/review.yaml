summary: 'The generated 4% Malt Agar record contains the 2% parent formulation: malt
  extract is 20 g/L instead of the 40 g source amount retained by its maintained owner.
  Both source-specific owners also encode 1 L water as 1 g/L and omit distinct source
  pH instructions (7.0 versus 6.5), making the claim that only malt concentration
  differs incomplete. Exact TOGO and MediaDive versions support this comparison, but
  live JCM253 returns no formulation, so primary reconciliation remains partial.'
