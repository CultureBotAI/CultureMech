limitations:
- The primary gives water inputs rather than an explicit final-makeup instruction;
  API g_l is credited as provider-defined nominal normalization only. No measured
  final-volume claim or unqualified final-medium stock dilution is inferred.
- No strain-specific growth or taxonomic resolution is inferred from the medium name,
  bacterial folder or generic preparation.
- Current API/OLS/MIM observations establish current source/identifier facts, not
  historical retrieval events. Exact old report objects and any full-response digest
  matches are separately recorded.
- Late stock strengths or addition volumes not quantified by the source remain unresolved.
  Source titrant concentrations are not titrant volumes. The current writer code is
  inspected context, not proof of the pipeline execution that produced these older
