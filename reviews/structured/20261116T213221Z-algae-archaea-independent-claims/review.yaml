  snapshot_sha256: 7e3ddf65f336955a2c875b18361e878ffcf16bc341fe9b404308d014df4c3319
- evidence_id: bbmerds
  kind: primary_source
  reference: https://www.ccap.ac.uk/wp-content/uploads/MR_BB_MErds.pdf
  locator: Page 1, 8:2 or 1:1 mixture; named BB and MErds recipes
  accessed_at: '2026-11-16T21:32:21Z'
  support: supports
  summary: Official CCAP instructions specify 8:2 or 1:1 mixtures of the separately
    prepared media. The explicitly selected one-litre mixture normalization yields
