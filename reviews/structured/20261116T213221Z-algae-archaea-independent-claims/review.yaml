  accessed_at: '2026-11-16T21:32:21Z'
  support: supports
  summary: The acetate-determination Methods paragraph supports 0.1% wt/vol yeast
    extract in its specified mixotrophic arm. A separate 0.05% experiment is not substituted
    or pooled.
  snapshot_sha256: ccbf5dabb3b3725c20426192da7551509cc04ceb08b6fda0b5d572e51f239905
