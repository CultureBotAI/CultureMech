    volume after three days and 3% of initial volume after six days. Sequential additions
    are not a 6% initial concentration; the undefined effluent is not expanded.
  snapshot_sha256: 3447430b8c29a069ccf9c0f19409da2c1141faa43d104d450111e0a71b878bf8
- evidence_id: fertilizer
  kind: primary_source
  reference: doi:10.1016/j.biortech.2025.132777
