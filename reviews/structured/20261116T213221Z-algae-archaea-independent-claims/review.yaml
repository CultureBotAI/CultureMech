  reference: https://www.ccap.ac.uk/wp-content/uploads/MR_f2Si.pdf
  locator: Page 2, f/2 + Si Modified, direct addition replacing stock 5
  accessed_at: '2026-11-16T21:32:21Z'
  support: supports
  summary: Official CCAP page 2 explicitly omits stock 5 and instead adds 0.1705 g
    sodium metasilicate nonahydrate per litre of medium. The replacement retains hydrate
