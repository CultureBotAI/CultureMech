  snapshot_sha256: 1a4a451f7a926a815288c9d915cc9ec8b3fc36ab210c041f0f83f9365d9bfc06
- evidence_id: reed
  kind: primary_source
  reference: doi:10.1128/jb.183.24.7007-7016.2001
  locator: Materials and Methods, Archaeoglobus growth and harvest
  accessed_at: '2026-11-16T21:32:21Z'
  support: supports
  summary: The cultivation paragraph, not downstream protein assays, supports 20 mM
    each Tris/maleic acid, 22 mM DL-sodium lactate, 0.5 g/L yeast extract and 1 mM
