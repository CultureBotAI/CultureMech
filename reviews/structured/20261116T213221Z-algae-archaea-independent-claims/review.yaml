  accessed_at: '2026-11-16T21:32:21Z'
  support: supports
  summary: Culture and antibiotic-treatment Methods support HCl acidification, 1.06e-4
    M silicate, 29.4 mM nitrate and separate penicillin G/dihydrostreptomycin sulfate
