summary: The source distinguishes a main recipe from a trace-element stock. Both local
  layers instead sum their two EDTA concentrations and expose ten stock-only compounds
  as direct-medium ingredients. The printed0.5 mg ammonium-acetate/pyruvate and phosphate
  rows are retained without a guessed unit correction. Nickel hydration and source-linkage
  gaps also need curation.
