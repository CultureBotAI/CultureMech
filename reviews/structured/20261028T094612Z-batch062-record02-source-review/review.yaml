limitations:
- The primary literally prints0.5 mg for the substrate alternative and KH2PO4; neither
  is silently changed to grams.
- Provider g_l fields identify main or stock stages; water inputs do not independently
  establish final volume. No final-medium trace concentration is calculated from an
  assumed denominator.
- EDTA hydration is unspecified by the source; the existing anhydrous identifier is
  therefore not independently authenticated as the supplied form.
- Bicarbonate/sulfide are separately sterilized, but stock strengths, addition volumes
  and autoclave time/temperature are absent. No such values or organism-specific growth
  conditions are inferred.
