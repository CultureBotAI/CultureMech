summary: Exact TOGO M162 and JCM 170 resolve the current recipe and its separate vitamin
  stock. Both local layers flatten the three undiluted stock constituents into the
  main medium, encode the 10 ml stock addition as mass, and combine the 990 ml base-volume
  instruction with 1 L stock water into 991 g/L. The 990 ml base makeup, 10 ml vitamin
  addition, pH, differential sterilization and optional solid branch are explicitly
  available. Chemical identifiers and current secondary membership resolve, with sodium
  succinate supplied-form specificity kept qualified. The optional unavailable MediaDive
  endpoint does not prevent assessment from the complete primary and TOGO records.
