  title: Resolve cellulose extension without inventing a final denominator
  description: All three records state Cellulose MN30015 G_PER_L. The current API
    contains only15 g without g_l, and the current primaryPDF lacks that row. The
    primary paper-strip instruction does not establish cellulose-powder equivalence.
    Preserve both source observations and the supported eight API main rates; do not
    silently delete or endorse the extension.
