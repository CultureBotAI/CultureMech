- finding_id: formulation-119
  issue_key: fungal-study-citations-formulation-119
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: 'Exact study-to-recipe formulation remains unresolved: source 119'
  target_ids:
  - CultureMech:007210
  - CultureMech:007245
  field_paths:
  - ingredients
  - references
  description: Methods explicitly identify modified Vogel medium, 2.44 g/L uridine,
    hydrated salts and 20 g/L initial xylose or maltose. Imported values are molar
    and several labels omit hydration or use citrate instead of citric acid. Verify
    formula identity and conversion bases before exact amount approval; do not overwrite
    original quantities from an unverified conversion. PDA plus uridine is inoculum
    medium; saline harvest, PBS washes and protein-extraction buffers are not the
    growth recipe. Bioreactor versus flask conditions, and induction versus single-carbon
    assays, remain separate. Linked supplemental files and figure images not inspected.
    Induction experiment starts at 10 g/L xylose and adds maltose to a final 10 g/L
    after 68 hours. It is distinct from both 20 g/L single-carbon owners. An inline
    study variant may be appropriate after recipe-identity comparison and duplicate-variant
    search. Assignment remains unresolved pending source/local chemical-form reconciliation.
  evidence_ids:
  - paper-119
  - lu-body
  - claims
  owner_paths:
  - repository: culturebotai/CultureMech
    path: data/normalized_yaml/bacterial/modified_vogel_medium_xylose.yaml
    role: authoritative normalized recipe
  - repository: culturebotai/CultureMech
    path: data/normalized_yaml/bacterial/modified_vogel_medium_maltose.yaml
    role: authoritative normalized recipe
