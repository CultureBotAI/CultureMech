  description: TA1 and A28 owners share a ten-component xylose base; A28 additionally
    has 4-aminobenzoate and biotin. This is a local comparison, not a newly verified
    study-specific supplement requirement. Intracellular xylitol up to 30 mM is a
    measured metabolite, not medium ingredient concentration. Metabolic flux control
    is not growth rate.
  evidence_ids:
