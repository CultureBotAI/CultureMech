  summary: A. niger AB1.13 is the experimental uridine auxotroph and protease-regulatory
    mutant. AB4.1, N402 and ATCC9029 (= NRRL3 in the paper) are ancestry, not tested
    growth targets. NRRL3 has verified strain node NCBITaxon:1451139; AB1.13 must
    not receive that exact identity. Its species parent is NCBITaxon:5061. P. chrysogenum
    (expanded using reference 24) maps to Penicillium chrysogenum 5076; S. cerevisiae
    4932, A. nidulans 162425 and A. fumigatus 746128 occur in background comparisons.
    Unspecified fission yeast remains unresolved rather than inventing a species.
