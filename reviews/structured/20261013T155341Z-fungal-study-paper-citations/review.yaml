  summary: Methods explicitly identify modified Vogel medium, 2.44 g/L uridine, hydrated
    salts and 20 g/L initial xylose or maltose. Imported values are molar and several
    labels omit hydration or use citrate instead of citric acid. Verify formula identity
    and conversion bases before exact amount approval; do not overwrite original quantities
    from an unverified conversion. PDA plus uridine is inoculum medium; saline harvest,
    PBS washes and protein-extraction buffers are not the growth recipe. Bioreactor
    versus flask conditions, and induction versus single-carbon assays, remain separate.
    Linked supplemental files and figure images not inspected. Induction experiment
    starts at 10 g/L xylose and adds maltose to a final 10 g/L after 68 hours. It
    is distinct from both 20 g/L single-carbon owners. An inline study variant may
    be appropriate after recipe-identity comparison and duplicate-variant search.
    Assignment remains unresolved pending source/local chemical-form reconciliation.
