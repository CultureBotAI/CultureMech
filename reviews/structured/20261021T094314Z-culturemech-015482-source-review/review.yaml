  issue_key: CM015482-dtt-stereochemistry
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Generic dithiothreitol is assigned an unsupported L stereoisomer
  description: The source and both preferred terms say only dithiothreitol. CHEBI:42106
    names L-1,4-dithiothreitol and encodes explicit stereochemistry. Neither the source
    row nor a generic CAS-enrichment note establishes that stereoisomer.
  target_ids:
