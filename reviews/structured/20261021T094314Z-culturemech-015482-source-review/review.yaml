- assessment_id: identity
  area: identity
  topic: Exact ABB accession and dataset boundary
  outcome: supported
  summary: The record name ABB, description Anaerobic basal broth and 15 source ingredient
    rows match the public FEBA block exactly. ACY and other media in the same file
    remain separate. The CultureBotHT database ID ABB is retained as a historical
    claim, with its inaccessible import bytes separately limited.
  target_ids:
  - CultureMech:015482
  evidence_ids:
  - record
  - owner-0
  - id-search
  - feba
  - feba-repository
  - feba-version
- assessment_id: forms
  area: grounding
  topic: All direct material names and asserted forms
  outcome: concern
  summary: Canonical CHEBI labels resolve, but source generic dithiothreitol does
    not establish L-1,4-dithiothreitol and sodium succinate does not establish anhydrous
    disodium succinate. Explicit source D-glucose, L-arginine and L-cysteine hydrochloride
    retain their stated specificity. Starch is a polymeric material; peptic digest
    and yeast extract are mixtures without invented pure-molecule IDs. Existing CAS
    annotations for grounded compounds agree with captured OLS cross-references, but
    a CAS alias alone does not resolve DTT stereochemistry.
  target_ids:
  - CultureMech:015482
  evidence_ids:
  - record
  - owner-0
  - feba
  - chebi42106
  - chebi63675
  - chebi91247
  - chebi28017
  - annotations
- assessment_id: family
  area: scope
  topic: Medium classification, mixtures and growth scope
  outcome: supported
  summary: FEBA identifies a nonminimal broth with peptic digest and yeast extract,
    supporting COMPLEX/UNDEFINED and LIQUID. The unmapped-ingredient flag accurately
    reflects the two ungrounded mixtures; absence of current secondary links is reported
    as coverage, not an instruction to invent them. No stock, variant, parent, organism/strain,
    KG match or demonstrated growth assertion is present. The word anaerobic names
    the broth without establishing a detailed atmospheric protocol.
  target_ids:
  - CultureMech:015482
  evidence_ids:
  - record
  - owner-0
  - feba
  - mim
- assessment_id: preparation
  area: completeness
  topic: Unreported preparation and conditions
  outcome: unknown
  summary: Neither local layer nor the exact FEBA ABB block supplies preparation,
    stock recipes, solvent quantity, pH, sterilization or incubation parameters. Source-backed
    numerical concentrations are complete for this dataset, but operational detail
    remains unresolved. It cannot be copied from adjacent ACY, another basal broth
    or generic practice.
  target_ids:
  - CultureMech:015482
  evidence_ids:
  - record
  - owner-0
  - feba
- assessment_id: history
  area: provenance
  topic: Import history and exact source evidence
  outcome: concern
  summary: All 4 target and 3 owner events have timezone-bearing timestamps; the target
    adds only its merge event. Current ingredients agree exactly. Generic FEBA notes
    and CultureBotHT source metadata do not replace missing claim-level snippets and
    a pinned public reference. Historical access is unavailable, so this review remains
    partial despite complete independent numerical comparison.
  target_ids:
  - CultureMech:015482
  evidence_ids:
  - record
  - owner-0
  - feba
  - feba-version
  - historic-access
  - writer
  - validate-references
