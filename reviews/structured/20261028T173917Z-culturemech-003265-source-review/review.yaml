- assessment_id: grounding
  area: grounding
  topic: Supplied forms and current ontology/MIM scope
  outcome: concern
  summary: Exact current ontology objects and MIM snapshot rows are joined separately
    from scientific supplied-form review. The anhydrous iron ID contradicts the literal
    hydrated stock. Calcium pantothenate is unqualified in the source whereas current
    CHEBI31345 encodes D stereochemistry; retain this unresolved specificity limit
