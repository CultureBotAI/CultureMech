summary: DSMZ 1712 explicitly separates five basal salts from six stocks and their
  receiving doses. Both layers flatten the stock ingredients, invent a phosphate-buffer
  mass rate and combine four stock water volumes as 1250 g/L. The source distinguishes
  pyridoxol from stored pyridoxal, sodium coenzyme M from its acid term, and nickel
  chloride hexahydrate from anhydrous nickel dichloride. Preparation prose is largely
  retained but stock membership and the ascorbate action type are wrong. Current exact
  legacy nitrate-key absence is a completed lookup; historical correspondence remains
  unresolved, so the review is partial.
