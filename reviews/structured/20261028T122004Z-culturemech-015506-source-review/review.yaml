limitations:
- 'Completion is partial: the exact declared CultureBotHT repository and main-commit
  endpoints returned 404; this is a bounded request outcome, not proof of global repository
  absence. Current FEBA revision 803273865ea9e83fab770ec4f13670db80e1180b is fresh
  evidence and is not relabeled as the historical imported version.'
- The 2019 PMC page returned a browser challenge and its XML endpoint failed; neither
  is treated as a readable full paper. The 2026 exact abstract is used for MT123 identity
  context only; no full-paper recipe or growth assertion is adopted.
- FEBA names ATCC mixture products, but no current manufacturer formulation or product-lot
  certificate was authenticated. Current FEBA literal rates and its 1X declaration
  are the source basis here.
- CAS/MW notes are compared to exact FEBA compound rows and current ontology formulae,
  with an explicit lactate conflict and pantothenate formula-unit qualification. Mapping
  confidence and historical enrichment notes are algorithmic provenance, not measured
  concentrations or calibrated identity confidence.
- No strain-growth claim, optimization or experimental recommendation is inferred
  from the medium name or general source identity.
- The MIM snapshot commit is 6643131b0f12ab40b66f98135245fca04027e0e9; present/absent
  rows do not establish a historical or live-catalog result.
- Input water is not measured final volume. Explicit provider g_l rates are assessed
  only on their declared normalization basis; unspecified percent bases and hydrate
  numbers remain unresolved.
- No source changes, formal review validation/save, Git mutation or publication was
