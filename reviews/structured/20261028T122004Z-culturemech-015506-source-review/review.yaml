  description: Both local ingredient lists omit potassium phosphate monobasic, whereas
    the captured FEBA MOPS definition selects the ordinary vitamin mix at 1X and that
    mix contains a 0.9 g/L phosphate row. FEBA separately names a minus-phosphate
    mixture, which the selected medium does not reference. Reconcile the intended
    source revision and variant before curating this omission; the unavailable historical
    CultureBotHT payload prevents attributing it to a specific importer run.
