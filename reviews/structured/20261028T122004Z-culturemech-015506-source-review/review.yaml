  title: D,L sodium lactate is grounded to an L-specific chemical
  description: The supplied name in both records and the exact FEBA medium is Sodium
    D,L-Lactate, but CHEBI:232798 is sodium L-lactate with explicit stereochemistry.
    Its canonical label is correct for that ID and therefore does not validate the
    supplied racemic name. The copied FEBA compound metadata also gives CAS 50-21-5
    and MW 90.08, inconsistent with the inspected sodium L-lactate object. Resolve
    the supplied sodium salt and stereochemistry using exact source evidence, retaining
    the directly stated molar rate without an invented mass conversion.
