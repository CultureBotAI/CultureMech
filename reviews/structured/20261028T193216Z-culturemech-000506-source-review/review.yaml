- assessment_id: grounding
  area: grounding
  topic: Supplied forms and current ontology/MIM scope
  outcome: concern
  summary: All current primary/secondary ontology slots and preferred-term MIM lookups
    are enumerated against fresh exact OLS objects and the pinned 9077-row snapshot.
    Source hydrate/salt and stereochemical specificity were checked separately from
    canonical labels. Sodium resazurin is incorrectly linked to neutral resazurin
    CHEBI:8806. The existing ammonium nickel sulfate hexahydrate, zinc sulfate heptahydrate,
    cysteine hydrochloride monohydrate and selenate primary IDs are supported. Legacy
    MediaIngredientMech:000198 has no exact current catalog row; this is not a claim
    of authoritative deprecation. CHEBI:31345 has D stereochemistry in its current
    structure; its D structure is compatible with explicitly D calcium pantothenate,
    despite generic displayed label; no new wrong-ID finding is inferred. The vitamin-B12
    class and non-stereospecific lipoic-acid concept are not narrowed to an unsupported
    vitamer/enantiomer. Exact secondary-link presence and label-agreement populations
    are separate metrics in the inventory; missing links do not certify or refute
    chemical identity.
  target_ids:
  - CultureMech:000506
  evidence_ids:
  - groundings
  - mim
  - mim-meta
