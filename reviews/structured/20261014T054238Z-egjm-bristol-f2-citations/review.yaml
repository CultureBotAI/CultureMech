  issue_key: egjm-bristol-f2-citations-title-normalization
  category: evidence
  severity: minor
  status: open
  certainty: confirmed
  title: Combined entity and terminal-period differences defeat title comparison
  description: Two newly failing EG:JM reference checks compare the verified PubMed/JATS
    title with a DOI title containing literal &amp; and no final period. The maintained
    fallback already decodes HTML entities, but its exact rendered comparison retains
    terminal punctuation. A mocked-fetcher diagnostic proves each difference passes
    alone while the combination fails. Metadata is preserved; both owner baselines
    passed.
