  category: evidence
  severity: informational
  status: open
  certainty: confirmed
  title: EG:JM and vitamin-replaced f/2 are not complete resolved formulas
  description: EG:JM is named without a complete historical formula. Hiibel explicitly
    replaces f/2 vitamins but does not quantify dose or identities; its cited Gomord
    paper concerns plant glycosylation. Imported agar/stock details are not validated
    by these studies. Inline-variant growth cannot be exported with current scope
    handling.
