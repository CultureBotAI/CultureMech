    identification. All six reported salt forms and millimolar amounts match the parent;
    study conditions are pH 7.7, room temperature, 18/6 h light/dark. Stock preparation
    is not established. Table 1 centrate maxima and zero entries are separate wastewater
    results, not negative Bristol growth or growth metrics. No claim of an optimum,
    genus-wide growth or independent strain reidentification. Taxonomy XML archives
    are linked in the paper bibliography notes.'
