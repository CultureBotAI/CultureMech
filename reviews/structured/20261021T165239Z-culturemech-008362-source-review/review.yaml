  and vitamin stocks. Both local layers flatten stock strengths, sum ingredients across
  stages and lose milligram/volume units. Two resolvable external stock links identify
  different formulations; their eight attached amount claims remain stock-only. Preparation
  and stock-pH context are absent. Valid ontology labels coexist with hydrate/calcium-salt
  mismatches and a confirmed current secondary-index gap. All required source checks
  in this scope are available.
