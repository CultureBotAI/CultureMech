  - mim
  - primary
- assessment_id: preparation
  area: completeness
  topic: Existing supported quantities and edition differences
  outcome: concern
  summary: The record already preserves pH 7.1, make-up to 1 L, 1 M titrants, optional
    15 g/L agar, 15 psi for 15 min and 100 ml separate-stock water. The current PDF
    omits the inherited alternative test-tube route and uses Oxoid L11 product wording.
    These differences are edition-limited, not proof that either procedure is intrinsically
    wrong. Temperature and pressure basis remain unspecified.
  target_ids:
  - CultureMech:000325
  evidence_ids:
  - record
  - owner-0
  - primary
  - edition
  - historical-report
  - quantity-inventory
- assessment_id: classification-growth
  area: evidence
  topic: Physical state, definedness and biological scope
  outcome: concern
  summary: The default liquid branch and optional agar branch are distinct. The source
    title describes nitrogen-fixing cyanobacteria but supplies no strain-specific
    growth result. Bacterial category is compatible with cyanobacteria. DEFINED is
    a conventional medium classification, not proof that the green ferric-ammonium-citrate
    mixture has a unique molecular composition. Comparison papers concern other formulations
    and experimental variants, so they do not establish growth on this selected BG11₀
    recipe.
  target_ids:
  - CultureMech:000325
  evidence_ids:
  - primary
  - grounding-inventory
  - record
  - owner-0
