- assessment_id: grounding
  area: grounding
  topic: Asserted forms, linkage and unresolved specificity
  outcome: concern
  summary: Thirteen of thirteen primary and current CHEBI-based secondary ingredient
    instances are linked (100.00% each on a 0–100 linkage scale), with exact current
    labels and pinned mapped secondary keys. This is not a correctness score. Hydrated
    mineral formulas agree with the primary. The PDF does not establish EDTA anhydrous
    specificity, and ferric ammonium citrate is explicitly a green mixture; neither
    permits invented hydrate or molarity. Legacy MIM000171 is confined to comparison
    inputs and is not an asserted C18 target/owner mapping.
  target_ids:
