  category: quantity
  severity: major
  status: open
  certainty: confirmed
  title: Stock doses and stock rates are presented as medium mass rates
  description: The first six ingredients are stored at 10 g/L, carbonate at 25.3 g/L,
    and six trace constituents at their one-litre stock concentrations. CCAP explicitly
    specifies seven 500 ml stock recipes dosed at 10 ml/L and one trace stock dosed
    at 1 ml/L. All thirteen receiving rates therefore require the source-stage corrections
    in the inventory.
