limitations:
- KOMODO aerobic=false is verified table metadata. It is not independent evidence
  that this recipe requires anaerobic cultivation or that any named organism grows
  in it.
- DSMZ626 provides1000 mL water and an HCl/pH instruction, with no sterilization,
  atmosphere or incubation details. No generic protocol or taxon was inferred.
- The current provider explicitly declares 1000 mL; g/L arithmetic is attributed to
  that declared basis. The primary water amount alone is not an independently measured
  final volume.
- Current writer code explains timestamp formatting and copy scope but does not establish
  the exact historical payload, execution environment or missing timezone. Existing
  events must remain append-only.
- A schema/term pass does not establish chemical identity, correct source quantities,
  or growth. Reference-check coverage must be read from its actual output; direct
  source comparisons are separately documented.
- No record, curation history, merge output, or scientific status was changed. No
  new experiment or exhaustive literature review was performed. Full-corpus regeneration,
  ID/product/merge gates are acceptance checks for follow-up changes, not executed
  by this read-only single-record review.
