findings:
- finding_id: f1
  issue_key: aml60-nested-formulation-flattened
  category: quantity
  severity: blocker
  status: open
  certainty: confirmed
  title: Stock strengths are represented as the medium formulation
  description: All 19 local g/L concentrations describe separate source stock objects,
    while the main 500 mL + 500 mL combination and the nested 5 mL SL-10 / 0.30 mL
    selenite-tungstate doses are absent. HCl’s 2.5 g/L additionally assumes a conversion
    not established by the primary’s unqualified 25% stock. This changes the denoted
    formulation, not merely its documentation. Source volume inconsistencies and unquantified
    late additions prevent an unconditional replacement final-concentration table.
