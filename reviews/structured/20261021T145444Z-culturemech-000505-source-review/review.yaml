- finding_id: f2
  issue_key: aml60-nickel-hydrate-grounding
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Nickel hexahydrate is grounded to the anhydrous compound
  description: The exact source calls for 24 mg NiCl2 x 6 H2O in SL-10. Both local
    CHEBI slots assert CHEBI:34887, whose formula Cl2Ni lacks the six waters. Correct
    labels and a mapped secondary key do not preserve this source form.
