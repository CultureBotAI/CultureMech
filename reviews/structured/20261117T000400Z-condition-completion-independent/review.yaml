evidence:
- evidence_id: matsui
  kind: primary_source
  reference: DOI:10.1104/pp.18.00453
  locator: 'Methods: culture conditions and transformation'
  accessed_at: '2026-11-17T00:04:00Z'
  support: supports
  summary: Methods supports distinct high-CO2 and ambient-air aeration arms. This
    proposal concerns a different recipe coordinate from the prior model cohort; gas
    input is not a dissolved dose.
  snapshot_sha256: beecd6db87651dbf5f4119169a755249ba977070ee4a7046d26dff3bab3b5d43
- evidence_id: '125'
  kind: primary_source
  reference: https://www.dsmz.de/microorganisms/medium/pdf/DSMZ_Medium125.pdf
  locator: Page 1 carbon alternatives
  accessed_at: '2026-11-17T00:04:00Z'
  support: supports
  summary: Official medium125 describes methane-air incubation at4:1 as an alternative
    to methanol addition. Ratio and input stage are retained without gas volume/pressure
    assumptions.
  snapshot_sha256: e107edb0e43f303bc124e81ef0430f07fde07eb9efbcf1cea9c35e3a2190ad8f
- evidence_id: kato
  kind: primary_source
  reference: doi:10.1264/jsme2.ME19128
  locator: 'Methods: cultivation of methanotrophs'
  accessed_at: '2026-11-17T00:04:00Z'
  support: supports
  summary: The already-reviewed metal and carbon-source treatments remain linked,
    avoiding duplicate positive events. Condition notes do not alter default versus
    dose-response scopes.
  snapshot_sha256: 2ade9577ad927b568273334fa9b14d2da22d155f877535d317ad13a0977a224d
- evidence_id: carini
  kind: primary_source
  reference: doi:10.1038/ismej.2012.122
  locator: Media preparation, autoclave and sequential gas sparging
  accessed_at: '2026-11-17T00:04:00Z'
  support: supports
  summary: Media preparation explicitly orders CO2 sparging after autoclaving, then
    air sparging, then vitamin/organic additions. Establishing a bicarbonate buffer
    does not identify a directly added bicarbonate salt or measured final species
    concentration.
  snapshot_sha256: b9fa5f44ed26edc1d3323374ba097fbc17c10510893d36703f9328983c77c2d1
- evidence_id: blumer
  kind: primary_source
  reference: doi:10.1128/AEM.01400-10
  locator: 'Methods: Bacterial strains and growth on sugar substrates'
  accessed_at: '2026-11-17T00:04:00Z'
  support: supports
  summary: The modified DSMZ640 sugar-substrate Methods specify nitrogen headspace
    for the50mL culture. This is the exact Blumer-Schuette variant0, distinct from
    the same recipe's Shang variant1.
  snapshot_sha256: ad092222c6d2e66bbd824e3d01ecc577c741cd64ac2eea89bcc43f5b2fa15cb8
- evidence_id: '11801'
  kind: primary_source
  reference: PMID:30413737
  locator: Culture conditions and Figure 2A
  accessed_at: '2026-11-17T00:04:00Z'
  support: supports
  summary: Full source describes active ambient-air bubbling in the multi-cultivator.
    The supplied gas context is distinct from shaker-flask incubation; no dissolved
    dose or new growth-success assertion is inferred.
  snapshot_sha256: bc5b3e8e61aea59f4547670a0bced26074cfa9dd650595ccd7c3316c8b640b53
- evidence_id: '11802'
  kind: primary_source
  reference: PMID:31932622
  locator: Culture conditions and Figure 2C
  accessed_at: '2026-11-17T00:04:00Z'
  support: supports
  summary: Figure-associated full text supports the1-percent CO2 multi-cultivator
    arm with bubbling. Other CO2/shaker arms are not silently combined.
  snapshot_sha256: fe274b564c95fb3895cdf8a2e2117ba7fe6fe6f14206101a4b9aef5bcc4fa62a
- evidence_id: nostoc
  kind: primary_source
  reference: PMID:36550226
  locator: Primary abstract only
  accessed_at: '2026-11-17T00:04:00Z'
  support: supports
  summary: The primary abstract distinguishes nitrate-present BG11 from nitrate-absent
    BG110. Comparator membership is held as operation/form uncertainty rather than
    an inferred removal from the nitrate-replete variant.
  snapshot_sha256: d883adb351252f53b31ab320203b6cbe3caf00677b580f776f9e924d9979b800
- evidence_id: mrs
  kind: primary_source
  reference: PMID:39353547
  locator: Primary abstract only
  accessed_at: '2026-11-17T00:04:00Z'
  support: supports
  summary: The primary abstract supports oxygen-condition comparisons but does not
    establish a gas-delivery procedure or dose. A field-specific operation/quantity
    hold is appropriate.
  snapshot_sha256: ea40b43f5297f50541e3363ecc5559b07847715c4878aeeebb2e90e3df9c3bc3
- evidence_id: context-accounting
  kind: record_content
  reference: conf/variant_ingredient_curation/completeness-conditions-683.json
  accessed_at: '2026-11-17T00:04:00Z'
  support: supports
  summary: All104 original condition rows were re-read. Named residual sodium, nitrate,
    total-silicate, oxygen and bicarbonate claims remain held at their exact unresolved
    dimensions. Existing/base occurrence links avoid duplicate inputs; ordinary temperature/pH/role/whole-medium
    conditions do not invent unnamed chemical additions.
