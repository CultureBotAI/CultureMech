limitations:
- Agent review, not human approval or release approval.
- No scientific records were mutated. Writer, schema, aggregate and MIM mapping gates
  remain separate.
- Nostoc/MRS support is limited to the inspected primary abstracts. Unavailable detailed
  preacclimation or oxygen procedures remain held.
- Ingredient-role links do not independently certify base ontology identities, doses
  or growth claims.
- Gas-supply stages are not liquid concentrations; alternative arms and ordered sparging
  are not combined.
- No-op envelopes may be filtered by the merger while every disposition remains accounted
  for.
