summary: 'Generated merged record data/merge_yaml/merged/THERMOVENABULUM_MEDIUM.yaml
  (CultureMech:002143), derived from data/normalized_yaml/bacterial/DSMZ_962a_THERMOVENABULUM_MEDIUM.yaml,
  contains 33 flat ingredients with 93.94% CHEBI coverage (31/33) and 87.88% mediaingredientmech_chebi_term
  coverage (29/33), and passes recipe reference and ontology term validation. However,
  it exhibits three defects: (1) linkml-validate and scripts/validate_strict.py fail
  on the merged file because src/culturemech/merge/merge_recipes.py emits top-level
  merge_fingerprint and merged_from fields that are not declared in src/culturemech/schema/culturemech.yaml;
  (2) its upstream normalized record (DSMZ_962a_THERMOVENABULUM_MEDIUM.yaml) flattened
  DSMZ Medium 962a''s Wolin trace element solution (10 mL/L) and vitamin solution
  (10 mL/L) directly into top-level ingredients[10..32] at their undiluted 1 L stock
  concentrations (inflating all 23 trace element and vitamin concentrations 100-fold,
  e.g., Nitrilotriacetic acid 1.5 G_PER_L, MgSO4 x 7 H2O 3 G_PER_L, NaCl 1 G_PER_L,
  Biotin 0.02 G_PER_L) and summed the base-medium CaCl2 x 2 H2O (0.326409 G_PER_L)
  with the unscaled trace-stock CaCl2 x 2 H2O (0.1 G_PER_L) into ingredients[3].concentration.value
  = ''0.42640900000000004'' ('' [Merged 2 duplicates: 0.326409, 0.1]''); and (3) four
  ingredients (Yeast extract, Sodium resazurin, Meat extract, and Calcium D-(+)-pantothenate)
  lack mediaingredientmech_chebi_term.'
