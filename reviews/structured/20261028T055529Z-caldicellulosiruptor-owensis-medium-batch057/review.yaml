- finding_id: f1
  issue_key: culturemech-000915-144b-144-and-modified-owner-conflation
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: The generated merge conflates DSM 144b with distinct DSM 144 and modified
    identities
  description: The maintained DSM 144b owner and target match that primary identity.
    Four KOMODO owners declare 144 or variants but copy 144b chemistry. Current 144
    instead has MgCl2·6H2O 0.4 rather than 0.1 g, K2HPO4 1.5 rather than 0.4 g, KH2PO4,
    a 9 ml NTA trace stock, a separate acidified iron stock and 100% N2; 144b uses
    10 ml EDTA stock, carbonate 2 g and 80/20 gas. DSM 12299 explicitly omits glucose;
    DSM 7040 and the named replacement variant remain unresolved. Copied fingerprints
    and SOURCE_DUPLICATE proposals are not independent equivalence evidence.
  target_ids:
