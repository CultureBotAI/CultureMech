limitations:
- Exact current KOMODO MediaList endpoint returnedHTTP 403; its original identity
  cross-reference is corroborated only by a pinned historical report and current local
  lineage, not fresh remote catalog text.
- API g_l fields are reported values at their own source solution scope. PDF input-water
  volumes do not independently prove final mixed volume; no new final-medium dilution,
  density, molarity or ambiguous-percent conversion was asserted.
- No externally verified replacement sodium-resazurin salt identifier was found in
  the bounded search; no absence outside that search is claimed. Packaged peptone
  MICRO identity was observed but not externally validated as a proposed new term.
- Four canonical checks cover the generated record only. Maintained owners were fully
  read as context; deterministic validation does not prove scientific accuracy. Embedded
  histories were assessed manually; full-corpus ID/product/merge gates were not rerun
  for a review-only addition.
- Primary PDF was inspected via complete extracted text and API cross-check, with
  no experimental validation or organism-growth review.
- The generic source name Calcium pantothenate does not independently establish the
  D stereochemistry encoded by CHEBI:31345 InChI/SMILES and synonyms. Retain this
  as unverified supplied-form specificity; the generic label is not itself declared
  wrong and no replacement is proposed.
notes:
- All source inputs remain unchanged. Native inspection provenance is retained exactly;
  public source captures and full check streams reside in durable private work storage.
- Six historical ad hoc reports are evidence context, not validated structured review
  coverage or previous_occurrences. No historical finding is silently closed.
- Ignored-inclusive ownership discovery covered exact IDs/names within normalized
  records and reports. Source-only solvent quantities are retained as preparation
  evidence; missing optional water chemical edges alone are not a defect.
