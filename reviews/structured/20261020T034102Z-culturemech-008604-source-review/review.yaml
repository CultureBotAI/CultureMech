  details: 'ingredients[0]: correct. Distilled water stored 250 G_PER_L; NBRC and
    TOGO specify 250 mL per batch. No density-based mass conversion is supported.

    ingredients[1]: correct. Artificial seawater stored 750 G_PER_L; sources specify
    750 mL. Its unspecified composition/density further precludes mass conversion.

    ingredients[2]: source batch mass verified, concentration basis qualified. Optional
    agar is 15 g in both sources; target 15 G_PER_L is nominal on the sum of added
    liquid volumes, not source-stated final volume. Preserve optionality.

    ingredients[3]: source batch mass verified, concentration basis qualified. Commercial
    Marine Broth 2216 is 3.74 g in both sources; target 3.74 G_PER_L has the same
    nominal-batch caveat. Do not expand or further dilute it from the 1/10 name.

    250 mL + 750 mL = 1000 mL of liquid additions, not proof of an exactly 1000 mL
    finished batch. No stock-concentration or constituent chemistry can be inferred
    for artificial seawater.'
