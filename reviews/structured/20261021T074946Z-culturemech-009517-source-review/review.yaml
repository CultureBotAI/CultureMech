  sulfate heptahydrate row as 50 g/L, a 1000-fold excess relative to the provider
  concentration. Water volume is also misrepresented, and the unadjusted pH and JCM
  sterilization default are missing. Seven other solute quantities and all asserted
  chemical labels are supported.
