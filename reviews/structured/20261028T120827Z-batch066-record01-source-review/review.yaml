summary: The exact DSM1599 primary and current provider response agree on the source
  recipe, existing pH and staged main preparation. Both local layers flatten twelve
  stock components into the main ingredient list and omit stock receiving doses and
  solvent context. Sodium resazurin and nickel chloride hexahydrate are linked to
  different supplied forms. The source itself prints NaCO3; that ambiguity is retained
  rather than silently corrected. No recipe was changed.
