- finding_id: f1
  issue_key: culturemech.001316.distinct-bhi-formulations
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: Separate incompatible formulations among the 33 BHI contributors
  description: The target declares DSM 215b but combines basal 215, erythromycin 215a,
    strict anaerobe 215c, strain variants, J72 salt, NBRC optional agar and multiple
    branded agar/broth products. Their ingredients, physical states and preparation
    are not interchangeable. Complete ownership proof establishes provenance only;
    this identity ambiguity prevents using the generated target as the common recipe.
