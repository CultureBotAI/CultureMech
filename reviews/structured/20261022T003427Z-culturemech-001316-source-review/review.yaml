- assessment_id: grounding
  area: grounding
  topic: Canonical metadata versus source-specific products and chemical forms
  outcome: concern
  summary: All asserted OLS IDs resolve to nonobsolete exact labels; current secondary
    CHEBI keys have exact preferred MIM rows. Provider compound IDs 186/54/4/770 are
    treated separately, with current API access unavailable rather than invalid. UBERON
    brain/heart do not encode calf/beef source, infusion processing or tissue-equivalent
    masses. CHEBI 91248 explicitly covers the monohydrate and 76209 the sulfide nonahydrate;
    preserve those repaired forms. Generic glucose does not establish a wrong isomer,
    and neither valid glucose/phosphate/peptone IDs nor supplier labels authenticate
    the generic BHI expansion. Vitamin K1/haemin are consistent at name level; stock
    basis remains separate.
