    and pH", "local_fields": [{"record_path": "data/merge_yaml/merged/CALDICELLULOSIRUPTOR_MEDIUM.yaml",
    "field_path": "preparation_steps[0].description", "original": "Dissolve ingredients
    except cysteine and cellobiose. Sparge medium with 100% N2 gas for 30 - 45 min
    to make it anoxic, then add cysteine and adjust pH to 7.2. Distribute medium under
    same gas atmosphere into anoxic Hungate-type tubes or serum vials and autoclave.
