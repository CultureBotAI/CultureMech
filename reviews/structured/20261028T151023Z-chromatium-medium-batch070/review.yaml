limitations:
- Current ATCC 37 supplies no named-strain growth experiment, complete upper assembly
  schedule, sterilization duration or incubation condition. TOGO-only assembly claims
  remain separately qualified.
- Within the selected ATCC recipe, the only explicit final volume is 3.6 L for modified
  Hogland stock. The separate standalone 6241 source also explicitly makes its own
  stock up to 100 ml; that does not transfer to this recipient. No listed water, source
  metadata volume or sum of liquid additions is promoted to a measured final-medium
  volume.
- Generic thiamin, pantothenic acid and vitamin B12 source names do not justify forcing
  different salt, stereochemical or cobalamin forms. Unmapped EDTA, pyridoxamine HCl
  and sodium selenite remain unresolved rather than guessed.
- All three primary PDF pages were visually read, including the final mixing sentence
  on page 3. Locators count physical LF and do not count form-feed characters as extra
  lines.
- All six exact REST stock captures succeeded; the earlier /api/solution HTTP 404
  bodies remain preserved as failed leads. Current MIM snapshot 6643131b0f12ab40b66f98135245fca04027e0e9
  is not historical validity proof.
notes:
- Read-only scientific review. No source edits, native save, Git mutation or publication.
  All raw captures, failed access bodies, commands, times and original stdout/stderr
  remain in the adjacent private evidence directory.
