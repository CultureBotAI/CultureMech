  area: identity
  topic: ATCC 37, TOGO assembly and linked stock identities
  outcome: concern
  summary: 'The exact legacy ATCC URL returns the current three-page Chromatium recipe;
    TOGO M2555 identifies it but adds upper assembly amounts absent from the PDF.
    All six linked standalone stock identities differ from the printed ATCC stock
    at the linked stage: 5181 is oxoglutarate rather than sulfide; 6108 is FeNa/Na2-EDTA
    rather than calcium; 6109 is a trace mixture rather than Solution 2; 6110 is three
    vitamins rather than bicarbonate; 6105 is a different B12 preparation; 6241 is
    three vitamins rather than the printed six. Shared names do not support transfer.'
