    a recipe listing 1000 mL water. Nine SL10 stock constituents instead appear undiluted
    in every local ingredient list. DSM 12504 requires 1.0 g/L syringic acid in place
    of fructose; DSM 13105/19740 requires 2.5 g/L sodium thiosulfate pentahydrate
    and pH 7.4; DSM 13106/23801 requires 2.0 g/L D-glucose and pH 7.4. The respective
    owners retain fructose and broad pH ranges. The base normalized g/L values are
    numerically compatible with 1.002 L, but the listed liquid sum is not measured
    final volume and excludes unquantified later-stock additions.
