limitations:
- This is a focused citation and formulation-boundary assessment, not full record
  or corpus approval.
- Citation-note snippets were manually checked; automated reference resolution does
  not independently verify every note claim.
- Durot Table 4 mutant gene-essentiality counts are not quantitative growth rates
  or evidence of universal ADP1 growth.
- Source-printed trace formulas remain literal; original PDF typography and linked
  supplements were not inspected.
- Trautwein is abstract-only; failed retrieval endpoints and scope are retained in
  the source manifest.
- The existing KGX scope limitation remains unresolved; this batch adds no target
  organisms and performs no graph/page publication.
- Global merge failures are actual required-check failures, not silently ignored or
  repaired in this citation batch.
- The queue still contains 311 MediaDB candidate source-owner links and is not an
  exhaustive literature search.
- Two Shewanella full-text sources and eight unchanged owners were prepared separately;
  that handoff is not a completed scientific review.
