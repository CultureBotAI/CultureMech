- assessment_id: stocks
  area: representation
  topic: Named external stocks, stage-specific gases and empty compositions
  outcome: concern
  summary: All six local solution descriptors are named Unknown solution with empty
    compositions and mass-concentration units for source volume additions. The trace
    mineral and vitamin sources are exactly resolved. The mineral stock preparation
    must preserve nitrilotriacetic acid first, KOH adjustment to pH 6.5, then mineral
    addition and final pH 7.0; KOH remains unquantified. This is JCM 151 stock context
    only, excluding JCM 197 trace-mineral instructions. Their constituent stock batches
    must remain separate from the receiving medium; other parent-media ingredients
    are excluded. The two nitrogen labels refer to the same ontology ID but arise
    in different source stages and must be reconciled with those stages rather than
    numerically summed.
  target_ids:
  - CultureMech:007754
  evidence_ids:
  - record
  - owner-0
  - togo
  - jcm
  - jcm151
  - jcm197
  - stock-preparation
  - quantity-inventory
- assessment_id: preparation
  area: completeness
  topic: Preparation, base conditions and conditional source scope
  outcome: concern
  summary: Both local layers omit preparation_steps, sterilization and pH despite
    source comments that distinguish basal preparation, later stock additions and
    reducing additions. Base pH7.0 and the conditional JCM39191 pH7.5 statement have
    different scopes. Preserve the exact source gas/stage qualifications and collection
    default sterilization context without adding unreported incubation temperature
    or claiming an optimum.
  target_ids:
  - CultureMech:007754
  evidence_ids:
  - record
  - owner-0
  - togo
  - jcm
- assessment_id: organisms
  area: scope
  topic: Collection-strain comment and growth evidence
  outcome: concern
  summary: Local Microbial cultivation is generic. The exact source names JCM39191
    only in a conditional amendment; this is not a universal base recipe nor sufficient
    evidence for a new taxon-wide growth assertion. The conditional amendment is absent
    locally and should retain its exact strain scope. No organism or phenotype is
    inferred from linked stock parent names.
  target_ids:
  - CultureMech:007754
  evidence_ids:
  - record
  - owner-0
  - togo
  - jcm
- assessment_id: classification
