- assessment_id: forms
  area: grounding
  topic: Source hydrate identity and unasserted stock forms
  outcome: concern
  summary: The local/source sodium-acetate label explicitly states trihydrate, while
    CHEBI32954 synonyms and structure encode anhydrous sodium acetate. Both primary
    and secondary slots therefore fail exact supplied-form correspondence. Other asserted
    hydrate labels match their bound OLS identities; generic resazurin is not silently
    converted to its sodium salt. Source-only stock constituents are not assigned
    new IDs; variable hydration and unspecified stereochemistry remain unresolved.
