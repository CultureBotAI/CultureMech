- assessment_id: identity
  area: identity
  topic: Resolved local/provider identity with unavailable primary
  outcome: supported
  summary: The unique maintained CM010049 contributor is TOGO M648 and explicitly
    identifies JCM_M634. MediaDive J634 names the same medium and source URL. Exact
    primary content remains unavailable; matching provider identity does not authenticate
    a current JCM formulation or add a strain-specific growth claim.
  target_ids:
