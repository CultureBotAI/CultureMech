  - mediadiveJ634api
  - jcm634-attempt
- assessment_id: source-stage-consistency
  area: consistency
  topic: All local concentrations against bounded secondary evidence
  outcome: concern
  summary: All 28 local concentration instances are covered. Ten solute amounts agree
    numerically with the provider nominal 1 L basis but have no attached evidence.
    Water 1 L became 1 g/L, and resazurin 1 mg became 1 g/L instead of nominal 0.001
    g/L. Both gases are unquantified. Source-specific later cysteine/sulfide preparation
    and unknown stock doses are retained as distinct decisions; no measured final-volume
    claim follows from the provider declaration.
  target_ids:
  - CultureMech:010049
  evidence_ids:
  - record
  - owner-0
  - quantity-inventory
  - quantity-local-fields
  - togoM648
  - mediadiveJ634api
- assessment_id: forms
  area: grounding
  topic: Explicit hydrates and unresolved succinate specificity
  outcome: concern
  summary: The available provider forms support magnesium heptahydrate, calcium dihydrate,
    sulfide nonahydrate and L-cysteine hydrochloride monohydrate. Generic sodium succinate
    does not establish the anhydrous disodium salt specified by CHEBI:63675. The OLS
    label, formula and synonyms verify what the identifier means, not which material
    the unavailable primary intended. No alternative hydrate or molar conversion is
    proposed.
  target_ids:
  - CultureMech:010049
  evidence_ids:
  - record
  - owner-0
  - togoM648
  - mediadiveJ634api
  - chebi31795
  - chebi86158
  - chebi76209
  - chebi91248
  - chebi63675
- assessment_id: preparation
  area: completeness
  topic: Provider-supported anaerobic sequence is absent locally
  outcome: concern
  summary: Both providers describe withholding cysteine/sulfide, adjustment to pH
    7.2, boiling 5–10 seconds, cooling/dispensing under N2/CO2 80:20 v/v, butyl closure/autoclaving
    and separate 5% reducing-agent stocks autoclaved under N2 before anaerobic addition.
    Both local layers omit preparation and pH. Percentage basis, stock receiving volumes,
    titrant and numeric autoclave cycle remain unspecified.
  target_ids:
  - CultureMech:010049
  evidence_ids:
  - record
  - owner-0
  - togoM648
  - mediadiveJ634api
  - quantity-inventory
- assessment_id: classification
  area: scope
  topic: Complex liquid and biological claim boundaries
  outcome: supported
  summary: COMPLEX/UNDEFINED and LIQUID fit yeast extract and the provider liquid
    formulation. No organism strain, NCBI taxon, assembly, DOI or PMID is asserted.
    A species-like medium title is not an experimentally verified growth association.
  target_ids:
  - CultureMech:010049
  evidence_ids:
  - record
