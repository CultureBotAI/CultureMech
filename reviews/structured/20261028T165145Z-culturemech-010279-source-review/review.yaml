    Adjust pH to 9.0 with NaOH. Slowly add 9.6 ml of 20% TiCl3 to the chelator solution.
    Keep the pH above 2.0 by the addition of anaerobic saturated Na2CO3 solution.
    Adjust pH to 7.0 with Na2CO3 solution, adjust pH to 7.0 and bring the final volume
    to 500 ml with the anaerobic water. Filter-sterilize and keep the solution under
    a N2 gas atmosphere.\"\n    }","quote_basis":"raw UTF-8"}]},{"quantity_id":"q39","label":"Source
