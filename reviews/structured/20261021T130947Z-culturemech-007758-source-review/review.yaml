  copied numerically as g/L, plus 1 L water represented as 1 g/L. The current target
  and owner therefore do not faithfully represent the named formulation. The pH 10.0
  adjustment and collection sterilization default are absent; manganese hydration,
  current versus provider product qualifiers, and the high_metal assertion require
  bounded curation without invented doses or a replacement hydrate.
