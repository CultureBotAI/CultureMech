- assessment_id: preparation
  area: completeness
  topic: Source preparation, pH and staged atmospheres
  outcome: concern
  summary: Both local layers omit preparation and pH despite TOGO meta.ph 7.0 and
    the exact primary narrative. Source distinctions include initial nitrogen handling,
    a separate hydrogen/carbon-dioxide stage, separately autoclaved sulfide, filter-sterilized
    bicarbonate with its stated storage atmosphere, later addition, conditional readjustment
    to pH 7.0 and source vessel-pressure context. The vessel volumes are an example,
    not a universal batch or dilution denominator. The JCM default autoclave context
    is available. Trace-stock preparation starts NTA in 800 ml, adjusts pH with NaOH,
    adds minerals and makes up to 1 L. No parent JCM 301 cultivation procedure is
    transferred.
