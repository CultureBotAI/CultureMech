- assessment_id: sulfur
  area: grounding
  topic: ingredients[12] supplied substance versus atomic term
  outcome: concern
  summary: CHEBI:26833 resolves literally to sulfur atom with formula S; the source
    ingredient is bulk sulfur powder. The target omits that supplied-form qualifier,
    and its secondary key repeats the atomic identity.
  target_ids:
  - CultureMech:002907
  evidence_ids:
  - record
  - owner-0
  - jcm
  - api
  - chebi26833
  - mim
  - elemental-sulfur
  details: ID existence and label correspondence are positive but do not establish
    that an atomic entity identifies the source material. Preserve elemental-material
    and powder context; do not infer a particular crystalline form, allotrope, purity
    or replacement CHEBI from this source alone.
