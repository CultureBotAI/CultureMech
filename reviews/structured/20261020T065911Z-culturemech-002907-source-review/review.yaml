- assessment_id: preparation
  area: consistency
  topic: pH, gas-stage instructions and sulfide delivery
  outcome: supported
  summary: The complete recipe-specific preparation paragraph and pH match the source.
    Its explicit sterilization condition takes precedence over the collection page
    default.
  target_ids:
  - CultureMech:002907
  evidence_ids:
  - record
  - jcm
  - api
  - bacmedia
  details: 'The narrative retains initial versus later gas stages, vessel closure,
    pressure and the delayed sulfide-addition order. The single AUTOCLAVE action wraps
    a compound description but does not delete those instructions. The stated sulfide
    percentage has no explicit percentage basis or dose volume: preserve it as source
    text, do not calculate an asserted stock volume. LIQUID describes the medium presentation
    even though an insoluble powder is present; no clear-solution claim is made.'
- assessment_id: classification
  area: scope
  topic: Defined formulation and growth evidence
  outcome: supported
