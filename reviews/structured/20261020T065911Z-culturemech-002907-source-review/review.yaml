limitations:
- A schema/term pass does not establish chemical identity, correct source quantities,
  or growth. Reference-check coverage must be read from its actual output; direct
  source comparisons are separately documented.
- No record, curation history, merge output, or scientific status was changed. No
  new experiment or exhaustive literature review was performed. Full-corpus regeneration,
  ID/product/merge gates are acceptance checks for follow-up changes, not executed
  by this read-only single-record review.
- The historical secondary MIM key remains unresolved; a correct primary potassium-iodide
  CHEBI does not prove the retired key’s meaning.
- Provider volume supports reported main-recipe concentrations but is not an independently
  measured final volume. The percentage-solution basis is unspecified, so no addition
  volume is calculated from it.
- The bulk sulfur material is not assigned an unverified replacement allotrope or
  ontology ID. The atomic-term/form discrepancy is reported for curation.
