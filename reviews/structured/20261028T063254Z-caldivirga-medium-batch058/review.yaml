    "accessed_at": "2026-10-28T06:09:07.743537Z", "exact_source_quote": "{\n                        \"step\":
    \"Dissolve ingredients except sulfur, yeast extract, vitamins and sulfide, then
    adjust the pH to 3.5 with 4 N H2SO4. Sparge medium with 100% N2 gas for 30 - 45
    min to make it anoxic, then dispense under same gas atmosphere into anoxic Hungate-type
    tubes or serum vials which contain already the appropriate amount of sulfur, only
    to 30% of their volume to allow for a large headspace. Autoclave at <b>105\\u00b0C</b>
    for 20 min. Prior to inoculation add yeast extract, vitamins (sterilized by filtration)
    and sulfide from anoxic stock solutions prepared under 100% N2 gas atmosphere.
    The final pH of the complete medium should be around 4.0.\"\n                    }",
    "quote_representation": "raw JSON object"}, {"locator": "$.data.solutions[0].steps[0]",
    "source_key": "api991", "reference": "https://mediadive.dsmz.de/rest/medium/991",
