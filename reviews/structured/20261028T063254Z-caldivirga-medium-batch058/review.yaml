    "interpretation": "No fixed dose exists. DSM 883 specifies 4 N H2SO4 at initial
    pH 3.5, whereas DSM 991 specifies 10 N. These are distinct procedures; retain
    normality without inferring molarity, dose or direct-medium concentration.", "sources":
    [{"locator": "$.data.solutions[0].steps[0]", "source_key": "api883", "reference":
    "https://mediadive.dsmz.de/rest/medium/883", "source_raw_sha256": "42688e84a41a8468fbe753ff144cdf822aaf7495cf94192a99bed6245687f17d",
