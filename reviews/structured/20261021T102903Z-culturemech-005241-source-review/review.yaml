- assessment_id: forms
  area: grounding
  topic: Exact chemical-form scope and source-specific qualifiers
  outcome: supported
  summary: Captured asserted labels/IDs and pinned secondary keys resolve. Generic
    glucose and arginine are not forced into a stereoisomer. DL-tryptophan remains
    explicit in preferred_term while the generic ontology term does not establish
    a racemic ratio. CHEBI:91248 is the L hydrate supplied by the provider; the primary
    table itself does not specify L. Na-glutamate does not state a hydration grade;
    the monosodium-glutamate term must not be treated as verified product hydration
    or used for an unsupported mass/molar conversion. Complex peptones/extracts remain
    unassigned rather than receiving invented pure-compound IDs.
  target_ids:
  - CultureMech:005241
  evidence_ids:
  - primary
  - provider
  - chebi27897
  - chebi64220
  - chebi91248
  - mim
- assessment_id: preparation
