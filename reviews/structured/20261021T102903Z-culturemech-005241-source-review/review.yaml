    sentence. Target and KOMODO owner retain ph_range and the catalogue Aerobic: No
    note but omit that preparation context and water amount. Recover it with provider-specific
    citation; no autoclave temperature/time, gas percentage or additional procedural
    detail is supplied or inferred.'
  target_ids:
