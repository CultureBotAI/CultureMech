- assessment_id: identity
  area: identity
  topic: Single generated medium and maintained owner
  outcome: supported
  summary: The exact stable ID, one explicit merge contributor and DSMZ 1778a title
    resolve one ANB aerobic MediaRecipe. The source stocks printed from media 1478/1615
    are component recipes, not alternate identities or permission to transfer either
    parent basal medium.
  target_ids:
  - CultureMech:001235
  evidence_ids:
  - record
  - owner-0
  - id-search
  - primary
- assessment_id: stage-boundaries
  area: representation
  topic: Main and stock protocols
  outcome: concern
  summary: Main pH 10 and 121 °C for 20 min, main dispensing of 100 ml into 200 ml
    flasks and later example 20 ml into 100 ml flasks are supported. The root steps
    then append trace-stock pH 3–4, 121 °C for 15 min and closed-bottle handling,
    followed by vitamin filtration and 1:1:1:1 mixing. Without stock boundaries they
    read as changes to the main medium. The named sterile additions are omitted from
    the corresponding step.
  target_ids:
  - CultureMech:001235
  evidence_ids:
  - record
  - owner-0
  - primary
  - vitamin-ratio
- assessment_id: biological-scope
  area: scope
  topic: Growth and classification scope
  outcome: supported
  summary: The source title supports the aerobic ANB identity. Yeast extract supports
    a complex/undefined mixture classification, and the primary contains a liquid
    recipe with no solidifier. Bacterial filing and generic microbial-cultivation
    application are organizational metadata; no particular taxon, strain, growth outcome,
    incubation temperature, salinity phenotype or optimum is asserted or newly inferred.
    The source does not supply these claims.
  target_ids:
  - CultureMech:001235
  evidence_ids:
  - record
  - owner-0
  - primary
- assessment_id: source-evidence
  area: evidence
  topic: Claim-level evidence and retrieval limits
  outcome: concern
  summary: Both complete local layers lack claim-level concentration evidence and
    root references. This is a bounded field observation from the entire hash-bound
    target and owner; ignored-inclusive repository ID search distinguishes their layers,
    without claiming no evidence exists elsewhere. The complete primary can support
    scoped follow-up; historical reports are derivative and failed current API access
    does not authenticate the historical import.
  target_ids:
  - CultureMech:001235
  evidence_ids:
  - record
  - owner-0
  - primary
  - quantity-inventory
  - id-search
