- assessment_id: chemical-forms
  area: grounding
  topic: Supplied hydrate and chemical specificity
  outcome: concern
  summary: Source nickel chloride hexahydrate is mapped in both slots to CHEBI:34887,
    whose formula Cl2Ni and mass 129.599 omit six waters. The label metadata pass
    cannot repair that identity mismatch. Cobalt and copper explicitly use the source
    hexahydrate and pentahydrate forms, respectively. Calcium pantothenate in the
    source lacks stereochemical qualification while CHEBI:31345 encodes a specific
    structure; additional specificity needs evidence and is not proven false by unspecified
    wording. Generic thiamine is consistent with the named chemical entity, but no
    counterion or weighed salt is inferred.
  target_ids:
  - CultureMech:001235
  evidence_ids:
  - record
  - owner-0
  - primary
  - chebi34887
  - chebi31345
  - chebi18385
  - chebi53503
  - chebi91245
- assessment_id: generated-correspondence
  area: provenance
  topic: Maintained input versus generated merge
  outcome: concern
  summary: The maintained owner has melezitose CHEBI:6731 and an August 20 grounding
    event, while the generated target has no melezitose term and its merge event is
    August 6. Every corresponding amount is unchanged. This is observed metadata/history
    drift, not proof that the underlying formulation was repaired.
  target_ids:
  - CultureMech:001235
  evidence_ids:
  - record
  - owner-0
  - chebi6731
  - history-metadata
