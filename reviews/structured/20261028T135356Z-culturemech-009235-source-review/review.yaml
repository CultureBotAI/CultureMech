limitations:
- Current DSM991 and TOGO vitamin variants differ jointly in stock strength and receiving
  volume; nominal equivalent transferred vitamin masses do not prove an identical
  measured final-medium volume.
- No full supplier-grade identity, lot composition, unlisted stock strength or unreported
  addition volume is inferred.
- Initial misspelled TOGO API routes returned404 and are retained as failed leads;
  the exact gmid route succeeded later.
- CHEBI131366 formula annotation inconsistency remains unresolved; no mass-to-mole
  computation uses it.
- The referenced6241 record is reviewed only in term/composition/preparation scope;
  its generic placeholder ingredient and unrelated historical events are not source
  formulation evidence.
- No strain-growth claim, optimization or experimental recommendation is inferred
  from the medium name or general source identity.
- The MIM snapshot commit is 6643131b0f12ab40b66f98135245fca04027e0e9; present/absent
  rows do not establish a historical or live-catalog result.
- Input water is not measured final volume. Explicit provider g_l rates are assessed
  only on their declared normalization basis; unspecified percent bases and hydrate
  numbers remain unresolved.
- No source changes, formal review validation/save, Git mutation or publication was
  performed by this author.
