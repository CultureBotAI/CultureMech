- assessment_id: grounding
  area: grounding
  topic: Supplied forms and current ontology/MIM scope
  outcome: concern
  summary: All asserted chemical IDs resolve to current non-obsolete objects. Exact
    forms, hydrate counts and canonical labels are retained in the slot pool. Magnesium
    primary31795 is correct but secondary32599 is generic; cobalt53470 does not establish
    the current PDF heptahydrate. Calcium31345 includes D stereochemistry consistent
    with the explicit source, and broad lipoic16494 does not contradict the source
    DL wording. Borax131366 label agrees, but returned formula10H2O.H4B4O9.2Na differs
    from the printed Na2B4O7.10H2O representation; no molar conversion or silent wrong-ID
    conclusion is made. VitaminB12 is a broad class, without forced cyanocobalamin
    narrowing. Legacy membership and missing undefined-mixture IDs are not treated
    as historical invalidity.
