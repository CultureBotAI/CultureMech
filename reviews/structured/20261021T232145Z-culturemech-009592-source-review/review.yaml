    \ (VWR) until OD<sub>750</sub> = 1.5–2.0. The seed cultures were then used to\
    \ inoculate 25 mL experimental cultures to OD<sub>750</sub> = 0.1 in BioLite 25\
    \ cm<sup>2</sup> plug-sealed tissue culture flasks (Thermo Fisher Scientific).\
    \ The medium used for experimental cultures was BG11 with addition of 50 mM NaHCO<sub>3</sub>\
    \ (Sigma-Aldrich) and appropriate antibiotic(s) (final concentrations: chloramphenicol,\
    \ 10 μg mL<sup>−1</sup>; spectinomycin, 25 μg mL<sup>−1</sup>; erythromycin, 25 μg mL<sup>−1</sup>;\
    \ and kanamycin, 25 μg mL<sup>−1</sup>). All experimental cultures were prepared\
    \ in quadruplicates. The flasks were shaken horizontally at 120 rpm, under 50 μmol\
    \ photons m<sup>−2</sup> s<sup>−1</sup> at 30 °C. Two milliliters of culture were\
    \ sampled from each flask every second day for measurements and 2 mL of fresh\
    \ BG11 medium with addition of 500 mM NaHCO<sub>3</sub> (Sigma-Aldrich) and appropriate\
    \ antibiotic(s) were added back. The pH of experimental cultures was measured\
    \ with MColorpHast™ pH-indicator strips (pH 6.5–10) (Merck) and the cultures pH\
    \ were adjusted to the range between 7–8 using 37% HCl (Sigma-Aldrich).</p>\"\
