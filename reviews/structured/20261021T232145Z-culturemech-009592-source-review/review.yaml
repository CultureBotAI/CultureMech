- evidence_id: paper-Par63
  kind: primary_source
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC10492371/
  locator: 'Methods #Par63'
  accessed_at: '2026-10-21T22:56:39.972095Z'
  support: supports
  summary: Full literal HTML paragraph; seed cultivation and the distinct production/feed
    experiment are separately assessed.
  quote: '<p id="Par63">Seed cultures were grown under 30 μmol photons m<sup>−2</sup> s<sup>−1</sup>
    at 30 °C in BG11 with appropriate antibiotic(s) in 100 mL Erlenmeyer flasks (VWR)
    until OD<sub>750</sub> = 1.5–2.0. The seed cultures were then used to inoculate
    25 mL experimental cultures to OD<sub>750</sub> = 0.1 in BioLite 25 cm<sup>2</sup>
    plug-sealed tissue culture flasks (Thermo Fisher Scientific). The medium used
    for experimental cultures was BG11 with addition of 50 mM NaHCO<sub>3</sub> (Sigma-Aldrich)
    and appropriate antibiotic(s) (final concentrations: chloramphenicol, 10 μg mL<sup>−1</sup>;
    spectinomycin, 25 μg mL<sup>−1</sup>; erythromycin, 25 μg mL<sup>−1</sup>; and
    kanamycin, 25 μg mL<sup>−1</sup>). All experimental cultures were prepared in
    quadruplicates. The flasks were shaken horizontally at 120 rpm, under 50 μmol
    photons m<sup>−2</sup> s<sup>−1</sup> at 30 °C. Two milliliters of culture were
    sampled from each flask every second day for measurements and 2 mL of fresh BG11
    medium with addition of 500 mM NaHCO<sub>3</sub> (Sigma-Aldrich) and appropriate
    antibiotic(s) were added back. The pH of experimental cultures was measured with
    MColorpHast™ pH-indicator strips (pH 6.5–10) (Merck) and the cultures pH were
    adjusted to the range between 7–8 using 37% HCl (Sigma-Aldrich).</p>'
  snapshot_sha256: d3a388f7d9ced3289952d6d7ade39c95e5ccdf7cbe5eef0840a9caff308b2256
