  sodium-lactate variant and is stale relative to both September-repaired owners.
  Target water, resazurin and stock doses have wrong units and empty stocks; owners
  now retain nested compositions but assert undocumented per-liter normalization and
  unqualified-percent mass conversions. The JCM 403 DL-calcium pantothenate stock
  is linked to a D-specific structure, and two nested canonical labels differ from
  current OLS. Exact primary/TOGO formulations are available; the owners’ specific
  historical MediaDive normalization claim cannot be authenticated from the failed
  current API capture.
