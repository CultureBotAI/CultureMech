    hydrates. Sodium citrate does not independently prove the trisodium stoichiometry
    of CHEBI:53258; preserve that specificity limit. Ferric ammonium citrate is an
    indefinite mixture, not a fixed iron formulation. Explicit L-glutamic acid and
    dextrose support their respective L and D identities. Keep bovine albumin fraction
    V and beef catalase material qualifiers without forcing single-molecule identifiers.
    Valid tryptone/yeast/NaCl labels do not justify their presence.
