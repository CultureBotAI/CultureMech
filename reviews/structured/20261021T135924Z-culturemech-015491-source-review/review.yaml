- assessment_id: forms
  area: grounding
  topic: Exact supplied forms and annotation limits
  outcome: concern
  summary: All asserted primary labels resolve; hydrate names are retained rather
    than converted to anhydrous equivalents. Sodium D,L-Lactate is mapped to stereospecific
    sodium L-lactate CHEBI:232798, which is too narrow for the exact source name.
    The source compound CAS/FW annotation has a separate internal tension; no replacement
    is invented. The source calcium-pantothenate dictionary has both D and D,L synonyms
    and a hemicalcium-salt expression; its FW 238.27 is compatible with a half-formula
    convention while CHEBI:31345 gives the full 2C9H16NO5.Ca formula and mass 476.536.
    This does not justify doubling an amount or declaring the source FW erroneous.
    Exact product stereochemistry remains unverified. Lipoic-acid CAS 1077-28-7 differs
    from the captured OLS xref but absence of that xref alone does not prove an incorrect
    identity. Yeast extract is an unmapped mixture, and its source token 232-387-9
    is not in normal CAS-RN syntax; no replacement registry or pure chemical ID is
    guessed. Sodium phosphate dibasic heptahydrate is explicitly named and quantified
    but has no asserted primary ID; no wrong-existing-ID claim is made.
  target_ids:
