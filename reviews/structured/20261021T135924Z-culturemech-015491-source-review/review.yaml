    the original g/L and mg/L units retained. The current flattened ingredients are
    numerically complete; source stock definitions and receiving relationships need
    explicit traceability without double-counting. The description preserves pH 7.2
    but the structured ph_value slot is absent. The available exact FEBA blocks do
    not specify an operational mixing order, water/make-up volume, sterilization,
    incubation, storage, vessel, atmosphere or pH-adjustment reagent; none is invented.
