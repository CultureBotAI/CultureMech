limitations:
- Both complete primary PDF pages were read visually and as indexed text. Text line
  locators use Python splitlines, which counts the page form-feed boundary separately.
- Primary water is a solvent input, including for both stocks; the phrase final solution
  in the stock pH instruction is not a volumetric make-up instruction. Provider volume1011
  and stock volume1000 are explicitly cataloged normalization fields, not independent
  measured-final-volume proof.
- The source does not give strengths/volumes for every separately sterilized stock
  mentioned in prose, or fixed acid doses. None are reverse-engineered.
- CHEBI131366 authority formula inconsistency is explicitly unresolved despite canonical
  label agreement. The generic B12 and lipoic-acid IDs do not independently certify
  a particular commercial vitamer or racemate purity.
- Ignored-inclusive exact target/owner/report and current-writer searches define the
  provenance scope; no global literature absence claim is made.
- No strain-growth claim, optimization or experimental recommendation is inferred
  from the medium name or general source identity.
- The MIM snapshot commit is 6643131b0f12ab40b66f98135245fca04027e0e9; present/absent
  rows do not establish a historical or live-catalog result.
- Input water is not measured final volume. Explicit provider g_l rates are assessed
  only on their declared normalization basis; unspecified percent bases and hydrate
  numbers remain unresolved.
- No source changes, formal review validation/save, Git mutation or publication was
  performed by this author.
