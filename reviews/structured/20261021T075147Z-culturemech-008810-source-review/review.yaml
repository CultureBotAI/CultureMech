  concentrations are 1,000-fold larger than the provider values because ug/ml was
  relabelled G_PER_L. Water is also misrepresented as mass concentration. NaCl percent
  basis and the broth final-volume denominator are unsupported by the inspected source.
  Two verified chemical groundings exist in the maintained owner but not the generated
  target. The provider supplies ingredient roles, not organism-specific growth evidence.
  Completion is partial because the required upstream primary formulation provenance
  cannot be established from the source-less TOGO response.
