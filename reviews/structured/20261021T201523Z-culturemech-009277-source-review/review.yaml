  and two later anaerobic additions. Both local layers flatten the stock, store resazurin
  milligrams and the stock millilitre dose as g/L, and impose unsupported percent
  bases. Generated water differs from its owner. The linked local 3952 composition
  is incomplete and differs from the printed stock; its historical raw response is
  unavailable, so exact remote correspondence remains unresolved and the review is
  partial.
