summary: TOGO M2350 identifies DSMZ 756b, but the target collapses main medium and
  two stock recipes, corrupts water and stock units, and links two unrelated MediaDive
  stocks. It also assigns orthomolybdate to source heptamolybdate, loses a hydrate
  in a MIM link, omits pH 8.6, and carries an unsupported high-metal annotation. Correct
  the maintained TOGO input and regenerate.
