- assessment_id: classification
  area: consistency
  topic: Liquid and defined classifications by source
  outcome: concern
  summary: The generic DSM 383b basal formulation supports liquid/defined classification.
    Several explicitly named source variants add complex substrates such as trypticase,
    yeast extract or Casamino acids; their chemically identical local copies and inherited
    DEFINED labels cannot certify those variants. Resolve identity before assigning
    variant classification. Local aerobic notes are retained as unresolved source
    assertions rather than treated as cultivation support.
