    lines 25-42","quote":"For DSM 2056: Replace pyruvate with 0.70 g/l Na-butyrate,
    0.30 g/l Na-caproate, and 0.15\ng/l sodium octanoate.\nFor DSM 3384: The vitamin
    solution of medium 120 is replaced with 1.0 ml/l of seven\nvitamins solution of
    medium 503. Replace pyruvate with 0.4 g/l Na-benzoate and add,\nafter autoclaving,
    1.0 g/l yeast extract from a sterile anoxic stock solution as a growth\nsupplement.
    Initiation of growth requires the addition of freshly prepared sodium\ndithionite.\nFor
    DSM 4661: Replace pyruvate with resorcinol. During growth, the culture is fed
    once\nwith the same amount of resorcinol.\nFor DSM 5091, DSM 9788: Replace pyruvate
    with 2.00 g/l malonic acid.\nFor DSM 7044, DSM 7120, DSM 7467, DSM 12567, DSM
    13228, DSM 23484: Supplement\nmedium with 1.00 ml/l seven vitamins solution (see
    medium 503). Replace pyruvate with\n0.40 g/l benzoate and 0.10 g/l yeast extract
    sterilized separately by filtration and add to\nthe autoclaved medium from anoxic
