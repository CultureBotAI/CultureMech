- Historical canonical exits/order come from the recovery RESULT.md, with original
  logs retained. Fresh parent-run checks now have separate exact argv/time/exit/stream
  receipts; the author ran no validators.
- Configured term checks do not establish exact chemical form, and reference checks
  examined zero evidence assertions.
- DSM383a provider main volume1000mL agrees with its assembly sum; its PDF does not
  independently print a final-volume statement. DSM383 PDF explicitly states1003mL.
