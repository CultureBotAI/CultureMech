- No alternative sodium-resazurin salt ID was audited; no density, HCl percent convention,
  B12 vitamer or DL stereochemical proof was invented.
- high_metal remains unestablished until a correctly staged final composition is available;
  no substitute boolean or total is asserted.
- No recipe edits, generator reruns, corpus checks, structured-review validation,
  saver, Git mutation or publication were performed by this author helper. The parent
  owns subsequent independent review and persistence.
