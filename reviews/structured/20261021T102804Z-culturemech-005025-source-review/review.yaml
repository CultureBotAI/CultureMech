- assessment_id: evidence
  area: evidence
  topic: Claim-level source support and actual reference-check coverage
  outcome: concern
  summary: Neither target nor owner carries claim-level amount evidence; the original
    reference diagnostic checks zero evidence references. Exact source support was
    assessed separately, with original capture hashes/times and linked-stock boundaries
    preserved. Attach evidence during separately authorized curation; a source URL
    in provenance alone is insufficient.
  target_ids:
  - CultureMech:005025
  evidence_ids:
  - record
  - owner-0
  - validate-references
  - source-catalog
- assessment_id: organisms
  area: scope
  topic: Bounded biological claims and optional entities
  outcome: not_applicable
  summary: No target organisms, taxon/strain IDs, assemblies, DOI/PMID papers, growth
    outcomes or KG matches occur in either whole record. Source medium names and catalog
    Aerobic metadata do not establish organism-specific growth; no such claims are
    added.
  target_ids:
  - CultureMech:005025
  evidence_ids:
  - record
  - owner-0
findings:
- finding_id: f1
  issue_key: cm005025-flattened-stocks
  category: quantity
  severity: blocker
  status: open
  certainty: confirmed
  title: Undiluted stock recipes replace the named medium formulation
  description: The two local 32-row formulae use trace and vitamin stock strengths
    directly, without their 10 and 5 mL doses. NTA 12.8 g/L is a trace-stock concentration,
    while vitamins such as biotin 0.002 g/L are stock concentrations. Calcium 0.23
    g/L records 0.13 + 0.1 from different stages; source-dose arithmetic gives 0.13
    g + (0.1 g/L × 0.010 L) = 0.131 g before any final-volume division. This is a
    different formulation, despite passing deterministic checks.
  target_ids:
  - CultureMech:005025
  field_paths:
  - ingredients
  - ingredients[0].concentration
  - solutions
  evidence_ids:
  - record
  - owner-0
  - dsmz331
  - dsmz144
  - dsmz141
  - mediadive331api
  - importer
  - cleanup
  owner_paths:
  - repository: CultureBotAI/CultureMech
    path: data/normalized_yaml/bacterial/KOMODO_331_ACETOBACTEROIDES_GLYCINOPHILUS_medium.yaml
    role: authoritative normalized source
  - repository: CultureBotAI/CultureMech
    path: src/culturemech/merge/merge_recipes.py
    role: derived record generator
  rule_id: P1
  native_severity: P1
  normalization_reason: 'Native P1 scientific formulation blocker: undiluted stock
    compositions and a cross-stage sum make the encoded recipe denote a different
    formulation. This is not a schema P1.1 failure.'
- finding_id: f2
  issue_key: cm005025-nickel-hydrate
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Nickel chloride hexahydrate maps to the anhydrous term
  description: The preferred name and exact trace source specify NiCl2 x 6 H2O, but
    primary and secondary terms are CHEBI:34887, whose captured formula is Cl2Ni.
    Canonical label agreement and a current MIM row cannot validate this supplied-form
    mismatch.
  target_ids:
  - CultureMech:005025
  field_paths:
  - ingredients[18].term
  - ingredients[18].mediaingredientmech_chebi_term
  evidence_ids:
