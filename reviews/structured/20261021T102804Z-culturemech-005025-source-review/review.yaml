    role: authoritative normalized source
  - repository: CultureBotAI/CultureMech
    path: src/culturemech/merge/merge_recipes.py
    role: derived record generator
  rule_id: P2
  native_severity: P2
  normalization_reason: P2 normalized to major based on the specific formulation,
    identity or representation impact described here; deterministic passing checks
    do not negate it.
- finding_id: f3
  issue_key: cm005025-preparation-scope
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: Source-specific anaerobic and separate sterilization steps are missing
  description: Both complete local records lack the explicit nitrogen handling and
    separate autoclaving instructions, even though pH and NaOH were extracted. Stock
    preparation boundaries are also absent. The catalog Aerobic flag does not replace
    the source procedure. These omissions materially change reproducibility of the
    named recipe.
