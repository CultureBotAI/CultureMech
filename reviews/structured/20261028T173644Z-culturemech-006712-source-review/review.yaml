  area: grounding
  topic: Supplied forms and current ontology/MIM scope
  outcome: concern
  summary: Every asserted primary/secondary ontology slot and current MIM membership
    was checked against exact captured OLS objects. Nickel hydration and sodium-resazurin
    salt state are confirmed mismatches. Sodium lactate CHEBI:75228 is nonstereospecific
    and compatible with the DL source; magnesium sulfate heptahydrate and the other
    named hydrates/hydrochlorides remain compatible. Generic B12 is not narrowed to
    cyanocobalamin. Source calcium pantothenate does not state D stereochemistry,
    so the specificity of CHEBI:31345 remains unverified rather than silently endorsed.
    MIM mappings alone cannot settle supplied-form identity.
