limitations:
- Current exact KOMODO catalogue and accession GETs returned 403, so completion remains
  partial despite the available DSM primary and provider.
- The primary explicitly states final main volume and SL-10 final makeup, but not
  final vitamin-stock volume; the latter provider g_l is a declared provider basis.
- The primary 7.7 M HCl descriptor is not independently reconciled with provider 2.5
  g_l. The 25% basis is not invented.
- The primary supplies no sterilization temperature or duration; provider Autoclave
  equipment metadata is not a complete sterilization protocol.
- The generic genus identity does not establish any strain cultivation result.
- No strain-growth claim, optimization or experimental recommendation is inferred
  from the medium name or general source identity.
- The MIM snapshot commit is 6643131b0f12ab40b66f98135245fca04027e0e9; present/absent
  rows do not establish a historical or live-catalog result.
- Input water is not measured final volume. Explicit provider g_l rates are assessed
  only on their declared normalization basis; unspecified percent bases and hydrate
  numbers remain unresolved.
- No source changes, formal review validation/save, Git mutation or publication was
  performed by this author.
