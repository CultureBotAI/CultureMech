  acceptance_checks:
  - Every parent amount correction has DOI/PURL, exact snippet, chemical form and
    final/stock basis.
  - Resolve source-form and stereochemistry ambiguity without inventing structures
    or stoichiometry.
  - Preserve IDs, scoped growth and prior history; run native checks.
- action_id: scope-preserving-publication
  description: Before publication, verify a scope-preserving exporter or an explicitly
    curated full child-record representation.
  finding_ids:
  - export-scope
  target_ids:
  - CultureMech:007386
  - CultureMech:007388
  - CultureMech:007389
