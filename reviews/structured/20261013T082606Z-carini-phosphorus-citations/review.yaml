    path: src/culturemech/export/kgx_export.py
    role: growth-edge exporter
  acceptance_checks:
  - A variant-only growth association cannot become a parent-medium growth edge.
  - Regression tests cover variant, parent and parent-rank-only taxonomy cases.
  - No affected edge is published before scope preservation is verified.
limitations:
- Focused citation/variant review, not full recipe or corpus approval. Parent concentrations
  remain uncertified.
- Methionine and several phosphorus-substrate stereochemistries are unspecified; phosphite
  salt formula is retained as printed. No unsupported mass conversions.
- Figure 1 glucose label conflicts with concordant Methods/Results/Figure 2 wording;
  the conflict remains documented.
- The HMP paper qualifies its own HTCC1062 thiamin-stock interpretation; no HMP requirement
  or contaminant dose is inferred for these HTCC7211 assays.
- Supplement gene-expression values were not curated, and numerical growth metrics
  were not digitized or transferred from other experiments.
- Initial network and metadata-only reference failures are retained; post-cached checks
  use direct primary HTML, not synthetic evidence.
- Current KGX cannot honor inline variant scope, so no graph export, generated-page
  publication or GitHub mutations were performed.
- All started command receipts are terminal when this review is authored. Global merge
  failures are not disguised as record validation passes.
- The 325 remaining MediaDB source-owner candidate links are only one unfinished discovery
  queue; citation exhaustion remains unproven.
- Next-source Durot full text, Trautwein abstract-only XML and ADP1 taxonomy were
  archived separately. Their 14 owners were frozen and baseline-checked without adding
  citations or claiming a scientific review.
