- assessment_id: variant-007386
  area: quantity
  topic: Assay formulation and parent preservation
  outcome: supported
  target_ids:
  - CultureMech:007386
  evidence_ids:
  - main-paper
  - main-pdf
  - base-paper
  - readback
  summary: 'Carini 2014 AMS1 phosphite utilization assay: supported differences are
    explicit, with amount snippets and final basis. Different microarray/methane doses
    are not mixed into this assay.'
  details: 'Relative to this imported parent: pyruvate 100 micromolar (parent 1 millimolar);
    glycine 5 micromolar (parent 50 micromolar); methionine 5 micromolar (parent DL-methionine
    50 micromolar). The paper does not resolve methionine stereochemistry. | FeCl3
    1 micromolar (parent 117 nanomolar). The AMS1 base source specifies FeCl3.6H2O,
    but its 117 nanomolar dose is overridden by the main assay. | Full vitamin mixture:
    B1 6 micromolar, B3 800 nanomolar, B5 425 nanomolar, B6 500 nanomolar, B7 4 nanomolar,
    B9 4 nanomolar, B12 700 picomolar, myo-inositol 6 micromolar, 4-aminobenzoate
    60 nanomolar. Parent contains only biotin 4 nanomolar and thiamine 60 micromolar.
    | AMS1 Table 1 base uses MgSO4.7H2O at 2.8 millimolar, not parent magnesium sulfate
    28 millimolar. Source hydrate forms also specify CaCl2.2H2O, MnCl2.4H2O, ZnSO4.7H2O,
    CoCl2.6H2O, Na2MoO4.2H2O and NiCl2.6H2O; corresponding parent forms are anhydrous
    or unspecified. Retain Table 1 molar doses for these unchanged-dose salts, without
    mass conversion. | No phosphate is added to the alternate-P assay base; omit the
    phosphate of original AMS1 Table 1. This is not a claim of zero residual phosphate:
    the Figure 2 inoculum was previously grown on phosphate. | Added phosphite: 1.0
    micromolar final, numerically equal to the parent''s 0.001 millimolar. This supports
    the assay, not the complete parent recipe. Phosphite salt is printed as NaPHO3.5H2O;
    preserve this literal source formula without assigning a corrected stoichiometry
    or converting to mass. | Base preparation follows Carini 2013 Media preparation
    (inorganic AMS1 autoclaved, then carbon-dioxide and air sparging; vitamins and
    organics added afterward), rather than the parent''s generic dissolve-all/filter-all
    steps. Reported base pH 7.5-7.7 is not an optimum or a separate measurement of
    every 2014 assay.'
  dimensions:
  - name: concentration_decision
    value: evidence_only for study-variant amounts; parent values retained
    definition: Variant evidence does not recertify the complete parent recipe
    evidence_ids:
    - main-paper
    - base-paper
    - readback
  metrics:
  - name: unchanged parent ingredient instances
    value: 20
    unit: instances
    denominator: 20
    minimum: 0
    maximum: 20
    definition: Preservation count, not a scientifically verified concentration count
