- finding_id: f1
  issue_key: culturemech-007435-reconcile-source-hydrates-and-supplied-molecular-forms
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Reconcile source hydrates and supplied molecular forms
  description: The primary specifies MgSO4 heptahydrate, MnSO4 tetrahydrate, FeSO4
    heptahydrate, Na2MoO4 dihydrate and ZnSO4 heptahydrate. Current terms instead
    denote anhydrous salts or manganese monohydrate. p-Aminobenzoic acid is represented
    by the 4-aminobenzoate anion. Retain supported nominal molecular contributions
    separately from form correction, and do not infer cysteine hydrate/stereochemistry
    or D-glucose stereochemistry from rounded amounts. Verify any replacement identifiers
    before applying them.
  target_ids:
