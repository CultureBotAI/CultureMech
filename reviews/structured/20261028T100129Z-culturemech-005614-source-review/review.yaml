limitations:
- This scientific review is partial because the exact KOMODO489 MediaInfo route and
  MediaList were unavailable (HTTP403). Historical catalog-row correspondence remains
  derivative; the complete original catalog is not recovered. Exact preserved API489
  raw bytes and current maintained-owner repair preimages authenticate only their
  stated claims, not the unavailable KOMODO page or an independent current branch
  formulation.
- The standalone solution995 record and its follow-up report are excluded from this
  selected-record review; the initial broad private reader is retained but the scoped
  four-report successor alone supports the added history assessment.
- The one-page DSM489 PDF was read in full and visually checked. Its copyright is
  not an asserted publication year, and unknown individual authors are not invented.
- Neither source provides a measured final volume. The repaired reducing stocks intentionally
  retain unknown strength, solvent, stock volume and dose volume. No neighboring-medium
  values are substituted.
- 'The stock-node sodium-resazurin form issue is independent of quantity correctness:
  the repaired 0.1% w/v strength and 0.0005 L batch dose are supported and retained.'
- No strain-growth claim, optimization or experimental recommendation is inferred
  from the medium name or general source identity.
- The MIM snapshot commit is 6643131b0f12ab40b66f98135245fca04027e0e9; present/absent
  rows do not establish a historical or live-catalog result.
- Input water is not measured final volume. Explicit provider g_l rates are assessed
  only on their declared normalization basis; unspecified percent bases and hydrate
  numbers remain unresolved.
- No source changes, formal review validation/save, Git mutation or publication was
  performed by this author.
