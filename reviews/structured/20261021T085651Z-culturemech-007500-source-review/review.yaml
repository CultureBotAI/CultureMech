  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: Both layers overstate a chemically defined formulation
  description: The exact NBRC 868 recipe contains Bacto Marine Broth 2216 and permits
    filtered aged seawater or a named artificial seawater preparation. Neither target
    nor owner enumerates a chemically defined formula for those mixtures, yet both
    set medium_type and composition_type to DEFINED. This overstates composition knowledge
    and can propagate into exported medium-type semantics. The issue is medium classification,
    not P2.4 organism-folder mismatch.
