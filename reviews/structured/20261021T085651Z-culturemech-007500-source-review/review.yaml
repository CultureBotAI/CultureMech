  summary: Source pH 7.6 is present in the owner but missing from structured target
    fields. The source permits optional agar and alternative seawater preparations;
    it does not require all preparations to be solid. The owner has an empty preparation
    list rather than asserting an unsupported method. The target retains generic dissolve/adjust-pH/autoclaving
