- assessment_id: classification
  area: scope
  topic: Classification and bounded biological claims
  outcome: concern
  summary: DEFINED in both medium_type and composition_type is unsupported by the
    exact recipe. The source uses a commercial broth and permits natural seawater,
    without enumerating a complete chemically defined component set. The owner preserves
    Agar (if needed), yet both layers assert SOLID_AGAR without documenting selection
    of that optional branch. The conditional source solidification must remain explicit.
    Its agar material is also a complex polysaccharide mixture. The alternative artificial
    seawater choice does not establish that every preparation is chemically defined.
    Bacterial catalogue filing is not contradicted. Neither target nor owner asserts
    organisms, strains, taxon IDs, assemblies, DOI/PMID papers, growth outcomes, parent
    media or variants. Source catalogue scope is not experimental growth evidence.
    Optional omissions are not populated with invented organisms.
  target_ids:
  - CultureMech:007500
  evidence_ids:
  - record
  - owner-0
  - nbrc868
  - nbrc869
  - exporter
