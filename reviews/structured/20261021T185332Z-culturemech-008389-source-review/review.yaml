- A schema/term pass does not establish chemical identity, correct source quantities,
  or growth. Reference-check coverage must be read from its actual output; direct
  source comparisons are separately documented.
- No record, curation history, merge output, or scientific status was changed. No
  new experiment or exhaustive literature review was performed. Full-corpus regeneration,
  ID/product/merge gates are acceptance checks for follow-up changes, not executed
  by this read-only single-record review.
- Both current solution 6129 requests returned HTTP 503; its five attached historical
  amount snippets match derivative local reports, but the cited raw response remains
  unrecovered. This limits historical authentication of that standalone stock, not
  the complete NBRC 1050 current recipe or the demonstrated local stock mismatch.
