summary: The exact NBRC 1050 / TOGO M1818 formulation is available. Both local layers
  flatten separate trace and vitamin stocks into the main recipe, misstate milligram
  amounts and water as G_PER_L, and link different MediaDive stock formulations. The
  maintained owner water changed from 3 to 1 but remains a mass-rate misrepresentation.
  Valid CHEBI labels do not resolve the cobalt/nickel hydrates or calcium-pantothenate
  mismatch; the current MIM lookup for CHEBI:29032 is a completed negative result,
  not unavailable evidence.
