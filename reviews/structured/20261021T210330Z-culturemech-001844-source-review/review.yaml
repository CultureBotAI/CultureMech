  area: grounding
  topic: Source hydrates, commercial qualifiers and coenzyme M
  outcome: concern
  summary: 'CHEBI:131527 has an anhydrous HO4P.2K formula/structure despite a trihydrate
    synonym; source K2HPO4·3H2O therefore needs explicit hydrate representation. CHEBI:34887
    Cl2Ni does not encode source NiCl2·6H2O. Other printed hydrates agree with their
    asserted canonical forms. Coenzyme M has an exact 2-Mercaptoethanesulfonate synonym:
    no unsupported sodium-salt correction is proposed. Generic acetate/lactate and
    Aldrich F6129 ferric citrate do not establish unprinted hydration, purity or stereochemistry.
    Preserve OXOID and BD BBL qualifiers.'
