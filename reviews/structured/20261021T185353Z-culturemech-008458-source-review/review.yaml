- assessment_id: forms
  area: grounding
  topic: Hydrates, borax structural inconsistency and mixtures
  outcome: concern
  summary: The specified Mg, Ca, Mn, Zn, Cu, Fe, Co and sodium molybdate/sulfide hydrates
    match the asserted ontology forms. VOSO4·xH2O remains a variable hydrate without
    a supported molar conversion. CHEBI:131366 has the matching borax label and CAS
    synonym, but its exact bound formula 10H2O.H4B4O9.2Na and mass 417.401 do not
    agree with the source-printed Na2B4O7·10H2O stoichiometry. Preserve that ontology/source
    inconsistency rather than silently adopting its mass or inventing a replacement
    ID. Elemental sulfur is broadly grounded without an allotrope claim; the Bacto/Difco
    yeast extract remains an undefined commercial mixture.
  target_ids:
