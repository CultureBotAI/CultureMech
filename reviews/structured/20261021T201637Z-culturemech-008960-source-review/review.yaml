summary: ATCC 1682 specifies a saline agar base with 990 mL water and a 10 mL addition
  of a separately prepared three-vitamin stock. Both local layers flatten stock amounts,
  merge water numerals into 991 g/L and encode the stock dose as 10 g/L. The linked
  stock6241 has a different vitamin ratio, a million-fold local biotin error and an
  invalid water percentage. Primary preparation is available; ingredient form and
  source-stage repairs are needed.
