  - importer
- assessment_id: classification
  area: scope
  topic: Classification and bounded biological claims
  outcome: concern
  summary: COMPLEX/UNDEFINED is consistent with Hipolypepton and yeast extract. The
    owner preserves Agar (if needed), but both layers assert SOLID_AGAR without documenting
    that the optional agar branch was selected. A solid preparation is source-supported
    only when agar is used; the record must explicitly qualify its selected branch
    rather than imply that all preparations are solid. Neither target nor owner asserts
    organisms, strains, taxon IDs, assemblies, DOI/PMID papers, growth outcomes, parent
    media or variants. Source catalogue scope is not experimental growth evidence.
    Optional omissions are not populated with invented organisms.
