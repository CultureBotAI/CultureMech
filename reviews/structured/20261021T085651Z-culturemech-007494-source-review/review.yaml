- assessment_id: forms
  area: grounding
  topic: Source ingredient identities, mixtures and exact chemical forms
  outcome: supported
  summary: The five primary CHEBI IDs identify generic glucose, lactose, polysorbate
    80, water and agar, with the three stated label differences handled separately.
    OLS identifies Tween 80 as a polysorbate 80 synonym. The source does not specify
    glucose stereochemistry or a lactose hydrate; neither is added. Yeast extract
    remains a FoodOn mixture. Source MgSO4·7H2O is preserved without an asserted ontology
    ID, and no anhydrous substitution or molar conversion is proposed.
  target_ids:
