limitations:
- The source lists 1 L distilled water with ingredient masses; it does not specify
  a measured final volume after dissolution. Owner g/L quantities are assessed on
  the nominal source recipe basis, not as experimentally verified final concentrations.
- Agar is explicitly optional. The solid branch is supported, while omission gives
  a liquid alternative; no new variant record was inferred or created.
- Hipolypepton remains a named Wako complex ingredient. Its detailed chemical composition
  and an exact ontology replacement for unmapped magnesium sulfate heptahydrate were
  not invented.
- The exact NBRC 803 page provides pH and supplier information but no detailed sterilization,
  incubation or storage protocol. NBRC 804 is only an identity countercheck.
- A schema/term pass does not establish chemical identity, correct source quantities,
  or growth. Reference-check coverage must be read from its actual output; direct
  source comparisons are separately documented.
- No record, curation history, merge output, or scientific status was changed. No
  new experiment or exhaustive literature review was performed. Full-corpus regeneration,
  ID/product/merge gates are acceptance checks for follow-up changes, not executed
  by this read-only single-record review.
