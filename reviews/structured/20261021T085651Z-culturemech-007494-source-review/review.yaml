- assessment_id: conditions
  area: consistency
  topic: Preparation, pH and physical-state conditions
  outcome: concern
  summary: Source pH 6.5–6.8 is present in the owner but absent from structured target
    fields. The owner has an empty preparation list, retaining pH and composition
    without fabricating a protocol. The target has three generic steps, including
    Sterilize by autoclaving tagged DISSOLVE; the page supplies no such sterilization
    method. Optional agar must remain conditional.
  target_ids:
