  summary: 'LPSN''s type-strain entry lists P262, NCP 262, DSM 13864 and ATCC BAA-117;
    NCBI lists NCP262 as a DSM 13864 synonym. Identity authority: https://lpsn.dsmz.de/species/clostridium-saccharobutylicum;
    archived in references_cache/papers/primary_html/osmotic-next-p262-lpsn-20261013.html
    and .md; accessed_on=2026-10-13. The fresh NCBI EFetch rank is strain; an earlier
    cached browser-search representation said no rank, so the dated raw authority
    is retained. Do not inherit a newer paper''s recipe through this name mapping.
    The abstract does not specify the complete local CAMM formula or establish species-wide
    sporulation. Local comparison: Seventeen native entries include 333.037 mM glucose,
    calcium carbonate and generically named ammonium phosphate; salt/hydrate identities
    and preparation remain unverified. '
