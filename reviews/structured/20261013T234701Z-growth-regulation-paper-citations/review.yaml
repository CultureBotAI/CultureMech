    path: data/normalized_yaml/bacterial/camm.yaml
    role: authoritative normalized recipe
- finding_id: formulation-18
  issue_key: growth-regulation-citations-formulation-18
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: 'Exact local-formulation assignment unresolved: source 18'
  target_ids:
  - CultureMech:007430
  field_paths:
  - ingredients
  - references
  description: 'Citation disposition=imported_recipe_source_with_unresolved_formulation_and_organism_assignment.
    Page 273''s culture paragraph gives a per-liter mass amount for 4-HPA and hydrated
    phosphate/sulfate forms. This differs from the native 5 mM carbon entry and several
    native chemical identities. No mass-to-molar conversion or claim of exact identity
    is made. These conflicts prevent a resolved variant or growth assignment; the
    source-defined differences remain in citation notes for reconciliation. Purified-enzyme
    assay concentrations, inhibitor constants and storage buffers are not culture-medium
    amounts. The scanned page and abstract establish source relevance, not the importer''s
    Klebsiella growth assertion. Inventory is limited to the abstract and the inspected
    medium-relevant methods paragraph. Local comparison: Ten native entries retain
    5 mM 4-hydroxyphenylacetate and nominal phosphate/sulfate identities. The source-reported
    mass and hydration differences are not applied as canonical corrections. '
  evidence_ids:
  - paper-18
  - claims
  - comparison
  - page-18
  owner_paths:
  - repository: culturebotai/CultureMech
    path: data/normalized_yaml/bacterial/pjc_with_4_hpa.yaml
    role: authoritative normalized recipe
