- finding_id: formulation-22
  issue_key: growth-regulation-citations-formulation-22
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: 'Exact local-formulation assignment unresolved: source 22'
  target_ids:
  - CultureMech:007436
  - CultureMech:007438
  - CultureMech:007439
  field_paths:
  - ingredients
  - references
  description: 'The three challenge conditions, growth temperatures and two strains
    are separate contexts. The abstract names a chemically defined medium but does
    not supply the full P2 formula. Existing linked challenge variants are reused
    as bibliography owners, not duplicated or newly certified. Volume-percent challenge
    levels do not independently validate the imported millimolar amounts or their
    conversion basis. Local comparison: Eleven native entries have no butanol; retain
    the unchallenged owner separately from both challenge formulations.  Local comparison:
    Twelve native entries include 98.4633 mM butanol; the existing child is CultureMech:007439.
    Abstract volume percent does not recertify this conversion.  Local comparison:
    Twelve native entries include 147.695 mM butanol; the existing parent is CultureMech:007438.
    This citation belongs on the child as well, without depending on the parent''s
    bibliography. '
  evidence_ids:
