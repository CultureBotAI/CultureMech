id: CultureMech:000172
name: j_medium
category: algae
medium_type: COMPLEX
composition_type: UNDEFINED
physical_state: LIQUID
ph_range:
  min: 8.3
  max: 8.5
media_term:
  preferred_term: J Medium
  term:
    id: UTEX:j-medium
    label: J Medium
description: Algae culture medium from UTEX Culture Collection. Suitable for freshwater
  algae cultivation.
notes: UTEX prepares J Medium as an alkaline freshwater Microcystis recipe at pH 8.3-8.5
  with two macro-component stocks, a calcium chloride stock, and G9 trace metals.
  The water quantities at the parent and three stock levels are unquantified starting-water/makeup
  inputs, not 1000 mL/L pure-water fractions. Printed stock-page molarity annotations
  are not independently certified as receiving concentrations.
ingredients:
- preferred_term: dH2O
  term:
    id: CHEBI:15377
    label: water
  mediaingredientmech_chebi_term:
    id: CHEBI:15377
    label: water
  notes: UTEX starts the 1 L J Medium recipe with approximately 950 mL dH2O and brings
    the final volume to 1 L. The stated total is solution volume; the exact final
    quantity of pure water is not specified.
  evidence:
  - reference: https://utex.org/products/j-medium
    supports: SUPPORT
    snippet: Bring total volume to 1 L with dH2O.
    explanation: 'Supports removal of the unsupported final-volume assertion at ingredients[0].concentration
      and the replacement notes. UTEX starts the 1 L J Medium recipe with approximately
      950 mL dH2O and brings the final volume to 1 L. The stated total is solution
      volume; the exact final quantity of pure water is not specified. Separate basis
      excerpt: ''To approximately 950 mL of dH2O''. Locator: Directions / formulation
      table.'
