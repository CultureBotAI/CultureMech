# Targets for scripts/validate_id_label_correspondence.py (Engine B).
#
# Declares which surfaces carry ontology (id, label) pairs and how strictly
# the label must correspond to the id's ontology label.
#
# A CURIE prefix is handled three ways:
#   * in `adapters`          → looked up against that OAK ontology.
#   * in `ignored_prefixes`  → legitimate non-ontology id (cas:, MIM:, …);
#                              SKIPPED_NO_ADAPTER, never looked up.
#   * neither                → UNKNOWN_PREFIX (ERROR) — a typo (CHBEI:) or an
#                              unexpected new prefix that must be triaged (added
#                              to `adapters` or `ignored_prefixes`) rather than
#                              silently passing the gate. Ids with NO prefix at
#                              all (UNMAPPED_0001) are a benign skip.
# See docs/ID_LABEL_CORRESPONDENCE.md.

adapters:
  CHEBI: sqlite:obo:chebi
  NCBITaxon: sqlite:obo:ncbitaxon
  ENVO: sqlite:obo:envo
  UBERON: sqlite:obo:uberon
  NCIT: sqlite:obo:ncit
  FOODON: sqlite:obo:foodon

# Legitimate NON-ontology id prefixes — skipped without a lookup, but
# acknowledged so a typoed ontology prefix (CHBEI:, CHEB:) is NOT mistaken for
# one of these and instead fails as UNKNOWN_PREFIX. Keep in sync with the
# prefixes actually emitted into (id, label) target fields. If `validate-products`
# fires UNKNOWN_PREFIX on a real but uncovered prefix, triage it here.
ignored_prefixes:
  - culturemech            # culture-media record ids (this repo) — the form
                           #   carried in (id,label) ingredient pairs is LOWERCASE
  - CultureMech            # CamelCase record ids (e.g. CultureMech:015440); not
                           #   currently in any (id,label) pair, kept for safety
  - CommunityMech          # community record ids (sibling Mech)
  - MediaIngredientMech    # ingredient record ids (sibling Mech, long form)
  - MIM                    # MediaIngredientMech record ids (short form)
  - cas                    # CAS registry numbers
  - registry               # generic registry fallback
  - kgmicrobe.compound     # KG-Microbe compound nodes
  - kgmicrobe.ingredient   # KG-Microbe ingredient nodes
  - mediadive.ingredient   # MediaDive ingredient nodes
  - mediadive.solution     # MediaDive solution nodes
  - mediadive.compound     # MediaDive compound nodes
  - mediadive.medium       # MediaDive medium nodes
  - MEDIADB                # MediaDive medium DB ids (MEDIADB:NNN)
  - komodo.medium          # KOMODO media identifiers
  - DSMZ                   # DSMZ culture-collection ids
  - ATCC                   # ATCC culture-collection ids
  - TOGO                   # TogoMedia ids
  - GTDB                   # GTDB taxa (not in NCBITaxon namespace)

synonym_scope: exact_related

targets:
  # data inputs (recipe YAMLs) — every nested term.{id,label} block — canonical
  - name: normalized_yaml
    kind: yaml
    glob: "data/normalized_yaml/**/*.yaml"
    policy: canonical
    pairs:
      - [id, label]
    # mediaingredientmech_chebi_term.label is intentionally MIM's preferred_term
    # (not the OBO canonical label), so excluded from the canonical gate to
    # avoid false MISMATCHes.
    exclude_keys:
      - mediaingredientmech_chebi_term
    # PRODUCT DECISION (item 3c): the `term` and `chebi_term` blocks pair an
    # OBO id (CHEBI/…) with a CURATOR-INTENDED formula/common-name label —
    # e.g. CHEBI:15377 "Distilled water", CHEBI:26710 "NaCl",
    # CHEBI:63036 "KH2PO4". We KEEP those labels (they are the human-facing
    # recipe names) rather than relabel ~14,900 rows to the OBO canonical form,
    # so these slots are EXEMPT from canonical-label matching. They are STILL
    # id-existence checked (a bogus CHEBI id under `term`/`chebi_term` still
    # surfaces as ID_NOT_FOUND); only the canonical-label match is waived.
    label_waived_keys:
      - term
      - chebi_term

  # data products: CHEBI mapping SSSOM export — canonical OR synonym.
  # Narrowed to the canonical base artifact only; `output/*.sssom.tsv` also
  # matched ~18 intermediate/legacy exports (clean/enriched/exact/final/...).
  - name: sssom
    kind: tabular
    format: tsv
    glob: "output/culturemech_chebi_mappings.sssom.tsv"
    # required: enforce mode fails (MISSING_GLOB) if this product hasn't been
    # built, instead of greening while validating nothing (false-green).
    required: true
    policy: canonical_or_synonym
    pairs:
      - [subject_id, subject_label]
      - [object_id, object_label]
