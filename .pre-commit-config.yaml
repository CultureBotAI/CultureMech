# Pre-commit hooks for CultureMech.
#
# Install: pre-commit install
# Run manually on all files: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: validate-strict-changed
        name: validate-strict on changed YAMLs
        description: Run linkml-validate (closed schema) on staged YAMLs under data/normalized_yaml/.
        # Output goes to a temp file so the committed `reports/instance_validation_failures.tsv`
        # (the full-corpus artifact regenerated by `just validate-strict`) is never overwritten
        # with a changed-files-only subset by the local hook.
        entry: bash -c 'files=$(git diff --cached --name-only --diff-filter=ACMR -- "data/normalized_yaml/*.yaml" "data/normalized_yaml/**/*.yaml"); [ -z "$files" ] && exit 0; out=$(mktemp -t culturemech_validate_strict.XXXXXX.tsv); uv run python scripts/validate_strict.py --quiet --out "$out" $files; rc=$?; [ $rc -ne 0 ] && echo "validate-strict failures in $out"; exit $rc'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
