name: merge-yaml-freshness

# Guards that data/merge_yaml/merged/ stays a current derivation of
# normalized_yaml (#215/#219). merge_yaml is now a single canonical corpus that the
# pages site renders from, so if it drifts the published site serves stale data.
#
# This runs on a schedule, NOT as a blocking per-PR gate: a blocking gate would
# force every normalized_yaml curation PR to also regenerate ~6.3k merge files,
# which is exactly the friction that let merge_yaml rot in the first place. Instead
# the nightly run FAILS (alerting) when drift appears; the fix is
# `just merge-recipes && just generate-indexes data/merge_yaml/merged`, commit, and
# the generate-pages workflow re-renders. Also runnable on demand.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-yaml-freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check merge_yaml is a current derivation of normalized_yaml
        run: just audit-merge-freshness
