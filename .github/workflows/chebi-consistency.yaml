name: chebi-consistency

# Required checks must report for every PR and merge queue candidate.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep uv commands on the fleet runtime, including --no-project invocations.
env:
  UV_PYTHON: "3.13"

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync dependencies
        run: uv sync --frozen

      # Gates at the current baseline (--max-allowed in the just target): a PR
      # that introduces NEW same-name-multiple-CHEBI groundings fails, while the
      # existing backlog (G24 garbage, G25 kg_fallback layer) does not block.
      - name: Check CHEBI grounding consistency
        run: just check-chebi-grounding

      - name: Upload consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chebi-consistency-report
          path: reports/chebi_consistency.tsv
