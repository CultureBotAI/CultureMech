name: tests

# Deliberately NO `paths:` filter, unlike the data-integrity workflows.
#
# Two reasons. First, this repo's tests span scripts/, src/, AND the corpus —
# tests/test_record_kinds.py asserts against the real data/normalized_yaml/
# tree, so a data-only PR can legitimately break them. Second, path-filtered
# gates are how the repo ended up here: validate-strict and chebi-consistency
# are both scoped to data/normalized_yaml/**, so a pure scripts/ + tests/ PR
# could land with no checks at all (#129).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-python-quality:
    name: Changed Python quality + wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Lifecycle tests compare every previously published catalog version;
          # shallow history would make the never-forget invariant vacuous.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff and Black on changed Python
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: uv run python scripts/check_changed_python.py
      - name: Validate Claude skills
        run: uv run python scripts/validate_claude_skills.py
      - name: Verify generated README statistics
        run: just check-readme-stats
      - name: Type-check renderer boundary
        run: just typecheck-renderer
      - name: Build and install wheel
        run: |
          uv build --wheel
          uv pip install --python .venv/bin/python --force-reinstall --no-deps dist/*.whl
      - name: Smoke test installed CLI and renderer
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/culturemech" --help
          "$GITHUB_WORKSPACE/.venv/bin/culturemech" render \
            --file "$GITHUB_WORKSPACE/tests/fixtures/render_smoke.yaml" \
            --output-dir /tmp/culturemech-wheel-smoke/media \
            --index-dir /tmp/culturemech-wheel-smoke

  fast:
    name: Fast tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Run fast tier
        run: just test-fast

  corpus-and-integration:
    name: Full corpus and integration suite
    runs-on: ubuntu-latest
    # Higher than the data-integrity workflows' 20. Several tests walk the whole
    # full tracked corpus (record kinds, ranking duplicates, index freshness,
    # concentration plausibility), and parsing that much YAML is markedly slower
    # on a runner than locally — a 3-minute local suite has taken >20 minutes
    # here. Coverage is not the cost; it accounts for ~7s of that.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Lifecycle tests compare every previously published catalog version;
          # shallow history would make the never-forget invariant vacuous.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # `--extra dev` is required: pytest lives in [project.optional-dependencies]
      # dev, which a plain `uv sync` does not install. The other workflows omit it
      # because they only invoke runtime deps.
      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Verify recipe ID lifecycle catalog
        run: just check-id-catalog

      - name: Run full suite with coverage floor
        run: just test
