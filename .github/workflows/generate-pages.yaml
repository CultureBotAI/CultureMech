name: Generate per-medium pages + deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "index.html"
      - "data/normalized_yaml/**.yaml"
      - "data/merge_yaml/merged/**.yaml"
      - "src/culturemech/export/browser_export.py"
      - "src/culturemech/templates/**"
      - "src/culturemech/render_media_pages.py"
      - "src/culturemech/web_artifacts.py"
      - "conf/qc_config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/generate-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CultureMech
        uses: actions/checkout@v4
        with:
          path: CultureMech

      - name: Checkout claw (kg_microbe_browser + kg_microbe_qc)
        id: checkout-claw
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: CultureBotAI/culturebotai-claw
          path: culturebotai-claw

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        working-directory: CultureMech
        run: uv sync --frozen

      - name: Build browser data and normalized pages
        env:
          PYTHONPATH: ${{ github.workspace }}/culturebotai-claw/src
        working-directory: CultureMech
        run: |
          uv run python -m culturemech.export.browser_export \
            --input data/normalized_yaml \
            --output app/data.js
          uv run python -m culturemech.render_media_pages \
            --yaml-dir data/normalized_yaml \
            --out-dir pages/normalized \
            --index-dir pages/normalized

      - name: Render canonical merged pages
        env:
          PYTHONPATH: ${{ github.workspace }}/culturebotai-claw/src
        working-directory: CultureMech
        run: |
          uv run python -m culturemech.render_media_pages \
            --yaml-dir data/merge_yaml/merged \
            --out-dir pages/media \
            --index-dir pages

      - name: Report degraded composition rendering
        if: steps.checkout-claw.outcome != 'success'
        run: |
          echo "::warning::culturebotai-claw unavailable; generated indexes carry a degraded-build notice"
          echo "### Pages build degraded" >> "$GITHUB_STEP_SUMMARY"
          echo "Ingredient composition graphs were omitted because culturebotai-claw was unavailable." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify complete web coverage
        working-directory: CultureMech
        run: |
          uv run python -m culturemech.web_artifacts \
            --corpus-dir data/normalized_yaml \
            --data-file app/data.js \
            --pages-dir pages

      - name: Render QC dashboard
        if: steps.checkout-claw.outcome == 'success'
        env:
          PYTHONPATH: ${{ github.workspace }}/culturebotai-claw/src
        run: |
          cd CultureMech
          uv run python -m kg_microbe_qc \
            --config conf/qc_config.yaml \
            --output dashboard

      - name: Stage site
        run: |
          mkdir -p site
          # Site root mirrors the repo layout so existing relative links work:
          #   /              -> redirect to app/  (root index.html)
          #   /app/          -> landing (index.html) + browser + UMAPs + data
          #   /pages/        -> per-record media pages (browser links ../pages/<page>)
          #   /dashboard/    -> QC dashboard
          cp CultureMech/index.html site/index.html
          cp -r CultureMech/app site/app
          cp -r CultureMech/pages site/pages
          if [ -d CultureMech/dashboard ]; then
            cp -r CultureMech/dashboard site/dashboard
          fi
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
