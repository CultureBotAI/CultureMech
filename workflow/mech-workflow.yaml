stages:
- stage: 1
  key: add_records
  goal_text: Use the repository-local add/discovery skills to review candidates and add new growth-media
    and stock-solution recipes until a repeated, recorded search of the bounded frontier finds no further
    admissible new records. Preserve unresolved candidates and search limits.
  skill_paths:
  - .claude/skills/culturemech-evolve-workflow/SKILL.md
  - .claude/skills/create-recipe/SKILL.md
  - .claude/skills/manage-identifiers/SKILL.md
  applicability: enabled
- stage: 2
  key: causal_graphs
  goal_text: Review every eligible record and use the repository-local causal-graph and curation instructions
    to review, edit and update its evidence-backed native mechanism representation. Record source-limited
    gaps and representation/writer blockers; do not invent fields or unsupported edges.
  skill_paths:
  - .claude/skills/culturemech-evolve-workflow/SKILL.md
  - .claude/skills/review-yaml-record/SKILL.md
  applicability: blocked
  applicability_reason: Native representation or maintained writer prerequisites must be verified and
    implemented before scientific mutation; retain an explicit applicability/blocked assessment and issue-linked
    infrastructure intake.
- stage: 3
  key: protein_examples
  goal_text: Review all records and add verified UniProt protein examples or the native equivalent where
    applicable, prioritizing gene and protein elements of mechanism graphs. Preserve exact organism, sequence
    and claim scope; document inapplicability and representation/writer blockers.
  skill_paths:
  - .claude/skills/culturemech-evolve-workflow/SKILL.md
  - .claude/skills/review-yaml-record/SKILL.md
  applicability: blocked
  applicability_reason: Native representation or maintained writer prerequisites must be verified and
    implemented before scientific mutation; retain an explicit applicability/blocked assessment and issue-linked
    infrastructure intake.
- stage: 4
  key: record_review
  goal_text: Use CultureMech repository-local record-review and cohort-review skills to review every eligible
    record in a frozen inventory. Save actual versioned review reports, stable findings, coverage, provenance,
    input hashes, limitations and dispositions through native persistence plus the parent workflow evidence
    manifest. Preserve unresolved findings for the next grouped-remediation goal; complete this goal with
    its own commit sequence.
  skill_paths:
  - .claude/skills/culturemech-evolve-workflow/SKILL.md
  - .claude/skills/review-yaml-record/SKILL.md
  - .claude/skills/review-yaml-category/SKILL.md
  - .claude/skills/review-ingredient-concentrations/SKILL.md
  - .claude/skills/review-recipes/SKILL.md
  applicability: enabled
- stage: 5
  key: resolve_review_findings
  goal_text: Consume the current cycle's accepted review outputs and carried-forward findings in CultureMech.
    Group related problems by cause and repair ownership, deduplicate against real GitHub issues, create
    or reuse issues, implement the accepted fixes through native writers, validate and obtain fresh review.
    Preserve immutable original reports and save the issue map, finding dispositions, linked new review
    evidence and unresolved blockers. Finish with the complete commit sequence.
  skill_paths:
  - .claude/skills/culturemech-evolve-workflow/SKILL.md
  - .claude/skills/review-open-issues/SKILL.md
  applicability: enabled
- stage: 6
  key: infrastructure
  goal_text: Freeze CultureMech INFRA_TASKS.md at a documented cutoff and turn the bounded intake into
    a dependency-aware implementation plan. Group related needs into real GitHub issues, implement selected
    requirements and upgrades, validate outcomes, update issue-linked dispositions and explicitly carry
    forward blocked or deferred tasks. Save the ledger snapshot, plan, validation and parent evidence
    manifest; finish the full commit sequence, write the closure receipt and stop; the coordinator alone
    dispatches the next goal or cycle.
  skill_paths:
  - .claude/skills/culturemech-evolve-workflow/SKILL.md
  - .claude/skills/review-open-issues/SKILL.md
  applicability: enabled
